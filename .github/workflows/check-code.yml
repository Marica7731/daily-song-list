name: Check code

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "assets/**"
      - "config/**"
      - "test/**"
      - "docs/**"
      - "index.html"
      - "package.json"
      - "README.md"
  workflow_dispatch:
    inputs:
      expected_selector_count:
        description: Exact number of selectors tagged for this cleanup batch
        required: false
        default: "0"
      checkpoint_run_id:
        description: Optional prior run ID containing a compatible inventory checkpoint
        required: false
        default: ""
      checkpoint_artifact_name:
        description: Optional exact checkpoint artifact name from that run
        required: false
        default: ""

permissions:
  actions: read
  contents: read

concurrency:
  group: daily-song-list-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: [self-hosted, macOS, ARM64, daily-song-list-mac]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50
          filter: blob:none

      - name: Ensure full workspace checkout
        run: |
          git sparse-checkout disable || true
          git checkout --force

      - name: Configure Mac toolchain
        run: |
          echo "/Users/be/.local/bin" >> "$GITHUB_PATH"
          echo "/Users/be/.local/codex-toolchains/node/bin" >> "$GITHUB_PATH"

      - name: Checkout canonical blocklist
        uses: actions/checkout@v4
        with:
          repository: Marica7731/mygit
          path: .tmp/mygit
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            config/blocked-vtuber-channels.json
          sparse-checkout-cone-mode: false

      - name: Check blocklist mirror sync
        run: node scripts/check-blocked-vtuber-sync.js --source .tmp/mygit/config/blocked-vtuber-channels.json --mirror config/blocked-vtuber-channels.json

      - name: Run checks
        env:
          CHECK_BASE_SHA: ${{ github.event.before }}
        run: |
          set -Eeuo pipefail
          base="${CHECK_BASE_SHA}"
          if [ -z "${base}" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          run_ui_proof=1
          if [ -n "${base}" ]; then
            ui_changes="$(git diff --name-only "${base}" HEAD -- \
              index.html \
              assets/app.js \
              assets/styles.css \
              assets/frontend-utils.js \
              README.md \
              docs/ui-spec.md \
              docs/ui-proof.md \
              scripts/capture-readme-screenshots.js \
              scripts/validate-ui-proof.js \
              scripts/ui-proof-config.js \
              test/fixtures/ui-proof-runtime.json \
              test/ui-proof-fixtures.test.js \
              docs/data-architecture.md \
              docs/range-migration.md \
              docs/storage-layout.md \
              docs/backfill.md)"
            if [ -z "${ui_changes}" ]; then
              run_ui_proof=0
            fi
          fi
          run_data_validate=1
          if [ -n "${base}" ]; then
            data_changes="$(git diff --name-only "${base}" HEAD -- \
              config \
              data/latest.json \
              data/status.json \
              data/external)"
            if [ -z "${data_changes}" ]; then
              run_data_validate=0
            fi
          fi
          node scripts/check-js-syntax.js
          ui_proof_ok=0
          if [ "${run_ui_proof}" = "1" ]; then
            if npm run check:ui-proof; then
              ui_proof_ok=1
              echo "CODEX_UI_PROOF_OK"
            else
              echo "::warning::UI proof is deferred until the planned screenshot matrix refresh; code and contract checks remain blocking."
              echo "CODEX_UI_PROOF_DEFERRED"
            fi
          else
            echo "CODEX_UI_PROOF_SKIPPED reason=no-ui-proof-input-changes"
          fi
          npm run blocklist:validate
          if [ "${run_ui_proof}" = "1" ] && [ "${ui_proof_ok}" = "1" ]; then
            npm test
          else
            test_files=()
            while IFS= read -r -d '' test_file; do
              case "${test_file}" in
                test/ui-proof.test.js|test/ui-proof.test.mjs) continue ;;
              esac
              test_files+=("${test_file}")
            done < <(git ls-files -z -- \
              'test/*.test.js' \
              'test/**/*.test.js' \
              'test/*.test.mjs' \
              'test/**/*.test.mjs')
            if [ "${#test_files[@]}" -eq 0 ]; then
              echo "::error::No tracked non-UI test files were selected." >&2
              exit 1
            fi
            node --test "${test_files[@]}"
          fi
          if [ "${run_data_validate}" = "1" ]; then
            npm run validate
          else
            echo "CODEX_DATA_VALIDATE_SKIPPED reason=no-data-input-changes"
          fi
          npm run check:budget

  curation_audit:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'codex/global-singleton-cleanup-20260726'
    runs-on: [self-hosted, macOS, ARM64, daily-song-list-mac]
    timeout-minutes: 150
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none

      - name: Ensure full audit workspace checkout
        run: |
          set -Eeuo pipefail
          git sparse-checkout disable || true
          git checkout --force

      - name: Configure Mac audit toolchain
        run: |
          echo "/Users/be/.local/bin" >> "$GITHUB_PATH"
          echo "/Users/be/.local/codex-toolchains/node/bin" >> "$GITHUB_PATH"

      - name: Prepare isolated audit directories
        run: |
          set -Eeuo pipefail
          audit_root="$RUNNER_TEMP/daily-song-list-curation-audit/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "AUDIT_ROOT=$audit_root" >> "$GITHUB_ENV"
          mkdir -p \
            "$audit_root/checkpoint/global" \
            "$audit_root/checkpoint/pages" \
            "$audit_root/reports/global" \
            "$audit_root/reports/pages" \
            "$audit_root/runtime-db"

      - name: Restore compatible inventory checkpoint
        if: inputs.checkpoint_run_id != '' && inputs.checkpoint_artifact_name != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_RUN_ID: ${{ inputs.checkpoint_run_id }}
          CHECKPOINT_ARTIFACT_NAME: ${{ inputs.checkpoint_artifact_name }}
        run: |
          set -Eeuo pipefail
          gh run download "$CHECKPOINT_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$CHECKPOINT_ARTIFACT_NAME" \
            --dir "$AUDIT_ROOT/checkpoint"

      - name: Run focused audit tests
        timeout-minutes: 5
        run: |
          set -Eeuo pipefail
          node --check scripts/audit-global-song-quality.js
          node --check scripts/audit-production-vtuber-pages.js
          python3 -m py_compile scripts/audit-runtime-db.py
          python3 test/audit_runtime_db_test.py
          node --test \
            test/audit-global-song-quality.test.js \
            test/audit-production-vtuber-pages.test.js \
            test/curation.test.js \
            test/song-aliases.test.js

      - name: Build resumable global inventory and before-after audit
        timeout-minutes: 35
        env:
          CODEX_VSINGER_RUNTIME_IMPORT_PROGRESS: "1"
          CODEX_VSINGER_RUNTIME_IMPORT_PROGRESS_INTERVAL: "100"
        run: |
          set -Eeuo pipefail
          node --max-old-space-size=12288 scripts/audit-global-song-quality.js \
            --input data/latest.json \
            --vsinger-dir data/external/vsinger-http/backfill \
            --youtube-dir data/external/youtube-channel-discovery \
            --require-vsinger \
            --require-youtube-channel-discovery \
            --expected-selector-count "${{ inputs.expected_selector_count || '0' }}" \
            --checkpoint-dir "$AUDIT_ROOT/checkpoint/global" \
            --output-dir "$AUDIT_ROOT/reports/global"

      - name: Audit four production VTuber pages
        timeout-minutes: 10
        run: |
          set -Eeuo pipefail
          node scripts/audit-production-vtuber-pages.js \
            --api-base https://ytb-song-rank.culua.com \
            --timeout-ms 30000 \
            --checkpoint-dir "$AUDIT_ROOT/checkpoint/pages" \
            --output-dir "$AUDIT_ROOT/reports/pages"

      - name: Materialize full runtime SQLite
        timeout-minutes: 50
        run: |
          set -Eeuo pipefail
          npm run db:build -- \
            --require-youtube-channel-discovery \
            --output "$AUDIT_ROOT/runtime-db/song-rank.sqlite" \
            2>&1 | tee "$AUDIT_ROOT/reports/runtime-db-build.log"

      - name: Extract runtime DB audit
        timeout-minutes: 15
        run: |
          set -Eeuo pipefail
          python3 scripts/audit-runtime-db.py \
            --db "$AUDIT_ROOT/runtime-db/song-rank.sqlite" \
            --output "$AUDIT_ROOT/reports/runtime-db-audit.json"

      - name: Remove full temporary DB
        if: always()
        run: |
          set -Eeuo pipefail
          db="$AUDIT_ROOT/runtime-db/song-rank.sqlite"
          tmp_db="$db.tmp"
          case "$db" in
            "$RUNNER_TEMP"/*) ;;
            *) echo "refusing to remove DB outside RUNNER_TEMP: $db" >&2; exit 1 ;;
          esac
          rm -f -- "$db" "$tmp_db"
          echo "CODEX_CURATION_AUDIT_DB_REMOVED path=$db"

      - name: Upload resumable inventory checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-singleton-curation-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/daily-song-list-curation-audit/${{ github.run_id }}-${{ github.run_attempt }}/checkpoint
          if-no-files-found: warn
          retention-days: 3
          compression-level: 0

      - name: Upload bounded audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-singleton-curation-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/daily-song-list-curation-audit/${{ github.run_id }}-${{ github.run_attempt }}/reports
          if-no-files-found: warn
          retention-days: 14
