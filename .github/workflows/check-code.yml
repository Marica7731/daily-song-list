name: Check code

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "assets/**"
      - "config/**"
      - "test/**"
      - "docs/**"
      - "index.html"
      - "package.json"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-song-list-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: [self-hosted, macOS, ARM64, daily-song-list-mac]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none

      - name: Configure Mac toolchain
        run: |
          echo "/Users/be/.local/bin" >> "$GITHUB_PATH"
          echo "/Users/be/.local/codex-toolchains/node/bin" >> "$GITHUB_PATH"

      - name: Checkout canonical blocklist
        uses: actions/checkout@v4
        with:
          repository: Marica7731/mygit
          path: .tmp/mygit
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            config/blocked-vtuber-channels.json
          sparse-checkout-cone-mode: false

      - name: Check blocklist mirror sync
        run: node scripts/check-blocked-vtuber-sync.js --source .tmp/mygit/config/blocked-vtuber-channels.json --mirror config/blocked-vtuber-channels.json

      - name: Run checks
        run: npm run check
