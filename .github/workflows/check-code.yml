name: Check code

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "assets/**"
      - "config/**"
      - "test/**"
      - "docs/**"
      - "index.html"
      - "package.json"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-song-list-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Checkout canonical blocklist
        uses: actions/checkout@v4
        with:
          repository: Marica7731/mygit
          path: .tmp/mygit

      - name: Check blocklist mirror sync
        run: node scripts/check-blocked-vtuber-sync.js --source .tmp/mygit/config/blocked-vtuber-channels.json --mirror config/blocked-vtuber-channels.json

      - name: Run checks
        run: npm run check
