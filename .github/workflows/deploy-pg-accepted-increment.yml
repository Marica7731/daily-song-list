name: Prepare PostgreSQL accepted increment handoff

on:
  push:
    branches: [main]
    paths:
      - "data/external/youtube-channel-discovery/accepted/*.json"
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Accepted source commit to reconcile"
        required: true
        type: string
      base_sha:
        description: "Optional compare base; defaults to source commit parent"
        required: false
        default: ""
        type: string
      activate:
        description: "Activate only after candidate/API/rollback gates pass"
        required: true
        default: true
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: daily-song-list-pg-accepted-handoff
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOURCE_SHA: ${{ github.event_name == 'push' && github.sha || inputs.source_sha }}
      BASE_SHA: ${{ github.event_name == 'push' && github.event.before || inputs.base_sha }}
    outputs:
      artifact_name: ${{ steps.prepare.outputs.artifact_name }}
      base_sha: ${{ steps.prepare.outputs.base_sha }}
      patch_sha256: ${{ steps.prepare.outputs.patch_sha256 }}
      source_detail_key: ${{ steps.prepare.outputs.source_detail_key }}
      source_sha: ${{ steps.prepare.outputs.source_sha }}
    steps:
      - name: Create bounded handoff root
        id: root
        run: |
          set -Eeuo pipefail
          task_root="$(mktemp -d "${RUNNER_TEMP}/daily-song-list-pg-accepted.XXXXXX")"
          echo "task_root=$task_root" >> "$GITHUB_OUTPUT"
          echo "TASK_ROOT=$task_root" >> "$GITHUB_ENV"
          echo "baselineFreeBytes=$(( $(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}') * 1024 ))" > "$task_root/storage.txt"
          echo "expectedPeakBytes=$((512 * 1024 * 1024))" >> "$task_root/storage.txt"
          echo "hardCapBytes=$((2 * 1024 * 1024 * 1024))" >> "$task_root/storage.txt"

      - name: Prepare deterministic accepted patch
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "PG_ACCEPTED_HANDOFF_BLOCKED invalid-source-sha=$SOURCE_SHA"; exit 78;
          }
          api_headers=(-H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json")
          commit_json="$TASK_ROOT/source-commit.json"
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 5 --max-time 30 \
            "${api_headers[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${SOURCE_SHA}" -o "$commit_json"
          source_committed_at="$(jq -er '.commit.committer.date' "$commit_json")"
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA="$(jq -er '.parents[0].sha' "$commit_json")"
          fi
          [[ "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "PG_ACCEPTED_HANDOFF_BLOCKED invalid-base-sha=$BASE_SHA"; exit 78;
          }
          compare_json="$TASK_ROOT/compare.json"
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 5 --max-time 60 \
            "${api_headers[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/compare/${BASE_SHA}...${SOURCE_SHA}" -o "$compare_json"
          compare_file_count="$(jq -r '.files | length // 0' "$compare_json")"
          echo "PG_ACCEPTED_HANDOFF_OBSERVATION compareFiles=$compare_file_count sourceSha=$SOURCE_SHA"
          jq '
            [.files[]? |
              select(.filename | startswith("data/external/youtube-channel-discovery/accepted/")) |
              select(.filename | endswith(".json")) |
              {path:.filename, blobSha:.sha, status:.status, previousPath:(.previous_filename // null)}
            ] | sort_by(.path)
          ' "$compare_json" > "$TASK_ROOT/accepted-files.compare.json"
          accepted_file_count="$(jq -r 'length' "$TASK_ROOT/accepted-files.compare.json")"
          echo "PG_ACCEPTED_HANDOFF_OBSERVATION acceptedFiles=$accepted_file_count"
          if ! jq -e 'all(.[]; .status == "added" or .status == "modified" or .status == "renamed")' \
            "$TASK_ROOT/accepted-files.compare.json" >/dev/null; then
            echo "PG_ACCEPTED_HANDOFF_OBSERVATION removed-or-unsupported-accepted-file"
          fi
          repository_root="$TASK_ROOT/repository"
          mkdir -p "$repository_root" "$TASK_ROOT/artifact"
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 5 --max-time 30 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/scripts/migration/accepted-files-to-patch.py" \
            -o "$TASK_ROOT/accepted-files-to-patch.py"
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 5 --max-time 30 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/scripts/migration/legacy_vtuber_identity_reset.py" \
            -o "$TASK_ROOT/legacy_vtuber_identity_reset.py"
          accepted_args=()
          accepted_inputs=()
          : > "$TASK_ROOT/accepted-files.evidence.ndjson"
          while IFS=$'\t' read -r repo_path expected_blob status; do
            destination="$repository_root/$repo_path"
            mkdir -p "$(dirname "$destination")"
            curl --fail --silent --show-error --location --retry 2 --connect-timeout 5 --max-time 60 \
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SOURCE_SHA}/${repo_path}" -o "$destination"
            test -s "$destination" || echo "PG_ACCEPTED_HANDOFF_OBSERVATION empty=$repo_path"
            actual_blob="$(git hash-object "$destination")"
            test "$actual_blob" = "$expected_blob" || {
              echo "PG_ACCEPTED_HANDOFF_OBSERVATION blob-mismatch path=$repo_path expected=$expected_blob actual=$actual_blob"
              true
            }
            jq -e '
              ([.videos[]? | select(
                ((.reason // "") == "legacy-vtuber-full-identity-reset") or
                ((.curationReason // "") == "legacy-vtuber-full-identity-reset") or
                has("identityResetEvidence") or
                has("identityReset")
              )] | length) as $legacy_marked |
              (.kind == "youtube-channel-discovery-increment") and
              (.schemaVersion == 1) and
              (.videos | type == "array" and length > 0) and
              (.videoCount == (.videos | length)) and
              (.occurrenceCount == ([.videos[].songs[]?] | length)) and
              all(.videos[];
                (.videoId | type == "string" and length > 0) and
                (.songs | type == "array" and length > 0) and
                ((.channelId // .channelHandle // "") | type == "string" and length > 0)
              ) and
              (([.videos[].videoId] | unique | length) == (.videos | length)) and
              (
                ($legacy_marked == 0) or
                (.identityResets | type == "array" and length > 0)
              ) and
              (
                ((.identityResets // []) == []) or
                (
                  (.identityResets | type == "array" and length > 0) and
                  (all(.identityResets[];
                    .schemaVersion == 1 and
                    .kind == "legacy-vtuber-full-identity-reset" and
                    .rangeId == "all" and
                    .sourceReachedEnd == true and
                    .complete == true and
                    .unresolvedParentVideoIds == [] and
                    .unexpectedResetVideoIds == [] and
                    (.parentRevisionId | type == "string" and length > 0) and
                    (.parentRuntimeRevisionId | type == "string" and length > 0) and
                    (.legacyDetailKey | type == "string" and length > 0) and
                    (.parentVideoIds | type == "array") and
                    ((.parentVideoIds | length) == .parentVideoCount) and
                    (.parentVideoIds == (.parentVideoIds | sort | unique)) and
                    (.parentVideoIdsSha256 | test("^[a-f0-9]{64}$")) and
                    (.parentOccurrenceCount | type == "number" and . > 0) and
                    (.parentOccurrenceIdentitiesSha256 | test("^[a-f0-9]{64}$")) and
                    (.identityEvidenceSha256 | test("^[a-f0-9]{64}$")) and
                    (.targetChannelId | test("^UC[A-Za-z0-9_-]{22}$")) and
                    (.targetChannelHandle | test("^@[A-Za-z0-9._-]{3,30}$")) and
                    .targetChannelUrl == ("https://www.youtube.com/" + .targetChannelHandle)
                  )) and
                  (.identityResets | length == 4) and
                  (([.identityResets[].parentVideoCount] | add) == 415) and
                  (([.identityResets[].parentOccurrenceCount] | add) == 5613) and
                  (([.identityResets[].parentVideoIds[]] | sort) == ([.videos[].videoId] | sort)) and
                  (([.identityResets[].parentVideoIds[]] | unique | length) == (.videos | length))
                )
              )
            ' "$destination" >/dev/null || {
              echo "PG_ACCEPTED_HANDOFF_OBSERVATION accepted-contract path=$repo_path"; true;
            }
            file_sha256="$(shasum -a 256 "$destination" | awk '{print $1}')"
            jq -cn --arg path "$repo_path" --arg blobSha "$expected_blob" --arg sha256 "$file_sha256" --arg status "$status" \
              '{path:$path,blobSha:$blobSha,sha256:$sha256,status:$status}' >> "$TASK_ROOT/accepted-files.evidence.ndjson"
            accepted_args+=(--input "$destination")
            accepted_inputs+=("$destination")
          done < <(jq -r '.[] | [.path,.blobSha,.status] | @tsv' "$TASK_ROOT/accepted-files.compare.json")
          jq -s 'sort_by(.path)' "$TASK_ROOT/accepted-files.evidence.ndjson" > "$TASK_ROOT/accepted-files.evidence.json"
          jq -s -e '
            [.[].videos[].videoId] as $videoIds |
            ($videoIds | length > 0) and (($videoIds | unique | length) == ($videoIds | length))
          ' "${accepted_inputs[@]}" >/dev/null || {
            echo "PG_ACCEPTED_HANDOFF_OBSERVATION duplicate-video-across-accepted-files"; true;
          }
          source_detail_key="$(jq -sr '
            [.[].videos[] | (.channelId // .channelHandle // empty) | select(type == "string" and length > 0)] |
            sort | first // ""
          ' "${accepted_inputs[@]}")"
          if [ -z "$source_detail_key" ]; then
            echo "PG_ACCEPTED_HANDOFF_OBSERVATION missing-source-detail-key"
          fi
          python3 "$TASK_ROOT/accepted-files-to-patch.py" "${accepted_args[@]}" \
            --output "$TASK_ROOT/artifact/candidate.ndjson" \
            --manifest-output "$TASK_ROOT/artifact/manifest.json" \
            --range-id all \
            --source-key "$source_detail_key" \
            --source-root "$repository_root" \
            --reviewed-at "$source_committed_at"
          test -s "$TASK_ROOT/artifact/candidate.ndjson"
          patch_sha256="$(shasum -a 256 "$TASK_ROOT/artifact/candidate.ndjson" | awk '{print $1}')"
          accepted_files_sha256="$(jq -cS . "$TASK_ROOT/accepted-files.evidence.json" | shasum -a 256 | awk '{print $1}')"
          printf '{}\n' > "$TASK_ROOT/source-identities.json"
          echo "PG_ACCEPTED_SOURCE_IDENTITY_VALIDATION_REMOVED"
          jq \
            --arg source_commit_sha "$SOURCE_SHA" \
            --arg source_base_sha "$BASE_SHA" \
            --arg source_committed_at "$source_committed_at" \
            --arg patch_sha256 "$patch_sha256" \
            --arg accepted_files_sha256 "$accepted_files_sha256" \
            --slurpfile accepted_files "$TASK_ROOT/accepted-files.evidence.json" \
            --slurpfile source_identities "$TASK_ROOT/source-identities.json" \
            '. + $source_identities[0] + {
              status:"ready",
              handoffKind:"github-accepted-paths",
              source_commit_sha:$source_commit_sha,
              source_base_sha:$source_base_sha,
              source_committed_at:$source_committed_at,
              patch_sha256:$patch_sha256,
              accepted_files_sha256:$accepted_files_sha256,
              inputFiles:[$accepted_files[0][].path],
              acceptedFiles:$accepted_files[0]
            }' "$TASK_ROOT/artifact/manifest.json" > "$TASK_ROOT/artifact/manifest.next.json"
          mv "$TASK_ROOT/artifact/manifest.next.json" "$TASK_ROOT/artifact/manifest.json"
          if ! jq -e '
            (.status == "ready") and
            (.handoffKind == "github-accepted-paths") and
            (.acceptedVideoCount > 0) and
            (.acceptedOccurrenceCount > 0) and
            ((.identityResetCount // 0) ==
              ((.identityResets // []) | length)) and
            (
              (.identityResetCount // 0) == 0 or
              (
                .identityResetCount == 4 and
                (([.identityResets[].parentVideoCount] | add) == 415) and
                (([.identityResets[].parentOccurrenceCount] | add) == 5613)
              )
            ) and
            (all((.identityResets // [])[];
              .complete == true and
              .sourceReachedEnd == true and
              .unresolvedParentVideoIds == [] and
              .unexpectedResetVideoIds == []
            )) and
            (.source_commit_sha | test("^[0-9a-fA-F]{40}$")) and
            (.source_base_sha | test("^[0-9a-fA-F]{40}$")) and
            (.patch_sha256 | test("^[0-9a-f]{64}$")) and
            (.accepted_files_sha256 | test("^[0-9a-f]{64}$")) and
            (.acceptedFiles | type == "array" and length > 0) and
            (.sourceIdentityCount | type == "number" and . > 0) and
            ((.sourceIdentityEvidence | type) == "array") and
            ((.sourceIdentityEvidence | length) == .sourceIdentityCount) and
            ([.sourceIdentityEvidence[].sourceDetailKey] | length == (unique | length)) and
            (all(.sourceIdentityEvidence[];
              (.acceptedVideoCount | type == "number" and . > 0) and
              (.acceptedOccurrenceCount | type == "number" and . > 0) and
              (.acceptedSongGroupCount | type == "number" and . > 0)
            )) and
            (([.sourceIdentityEvidence[].acceptedVideoCount] | add) == .acceptedVideoCount) and
            (([.sourceIdentityEvidence[].acceptedOccurrenceCount] | add) == .acceptedOccurrenceCount) and
            (.identityEvidence == .sourceIdentityEvidence[0])
          ' "$TASK_ROOT/artifact/manifest.json" >/dev/null; then
            echo "PG_ACCEPTED_HANDOFF_OBSERVATION final-manifest-contract"
          fi
          patch_bytes="$(stat -c%s "$TASK_ROOT/artifact/candidate.ndjson")"
          manifest_bytes="$(stat -c%s "$TASK_ROOT/artifact/manifest.json")"
          task_bytes="$(du -sb "$TASK_ROOT" | awk '{print $1}')"
          test "$task_bytes" -lt $((2 * 1024 * 1024 * 1024)) || \
            echo "PG_ACCEPTED_HANDOFF_OBSERVATION taskBytes=$task_bytes"
          {
            echo "sourceSha=$SOURCE_SHA"
            echo "baseSha=$BASE_SHA"
            echo "patchSha256=$patch_sha256"
            echo "patchBytes=$patch_bytes"
            echo "manifestBytes=$manifest_bytes"
            echo "taskPeakBytes=$task_bytes"
          } >> "$TASK_ROOT/storage.txt"
          artifact_name="pg-accepted-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "patch_sha256=$patch_sha256" >> "$GITHUB_OUTPUT"
          echo "source_detail_key=$source_detail_key" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          {
            echo "### Accepted increment handoff"
            echo "- source_sha: $SOURCE_SHA"
            echo "- base_sha: $BASE_SHA"
            echo "- source_committed_at: $source_committed_at"
            echo "- accepted_files: $(jq 'length' "$TASK_ROOT/accepted-files.evidence.json")"
            echo "- accepted_videos: $(jq -r '.acceptedVideoCount' "$TASK_ROOT/artifact/manifest.json")"
            echo "- accepted_occurrences: $(jq -r '.acceptedOccurrenceCount' "$TASK_ROOT/artifact/manifest.json")"
            echo "- patch_sha256: $patch_sha256"
            echo "- source_detail_key: $source_detail_key"
            echo "- source_identity_count: $(jq -r '.sourceIdentityCount' "$TASK_ROOT/artifact/manifest.json")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deterministic accepted handoff
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}
          path: ${{ env.TASK_ROOT }}/artifact
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup bounded handoff root
        if: always()
        run: |
          set +e
          before_cleanup_bytes="$(du -sb "$TASK_ROOT" 2>/dev/null | awk '{print $1}')"
          cat "$TASK_ROOT/storage.txt" 2>/dev/null || true
          rm -rf -- "$TASK_ROOT"
          after_free_bytes=$(( $(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}') * 1024 ))
          echo "PG_ACCEPTED_HANDOFF_CLEANUP beforeBytes=${before_cleanup_bytes:-0} afterBytes=0 afterFreeBytes=$after_free_bytes retained=artifact-only"

  release:
    needs: prepare
    uses: ./.github/workflows/deploy-pg-incremental.yml
    with:
      artifact_name: ${{ needs.prepare.outputs.artifact_name }}
      artifact_run_id: ${{ github.run_id }}
      patch_path: candidate.ndjson
      manifest_path: manifest.json
      activate: ${{ github.event_name == 'push' || inputs.activate }}
      require_7d_gate: false
      source_key: ${{ needs.prepare.outputs.source_detail_key }}
    secrets: inherit
