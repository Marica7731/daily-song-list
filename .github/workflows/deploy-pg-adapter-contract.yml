name: Deploy PostgreSQL adapter contract

on:
  workflow_dispatch:
    inputs:
      source_key:
        description: "Source detail key used for the live contract probe"
        required: true
        default: "29ae50b7975dbdcf"
        type: string
      source_channel_id:
        description: "Exact channelId expected for source_key"
        required: true
        default: ""
        type: string
      source_occurrence_count:
        description: "Exact active occurrence count expected for source_key"
        required: true
        default: ""
        type: string
      source_video_count:
        description: "Exact active video count expected for source_key"
        required: true
        default: ""
        type: string
      expected_active_revision:
        description: "Active revision CAS captured before dispatch"
        required: true
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: daily-song-list-pg-adapter-contract
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Candidate and installed-public quick gates are independently bounded;
    # reserve enough time for rollback and cleanup without exhaustive paging.
    timeout-minutes: 20
    env:
      VPS2_HOST: "192.255.151.75"
      VPS2_USER: "root"
      SOURCE_KEY: ${{ inputs.source_key }}
      SOURCE_CHANNEL_ID: ${{ inputs.source_channel_id }}
      SOURCE_OCCURRENCE_COUNT: ${{ inputs.source_occurrence_count }}
      SOURCE_VIDEO_COUNT: ${{ inputs.source_video_count }}
      EXPECTED_ACTIVE_REVISION: ${{ inputs.expected_active_revision }}
      PUBLIC_BASE: "https://ytb-song-rank.culua.com"
    steps:
      - name: Create bounded task root
        run: |
          set -Eeuo pipefail
          test -n "$SOURCE_KEY"
          test -n "$SOURCE_CHANNEL_ID"
          test -n "$SOURCE_OCCURRENCE_COUNT"
          test -n "$SOURCE_VIDEO_COUNT"
          test -n "$EXPECTED_ACTIVE_REVISION"
          [[ "$SOURCE_OCCURRENCE_COUNT" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_VIDEO_COUNT" =~ ^[0-9]+$ ]]
          TASK_ROOT="$(mktemp -d "$RUNNER_TEMP/daily-song-list-adapter.XXXXXX")"
          printf 'TASK_ROOT=%s\n' "$TASK_ROOT" >> "$GITHUB_ENV"
          df -B1 / > "$TASK_ROOT/storage-before.txt"
          printf 'runId=%s\nstartedAt=%s\nsourceKey=%s\nsourceChannelId=%s\nsourceOccurrenceCount=%s\nsourceVideoCount=%s\nexpectedActiveRevision=%s\n' \
            "$GITHUB_RUN_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$SOURCE_KEY" "$SOURCE_CHANNEL_ID" \
            "$SOURCE_OCCURRENCE_COUNT" "$SOURCE_VIDEO_COUNT" "$EXPECTED_ACTIVE_REVISION" > "$TASK_ROOT/manifest.txt"

      - name: Fetch adapter sources from this commit
        run: |
          set -Eeuo pipefail
          RAW_BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}"
          curl --fail --location --connect-timeout 8 --max-time 20 "$RAW_BASE/server/pg_adapter.py" -o "$TASK_ROOT/pg_adapter.py"
          curl --fail --location --connect-timeout 8 --max-time 20 "$RAW_BASE/server/pg_api_server.py" -o "$TASK_ROOT/pg_api_server.py"
          curl --fail --location --connect-timeout 8 --max-time 20 "$RAW_BASE/scripts/migration/audit-ranking-source-identities.py" -o "$TASK_ROOT/audit-ranking-source-identities.py"
          PYTHONDONTWRITEBYTECODE=1 python3 - "$TASK_ROOT/pg_adapter.py" "$TASK_ROOT/pg_api_server.py" "$TASK_ROOT/audit-ranking-source-identities.py" <<'PY'
          import sys
          for filename in sys.argv[1:]:
              compile(open(filename, encoding="utf-8").read(), filename, "exec")
          PY
          sha256sum "$TASK_ROOT/pg_adapter.py" "$TASK_ROOT/pg_api_server.py" "$TASK_ROOT/audit-ranking-source-identities.py" >> "$TASK_ROOT/manifest.txt"

      - name: Prepare bounded SSH helper
        env:
          VPS2_PASSWORD: ${{ secrets.VPS2_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$VPS2_PASSWORD"
          mkdir -p "$TASK_ROOT/ssh"
          printf '%s\n' "$VPS2_PASSWORD" > "$TASK_ROOT/ssh/password"
          chmod 600 "$TASK_ROOT/ssh/password"
          cat > "$TASK_ROOT/ssh/askpass.sh" <<'SH'
          #!/bin/sh
          exec cat "$TASK_ROOT/ssh/password"
          SH
          chmod 700 "$TASK_ROOT/ssh/askpass.sh"
          {
            echo "SSH_ASKPASS=$TASK_ROOT/ssh/askpass.sh"
            echo "SSH_ASKPASS_REQUIRE=force"
            echo "DISPLAY=daily-song-list"
          } >> "$GITHUB_ENV"

      - name: Start candidate and run minimal quick gate
        run: |
          set -Eeuo pipefail
          SSH_OPTS=(-o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no -o ConnectTimeout=8)
          REMOTE_ROOT="/tmp/daily-song-list-adapter-${GITHUB_RUN_ID}"
          printf 'REMOTE_ROOT=%s\n' "$REMOTE_ROOT" >> "$GITHUB_ENV"
          ssh "${SSH_OPTS[@]}" "$VPS2_USER@$VPS2_HOST" "set -Eeuo pipefail; rm -rf '$REMOTE_ROOT' /tmp/daily-song-list-adapter-30256082805; install -d -m 0755 '$REMOTE_ROOT/server'; install -m 0644 /dev/null '$REMOTE_ROOT/placeholder';"
          scp "${SSH_OPTS[@]}" "$TASK_ROOT/pg_adapter.py" "$TASK_ROOT/pg_api_server.py" "$TASK_ROOT/audit-ranking-source-identities.py" "$VPS2_USER@$VPS2_HOST:$REMOTE_ROOT/server/"
          ssh "${SSH_OPTS[@]}" "$VPS2_USER@$VPS2_HOST" bash -s -- "$REMOTE_ROOT" "$EXPECTED_ACTIVE_REVISION" "$SOURCE_KEY" "$SOURCE_CHANNEL_ID" "$SOURCE_OCCURRENCE_COUNT" "$SOURCE_VIDEO_COUNT" <<'REMOTE'
          set -Eeuo pipefail
          remote_root="$1"
          expected_active="$2"
          source_key="$3"
          source_channel_id="$4"
          source_occurrence_count="$5"
          source_video_count="$6"
          candidate_unit="daily-song-list-adapter-${remote_root##*-}"
          cleanup_candidate() {
            systemctl stop "$candidate_unit" 2>/dev/null || true
            systemctl reset-failed "$candidate_unit" 2>/dev/null || true
          }
          trap cleanup_candidate EXIT
          systemd-run --quiet --collect --unit="$candidate_unit" \
            --uid=www-data --property=RuntimeMaxSec=8m \
            --setenv=PGHOST=/var/run/postgresql \
            --setenv=PGDATABASE=song_rank \
            --setenv=PGUSER=www-data \
            --setenv=DAILY_SONG_PG_ADAPTER_PHASE_TRACE=1 \
            --setenv=PYTHONPATH="$remote_root/server" \
            /usr/bin/python3 "$remote_root/server/pg_api_server.py" \
              --host 127.0.0.1 --port 18766
          systemctl show "$candidate_unit" --property MainPID --value > "$remote_root/candidate.pid"
          for unused in $(seq 1 20); do
            systemctl is-active --quiet "$candidate_unit" || {
              journalctl -u "$candidate_unit" -n 80 --no-pager
              exit 1
            }
            ss -ltn 'sport = :18766' | grep -q LISTEN && break
            sleep 1
          done
          systemctl is-active --quiet "$candidate_unit"
          ss -ltn 'sport = :18766' | grep -q LISTEN
          base_url="http://127.0.0.1:18766"
          curl --silent --show-error --fail --connect-timeout 8 --max-time 20 \
            "$base_url/healthz" > "$remote_root/candidate-healthz.json" || {
              journalctl -u "$candidate_unit" -n 80 --no-pager
              exit 1
            }
          jq -e 'type == "object"' "$remote_root/candidate-healthz.json" >/dev/null

          meta_http_code="$(curl --silent --show-error --fail --connect-timeout 8 --max-time 20 \
            --output "$remote_root/candidate-meta.json" --write-out '%{http_code}' \
            "$base_url/api/meta")"
          test "$meta_http_code" = 200
          jq -e --arg expected "$expected_active" \
            '(.meta.active_revision_id // .active_revision_id // .activeRevisionId) == $expected' \
            "$remote_root/candidate-meta.json" >/dev/null

          rankings_http_code="$(curl --silent --show-error --fail --connect-timeout 8 --max-time 20 \
            --output "$remote_root/candidate-page1.json" --write-out '%{http_code}' \
            "$base_url/api/rankings?range=all&view=vtubers&metric=count&page=1&pageSize=20")"
          test "$rankings_http_code" = 200

          negative_query='%40shingames7857%20%E5%85%A8%E5%8A%9B%E3%82%AD%E3%83%B3%E3%82%B0'
          negative_http_code="$(curl --silent --show-error --fail --connect-timeout 8 --max-time 20 \
            --get --data-urlencode 'range=all' --data-urlencode 'view=songs' \
            --data-urlencode 'metric=count' --data-urlencode 'page=1' \
            --data-urlencode 'pageSize=20' \
            --data-urlencode 'searchFields=title,channel' \
            --data "q=$negative_query" \
            --output "$remote_root/candidate-negative.json" --write-out '%{http_code}' \
            "$base_url/api/rankings")"
          test "$negative_http_code" = 200

          source_http_code="$(curl --silent --show-error --fail --connect-timeout 8 --max-time 20 \
            --output "$remote_root/candidate-source.json" --write-out '%{http_code}' \
            "$base_url/api/sources/$source_key?page=1&pageSize=20")"
          test "$source_http_code" = 200

          timeout --signal=TERM --kill-after=10s 3m \
            python3 "$remote_root/server/audit-ranking-source-identities.py" \
              --base-url "$base_url" --skip-rankings \
              --negative-query "" --page-size 20 --max-pages 1 \
              --timeout 20 --concurrency 4 \
              --expected-active "$expected_active" \
              --channel-probe '@MEDAzcd=UC0HX1e5jJnhN5Xn0epV2wzA' \
              --channel-probe '@shingames7857=UC5zO6IFsWSUHMYgJMv81XKg' \
              --channel-probe '@mikoto_songs=UCkZif4byA067Xl_c199w3BQ' \
              --channel-probe '@urameshi_conta=UC8VlcljjGFb4-Ny2Heb0-ew' \
              > "$remote_root/candidate-handles.log" 2>&1
          cat "$remote_root/candidate-handles.log"

          python3 - \
            "$remote_root/candidate-page1.json" \
            "$remote_root/candidate-negative.json" \
            "$remote_root/candidate-source.json" \
            "$source_key" "$source_channel_id" \
            "$source_occurrence_count" "$source_video_count" <<'PY'
          import json
          import sys

          page_path, negative_path, source_path = sys.argv[1:4]
          source_key, source_channel_id = sys.argv[4:6]
          expected_occurrences, expected_videos = map(int, sys.argv[6:8])

          with open(page_path, encoding="utf-8") as stream:
              page = json.load(stream)
          records = page.get("records")
          if not isinstance(records, list):
              raise AssertionError("ranking records are missing")
          for card in records:
              count = int(card.get("count") or card.get("timestampCount") or 0)
              if count <= 0:
                  continue
              occurrences = card.get("occurrences")
              if not isinstance(occurrences, list) or not occurrences:
                  raise AssertionError("positive ranking card has no occurrence")
              channel_id = str(card.get("channelId") or "")
              if not channel_id:
                  raise AssertionError("ranking channel identity mismatch")
              for occurrence in occurrences:
                  item = occurrence.get("item") or {}
                  video = occurrence.get("video") or {}
                  if item.get("channelId") != channel_id or video.get("channelId") != channel_id:
                      raise AssertionError("ranking channel identity mismatch")
                  item_video_id = str(item.get("videoId") or "")
                  video_video_id = str(video.get("videoId") or "")
                  occurrence_video_id = str(occurrence.get("videoId") or item_video_id)
                  if not item_video_id or item_video_id != video_video_id or item_video_id != occurrence_video_id:
                      raise AssertionError("ranking video identity mismatch")
                  item_thumbnail = str(item.get("thumbnailUrl") or item.get("videoThumbnailUrl") or "")
                  video_thumbnail = str(video.get("thumbnailUrl") or video.get("videoThumbnailUrl") or "")
                  if not item_thumbnail or item_thumbnail != video_thumbnail:
                      raise AssertionError("ranking thumbnail identity mismatch")

          with open(negative_path, encoding="utf-8") as stream:
              negative = json.load(stream)
          if negative.get("records") or int(negative.get("totalCount") or 0) != 0:
              raise AssertionError("negative ranking query returned records")

          with open(source_path, encoding="utf-8") as stream:
              source = json.load(stream)
          if source.get("found") is not True or source.get("sourceKey") != source_key:
              raise AssertionError("source input identity mismatch")
          if int(source.get("page") or 0) != 1 or int(source.get("pageSize") or 0) != 20:
              raise AssertionError("source page mismatch")
          if int(source.get("totalOccurrenceCount") or -1) != expected_occurrences:
              raise AssertionError("source occurrence total mismatch")
          if int(source.get("totalVideoCount") or -1) != expected_videos:
              raise AssertionError("source video total mismatch")
          record = source.get("record") or {}
          if record.get("sourceDetailKey") != source_key or record.get("channelId") != source_channel_id:
              raise AssertionError("source channel identity mismatch")
          source_occurrences = record.get("occurrences")
          if not isinstance(source_occurrences, list) or (expected_occurrences > 0 and not source_occurrences):
              raise AssertionError("source page has no occurrence")
          for occurrence in source_occurrences:
              item = occurrence.get("item") or {}
              video = occurrence.get("video") or {}
              if item.get("channelId") != source_channel_id or video.get("channelId") != source_channel_id:
                  raise AssertionError("source channel identity mismatch")
              occurrence_video_id = str(occurrence.get("videoId") or "")
              item_video_id = str(item.get("videoId") or "")
              video_video_id = str(video.get("videoId") or "")
              if not occurrence_video_id or occurrence_video_id != item_video_id or occurrence_video_id != video_video_id:
                  raise AssertionError("source video identity mismatch")
              item_thumbnail = str(item.get("thumbnailUrl") or item.get("videoThumbnailUrl") or "")
              video_thumbnail = str(video.get("thumbnailUrl") or video.get("videoThumbnailUrl") or "")
              if not item_thumbnail or item_thumbnail != video_thumbnail:
                  raise AssertionError("source thumbnail identity mismatch")
          PY
          touch "$remote_root/candidate-quick-gate-passed"
          REMOTE

      - name: Install verified adapter and retain rollback files until health passes
        run: |
          set -Eeuo pipefail
          SSH_OPTS=(-o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no -o ConnectTimeout=8)
          ssh "${SSH_OPTS[@]}" "$VPS2_USER@$VPS2_HOST" bash -s -- \
            "$REMOTE_ROOT" "$PUBLIC_BASE" "$EXPECTED_ACTIVE_REVISION" \
            "$SOURCE_KEY" "$SOURCE_CHANNEL_ID" \
            "$SOURCE_OCCURRENCE_COUNT" "$SOURCE_VIDEO_COUNT" <<'REMOTE'
          set -Eeuo pipefail
          remote_root="$1"
          public_base="$2"
          expected_active="$3"
          source_key="$4"
          source_channel_id="$5"
          source_occurrence_count="$6"
          source_video_count="$7"

          install -d -m 0755 "$remote_root/backup" /opt/culua/ytb-song-rank/server
          cp -p /opt/culua/ytb-song-rank/server/pg_adapter.py "$remote_root/backup/pg_adapter.py"
          cp -p /opt/culua/ytb-song-rank/server/pg_api_server.py "$remote_root/backup/pg_api_server.py"
          rollback_adapter() {
            install -m 0644 "$remote_root/backup/pg_adapter.py" /opt/culua/ytb-song-rank/server/pg_adapter.py
            install -m 0644 "$remote_root/backup/pg_api_server.py" /opt/culua/ytb-song-rank/server/pg_api_server.py
            systemctl restart song-rank-pg-api
          }
          trap rollback_adapter ERR

          install -m 0644 "$remote_root/server/pg_adapter.py" /opt/culua/ytb-song-rank/server/pg_adapter.py
          install -m 0644 "$remote_root/server/pg_api_server.py" /opt/culua/ytb-song-rank/server/pg_api_server.py
          systemctl restart song-rank-pg-api
          for unused in $(seq 1 20); do
            systemctl is-active --quiet song-rank-pg-api \
              && ss -ltn 'sport = :8765' | grep -q LISTEN \
              && break
            sleep 1
          done
          systemctl is-active --quiet song-rank-pg-api
          ss -ltn 'sport = :8765' | grep -q LISTEN

          readiness_deadline=$((SECONDS + 75))
          readiness_attempt=0
          readiness_ready=false
          while (( SECONDS < readiness_deadline )); do
            ((readiness_attempt += 1))
            if curl --silent --show-error --fail --connect-timeout 3 --max-time 8 \
                "$public_base/healthz" > "$remote_root/production-public-healthz.json" \
              && jq -e 'type == "object"' "$remote_root/production-public-healthz.json" >/dev/null; then
              readiness_ready=true
              break
            fi
            rm -f "$remote_root/production-public-healthz.json"
            printf 'public readiness attempt %s did not pass\n' "$readiness_attempt" >&2
            if (( SECONDS < readiness_deadline )); then
              sleep 2
            fi
          done
          test "$readiness_ready" = true

          local_base="http://127.0.0.1:8765"
          local_warmup_deadline=$((SECONDS + 300))
          warm_local_endpoint() {
            local label="$1"
            shift
            local remaining=$((local_warmup_deadline - SECONDS))
            (( remaining > 0 ))
            local request_timeout=90
            if (( remaining < request_timeout )); then
              request_timeout="$remaining"
            fi
            printf 'warming installed adapter endpoint=%s timeout=%ss\n' "$label" "$request_timeout"
            curl --silent --show-error --fail --connect-timeout 2 --max-time "$request_timeout" \
              --output /dev/null "$@"
          }
          warm_local_endpoint meta "$local_base/api/meta"
          warm_local_endpoint rankings \
            "$local_base/api/rankings?range=all&view=vtubers&metric=count&page=1&pageSize=20"
          negative_query='%40shingames7857%20%E5%85%A8%E5%8A%9B%E3%82%AD%E3%83%B3%E3%82%B0'
          warm_local_endpoint negative \
            --get --data-urlencode 'range=all' --data-urlencode 'view=songs' \
            --data-urlencode 'metric=count' --data-urlencode 'page=1' \
            --data-urlencode 'pageSize=20' \
            --data-urlencode 'searchFields=title,channel' \
            --data "q=$negative_query" \
            "$local_base/api/rankings"
          warm_local_endpoint source "$local_base/api/sources/$source_key?page=1&pageSize=20"

          public_contract_retry=(--retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 90)
          meta_http_code="$(curl --silent --show-error --fail --connect-timeout 8 --max-time 20 "${public_contract_retry[@]}" \
            --output "$remote_root/production-public-meta.json" --write-out '%{http_code}' \
            "$public_base/api/meta")"
          test "$meta_http_code" = 200
          jq -e --arg expected "$expected_active" \
            '(.meta.active_revision_id // .active_revision_id // .activeRevisionId) == $expected' \
            "$remote_root/production-public-meta.json" >/dev/null

          rankings_http_code="$(curl --silent --show-error --fail --connect-timeout 8 --max-time 20 "${public_contract_retry[@]}" \
            --output "$remote_root/production-public-page1.json" --write-out '%{http_code}' \
            "$public_base/api/rankings?range=all&view=vtubers&metric=count&page=1&pageSize=20")"
          test "$rankings_http_code" = 200

          negative_http_code="$(curl --silent --show-error --fail --connect-timeout 8 --max-time 20 "${public_contract_retry[@]}" \
            --get --data-urlencode 'range=all' --data-urlencode 'view=songs' \
            --data-urlencode 'metric=count' --data-urlencode 'page=1' \
            --data-urlencode 'pageSize=20' \
            --data-urlencode 'searchFields=title,channel' \
            --data "q=$negative_query" \
            --output "$remote_root/production-public-negative.json" --write-out '%{http_code}' \
            "$public_base/api/rankings")"
          test "$negative_http_code" = 200

          source_http_code="$(curl --silent --show-error --fail --connect-timeout 8 --max-time 20 "${public_contract_retry[@]}" \
            --output "$remote_root/production-public-source.json" --write-out '%{http_code}' \
            "$public_base/api/sources/$source_key?page=1&pageSize=20")"
          test "$source_http_code" = 200

          timeout --signal=TERM --kill-after=10s 3m \
            python3 "$remote_root/server/audit-ranking-source-identities.py" \
              --base-url "$public_base" --skip-rankings \
              --negative-query "" --page-size 20 --max-pages 1 \
              --timeout 20 --concurrency 4 \
              --expected-active "$expected_active" \
              --channel-probe '@MEDAzcd=UC0HX1e5jJnhN5Xn0epV2wzA' \
              --channel-probe '@shingames7857=UC5zO6IFsWSUHMYgJMv81XKg' \
              --channel-probe '@mikoto_songs=UCkZif4byA067Xl_c199w3BQ' \
              --channel-probe '@urameshi_conta=UC8VlcljjGFb4-Ny2Heb0-ew' \
              > "$remote_root/production-public-handles.log" 2>&1
          cat "$remote_root/production-public-handles.log"

          python3 - \
            "$remote_root/production-public-page1.json" \
            "$remote_root/production-public-negative.json" \
            "$remote_root/production-public-source.json" \
            "$source_key" "$source_channel_id" \
            "$source_occurrence_count" "$source_video_count" <<'PY'
          import json
          import sys

          page_path, negative_path, source_path = sys.argv[1:4]
          source_key, source_channel_id = sys.argv[4:6]
          expected_occurrences, expected_videos = map(int, sys.argv[6:8])

          with open(page_path, encoding="utf-8") as stream:
              page = json.load(stream)
          records = page.get("records")
          if not isinstance(records, list):
              raise AssertionError("ranking records are missing")
          for card in records:
              count = int(card.get("count") or card.get("timestampCount") or 0)
              if count <= 0:
                  continue
              occurrences = card.get("occurrences")
              if not isinstance(occurrences, list) or not occurrences:
                  raise AssertionError("positive ranking card has no occurrence")
              channel_id = str(card.get("channelId") or "")
              if not channel_id:
                  raise AssertionError("ranking channel identity mismatch")
              for occurrence in occurrences:
                  item = occurrence.get("item") or {}
                  video = occurrence.get("video") or {}
                  if item.get("channelId") != channel_id or video.get("channelId") != channel_id:
                      raise AssertionError("ranking channel identity mismatch")
                  item_video_id = str(item.get("videoId") or "")
                  video_video_id = str(video.get("videoId") or "")
                  occurrence_video_id = str(occurrence.get("videoId") or item_video_id)
                  if not item_video_id or item_video_id != video_video_id or item_video_id != occurrence_video_id:
                      raise AssertionError("ranking video identity mismatch")
                  item_thumbnail = str(item.get("thumbnailUrl") or item.get("videoThumbnailUrl") or "")
                  video_thumbnail = str(video.get("thumbnailUrl") or video.get("videoThumbnailUrl") or "")
                  if not item_thumbnail or item_thumbnail != video_thumbnail:
                      raise AssertionError("ranking thumbnail identity mismatch")

          with open(negative_path, encoding="utf-8") as stream:
              negative = json.load(stream)
          if negative.get("records") or int(negative.get("totalCount") or 0) != 0:
              raise AssertionError("negative ranking query returned records")

          with open(source_path, encoding="utf-8") as stream:
              source = json.load(stream)
          if source.get("found") is not True or source.get("sourceKey") != source_key:
              raise AssertionError("source input identity mismatch")
          if int(source.get("page") or 0) != 1 or int(source.get("pageSize") or 0) != 20:
              raise AssertionError("source page mismatch")
          if int(source.get("totalOccurrenceCount") or -1) != expected_occurrences:
              raise AssertionError("source occurrence total mismatch")
          if int(source.get("totalVideoCount") or -1) != expected_videos:
              raise AssertionError("source video total mismatch")
          record = source.get("record") or {}
          if record.get("sourceDetailKey") != source_key or record.get("channelId") != source_channel_id:
              raise AssertionError("source channel identity mismatch")
          source_occurrences = record.get("occurrences")
          if not isinstance(source_occurrences, list) or (expected_occurrences > 0 and not source_occurrences):
              raise AssertionError("source page has no occurrence")
          for occurrence in source_occurrences:
              item = occurrence.get("item") or {}
              video = occurrence.get("video") or {}
              if item.get("channelId") != source_channel_id or video.get("channelId") != source_channel_id:
                  raise AssertionError("source channel identity mismatch")
              occurrence_video_id = str(occurrence.get("videoId") or "")
              item_video_id = str(item.get("videoId") or "")
              video_video_id = str(video.get("videoId") or "")
              if not occurrence_video_id or occurrence_video_id != item_video_id or occurrence_video_id != video_video_id:
                  raise AssertionError("source video identity mismatch")
              item_thumbnail = str(item.get("thumbnailUrl") or item.get("videoThumbnailUrl") or "")
              video_thumbnail = str(video.get("thumbnailUrl") or video.get("videoThumbnailUrl") or "")
              if not item_thumbnail or item_thumbnail != video_thumbnail:
                  raise AssertionError("source thumbnail identity mismatch")
          PY
          touch "$remote_root/production-public-quick-gate-passed"
          rm -rf "$remote_root/backup"
          trap - ERR
          REMOTE
          printf 'PUBLIC_QUICK_GATE_PASSED=1\n' >> "$GITHUB_ENV"

      - name: Record result and cleanup
        if: always()
        run: |
          set +e
          SSH_OPTS=(-o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no -o ConnectTimeout=8)
          df -B1 / > "$TASK_ROOT/storage-after.txt"
          printf 'finishedAt=%s\npublicQuickGatePassed=%s\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${PUBLIC_QUICK_GATE_PASSED:-0}" >> "$TASK_ROOT/manifest.txt"
          echo "ADAPTER_RELEASE_MANIFEST"
          cat "$TASK_ROOT/manifest.txt"
          echo "ADAPTER_RELEASE_STORAGE_BEFORE"
          cat "$TASK_ROOT/storage-before.txt"
          echo "ADAPTER_RELEASE_STORAGE_AFTER"
          cat "$TASK_ROOT/storage-after.txt"
          if [ -n "${REMOTE_ROOT:-}" ]; then
            ssh "${SSH_OPTS[@]}" "$VPS2_USER@$VPS2_HOST" "candidate_unit='daily-song-list-adapter-${GITHUB_RUN_ID}'; systemctl stop \"\$candidate_unit\" 2>/dev/null || true; systemctl reset-failed \"\$candidate_unit\" 2>/dev/null || true; rm -rf '$REMOTE_ROOT'" || true
          fi
          rm -rf "$TASK_ROOT"
