name: Deploy PostgreSQL adapter contract

on:
  workflow_dispatch:
    inputs:
      source_title:
        description: "Exact song title for a song source"
        required: true
        default: "晴る"
        type: string
      source_entity_key:
        description: "Exact canonical song entity key; never the opaque source detail key"
        required: true
        default: "晴る::ヨルシカ"
        type: string
      source_key:
        description: "Exact opaque source detail key"
        required: true
        default: "01fc9d6830d3c230"
        type: string
      source_occurrence_count:
        description: "Exact active occurrence count"
        required: true
        default: "4697"
        type: string
      source_video_count:
        description: "Exact active video count"
        required: true
        default: "4485"
        type: string
      channel_regression_handle:
        description: "Known channel positive regression handle"
        required: true
        default: "@shingames7857"
        type: string
      channel_regression_id:
        description: "Known channel positive regression channelId"
        required: true
        default: "UC5zO6IFsWSUHMYgJMv81XKg"
        type: string
      expected_active_revision:
        description: "Active revision CAS captured before dispatch"
        required: true
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: daily-song-list-pg-adapter-contract
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VPS2_HOST: "192.255.151.75"
      VPS2_USER: "root"
      SOURCE_TITLE: ${{ inputs.source_title }}
      SOURCE_ENTITY_KEY: ${{ inputs.source_entity_key }}
      SOURCE_KEY: ${{ inputs.source_key }}
      SOURCE_OCCURRENCE_COUNT: ${{ inputs.source_occurrence_count }}
      SOURCE_VIDEO_COUNT: ${{ inputs.source_video_count }}
      CHANNEL_REGRESSION_HANDLE: ${{ inputs.channel_regression_handle }}
      CHANNEL_REGRESSION_ID: ${{ inputs.channel_regression_id }}
      EXPECTED_ACTIVE_REVISION: ${{ inputs.expected_active_revision }}
      PUBLIC_BASE: "https://ytb-song-rank.culua.com"
      THUMBNAIL_PATH_PREFIX: "/api/thumbnails"
    steps:
      - name: Create bounded task root and validate contract inputs
        run: |
          set -Eeuo pipefail
          TASK_ROOT="$(mktemp -d "$RUNNER_TEMP/daily-song-list-adapter.XXXXXX")"
          printf 'TASK_ROOT=%s\n' "$TASK_ROOT" >> "$GITHUB_ENV"
          test -n "$SOURCE_TITLE"
          test "${#SOURCE_TITLE}" -le 256
          test -n "$SOURCE_ENTITY_KEY"
          test "${#SOURCE_ENTITY_KEY}" -le 512
          test "$SOURCE_ENTITY_KEY" != "$SOURCE_KEY"
          [[ "$SOURCE_TITLE" != *$'\n'* && "$SOURCE_TITLE" != *$'\r'* ]]
          [[ "$SOURCE_ENTITY_KEY" != *$'\n'* && "$SOURCE_ENTITY_KEY" != *$'\r'* ]]
          [[ "$SOURCE_KEY" =~ ^[0-9a-f]{16}([0-9a-f]{8})?$ ]]
          [[ "$EXPECTED_ACTIVE_REVISION" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$ ]]
          [[ "$CHANNEL_REGRESSION_HANDLE" =~ ^@[A-Za-z0-9._-]{1,100}$ ]]
          [[ "$CHANNEL_REGRESSION_ID" =~ ^UC[A-Za-z0-9_-]{20,}$ ]]
          [[ "$SOURCE_OCCURRENCE_COUNT" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_VIDEO_COUNT" =~ ^[1-9][0-9]*$ ]]
          test "$SOURCE_OCCURRENCE_COUNT" -le 200000
          test "$SOURCE_VIDEO_COUNT" -le 100000
          {
            printf 'SOURCE_TITLE_B64=%s\n' "$(printf '%s' "$SOURCE_TITLE" | base64 -w0)"
            printf 'SOURCE_ENTITY_KEY_B64=%s\n' "$(printf '%s' "$SOURCE_ENTITY_KEY" | base64 -w0)"
            printf 'SOURCE_KEY_B64=%s\n' "$(printf '%s' "$SOURCE_KEY" | base64 -w0)"
            printf 'SOURCE_OCCURRENCE_COUNT_B64=%s\n' "$(printf '%s' "$SOURCE_OCCURRENCE_COUNT" | base64 -w0)"
            printf 'SOURCE_VIDEO_COUNT_B64=%s\n' "$(printf '%s' "$SOURCE_VIDEO_COUNT" | base64 -w0)"
            printf 'CHANNEL_REGRESSION_HANDLE_B64=%s\n' "$(printf '%s' "$CHANNEL_REGRESSION_HANDLE" | base64 -w0)"
            printf 'CHANNEL_REGRESSION_ID_B64=%s\n' "$(printf '%s' "$CHANNEL_REGRESSION_ID" | base64 -w0)"
            printf 'EXPECTED_ACTIVE_REVISION_B64=%s\n' "$(printf '%s' "$EXPECTED_ACTIVE_REVISION" | base64 -w0)"
          } >> "$GITHUB_ENV"
          df -B1 / > "$TASK_ROOT/storage-before.txt"
          printf 'runId=%s\nsourceType=song\nsourceTitle=%s\nsourceEntityKey=%s\nsourceKey=%s\nsourceOccurrenceCount=%s\nsourceVideoCount=%s\nexpectedActiveRevision=%s\n' \
            "$GITHUB_RUN_ID" "$SOURCE_TITLE" "$SOURCE_ENTITY_KEY" "$SOURCE_KEY" \
            "$SOURCE_OCCURRENCE_COUNT" "$SOURCE_VIDEO_COUNT" "$EXPECTED_ACTIVE_REVISION" > "$TASK_ROOT/manifest.txt"

      - name: Prepare independent contract verifier
        run: |
          set -Eeuo pipefail
          cat > "$TASK_ROOT/verify_contract.py" <<'PY'
          import argparse
          import json
          import sys

          def text(value):
              return str(value).strip() if value is not None else ""

          def integer(value, label):
              try:
                  result = int(value)
              except (TypeError, ValueError) as exc:
                  raise AssertionError(f"{label} is not an integer") from exc
              if result < 0:
                  raise AssertionError(f"{label} is negative")
              return result

          def first(mapping, *keys):
              for key in keys:
                  value = mapping.get(key)
                  if value not in (None, ""):
                      return value
              return None

          def load(path):
              with open(path, encoding="utf-8") as stream:
                  value = json.load(stream)
              if not isinstance(value, dict):
                  raise AssertionError(f"{path} is not an object")
              return value

          def visible_video(occurrence, label):
              if not isinstance(occurrence, dict):
                  raise AssertionError(f"{label} occurrence is not an object")
              item = occurrence.get("item") if isinstance(occurrence.get("item"), dict) else {}
              video = occurrence.get("video") if isinstance(occurrence.get("video"), dict) else {}
              ids = [text(occurrence.get("videoId")), text(item.get("videoId")), text(video.get("videoId"))]
              ids = [value for value in ids if value]
              if not ids or len(set(ids)) != 1:
                  raise AssertionError(f"{label} video identity mismatch")
              thumbs = [text(item.get("thumbnailUrl") or item.get("videoThumbnailUrl")), text(video.get("thumbnailUrl") or video.get("videoThumbnailUrl"))]
              thumbs = [value for value in thumbs if value]
              if thumbs and len(set(thumbs)) != 1:
                  raise AssertionError(f"{label} thumbnail identity mismatch")
              return ids[0]

          def gate(args):
              meta = load(args.meta)
              meta_root = meta.get("meta") if isinstance(meta.get("meta"), dict) else meta
              if args.revision and text(meta_root.get("active_revision_id") or meta_root.get("activeRevisionId")) != args.revision:
                  raise AssertionError(f"{args.phase} active revision mismatch")
              if text(meta_root.get("migration_status") or meta_root.get("migrationStatus")) != "active":
                  raise AssertionError(f"{args.phase} migration status mismatch")

              rankings = load(args.rankings)
              if text(rankings.get("searchScope")) != "song":
                  raise AssertionError(f"{args.phase} rankings searchScope is not song")
              records = rankings.get("records")
              if not isinstance(records, list) or not records:
                  raise AssertionError(f"{args.phase} rankings has no visible rows")
              matching = []
              for card_candidate in records:
                  if not isinstance(card_candidate, dict):
                      continue
                  source_detail_key = text(first(card_candidate, "sourceDetailKey", "source_detail_key"))
                  if source_detail_key == args.source_key:
                      matching.append(card_candidate)
              if not matching:
                  raise AssertionError(f"{args.phase} rankings card identity is not visible")
              card = matching[0]
              card_key = text(first(card, "key", "songKey", "entityKey", "sourceKey"))
              card_title = text(first(card, "title", "songTitle", "displayTitle"))
              card_source_detail_key = text(first(card, "sourceDetailKey", "source_detail_key"))
              if card_key != args.source_entity_key:
                  raise AssertionError(f"{args.phase} rankings entity key mismatch")
              if card_source_detail_key != args.source_key or card_key == card_source_detail_key:
                  raise AssertionError(f"{args.phase} rankings source detail identity mismatch")
              if card_title != args.source_title:
                  raise AssertionError(f"{args.phase} rankings card title mismatch")
              card_count = integer(first(card, "count", "occurrenceCount", "timestampCount"), "ranking card count")
              if card_count != args.occurrences:
                  raise AssertionError(f"{args.phase} rankings card count mismatch")
              card_videos = integer(first(card, "videoCount", "videos"), "ranking card video count")
              if card_videos != args.videos:
                  raise AssertionError(f"{args.phase} rankings card video count mismatch")
              visible = card.get("occurrences")
              if not isinstance(visible, list) or not visible:
                  raise AssertionError(f"{args.phase} rankings card has no visible occurrence")
              video_id = visible_video(visible[0], f"{args.phase} rankings")

              source = load(args.source)
              if source.get("found") is not True or text(source.get("sourceKey")) != args.source_key:
                  raise AssertionError(f"{args.phase} source key was not found")
              source_page_size = integer(source.get("pageSize"), "source pageSize")
              if integer(source.get("page"), "source page") != 1 or source_page_size != 20:
                  raise AssertionError(f"{args.phase} source page is not visible page 1/20")
              source_total_count = integer(source.get("totalCount"), "source totalCount")
              if source_total_count != args.videos:
                  raise AssertionError(
                      f"{args.phase} source totalCount mismatch "
                      f"actual={source_total_count} expected={args.videos} "
                      f"sourceKey={args.source_key}"
                  )
              page_count = integer(source.get("pageCount"), "source pageCount")
              expected_page_count = max(1, (source_total_count + source_page_size - 1) // source_page_size)
              if page_count != expected_page_count:
                  raise AssertionError(f"{args.phase} source pageCount mismatch")
              source_occurrence_count = integer(
                  source.get("totalOccurrenceCount"), "source occurrence total"
              )
              if source_occurrence_count != args.occurrences:
                  raise AssertionError(
                      f"{args.phase} source totalOccurrenceCount mismatch "
                      f"actual={source_occurrence_count} expected={args.occurrences} "
                      f"sourceKey={args.source_key}"
                  )
              source_video_count = integer(source.get("totalVideoCount"), "source video total")
              if source_video_count != args.videos:
                  raise AssertionError(
                      f"{args.phase} source totalVideoCount mismatch "
                      f"actual={source_video_count} expected={args.videos} "
                      f"sourceKey={args.source_key}"
                  )
              record = source.get("record")
              if not isinstance(record, dict):
                  raise AssertionError(f"{args.phase} source record missing")
              if text(record.get("sourceDetailKey")) != args.source_key:
                  raise AssertionError(f"{args.phase} source detail key mismatch")
              if text(record.get("key")) != args.source_entity_key or text(record.get("key")) != card_key:
                  raise AssertionError(f"{args.phase} source/card key mismatch")
              if text(record.get("key")) == text(record.get("sourceDetailKey")):
                  raise AssertionError(f"{args.phase} entity key conflates opaque source detail key")
              if text(record.get("title")) != card_title or text(record.get("title")) != args.source_title:
                  raise AssertionError(f"{args.phase} source/card title mismatch")
              if text(record.get("type")) != "song":
                  raise AssertionError(f"{args.phase} source type mismatch")
              if integer(first(record, "count", "occurrenceCount", "timestampCount"), "source record count") != args.occurrences:
                  raise AssertionError(f"{args.phase} source record occurrence count mismatch")
              if integer(first(record, "videoCount", "videos"), "source record video count") != args.videos:
                  raise AssertionError(f"{args.phase} source record video count mismatch")
              occurrences = record.get("occurrences")
              if not isinstance(occurrences, list) or not occurrences:
                  raise AssertionError(f"{args.phase} source page has no visible occurrence")
              page_video_ids = set()
              for index, occurrence in enumerate(occurrences):
                  current = visible_video(occurrence, f"{args.phase} source[{index}]")
                  page_video_ids.add(current)
              expected_page_videos = min(source_page_size, args.videos)
              if len(page_video_ids) != expected_page_videos:
                  raise AssertionError(
                      f"{args.phase} source first-page video coverage mismatch "
                      f"expected={expected_page_videos} actual={len(page_video_ids)}"
                  )
              print(f"CONTRACT_VERIFIED phase={args.phase} videoId={video_id} occurrences={args.occurrences} videos={args.videos}")
              return video_id

          parser = argparse.ArgumentParser()
          parser.add_argument("--phase", required=True)
          parser.add_argument("--meta", required=True)
          parser.add_argument("--rankings", required=True)
          parser.add_argument("--source", required=True)
          parser.add_argument("--revision", required=True)
          parser.add_argument("--source-entity-key", required=True)
          parser.add_argument("--source-key", required=True)
          parser.add_argument("--source-title", required=True)
          parser.add_argument("--occurrences", type=int, required=True)
          parser.add_argument("--videos", type=int, required=True)
          args = parser.parse_args()
          try:
              gate(args)
          except (AssertionError, KeyError, TypeError, ValueError) as exc:
              print(f"CONTRACT_GATE_FAILED phase={args.phase} error={exc}", file=sys.stderr)
              raise SystemExit(1)
          PY
          chmod 700 "$TASK_ROOT/verify_contract.py"

      - name: Prepare bounded upload sanitizer
        run: |
          set -Eeuo pipefail
          cat > "$TASK_ROOT/sanitize_upload_tree.sh" <<'SANITIZER'
          #!/usr/bin/env bash
          # Build the only tree that actions/upload-artifact may read. Never follow links.
          set -u
          set -o pipefail

          RAW_ROOT="${1:-}"
          UPLOAD_ROOT="${2:-}"
          TREE_MAX_BYTES=35651584
          PAYLOAD_MAX_BYTES=35389440
          REGULAR_MAX_BYTES=12582912
          ARCHIVE_MAX_BYTES=16777216
          SMALL_MAX_BYTES=1048576
          SUMMARY_MAX_LINES=64

          case "$RAW_ROOT" in
            /*/release-evidence) ;;
            *) printf 'SANITIZER_REFUSED rawRoot\n' >&2; exit 64 ;;
          esac
          case "$UPLOAD_ROOT" in
            /*/upload-evidence) ;;
            *) printf 'SANITIZER_REFUSED uploadRoot\n' >&2; exit 64 ;;
          esac
          task_root="${RAW_ROOT%/release-evidence}"
          test "$task_root" != "$RAW_ROOT" || { printf 'SANITIZER_REFUSED taskRoot\n' >&2; exit 64; }
          test "$UPLOAD_ROOT" = "$task_root/upload-evidence" || {
            printf 'SANITIZER_REFUSED rootMismatch\n' >&2
            exit 64
          }
          test -d "$RAW_ROOT" && test ! -L "$RAW_ROOT" || {
            printf 'SANITIZER_REFUSED rawRootType\n' >&2
            exit 64
          }

          case "$UPLOAD_ROOT" in
            "$task_root"/upload-evidence) rm -rf -- "$UPLOAD_ROOT" || exit 2 ;;
            *) printf 'SANITIZER_REFUSED unsafeCleanup\n' >&2; exit 64 ;;
          esac
          install -d -m 0700 "$UPLOAD_ROOT" || exit 2

          violation_count=0
          removed_count=0
          copied_count=0
          copied_bytes=0
          summary_lines=0
          SUMMARY_TMP="$task_root/upload-sanitization-summary.tmp"
          : > "$SUMMARY_TMP"
          chmod 600 "$SUMMARY_TMP"

          record_violation() {
            local reason="$1"
            violation_count=$((violation_count + 1))
            if [ "$summary_lines" -lt "$SUMMARY_MAX_LINES" ]; then
              printf 'removed reason=%s path=[redacted]\n' "$reason" >> "$SUMMARY_TMP"
              summary_lines=$((summary_lines + 1))
            fi
          }

          is_allowed_regular() {
            case "$1" in
              evidence-manifest.txt|manifest.txt|storage-before.txt|storage-after.txt|vps-storage-before.txt|vps-storage-after.txt|\
              cleanup-healthz.json|cleanup-meta.json|cleanup-state.txt|cleanup-summary.txt|remote-archive-failure.txt|\
              remote-candidate-evidence.tar.gz|remote-cleanup-evidence.tar.gz) return 0 ;;
              runner/manifest.txt|runner/storage-before.txt|runner/vps-storage-before.txt|\
              runner/installed-healthz.json|runner/installed-meta.json|runner/installed-rankings.json|runner/installed-source.json|\
              runner/installed-negative.headers|runner/installed-negative.json|\
              runner/public-healthz.json|runner/public-meta.headers|runner/public-meta.json|runner/public-rankings.json|runner/public-source.json|\
              runner/public-empty.headers|runner/public-empty.json|runner/public-contract.log|\
              runner/public-thumbnail.headers|runner/public-invalid-thumbnail.headers|runner/public-invalid-thumbnail.body) return 0 ;;
              *) return 1 ;;
            esac
          }

          is_archive() {
            case "$1" in
              remote-candidate-evidence.tar.gz|remote-cleanup-evidence.tar.gz) return 0 ;;
              *) return 1 ;;
            esac
          }

          validate_archive() {
            local archive="$1" validation_file="$2"
            timeout --signal=TERM --kill-after=2s 10s python3 -B - "$archive" > "$validation_file" <<'PY'
          import sys
          import tarfile

          archive = sys.argv[1]
          allowed = {
              "candidate-healthz.json", "candidate-meta.json", "candidate-rankings.json", "candidate-source.json",
              "candidate-negative.headers", "candidate-negative.json", "candidate-channel-regression.log",
              "candidate-thumbnail.headers", "candidate-invalid-thumbnail.headers", "candidate-invalid-thumbnail.body",
              "candidate-unit-status.txt", "candidate-unit-journal.txt", "candidate-unit-cleanup-result.txt",
              "install-failure-service-status.txt", "install-failure-service-journal.txt",
              "install-service-status.txt", "install-service-journal.txt",
              "rollback-service-status.txt", "rollback-service-journal.txt",
              "installed-healthz.json", "installed-meta.json", "installed-rankings.json", "installed-source.json",
              "installed-negative.headers", "installed-negative.json",
              "rollback-healthz.json", "rollback-meta.json", "finalize-healthz.json", "finalize-meta.json",
              "cleanup-healthz.json", "cleanup-meta.json", "cleanup-service-status.txt", "cleanup-service-journal.txt",
              "cleanup-candidate-unit-status.txt", "cleanup-candidate-unit-journal.txt", "cleanup-candidate-unit-result.txt",
              "release-finalized", "rollback-complete",
          }
          try:
              with tarfile.open(archive, "r:gz") as stream:
                  members = stream.getmembers()
          except (OSError, tarfile.TarError) as exc:
              print(f"INVALID archive={type(exc).__name__}")
              raise SystemExit(1)
          if not 1 <= len(members) <= 64:
              print(f"INVALID memberCount={len(members)}")
              raise SystemExit(1)
          seen = set()
          total = 0
          for member in members:
              name = member.name
              if name not in allowed:
                  print("INVALID forbiddenMember")
                  raise SystemExit(1)
              if name in seen:
                  print("INVALID duplicateMember")
                  raise SystemExit(1)
              if not member.isfile():
                  print("INVALID nonRegularMember")
                  raise SystemExit(1)
              if member.size < 0 or member.size > 12_582_912:
                  print(f"INVALID memberBytes={member.size}")
                  raise SystemExit(1)
              seen.add(name)
              total += member.size
              if total > 33_554_432:
                  print(f"INVALID expandedBytes={total}")
                  raise SystemExit(1)
          print(f"VALID members={len(members)} expandedBytes={total}")
          PY
          }

          remove_raw_path() {
            local path="$1"
            if rm -f -- "$path"; then
              removed_count=$((removed_count + 1))
            else
              record_violation remove_failed "${path#"$RAW_ROOT"/}"
            fi
          }

          # First remove links, special files, forbidden names, and any file outside the explicit allowlist.
          while IFS= read -r -d '' path; do
            relative="${path#"$RAW_ROOT"/}"
            record_violation symlink "$relative"
            remove_raw_path "$path"
          done < <(find -P "$RAW_ROOT" -xdev -mindepth 1 -type l -print0)

          while IFS= read -r -d '' path; do
            relative="${path#"$RAW_ROOT"/}"
            record_violation non_regular "$relative"
            remove_raw_path "$path"
          done < <(find -P "$RAW_ROOT" -xdev -mindepth 1 ! -type f ! -type d ! -type l -print0)

          # The staging step's raw sidecars are never uploaded; validated sidecars are regenerated.
          for relative in remote-archive-contents.txt remote-candidate-evidence.sha256; do
            path="$RAW_ROOT/$relative"
            if [ -f "$path" ] && [ ! -L "$path" ]; then remove_raw_path "$path"; fi
          done

          while IFS= read -r -d '' path; do
            relative="${path#"$RAW_ROOT"/}"
            case "$relative" in
              */ssh/*|ssh/*|*/askpass/*|askpass/*|*/backup/*|backup/*|*/server/*|server/*|\
              */secret/*|secret/*|*/secrets/*|secrets/*|*password*|*credential*|*token*)
                record_violation forbidden_path "$relative"
                remove_raw_path "$path"
                continue
                ;;
            esac
            if ! is_allowed_regular "$relative"; then
              record_violation not_allowlisted "$relative"
              remove_raw_path "$path"
            fi
          done < <(find -P "$RAW_ROOT" -xdev -mindepth 1 -type f -print0)

          copy_regular() {
            local relative="$1" source="$RAW_ROOT/$1" bytes destination
            test -f "$source" && test ! -L "$source" || return 0
            bytes="$(stat -c '%s' -- "$source" 2>/dev/null || printf invalid)"
            if ! [[ "$bytes" =~ ^[0-9]+$ ]]; then
              record_violation stat_failed "$relative"
              remove_raw_path "$source"
              return 0
            fi
            if [ "$bytes" -gt "$REGULAR_MAX_BYTES" ]; then
              record_violation oversized_regular "$relative"
              remove_raw_path "$source"
              return 0
            fi
            if [ $((copied_bytes + bytes)) -gt "$PAYLOAD_MAX_BYTES" ]; then
              record_violation tree_overflow "$relative"
              remove_raw_path "$source"
              return 0
            fi
            destination="$UPLOAD_ROOT/$relative"
            install -d -m 0700 "$(dirname "$destination")"
            if install -m 0600 "$source" "$destination"; then
              copied_bytes=$((copied_bytes + bytes))
              copied_count=$((copied_count + 1))
            else
              record_violation copy_failed "$relative"
              rm -f -- "$destination" || true
            fi
          }

          copy_archive() {
            local relative="$1" source="$RAW_ROOT/$1" bytes validation_file output_validation destination
            test -f "$source" && test ! -L "$source" || return 0
            bytes="$(stat -c '%s' -- "$source" 2>/dev/null || printf invalid)"
            validation_file="$task_root/archive-validation.$$.txt"
            if ! [[ "$bytes" =~ ^[0-9]+$ ]] || [ "$bytes" -eq 0 ] || [ "$bytes" -gt "$ARCHIVE_MAX_BYTES" ]; then
              record_violation archive_oversized_or_empty "$relative"
              remove_raw_path "$source"
              rm -f -- "$validation_file"
              return 0
            fi
            if ! validate_archive "$source" "$validation_file"; then
              reason="$(head -c 240 "$validation_file" 2>/dev/null || printf INVALID)"
              record_violation archive_invalid "$relative:$reason"
              remove_raw_path "$source"
              rm -f -- "$validation_file"
              return 0
            fi
            if [ $((copied_bytes + bytes)) -gt "$PAYLOAD_MAX_BYTES" ]; then
              record_violation tree_overflow_archive "$relative"
              remove_raw_path "$source"
              rm -f -- "$validation_file"
              return 0
            fi
            destination="$UPLOAD_ROOT/$relative"
            output_validation="$task_root/archive-output-validation.$$.txt"
            if install -m 0600 "$source" "$destination" && validate_archive "$destination" "$output_validation"; then
              copied_bytes=$((copied_bytes + bytes))
              copied_count=$((copied_count + 1))
              if ! install -m 0600 "$output_validation" "$destination.validation.txt" || \
                 ! sha256sum "$destination" > "$destination.sha256"; then
                record_violation archive_sidecar_failed "$relative"
                rm -f -- "$destination" "$destination.validation.txt" "$destination.sha256"
                copied_bytes=$((copied_bytes - bytes))
                copied_count=$((copied_count - 1))
              fi
            else
              record_violation archive_copy_or_revalidation_failed "$relative"
              rm -f -- "$destination" "$destination.validation.txt" "$destination.sha256"
            fi
            rm -f -- "$validation_file" "$output_validation"
          }

          # Essential small evidence first, then small runner data, then large runner data.
          for relative in evidence-manifest.txt manifest.txt storage-before.txt storage-after.txt \
            vps-storage-before.txt vps-storage-after.txt cleanup-healthz.json cleanup-meta.json \
            cleanup-state.txt cleanup-summary.txt remote-archive-failure.txt; do
            source="$RAW_ROOT/$relative"
            if [ -f "$source" ] && [ ! -L "$source" ]; then
              bytes="$(stat -c '%s' -- "$source" 2>/dev/null || printf invalid)"
              if [[ "$bytes" =~ ^[0-9]+$ ]] && [ "$bytes" -le "$SMALL_MAX_BYTES" ]; then
                copy_regular "$relative"
              else
                record_violation oversized_essential "$relative"
                remove_raw_path "$source"
              fi
            fi
          done

          while IFS= read -r -d '' path; do
            relative="${path#"$RAW_ROOT"/}"
            bytes="$(stat -c '%s' -- "$path" 2>/dev/null || printf invalid)"
            if [[ "$bytes" =~ ^[0-9]+$ ]] && [ "$bytes" -le "$SMALL_MAX_BYTES" ]; then
              copy_regular "$relative"
            fi
          done < <(find -P "$RAW_ROOT/runner" -xdev -type f -print0 2>/dev/null | sort -z)

          while IFS= read -r -d '' path; do
            relative="${path#"$RAW_ROOT"/}"
            bytes="$(stat -c '%s' -- "$path" 2>/dev/null || printf invalid)"
            if [[ "$bytes" =~ ^[0-9]+$ ]] && [ "$bytes" -gt "$SMALL_MAX_BYTES" ]; then
              copy_regular "$relative"
            fi
          done < <(find -P "$RAW_ROOT/runner" -xdev -type f -print0 2>/dev/null | sort -z)

          # Archives are deliberately last: a constrained tree keeps manifests/cleanup evidence first.
          copy_archive remote-candidate-evidence.tar.gz
          copy_archive remote-cleanup-evidence.tar.gz

          printf 'sanitizerStatus=%s\nviolations=%s\nremoved=%s\ncopiedFiles=%s\ncopiedPayloadBytes=%s\n' \
            "$([ "$violation_count" -eq 0 ] && printf clean || printf sanitized)" \
            "$violation_count" "$removed_count" "$copied_count" "$copied_bytes" \
            > "$UPLOAD_ROOT/upload-sanitization-summary.txt"
          head -n "$SUMMARY_MAX_LINES" "$SUMMARY_TMP" >> "$UPLOAD_ROOT/upload-sanitization-summary.txt"
          rm -f -- "$SUMMARY_TMP"

          final_status=0
          if find -P "$UPLOAD_ROOT" -xdev -mindepth 1 ! -type f ! -type d -print -quit | grep -q .; then
            final_status=1
          fi
          final_bytes="$(du -sb "$UPLOAD_ROOT" 2>/dev/null | awk '{print $1}')"
          if ! [[ "$final_bytes" =~ ^[0-9]+$ ]] || [ "$final_bytes" -gt "$TREE_MAX_BYTES" ]; then
            final_status=1
          fi
          if [ "$final_status" -ne 0 ]; then
            rm -rf -- "$UPLOAD_ROOT" || exit 2
            install -d -m 0700 "$UPLOAD_ROOT" || exit 2
            printf 'sanitizerStatus=fallback_minimal\nviolations=%s\nreason=final_validation_failed\n' \
              "$((violation_count + 1))" > "$UPLOAD_ROOT/upload-sanitization-summary.txt"
            violation_count=$((violation_count + 1))
          fi

          final_bytes="$(du -sb "$UPLOAD_ROOT" | awk '{print $1}')"
          [[ "$final_bytes" =~ ^[0-9]+$ ]]
          test "$final_bytes" -le "$TREE_MAX_BYTES"
          test -f "$UPLOAD_ROOT/upload-sanitization-summary.txt"
          test ! -L "$UPLOAD_ROOT/upload-sanitization-summary.txt"
          if find -P "$UPLOAD_ROOT" -xdev -mindepth 1 ! -type f ! -type d -print -quit | grep -q .; then
            printf 'SANITIZER_FATAL unsafeUploadTree\n' >&2
            exit 2
          fi
          printf 'UPLOAD_EVIDENCE_SANITIZED bytes=%s violations=%s\n' "$final_bytes" "$violation_count"
          test "$violation_count" -eq 0
          SANITIZER
          chmod 700 "$TASK_ROOT/sanitize_upload_tree.sh"

      - name: Fetch candidate adapter sources from this commit
        run: |
          set -Eeuo pipefail
          RAW_BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}"
          curl --fail --location --connect-timeout 8 --max-time 20 "$RAW_BASE/server/pg_adapter.py" -o "$TASK_ROOT/pg_adapter.py"
          curl --fail --location --connect-timeout 8 --max-time 20 "$RAW_BASE/server/pg_api_server.py" -o "$TASK_ROOT/pg_api_server.py"
          curl --fail --location --connect-timeout 8 --max-time 20 "$RAW_BASE/scripts/migration/audit-ranking-source-identities.py" -o "$TASK_ROOT/audit-ranking-source-identities.py"
          PYTHONDONTWRITEBYTECODE=1 python3 - "$TASK_ROOT/pg_adapter.py" "$TASK_ROOT/pg_api_server.py" "$TASK_ROOT/audit-ranking-source-identities.py" <<'PY'
          import sys
          for filename in sys.argv[1:]:
              compile(open(filename, encoding="utf-8").read(), filename, "exec")
          PY
          PG_ADAPTER_SHA256="$(sha256sum "$TASK_ROOT/pg_adapter.py" | awk '{print $1}')"
          PG_API_SERVER_SHA256="$(sha256sum "$TASK_ROOT/pg_api_server.py" | awk '{print $1}')"
          printf 'PG_ADAPTER_SHA256=%s\nPG_API_SERVER_SHA256=%s\n' "$PG_ADAPTER_SHA256" "$PG_API_SERVER_SHA256" >> "$GITHUB_ENV"
          printf 'candidate.pg_adapter_sha256=%s\ncandidate.pg_api_server_sha256=%s\n' "$PG_ADAPTER_SHA256" "$PG_API_SERVER_SHA256" >> "$TASK_ROOT/manifest.txt"

      - name: Prepare bounded SSH helper
        env:
          VPS2_PASSWORD: ${{ secrets.VPS2_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$VPS2_PASSWORD"
          mkdir -p "$TASK_ROOT/ssh"
          printf '%s\n' "$VPS2_PASSWORD" > "$TASK_ROOT/ssh/password"
          chmod 600 "$TASK_ROOT/ssh/password"
          cat > "$TASK_ROOT/ssh/askpass.sh" <<'SH'
          #!/bin/sh
          exec cat "$TASK_ROOT/ssh/password"
          SH
          chmod 700 "$TASK_ROOT/ssh/askpass.sh"
          {
            echo "SSH_ASKPASS=$TASK_ROOT/ssh/askpass.sh"
            echo "SSH_ASKPASS_REQUIRE=force"
            echo "DISPLAY=daily-song-list"
          } >> "$GITHUB_ENV"

      - name: Candidate adapter contract gate
        id: candidate_gate
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          SSH_OPTS=(-o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no -o ConnectTimeout=8 -o ServerAliveInterval=10 -o ServerAliveCountMax=3)
          REMOTE_ROOT="/tmp/daily-song-list-adapter-${GITHUB_RUN_ID}"
          printf 'REMOTE_ROOT=%s\n' "$REMOTE_ROOT" >> "$GITHUB_ENV"
          timeout --signal=TERM --kill-after=10s 60s ssh "${SSH_OPTS[@]}" "$VPS2_USER@$VPS2_HOST" bash -s -- "$REMOTE_ROOT" <<'REMOTE_SETUP'
          set -Eeuo pipefail
          remote_root="$1"
          [[ "$remote_root" =~ ^/tmp/daily-song-list-adapter-[0-9]+$ ]]
          rm -rf -- "$remote_root"
          install -d -m 0755 "$remote_root/server"
          REMOTE_SETUP
          timeout --signal=TERM --kill-after=10s 60s ssh "${SSH_OPTS[@]}" "$VPS2_USER@$VPS2_HOST" "df -B1 /" | tee "$TASK_ROOT/vps-storage-before.txt"
          vps_storage_before_bytes="$(awk 'NR==2 {print $4}' "$TASK_ROOT/vps-storage-before.txt")"
          [[ "$vps_storage_before_bytes" =~ ^[0-9]+$ ]]
          printf 'vpsStorageBeforeBytes=%s\n' "$vps_storage_before_bytes" >> "$TASK_ROOT/manifest.txt"
          timeout --signal=TERM --kill-after=10s 60s scp "${SSH_OPTS[@]}" "$TASK_ROOT/pg_adapter.py" "$TASK_ROOT/pg_api_server.py" "$TASK_ROOT/audit-ranking-source-identities.py" "$TASK_ROOT/verify_contract.py" "$VPS2_USER@$VPS2_HOST:$REMOTE_ROOT/server/"
          timeout --signal=TERM --kill-after=10s 360s ssh "${SSH_OPTS[@]}" "$VPS2_USER@$VPS2_HOST" bash -s -- \
            "$REMOTE_ROOT" "$EXPECTED_ACTIVE_REVISION_B64" "$SOURCE_TITLE_B64" "$SOURCE_ENTITY_KEY_B64" "$SOURCE_KEY_B64" \
            "$SOURCE_OCCURRENCE_COUNT_B64" "$SOURCE_VIDEO_COUNT_B64" "$CHANNEL_REGRESSION_HANDLE_B64" "$CHANNEL_REGRESSION_ID_B64" \
            "$PG_ADAPTER_SHA256" "$PG_API_SERVER_SHA256" <<'REMOTE'
          set -Eeuo pipefail
          decode_b64() {
            local encoded="$1" decoded
            [[ "$encoded" =~ ^[A-Za-z0-9+/]*={0,2}$ ]]
            decoded="$(printf '%s' "$encoded" | base64 --decode)"
            test "$(printf '%s' "$decoded" | base64 -w0)" = "$encoded"
            printf '%s' "$decoded"
          }
          remote_root="$1"
          expected_active="$(decode_b64 "$2")"
          source_title="$(decode_b64 "$3")"
          source_entity_key="$(decode_b64 "$4")"
          source_key="$(decode_b64 "$5")"
          expected_occurrences="$(decode_b64 "$6")"
          expected_videos="$(decode_b64 "$7")"
          regression_handle="$(decode_b64 "$8")"
          regression_id="$(decode_b64 "$9")"
          expected_adapter_sha="${10}"
          expected_server_sha="${11}"
          [[ "$remote_root" =~ ^/tmp/daily-song-list-adapter-[0-9]+$ ]]
          [[ "$source_key" =~ ^[0-9a-f]{16}([0-9a-f]{8})?$ ]]
          [[ "$expected_active" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$ ]]
          [[ "$expected_occurrences" =~ ^[1-9][0-9]*$ ]]
          [[ "$expected_videos" =~ ^[1-9][0-9]*$ ]]
          [[ "$regression_handle" =~ ^@[A-Za-z0-9._-]{1,100}$ ]]
          [[ "$regression_id" =~ ^UC[A-Za-z0-9_-]{20,}$ ]]
          test -n "$source_title"
          test -n "$source_entity_key"
          test "$source_entity_key" != "$source_key"
          candidate_unit="daily-song-list-adapter-${remote_root##*-}"
          capture_candidate_unit_diagnostics() {
            set +e
            timeout --signal=TERM --kill-after=2s 10s systemctl show --no-pager \
              --property=Id,ActiveState,SubState,MainPID,ExecMainStartTimestamp,ExecMainStatus,Result \
              "$candidate_unit" > "$remote_root/candidate-unit-status.txt.tmp" 2>&1
            head -c 262144 "$remote_root/candidate-unit-status.txt.tmp" > "$remote_root/candidate-unit-status.txt" 2>/dev/null || true
            rm -f -- "$remote_root/candidate-unit-status.txt.tmp"
            timeout --signal=TERM --kill-after=2s 10s journalctl --no-pager --output=short-iso \
              -u "$candidate_unit" -n 200 2>&1 | \
              grep -Eiv 'password|passwd|secret|token|authorization|cookie|credential|askpass|database_url|dsn|postgres(ql)?://[^[:space:]]*@' | \
              head -c 262144 > "$remote_root/candidate-unit-journal.txt" || true
          }
          cleanup_candidate_unit() {
            local output_path="$1"
            local cleanup_status=0
            local show_before_status=0
            local show_after_stop_status=0
            local show_after_reset_status=0
            local reset_status=0
            local stop_status=0
            local unit_present_before=0
            local unit_present_after_stop=0
            local unit_present_after=0
            local active_after=0
            local port_after=0
            local failed_before=0
            local failed_after=0
            local load_state_before=""
            local active_state_before=""
            local sub_state_before=""
            local result_before=""
            local load_state_after_stop=""
            local active_state_after_stop=""
            local sub_state_after_stop=""
            local result_after_stop=""
            local load_state_after=""
            local active_state_after=""
            local sub_state_after=""
            local result_after=""
            local state_before=""
            local state_after_stop=""
            local state_after_reset=""

            state_before="$(timeout --signal=TERM --kill-after=2s 10s systemctl show --no-pager \
              --property=LoadState,ActiveState,SubState,Result "$candidate_unit" 2>/dev/null)"
            show_before_status=$?
            if [ "$show_before_status" -eq 0 ] && [ -n "$state_before" ]; then
              load_state_before="$(printf '%s\n' "$state_before" | awk -F= '$1 == "LoadState" { print $2; exit }')"
              active_state_before="$(printf '%s\n' "$state_before" | awk -F= '$1 == "ActiveState" { print $2; exit }')"
              sub_state_before="$(printf '%s\n' "$state_before" | awk -F= '$1 == "SubState" { print $2; exit }')"
              result_before="$(printf '%s\n' "$state_before" | awk -F= '$1 == "Result" { print $2; exit }')"
              if [ "$load_state_before" != "not-found" ]; then
                unit_present_before=1
                if [ "$active_state_before" = "failed" ] || \
                   { [ -n "$result_before" ] && [ "$result_before" != "success" ]; }; then
                  failed_before=1
                fi
              fi
            else
              cleanup_status=1
            fi
            if [ "$unit_present_before" -eq 1 ]; then
              timeout --signal=TERM --kill-after=2s 15s systemctl stop "$candidate_unit" >/dev/null 2>&1
              stop_status=$?
            fi

            for unused in $(seq 1 10); do
              if ! systemctl is-active --quiet "$candidate_unit" && ! ss -ltn 'sport = :18766' | grep -q LISTEN; then break; fi
              sleep 1
            done

            state_after_stop="$(timeout --signal=TERM --kill-after=2s 10s systemctl show --no-pager \
              --property=LoadState,ActiveState,SubState,Result "$candidate_unit" 2>/dev/null)"
            show_after_stop_status=$?
            if [ "$show_after_stop_status" -eq 0 ] && [ -n "$state_after_stop" ]; then
              load_state_after_stop="$(printf '%s\n' "$state_after_stop" | awk -F= '$1 == "LoadState" { print $2; exit }')"
              active_state_after_stop="$(printf '%s\n' "$state_after_stop" | awk -F= '$1 == "ActiveState" { print $2; exit }')"
              sub_state_after_stop="$(printf '%s\n' "$state_after_stop" | awk -F= '$1 == "SubState" { print $2; exit }')"
              result_after_stop="$(printf '%s\n' "$state_after_stop" | awk -F= '$1 == "Result" { print $2; exit }')"
              if [ "$load_state_after_stop" != "not-found" ]; then
                unit_present_after_stop=1
                if [ "$active_state_after_stop" = "failed" ] || \
                   { [ -n "$result_after_stop" ] && [ "$result_after_stop" != "success" ]; }; then
                  failed_before=1
                fi
              fi
            else
              cleanup_status=1
            fi

            timeout --signal=TERM --kill-after=2s 10s systemctl reset-failed "$candidate_unit" >/dev/null 2>&1
            reset_status=$?

            state_after_reset="$(timeout --signal=TERM --kill-after=2s 10s systemctl show --no-pager \
              --property=LoadState,ActiveState,SubState,Result "$candidate_unit" 2>/dev/null)"
            show_after_reset_status=$?
            if [ "$show_after_reset_status" -eq 0 ] && [ -n "$state_after_reset" ]; then
              load_state_after="$(printf '%s\n' "$state_after_reset" | awk -F= '$1 == "LoadState" { print $2; exit }')"
              active_state_after="$(printf '%s\n' "$state_after_reset" | awk -F= '$1 == "ActiveState" { print $2; exit }')"
              sub_state_after="$(printf '%s\n' "$state_after_reset" | awk -F= '$1 == "SubState" { print $2; exit }')"
              result_after="$(printf '%s\n' "$state_after_reset" | awk -F= '$1 == "Result" { print $2; exit }')"
              if [ "$load_state_after" != "not-found" ]; then unit_present_after=1; fi
            else
              cleanup_status=1
            fi

            if [ "$active_state_after" = "failed" ] || [ "$result_after" = "failed" ]; then
              failed_after=1
            fi
            if systemctl is-active --quiet "$candidate_unit"; then active_after=1; else active_after=0; fi
            if ss -ltn 'sport = :18766' | grep -q LISTEN; then port_after=1; else port_after=0; fi
            if [ "$failed_before" -ne 0 ] || [ "$failed_after" -ne 0 ]; then cleanup_status=1; fi
            if [ "$stop_status" -ne 0 ] || [ "$active_after" -ne 0 ] || [ "$port_after" -ne 0 ]; then
              cleanup_status=1
            fi
            if [ "$unit_present_after" -eq 1 ]; then
              if [ "$active_state_after" != "inactive" ] || [ "$sub_state_after" != "dead" ] || [ "$result_after" != "success" ]; then
                cleanup_status=1
              fi
            fi

            if ! printf 'stopStatus=%s\nactiveAfter=%s\nport18766After=%s\nresetStatus=%s\nfailedBefore=%s\nfailedAfter=%s\nunitPresentAfter=%s\nactiveStateAfter=%s\nsubStateAfter=%s\nresultAfter=%s\nshowStatusBefore=%s\nshowStatusAfterStop=%s\nshowStatusAfter=%s\n' \
              "$stop_status" "$active_after" "$port_after" "$reset_status" \
              "$failed_before" "$failed_after" "$unit_present_after" "$active_state_after" \
              "$sub_state_after" "$result_after" "$show_before_status" "$show_after_stop_status" \
              "$show_after_reset_status" > "$output_path"; then
              cleanup_status=1
            fi
            return "$cleanup_status"
          }
          cleanup_candidate() {
            candidate_status=$?
            trap - EXIT
            set +e
            capture_candidate_unit_diagnostics
            cleanup_candidate_unit "$remote_root/candidate-unit-cleanup-result.txt"
            candidate_cleanup_status=$?
            if [ "$candidate_cleanup_status" -ne 0 ] && [ "$candidate_status" -eq 0 ]; then candidate_status=1; fi
            exit "$candidate_status"
          }
          trap cleanup_candidate EXIT
          test "$(sha256sum "$remote_root/server/pg_adapter.py" | awk '{print $1}')" = "$expected_adapter_sha"
          test "$(sha256sum "$remote_root/server/pg_api_server.py" | awk '{print $1}')" = "$expected_server_sha"
          systemd-run --quiet --collect --unit="$candidate_unit" --uid=www-data --property=RuntimeMaxSec=8m \
            --setenv=PGHOST=/var/run/postgresql --setenv=PGDATABASE=song_rank --setenv=PGUSER=www-data \
            --setenv=PYTHONPATH="$remote_root/server" /usr/bin/python3 "$remote_root/server/pg_api_server.py" --host 127.0.0.1 --port 18766
          for unused in $(seq 1 30); do
            if systemctl is-active --quiet "$candidate_unit" && ss -ltn 'sport = :18766' | grep -q LISTEN; then break; fi
            sleep 1
          done
          systemctl is-active --quiet "$candidate_unit"
          ss -ltn 'sport = :18766' | grep -q LISTEN
          base_url="http://127.0.0.1:18766"
          curl --fail --silent --show-error --connect-timeout 8 --max-time 300 "$base_url/healthz" > "$remote_root/candidate-healthz.json"
          jq -e '.status == "ok" and ((.counts.videos // 0) > 0) and ((.counts.occurrences // 0) > 0)' "$remote_root/candidate-healthz.json" >/dev/null
          curl --fail --silent --show-error --connect-timeout 8 --max-time 300 "$base_url/api/meta" > "$remote_root/candidate-meta.json"
          curl --fail --silent --show-error --connect-timeout 8 --max-time 20 --get \
            --data-urlencode 'range=all' --data-urlencode 'view=songs' --data-urlencode 'metric=occurrences' \
            --data-urlencode 'page=1' --data-urlencode 'pageSize=20' --data-urlencode 'searchScope=song' \
            --data-urlencode 'searchFields=title' --data-urlencode "q=$source_title" \
            "$base_url/api/rankings" > "$remote_root/candidate-rankings.json"
          curl --fail --silent --show-error --connect-timeout 8 --max-time 20 \
            "$base_url/api/sources/$source_key?page=1&pageSize=20" > "$remote_root/candidate-source.json"
          python3 - "$remote_root/candidate-negative.headers" "$remote_root/candidate-negative.json" "$base_url/api/sources/" <<'PY'
          import sys, urllib.error, urllib.request
          headers_path, body_path, url = sys.argv[1:]
          request = urllib.request.Request(url, method="GET")
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  status = response.status; headers = response.headers; body = response.read()
          except urllib.error.HTTPError as exc:
              status = exc.code; headers = exc.headers; body = exc.read()
          if status != 400 or headers.get("Cache-Control", "").lower() != "no-store":
              raise SystemExit(f"candidate empty source gate failed status={status} cache={headers.get('Cache-Control')!r}")
          open(headers_path, "wb").write(str(headers).encode())
          open(body_path, "wb").write(body)
          PY
          jq -e '.error == "bad_request"' "$remote_root/candidate-negative.json" >/dev/null
          python3 "$remote_root/server/audit-ranking-source-identities.py" --base-url "$base_url" --skip-rankings \
            --negative-query "" --page-size 20 --max-pages 1 --timeout 20 --concurrency 4 --expected-active "$expected_active" \
            --channel-probe "$regression_handle=$regression_id" > "$remote_root/candidate-channel-regression.log" 2>&1
          grep -qx 'IDENTITY_AUDIT_COMPLETE' "$remote_root/candidate-channel-regression.log"
          python3 "$remote_root/server/verify_contract.py" --meta "$remote_root/candidate-meta.json" --rankings "$remote_root/candidate-rankings.json" --source "$remote_root/candidate-source.json" \
            --phase candidate --revision "$expected_active" --source-entity-key "$source_entity_key" --source-key "$source_key" \
            --source-title "$source_title" --occurrences "$expected_occurrences" --videos "$expected_videos"
          candidate_thumbnail_code="$(curl --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -D "$remote_root/candidate-thumbnail.headers" -o "$remote_root/candidate-thumbnail.image" -w '%{http_code}' "$base_url/api/thumbnails/dQw4w9WgXcQ/hqdefault.jpg")"
          test "$candidate_thumbnail_code" = 200
          grep -Eiq '^Content-Type:[[:space:]]*image/' "$remote_root/candidate-thumbnail.headers"
          test -s "$remote_root/candidate-thumbnail.image"
          candidate_thumbnail_mime="$(file --brief --mime-type "$remote_root/candidate-thumbnail.image")"
          test "$candidate_thumbnail_mime" = image/jpeg -o "$candidate_thumbnail_mime" = image/png -o "$candidate_thumbnail_mime" = image/webp -o "$candidate_thumbnail_mime" = image/gif
          candidate_invalid_thumbnail_code="$(curl --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -D "$remote_root/candidate-invalid-thumbnail.headers" -o "$remote_root/candidate-invalid-thumbnail.body" -w '%{http_code}' "$base_url/api/thumbnails/invalid/hqdefault.jpg")"
          test "$candidate_invalid_thumbnail_code" = 400
          grep -Eiq '^Cache-Control:[[:space:]]*no-store[[:space:]]*$' "$remote_root/candidate-invalid-thumbnail.headers"
          jq -e '.error == "bad_request"' "$remote_root/candidate-invalid-thumbnail.body" >/dev/null
          REMOTE
          echo "PG_ADAPTER_CANDIDATE_CONTRACT_OK"

      - name: Install adapter candidate with two-file rollback guard
        id: install_candidate
        run: |
          set -Eeuo pipefail
          SSH_OPTS=(-o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no -o ConnectTimeout=8 -o ServerAliveInterval=10 -o ServerAliveCountMax=3)
          timeout --signal=TERM --kill-after=10s 180s ssh "${SSH_OPTS[@]}" "$VPS2_USER@$VPS2_HOST" bash -s -- "$REMOTE_ROOT" "$PG_ADAPTER_SHA256" "$PG_API_SERVER_SHA256" "$EXPECTED_ACTIVE_REVISION_B64" <<'REMOTE'
          set -Eeuo pipefail
          decode_b64() {
            local encoded="$1" decoded
            [[ "$encoded" =~ ^[A-Za-z0-9+/]*={0,2}$ ]]
            decoded="$(printf '%s' "$encoded" | base64 --decode)"
            test "$(printf '%s' "$decoded" | base64 -w0)" = "$encoded"
            printf '%s' "$decoded"
          }
          remote_root="$1"; expected_adapter_sha="$2"; expected_server_sha="$3"; expected_revision="$(decode_b64 "$4")"
          [[ "$remote_root" =~ ^/tmp/daily-song-list-adapter-[0-9]+$ ]]
          [[ "$expected_adapter_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$expected_server_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$expected_revision" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$ ]]
          capture_service_diagnostics() {
            prefix="$1"
            case "$prefix" in install-failure|install|rollback) ;;
              *) return 64 ;;
            esac
            set +e
            timeout --signal=TERM --kill-after=2s 10s systemctl show --no-pager               --property=Id,ActiveState,SubState,MainPID,ExecMainStartTimestamp,ExecMainStatus,Result               song-rank-pg-api.service > "$remote_root/${prefix}-service-status.txt.tmp" 2>&1
            head -c 262144 "$remote_root/${prefix}-service-status.txt.tmp" > "$remote_root/${prefix}-service-status.txt" 2>/dev/null || true
            rm -f -- "$remote_root/${prefix}-service-status.txt.tmp"
            timeout --signal=TERM --kill-after=2s 10s journalctl --no-pager --output=short-iso               -u song-rank-pg-api.service -n 200 2>&1 |               grep -Eiv 'password|passwd|secret|token|authorization|cookie|credential|askpass|database_url|dsn|postgres(ql)?://[^[:space:]]*@' |               head -c 262144 > "$remote_root/${prefix}-service-journal.txt" || true
            set -e
          }
          install -d -m 0755 "$remote_root/backup" /opt/culua/ytb-song-rank/server
          cp -p /opt/culua/ytb-song-rank/server/pg_adapter.py "$remote_root/backup/pg_adapter.py"
          cp -p /opt/culua/ytb-song-rank/server/pg_api_server.py "$remote_root/backup/pg_api_server.py"
          wait_for_service_contract_inner() {
            local deadline_seconds="$1"
            shift
            local base_url="$1"
            local health_path="$2"
            local meta_path="$3"
            local expected_revision="$4"
            local deadline=$((SECONDS + deadline_seconds))
            while [ "$SECONDS" -lt "$deadline" ]; do
              if timeout --signal=TERM --kill-after=1s 3s systemctl is-active --quiet song-rank-pg-api &&
                 timeout --signal=TERM --kill-after=1s 3s ss -ltn 'sport = :8765' | grep -q LISTEN; then
                if timeout --signal=TERM --kill-after=1s 8s curl --fail --silent --show-error \
                     --connect-timeout 2 --max-time 5 "$base_url/healthz" > "$health_path" &&
                   timeout --signal=TERM --kill-after=1s 3s jq -e \
                     '.status == "ok" and ((.counts.videos // 0) > 0) and ((.counts.occurrences // 0) > 0)' \
                     "$health_path" >/dev/null &&
                   timeout --signal=TERM --kill-after=1s 8s curl --fail --silent --show-error \
                     --connect-timeout 2 --max-time 5 "$base_url/api/meta" > "$meta_path" &&
                   timeout --signal=TERM --kill-after=1s 3s jq -e --arg expected "$expected_revision" \
                     '(.meta // .) as $m | (($m.active_revision_id // $m.activeRevisionId) == $expected) and (($m.migration_status // $m.migrationStatus) == "active")' \
                     "$meta_path" >/dev/null; then
                  return 0
                fi
              fi
              [ "$SECONDS" -lt "$deadline" ] || break
              sleep 1
            done
            return 1
          }
          wait_for_service_contract() {
            local deadline_seconds="${READINESS_DEADLINE_SECONDS:-45}"
            [[ "$deadline_seconds" =~ ^[1-9][0-9]*$ ]]
            timeout --signal=TERM --kill-after=2s "${deadline_seconds}s" \
              bash -c "$(declare -f wait_for_service_contract_inner); wait_for_service_contract_inner \"\$@\"" \
              p0-readiness "$deadline_seconds" "$@"
          }
          rollback_adapter() {
            original_status=$?
            trap - ERR
            set +e
            capture_service_diagnostics install-failure
            rollback_status=0
            install -m 0644 "$remote_root/backup/pg_adapter.py" /opt/culua/ytb-song-rank/server/pg_adapter.py || rollback_status=$?
            install -m 0644 "$remote_root/backup/pg_api_server.py" /opt/culua/ytb-song-rank/server/pg_api_server.py || rollback_status=$?
            systemctl restart song-rank-pg-api || rollback_status=$?
            if ! wait_for_service_contract "http://127.0.0.1:8765" \
              "$remote_root/rollback-healthz.json" "$remote_root/rollback-meta.json" "$expected_revision"; then
              rollback_status=1
            fi
            cmp -s "$remote_root/backup/pg_adapter.py" /opt/culua/ytb-song-rank/server/pg_adapter.py || rollback_status=$?
            cmp -s "$remote_root/backup/pg_api_server.py" /opt/culua/ytb-song-rank/server/pg_api_server.py || rollback_status=$?
            systemctl is-active --quiet song-rank-pg-api || rollback_status=$?
            ss -ltn 'sport = :8765' | grep -q LISTEN || rollback_status=$?
            curl --fail --silent --show-error --max-time 20 http://127.0.0.1:8765/healthz > "$remote_root/rollback-healthz.json" || rollback_status=$?
            jq -e '.status == "ok" and ((.counts.videos // 0) > 0) and ((.counts.occurrences // 0) > 0)' "$remote_root/rollback-healthz.json" >/dev/null || rollback_status=$?
            curl --fail --silent --show-error --max-time 20 http://127.0.0.1:8765/api/meta > "$remote_root/rollback-meta.json" || rollback_status=$?
            jq -e --arg expected "$expected_revision" '(.meta // .) as $m | (($m.active_revision_id // $m.activeRevisionId) == $expected) and (($m.migration_status // $m.migrationStatus) == "active")' "$remote_root/rollback-meta.json" >/dev/null || rollback_status=$?
            capture_service_diagnostics rollback
            if [ "$rollback_status" -eq 0 ]; then
              touch "$remote_root/rollback-complete" || rollback_status=$?
              echo "PG_ADAPTER_ROLLBACK_RUNTIME_VERIFIED" >&2
            fi
            if [ "$rollback_status" -ne 0 ]; then exit "$rollback_status"; fi
            exit "$original_status"
          }
          trap rollback_adapter ERR
          install -m 0644 "$remote_root/server/pg_adapter.py" /opt/culua/ytb-song-rank/server/pg_adapter.py
          install -m 0644 "$remote_root/server/pg_api_server.py" /opt/culua/ytb-song-rank/server/pg_api_server.py
          test "$(sha256sum /opt/culua/ytb-song-rank/server/pg_adapter.py | awk '{print $1}')" = "$expected_adapter_sha"
          test "$(sha256sum /opt/culua/ytb-song-rank/server/pg_api_server.py | awk '{print $1}')" = "$expected_server_sha"
          systemctl restart song-rank-pg-api
          for unused in $(seq 1 40); do
            if systemctl is-active --quiet song-rank-pg-api && ss -ltn 'sport = :8765' | grep -q LISTEN; then break; fi
            sleep 1
          done
          systemctl is-active --quiet song-rank-pg-api
          ss -ltn 'sport = :8765' | grep -q LISTEN
          capture_service_diagnostics install
          trap - ERR
          echo "PG_ADAPTER_INSTALLED_HASHES_OK"
          REMOTE
          timeout --signal=TERM --kill-after=10s 60s ssh "${SSH_OPTS[@]}" "$VPS2_USER@$VPS2_HOST" "df -B1 /" | tee "$TASK_ROOT/vps-storage-peak.txt"
          vps_storage_peak_bytes="$(awk 'NR==2 {print $4}' "$TASK_ROOT/vps-storage-peak.txt")"
          [[ "$vps_storage_peak_bytes" =~ ^[0-9]+$ ]]
          printf 'vpsStoragePeakBytes=%s\n' "$vps_storage_peak_bytes" >> "$TASK_ROOT/manifest.txt"
          printf 'PG_ADAPTER_INSTALLED=1\n' >> "$GITHUB_ENV"

      - name: Verify installed local adapter contract
        id: installed_contract
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          SSH_OPTS=(-o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no -o ConnectTimeout=8 -o ServerAliveInterval=10 -o ServerAliveCountMax=3)
          timeout --signal=TERM --kill-after=10s 720s ssh "${SSH_OPTS[@]}" "$VPS2_USER@$VPS2_HOST" bash -s -- \
            "$REMOTE_ROOT" "$SOURCE_TITLE_B64" "$SOURCE_KEY_B64" <<'REMOTE'
          set -Eeuo pipefail
          decode_b64() {
            local encoded="$1" decoded
            [[ "$encoded" =~ ^[A-Za-z0-9+/]*={0,2}$ ]]
            decoded="$(printf '%s' "$encoded" | base64 --decode)"
            test "$(printf '%s' "$decoded" | base64 -w0)" = "$encoded"
            printf '%s' "$decoded"
          }
          remote_root="$1"; source_title="$(decode_b64 "$2")"; source_key="$(decode_b64 "$3")"
          [[ "$remote_root" =~ ^/tmp/daily-song-list-adapter-[0-9]+$ ]]
          [[ "$source_key" =~ ^[0-9a-f]{16}([0-9a-f]{8})?$ ]]
          test -n "$source_title"
          base_url="http://127.0.0.1:8765"
          systemctl is-active --quiet song-rank-pg-api
          ss -ltn 'sport = :8765' | grep -q LISTEN
          curl --fail --silent --show-error --max-time 300 "$base_url/healthz" > "$remote_root/installed-healthz.json"
          curl --fail --silent --show-error --max-time 300 "$base_url/api/meta" > "$remote_root/installed-meta.json"
          curl --fail --silent --show-error --max-time 20 --get \
            --data-urlencode 'range=all' --data-urlencode 'view=songs' --data-urlencode 'metric=occurrences' \
            --data-urlencode 'page=1' --data-urlencode 'pageSize=20' --data-urlencode 'searchScope=song' \
            --data-urlencode 'searchFields=title' --data-urlencode "q=$source_title" \
            "$base_url/api/rankings" > "$remote_root/installed-rankings.json"
          curl --fail --silent --show-error --max-time 20 \
            "$base_url/api/sources/$source_key?page=1&pageSize=20" > "$remote_root/installed-source.json"
          code="$(curl --silent --show-error --max-time 20 -D "$remote_root/installed-negative.headers" \
            -o "$remote_root/installed-negative.json" -w '%{http_code}' "$base_url/api/sources/")"
          test "$code" = 400
          grep -Eiq '^Cache-Control:[[:space:]]*no-store[[:space:]]*$' "$remote_root/installed-negative.headers"
          jq -e '.error == "bad_request"' "$remote_root/installed-negative.json" >/dev/null
          REMOTE
          timeout --signal=TERM --kill-after=10s 60s scp "${SSH_OPTS[@]}" \
            "$VPS2_USER@$VPS2_HOST:$REMOTE_ROOT/installed-healthz.json" \
            "$VPS2_USER@$VPS2_HOST:$REMOTE_ROOT/installed-meta.json" \
            "$VPS2_USER@$VPS2_HOST:$REMOTE_ROOT/installed-rankings.json" \
            "$VPS2_USER@$VPS2_HOST:$REMOTE_ROOT/installed-source.json" \
            "$VPS2_USER@$VPS2_HOST:$REMOTE_ROOT/installed-negative.json" "$TASK_ROOT/"
          jq -e '.status == "ok" and ((.counts.videos // 0) > 0) and ((.counts.occurrences // 0) > 0)' "$TASK_ROOT/installed-healthz.json" >/dev/null
          python3 "$TASK_ROOT/verify_contract.py" --phase installed --meta "$TASK_ROOT/installed-meta.json" \
            --rankings "$TASK_ROOT/installed-rankings.json" --source "$TASK_ROOT/installed-source.json" \
            --revision "$EXPECTED_ACTIVE_REVISION" --source-entity-key "$SOURCE_ENTITY_KEY" --source-key "$SOURCE_KEY" --source-title "$SOURCE_TITLE" \
            --occurrences "$SOURCE_OCCURRENCE_COUNT" --videos "$SOURCE_VIDEO_COUNT"
          echo "PG_ADAPTER_INSTALLED_CONTRACT_OK"

      - name: Verify real public TLS relay contract through VPS before finalize
        id: public_contract
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          SSH_OPTS=(-o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no -o ConnectTimeout=8 -o ServerAliveInterval=10 -o ServerAliveCountMax=3)
          public_rankings_release="release=$GITHUB_RUN_ID"
          public_source_release="release=$GITHUB_RUN_ID"
          public_empty_release="release=$GITHUB_RUN_ID"
          timeout --signal=TERM --kill-after=10s 120s ssh "${SSH_OPTS[@]}" "$VPS2_USER@$VPS2_HOST" bash -s -- \
            "$REMOTE_ROOT" "$PUBLIC_BASE" "$THUMBNAIL_PATH_PREFIX" \
            "$public_rankings_release" "$public_source_release" "$public_empty_release" \
            "$SOURCE_TITLE_B64" "$SOURCE_ENTITY_KEY_B64" "$SOURCE_KEY_B64" \
            "$SOURCE_OCCURRENCE_COUNT_B64" "$SOURCE_VIDEO_COUNT_B64" "$EXPECTED_ACTIVE_REVISION_B64" <<'REMOTE_PUBLIC'
          set -Eeuo pipefail
          decode_b64() {
            local encoded="$1" decoded
            [[ "$encoded" =~ ^[A-Za-z0-9+/]*={0,2}$ ]]
            decoded="$(printf '%s' "$encoded" | base64 --decode)"
            test "$(printf '%s' "$decoded" | base64 -w0)" = "$encoded"
            printf '%s' "$decoded"
          }
          remote_root="$1"
          public_base="$2"
          thumbnail_prefix="$3"
          rankings_release="$4"
          source_release="$5"
          empty_release="$6"
          source_title="$(decode_b64 "$7")"
          source_entity_key="$(decode_b64 "$8")"
          source_key="$(decode_b64 "$9")"
          expected_occurrences="$(decode_b64 "${10}")"
          expected_videos="$(decode_b64 "${11}")"
          expected_revision="$(decode_b64 "${12}")"
          [[ "$remote_root" =~ ^/tmp/daily-song-list-adapter-[0-9]+$ ]]
          [[ "$public_base" == https://ytb-song-rank.culua.com ]]
          [[ "$public_base" != *$'\n'* && "$public_base" != *$'\r'* ]]
          [[ "$thumbnail_prefix" == /api/thumbnails ]]
          [[ "$rankings_release" =~ ^release=[0-9]+$ ]]
          [[ "$source_release" =~ ^release=[0-9]+$ ]]
          [[ "$empty_release" =~ ^release=[0-9]+$ ]]
          [[ "$source_key" =~ ^[0-9a-f]{16}([0-9a-f]{8})?$ ]]
          [[ "$expected_occurrences" =~ ^[1-9][0-9]*$ ]]
          [[ "$expected_videos" =~ ^[1-9][0-9]*$ ]]
          [[ "$expected_revision" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$ ]]
          test -n "$source_title"
          test -n "$source_entity_key"
          test "$source_entity_key" != "$source_key"
          base_url="$public_base"
          PUBLIC_BASE="$public_base"
          THUMBNAIL_PATH_PREFIX="$thumbnail_prefix"
          curl --fail --silent --show-error --location --connect-timeout 8 --max-time 20 \
            "$base_url/healthz" -o "$remote_root/public-healthz.json"
          jq -e '.status == "ok" and ((.counts.videos // 0) > 0) and ((.counts.occurrences // 0) > 0)' \
            "$remote_root/public-healthz.json" >/dev/null
          curl --fail --silent --show-error --location --connect-timeout 8 --max-time 20 \
            -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
            -D "$remote_root/public-meta.headers" "$base_url/api/meta" -o "$remote_root/public-meta.json"
          curl --fail --silent --show-error --location --connect-timeout 8 --max-time 20 \
            -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' --get \
            --data-urlencode 'range=all' --data-urlencode 'view=songs' \
            --data-urlencode 'metric=occurrences' --data-urlencode 'page=1' \
            --data-urlencode 'pageSize=20' --data-urlencode 'searchScope=song' \
            --data-urlencode 'searchFields=title' --data-urlencode "q=$source_title" \
            --data-urlencode "$rankings_release" \
            "$base_url/api/rankings" -o "$remote_root/public-rankings.json"
          curl --fail --silent --show-error --location --connect-timeout 8 --max-time 20 \
            -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' --get \
            --data-urlencode "$source_release" \
            "$base_url/api/sources/$source_key?page=1&pageSize=20" \
            -o "$remote_root/public-source.json"
          code="$(curl --silent --show-error --location --connect-timeout 8 --max-time 20 \
            -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
            -D "$remote_root/public-empty.headers" -o "$remote_root/public-empty.json" \
            -w '%{http_code}' --get --data-urlencode "$empty_release" \
            "$base_url/api/sources/")"
          test "$code" = 400
          grep -Eiq '^Cache-Control:[[:space:]]*no-store[[:space:]]*$' "$remote_root/public-empty.headers"
          jq -e '.error == "bad_request"' "$remote_root/public-empty.json" >/dev/null
          python3 "$remote_root/server/verify_contract.py" --phase public \
            --meta "$remote_root/public-meta.json" --rankings "$remote_root/public-rankings.json" \
            --source "$remote_root/public-source.json" --revision "$expected_revision" \
            --source-entity-key "$source_entity_key" --source-key "$source_key" \
            --source-title "$source_title" --occurrences "$expected_occurrences" \
            --videos "$expected_videos" > "$remote_root/public-contract.log"
          public_video_id="$(sed -n 's/.*videoId=\([^ ]*\).*/\1/p' "$remote_root/public-contract.log" | tail -n1)"
          [[ "$public_video_id" =~ ^[A-Za-z0-9_-]{11}$ ]]
          thumbnail_url="$PUBLIC_BASE$THUMBNAIL_PATH_PREFIX/$public_video_id/hqdefault.jpg"
          thumbnail_code="$(curl --silent --show-error --location --connect-timeout 8 --max-time 20 \
            -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
            -D "$remote_root/public-thumbnail.headers" -o "$remote_root/public-thumbnail.image" \
            -w '%{http_code}' "$thumbnail_url")"
          test "$thumbnail_code" = 200
          grep -Eiq '^Content-Type:[[:space:]]*image/' "$remote_root/public-thumbnail.headers"
          test -s "$remote_root/public-thumbnail.image"
          thumbnail_mime="$(file --brief --mime-type "$remote_root/public-thumbnail.image")"
          test "$thumbnail_mime" = image/jpeg -o "$thumbnail_mime" = image/png \
            -o "$thumbnail_mime" = image/webp -o "$thumbnail_mime" = image/gif
          invalid_thumbnail_code="$(curl --silent --show-error --location --connect-timeout 8 --max-time 20 \
            -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
            -D "$remote_root/public-invalid-thumbnail.headers" \
            -o "$remote_root/public-invalid-thumbnail.body" -w '%{http_code}' \
            "$base_url$thumbnail_prefix/invalid/hqdefault.jpg")"
          test "$invalid_thumbnail_code" = 400
          grep -Eiq '^Cache-Control:[[:space:]]*no-store[[:space:]]*$' \
            "$remote_root/public-invalid-thumbnail.headers"
          jq -e '.error == "bad_request"' "$remote_root/public-invalid-thumbnail.body" >/dev/null
          rm -f -- "$remote_root/public-thumbnail.image"
          echo "PG_ADAPTER_PUBLIC_RELAY_CONTRACT_OK"
          REMOTE_PUBLIC
          timeout --signal=TERM --kill-after=10s 60s scp "${SSH_OPTS[@]}" \
            "$VPS2_USER@$VPS2_HOST:$REMOTE_ROOT/public-healthz.json" \
            "$VPS2_USER@$VPS2_HOST:$REMOTE_ROOT/public-meta.headers" \
            "$VPS2_USER@$VPS2_HOST:$REMOTE_ROOT/public-meta.json" \
            "$VPS2_USER@$VPS2_HOST:$REMOTE_ROOT/public-rankings.json" \
            "$VPS2_USER@$VPS2_HOST:$REMOTE_ROOT/public-source.json" \
            "$VPS2_USER@$VPS2_HOST:$REMOTE_ROOT/public-empty.headers" \
            "$VPS2_USER@$VPS2_HOST:$REMOTE_ROOT/public-empty.json" \
            "$VPS2_USER@$VPS2_HOST:$REMOTE_ROOT/public-contract.log" \
            "$VPS2_USER@$VPS2_HOST:$REMOTE_ROOT/public-thumbnail.headers" \
            "$VPS2_USER@$VPS2_HOST:$REMOTE_ROOT/public-invalid-thumbnail.headers" \
            "$VPS2_USER@$VPS2_HOST:$REMOTE_ROOT/public-invalid-thumbnail.body" \
            "$TASK_ROOT/"
          jq -e '.status == "ok" and ((.counts.videos // 0) > 0) and ((.counts.occurrences // 0) > 0)' \
            "$TASK_ROOT/public-healthz.json" >/dev/null
          python3 "$TASK_ROOT/verify_contract.py" --phase public \
            --meta "$TASK_ROOT/public-meta.json" --rankings "$TASK_ROOT/public-rankings.json" \
            --source "$TASK_ROOT/public-source.json" --revision "$EXPECTED_ACTIVE_REVISION" \
            --source-entity-key "$SOURCE_ENTITY_KEY" --source-key "$SOURCE_KEY" \
            --source-title "$SOURCE_TITLE" --occurrences "$SOURCE_OCCURRENCE_COUNT" \
            --videos "$SOURCE_VIDEO_COUNT"
          grep -Eq "^CONTRACT_VERIFIED phase=public videoId=[A-Za-z0-9_-]{11} occurrences=${SOURCE_OCCURRENCE_COUNT} videos=${SOURCE_VIDEO_COUNT}$" \
            "$TASK_ROOT/public-contract.log"
          printf 'publicContractTransport=ssh-vps\n' >> "$TASK_ROOT/manifest.txt"
          echo "PG_ADAPTER_PUBLIC_RELAY_CONTRACT_OK"

      - name: Finalize only after public contract gate
        id: finalize_release
        run: |
          set -Eeuo pipefail
          SSH_OPTS=(-o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no -o ConnectTimeout=8 -o ServerAliveInterval=10 -o ServerAliveCountMax=3)
          timeout --signal=TERM --kill-after=10s 120s ssh "${SSH_OPTS[@]}" "$VPS2_USER@$VPS2_HOST" bash -s -- \
            "$REMOTE_ROOT" "$PG_ADAPTER_SHA256" "$PG_API_SERVER_SHA256" "$EXPECTED_ACTIVE_REVISION_B64" <<'REMOTE'
          set -Eeuo pipefail
          decode_b64() {
            local encoded="$1" decoded
            [[ "$encoded" =~ ^[A-Za-z0-9+/]*={0,2}$ ]]
            decoded="$(printf '%s' "$encoded" | base64 --decode)"
            test "$(printf '%s' "$decoded" | base64 -w0)" = "$encoded"
            printf '%s' "$decoded"
          }
          remote_root="$1"; expected_adapter_sha="$2"; expected_server_sha="$3"; expected_revision="$(decode_b64 "$4")"
          [[ "$remote_root" =~ ^/tmp/daily-song-list-adapter-[0-9]+$ ]]
          [[ "$expected_adapter_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$expected_server_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$expected_revision" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$ ]]
          test -d "$remote_root/backup"
          test "$(sha256sum /opt/culua/ytb-song-rank/server/pg_adapter.py | awk '{print $1}')" = "$expected_adapter_sha"
          test "$(sha256sum /opt/culua/ytb-song-rank/server/pg_api_server.py | awk '{print $1}')" = "$expected_server_sha"
          test -f "$remote_root/rollback-complete" && { echo "PG_ADAPTER_BLOCKED rollback-already-used"; exit 78; }
          systemctl is-active --quiet song-rank-pg-api
          ss -ltn 'sport = :8765' | grep -q LISTEN
          curl --fail --silent --show-error --max-time 20 http://127.0.0.1:8765/healthz > "$remote_root/finalize-healthz.json"
          jq -e '.status == "ok" and ((.counts.videos // 0) > 0) and ((.counts.occurrences // 0) > 0)' "$remote_root/finalize-healthz.json" >/dev/null
          curl --fail --silent --show-error --max-time 20 http://127.0.0.1:8765/api/meta > "$remote_root/finalize-meta.json"
          jq -e --arg expected "$expected_revision" '(.meta // .) as $m | (($m.active_revision_id // $m.activeRevisionId) == $expected) and (($m.migration_status // $m.migrationStatus) == "active")' "$remote_root/finalize-meta.json" >/dev/null
          touch "$remote_root/release-finalized"
          echo "PG_ADAPTER_CONTRACT_FINALIZED"
          REMOTE
          printf 'PUBLIC_QUICK_GATE_PASSED=1\n' >> "$GITHUB_ENV"

      - name: Stage bounded pre-cleanup release evidence
        if: always() && env.TASK_ROOT != ''
        run: |
          set +e
          set -o pipefail
          capture_status=0
          EVIDENCE_ROOT="$TASK_ROOT/release-evidence"
          install -d -m 0700 "$EVIDENCE_ROOT" "$EVIDENCE_ROOT/runner"
          printf 'runId=%s\nrunAttempt=%s\nheadSha=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" \
            > "$EVIDENCE_ROOT/evidence-manifest.txt"
          LOCAL_EVIDENCE_ALLOWLIST=(
            manifest.txt storage-before.txt vps-storage-before.txt
            installed-healthz.json installed-meta.json installed-rankings.json installed-source.json
            installed-negative.headers installed-negative.json
            public-healthz.json public-meta.headers public-meta.json public-rankings.json public-source.json
            public-empty.headers public-empty.json public-contract.log
            public-thumbnail.headers public-invalid-thumbnail.headers public-invalid-thumbnail.body
          )
          local_total=0
          for relative in "${LOCAL_EVIDENCE_ALLOWLIST[@]}"; do
            path="$TASK_ROOT/$relative"
            if [ -e "$path" ]; then
              test -f "$path" && test ! -L "$path" || { capture_status=1; continue; }
              bytes="$(stat -c '%s' -- "$path")"
              [[ "$bytes" =~ ^[0-9]+$ ]] && test "$bytes" -le 12582912 || { capture_status=1; continue; }
              local_total=$((local_total + bytes))
              test "$local_total" -le 33554432 || { capture_status=1; continue; }
              install -m 0600 "$path" "$EVIDENCE_ROOT/runner/$relative" || capture_status=$?
            fi
          done
          if [ -n "${REMOTE_ROOT:-}" ]; then
            SSH_OPTS=(-o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no -o ConnectTimeout=8 -o ServerAliveInterval=10 -o ServerAliveCountMax=3)
            timeout --signal=TERM --kill-after=10s 90s ssh "${SSH_OPTS[@]}" "$VPS2_USER@$VPS2_HOST" bash -s -- \
              "$REMOTE_ROOT" > "$EVIDENCE_ROOT/remote-candidate-evidence.tar.gz" <<'REMOTE_EVIDENCE'
          set -Eeuo pipefail
          remote_root="$1"
          [[ "$remote_root" =~ ^/tmp/daily-song-list-adapter-[0-9]+$ ]]
          REMOTE_EVIDENCE_ALLOWLIST=(
            candidate-healthz.json candidate-meta.json candidate-rankings.json candidate-source.json
            candidate-negative.headers candidate-negative.json candidate-channel-regression.log
            candidate-thumbnail.headers candidate-invalid-thumbnail.headers candidate-invalid-thumbnail.body
            candidate-unit-status.txt candidate-unit-journal.txt candidate-unit-cleanup-result.txt
            install-failure-service-status.txt install-failure-service-journal.txt
            install-service-status.txt install-service-journal.txt
            rollback-service-status.txt rollback-service-journal.txt
            installed-healthz.json installed-meta.json installed-rankings.json installed-source.json
            installed-negative.headers installed-negative.json
            rollback-healthz.json rollback-meta.json finalize-healthz.json finalize-meta.json
            cleanup-healthz.json cleanup-meta.json release-finalized rollback-complete
          )
          selected=()
          total=0
          for relative in "${REMOTE_EVIDENCE_ALLOWLIST[@]}"; do
            path="$remote_root/$relative"
            if [ -e "$path" ]; then
              test -f "$path"
              test ! -L "$path"
              bytes="$(stat -c '%s' -- "$path")"
              [[ "$bytes" =~ ^[0-9]+$ ]]
              test "$bytes" -le 12582912
              total=$((total + bytes))
              test "$total" -le 33554432
              selected+=("$relative")
            fi
          done
          test "${#selected[@]}" -gt 0
          printf '%s\0' "${selected[@]}" | \
            tar --create --gzip --file=- --directory="$remote_root" --null --files-from=-
          REMOTE_EVIDENCE
            remote_capture_status=$?
            archive_path="$EVIDENCE_ROOT/remote-candidate-evidence.tar.gz"
            archive_list="$EVIDENCE_ROOT/remote-archive-contents.txt"
            archive_sha="$EVIDENCE_ROOT/remote-candidate-evidence.sha256"
            archive_failure=""
            if [ "$remote_capture_status" -ne 0 ]; then
              archive_failure="remote_capture_failed status=$remote_capture_status"
            elif [ ! -f "$archive_path" ] || [ -L "$archive_path" ] || [ ! -s "$archive_path" ]; then
              archive_failure="archive_missing_empty_or_nonregular"
            else
              archive_bytes="$(stat -c '%s' -- "$archive_path" 2>/dev/null || printf invalid)"
              if ! [[ "$archive_bytes" =~ ^[0-9]+$ ]] || [ "$archive_bytes" -gt 16777216 ]; then
                archive_failure="archive_oversized bytes=$archive_bytes limit=16777216"
              elif ! (ulimit -f 128; timeout --signal=TERM --kill-after=2s 10s tar -tzf "$archive_path" > "$archive_list"); then
                archive_failure="archive_corrupt_or_listing_unbounded"
              elif [ ! -f "$archive_list" ] || [ -L "$archive_list" ] || [ "$(stat -c '%s' -- "$archive_list")" -gt 65536 ]; then
                archive_failure="archive_listing_invalid"
              elif grep -Eiq '(^|/)(ssh|askpass|backup|server|secrets?)(/|$)|(^|/)\.\.?(/|$)' "$archive_list"; then
                archive_failure="archive_forbidden_path"
              elif ! sha256sum "$archive_path" > "$archive_sha"; then
                archive_failure="archive_sha256_failed"
              fi
            fi
            if [ -n "$archive_failure" ]; then
              capture_status=1
              rm -f -- "$archive_path" "$archive_list" "$archive_sha"
              printf 'remoteArchiveAccepted=0\nreason=%s\n' "$archive_failure" > "$EVIDENCE_ROOT/remote-archive-failure.txt"
            else
              printf 'remoteArchiveAccepted=1\nbytes=%s\n' "$archive_bytes" >> "$EVIDENCE_ROOT/evidence-manifest.txt"
            fi
          fi
          printf 'captureStatus=%s\nlocalEvidenceBytes=%s\n' "$capture_status" "$local_total" \
            >> "$EVIDENCE_ROOT/evidence-manifest.txt"
          exit "$capture_status"

      - name: Record result and rollback/cleanup on any pre-finalize failure
        if: always()
        run: |
          set +e
          set -o pipefail
          SSH_OPTS=(-o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no -o ConnectTimeout=8 -o ServerAliveInterval=10 -o ServerAliveCountMax=3)
          cleanup_status=0
          remote_cleanup_ok=0
          EVIDENCE_ROOT=""
          if [ -n "${TASK_ROOT:-}" ]; then
            EVIDENCE_ROOT="$TASK_ROOT/release-evidence"
            install -d -m 0700 "$EVIDENCE_ROOT"
          fi
          if [ -n "${REMOTE_ROOT:-}" ]; then
            timeout --signal=TERM --kill-after=10s 240s ssh "${SSH_OPTS[@]}" "$VPS2_USER@$VPS2_HOST" bash -s -- \
              "$REMOTE_ROOT" "$EXPECTED_ACTIVE_REVISION_B64" > "$EVIDENCE_ROOT/remote-cleanup-evidence.tar.gz" <<'REMOTE_CLEANUP'
          set -Eeuo pipefail
          decode_b64() {
            local encoded="$1" decoded
            [[ "$encoded" =~ ^[A-Za-z0-9+/]*={0,2}$ ]]
            decoded="$(printf '%s' "$encoded" | base64 --decode)"
            test "$(printf '%s' "$decoded" | base64 -w0)" = "$encoded"
            printf '%s' "$decoded"
          }
          remote_root="$1"; expected_revision="$(decode_b64 "$2")"
          [[ "$remote_root" =~ ^/tmp/daily-song-list-adapter-[0-9]+$ ]]
          [[ "$expected_revision" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$ ]]
          candidate_unit="daily-song-list-adapter-${remote_root##*-}"
          capture_cleanup_service_diagnostics() {
            set +e
            timeout --signal=TERM --kill-after=2s 10s systemctl show --no-pager \
              --property=Id,ActiveState,SubState,MainPID,ExecMainStartTimestamp,ExecMainStatus,Result \
              song-rank-pg-api.service > "$remote_root/cleanup-service-status.txt.tmp" 2>&1
            head -c 262144 "$remote_root/cleanup-service-status.txt.tmp" > "$remote_root/cleanup-service-status.txt" 2>/dev/null || true
            rm -f -- "$remote_root/cleanup-service-status.txt.tmp"
            timeout --signal=TERM --kill-after=2s 10s journalctl --no-pager --output=short-iso \
              -u song-rank-pg-api.service -n 200 2>&1 | \
              grep -Eiv 'password|passwd|secret|token|authorization|cookie|credential|askpass|database_url|dsn|postgres(ql)?://[^[:space:]]*@' | \
              head -c 262144 > "$remote_root/cleanup-service-journal.txt" || true
          }
          capture_cleanup_candidate_diagnostics() {
            set +e
            timeout --signal=TERM --kill-after=2s 10s systemctl show --no-pager \
              --property=Id,ActiveState,SubState,MainPID,ExecMainStartTimestamp,ExecMainStatus,Result \
              "$candidate_unit" > "$remote_root/cleanup-candidate-unit-status.txt.tmp" 2>&1
            head -c 262144 "$remote_root/cleanup-candidate-unit-status.txt.tmp" > "$remote_root/cleanup-candidate-unit-status.txt" 2>/dev/null || true
            rm -f -- "$remote_root/cleanup-candidate-unit-status.txt.tmp"
            timeout --signal=TERM --kill-after=2s 10s journalctl --no-pager --output=short-iso \
              -u "$candidate_unit" -n 200 2>&1 | \
              grep -Eiv 'password|passwd|secret|token|authorization|cookie|credential|askpass|database_url|dsn|postgres(ql)?://[^[:space:]]*@' | \
              head -c 262144 > "$remote_root/cleanup-candidate-unit-journal.txt" || true
          }
          cleanup_candidate_unit() {
            local output_path="$1"
            local cleanup_status=0
            local show_before_status=0
            local show_after_stop_status=0
            local show_after_reset_status=0
            local reset_status=0
            local stop_status=0
            local unit_present_before=0
            local unit_present_after_stop=0
            local unit_present_after=0
            local active_after=0
            local port_after=0
            local failed_before=0
            local failed_after=0
            local load_state_before=""
            local active_state_before=""
            local sub_state_before=""
            local result_before=""
            local load_state_after_stop=""
            local active_state_after_stop=""
            local sub_state_after_stop=""
            local result_after_stop=""
            local load_state_after=""
            local active_state_after=""
            local sub_state_after=""
            local result_after=""
            local state_before=""
            local state_after_stop=""
            local state_after_reset=""

            state_before="$(timeout --signal=TERM --kill-after=2s 10s systemctl show --no-pager \
              --property=LoadState,ActiveState,SubState,Result "$candidate_unit" 2>/dev/null)"
            show_before_status=$?
            if [ "$show_before_status" -eq 0 ] && [ -n "$state_before" ]; then
              load_state_before="$(printf '%s\n' "$state_before" | awk -F= '$1 == "LoadState" { print $2; exit }')"
              active_state_before="$(printf '%s\n' "$state_before" | awk -F= '$1 == "ActiveState" { print $2; exit }')"
              sub_state_before="$(printf '%s\n' "$state_before" | awk -F= '$1 == "SubState" { print $2; exit }')"
              result_before="$(printf '%s\n' "$state_before" | awk -F= '$1 == "Result" { print $2; exit }')"
              if [ "$load_state_before" != "not-found" ]; then
                unit_present_before=1
                if [ "$active_state_before" = "failed" ] || \
                   { [ -n "$result_before" ] && [ "$result_before" != "success" ]; }; then
                  failed_before=1
                fi
              fi
            else
              cleanup_status=1
            fi
            if [ "$unit_present_before" -eq 1 ]; then
              timeout --signal=TERM --kill-after=2s 15s systemctl stop "$candidate_unit" >/dev/null 2>&1
              stop_status=$?
            fi

            for unused in $(seq 1 10); do
              if ! systemctl is-active --quiet "$candidate_unit" && ! ss -ltn 'sport = :18766' | grep -q LISTEN; then break; fi
              sleep 1
            done

            state_after_stop="$(timeout --signal=TERM --kill-after=2s 10s systemctl show --no-pager \
              --property=LoadState,ActiveState,SubState,Result "$candidate_unit" 2>/dev/null)"
            show_after_stop_status=$?
            if [ "$show_after_stop_status" -eq 0 ] && [ -n "$state_after_stop" ]; then
              load_state_after_stop="$(printf '%s\n' "$state_after_stop" | awk -F= '$1 == "LoadState" { print $2; exit }')"
              active_state_after_stop="$(printf '%s\n' "$state_after_stop" | awk -F= '$1 == "ActiveState" { print $2; exit }')"
              sub_state_after_stop="$(printf '%s\n' "$state_after_stop" | awk -F= '$1 == "SubState" { print $2; exit }')"
              result_after_stop="$(printf '%s\n' "$state_after_stop" | awk -F= '$1 == "Result" { print $2; exit }')"
              if [ "$load_state_after_stop" != "not-found" ]; then
                unit_present_after_stop=1
                if [ "$active_state_after_stop" = "failed" ] || \
                   { [ -n "$result_after_stop" ] && [ "$result_after_stop" != "success" ]; }; then
                  failed_before=1
                fi
              fi
            else
              cleanup_status=1
            fi

            timeout --signal=TERM --kill-after=2s 10s systemctl reset-failed "$candidate_unit" >/dev/null 2>&1
            reset_status=$?

            state_after_reset="$(timeout --signal=TERM --kill-after=2s 10s systemctl show --no-pager \
              --property=LoadState,ActiveState,SubState,Result "$candidate_unit" 2>/dev/null)"
            show_after_reset_status=$?
            if [ "$show_after_reset_status" -eq 0 ] && [ -n "$state_after_reset" ]; then
              load_state_after="$(printf '%s\n' "$state_after_reset" | awk -F= '$1 == "LoadState" { print $2; exit }')"
              active_state_after="$(printf '%s\n' "$state_after_reset" | awk -F= '$1 == "ActiveState" { print $2; exit }')"
              sub_state_after="$(printf '%s\n' "$state_after_reset" | awk -F= '$1 == "SubState" { print $2; exit }')"
              result_after="$(printf '%s\n' "$state_after_reset" | awk -F= '$1 == "Result" { print $2; exit }')"
              if [ "$load_state_after" != "not-found" ]; then unit_present_after=1; fi
            else
              cleanup_status=1
            fi

            if [ "$active_state_after" = "failed" ] || [ "$result_after" = "failed" ]; then
              failed_after=1
            fi
            if systemctl is-active --quiet "$candidate_unit"; then active_after=1; else active_after=0; fi
            if ss -ltn 'sport = :18766' | grep -q LISTEN; then port_after=1; else port_after=0; fi
            if [ "$failed_before" -ne 0 ] || [ "$failed_after" -ne 0 ]; then cleanup_status=1; fi
            if [ "$stop_status" -ne 0 ] || [ "$active_after" -ne 0 ] || [ "$port_after" -ne 0 ]; then
              cleanup_status=1
            fi
            if [ "$unit_present_after" -eq 1 ]; then
              if [ "$active_state_after" != "inactive" ] || [ "$sub_state_after" != "dead" ] || [ "$result_after" != "success" ]; then
                cleanup_status=1
              fi
            fi

            if ! printf 'stopStatus=%s\nactiveAfter=%s\nport18766After=%s\nresetStatus=%s\nfailedBefore=%s\nfailedAfter=%s\nunitPresentAfter=%s\nactiveStateAfter=%s\nsubStateAfter=%s\nresultAfter=%s\nshowStatusBefore=%s\nshowStatusAfterStop=%s\nshowStatusAfter=%s\n' \
              "$stop_status" "$active_after" "$port_after" "$reset_status" \
              "$failed_before" "$failed_after" "$unit_present_after" "$active_state_after" \
              "$sub_state_after" "$result_after" "$show_before_status" "$show_after_stop_status" \
              "$show_after_reset_status" > "$output_path"; then
              cleanup_status=1
            fi
            return "$cleanup_status"
          }
          finalize_remote_cleanup() {
            original_status=$?
            trap - EXIT ERR
            set +e
            capture_cleanup_service_diagnostics
            capture_cleanup_candidate_diagnostics
            cleanup_candidate_unit "$remote_root/cleanup-candidate-unit-result.txt"
            candidate_cleanup_status=$?
            selected=()
            for relative in cleanup-healthz.json cleanup-meta.json cleanup-service-status.txt cleanup-service-journal.txt \
              cleanup-candidate-unit-status.txt cleanup-candidate-unit-journal.txt cleanup-candidate-unit-result.txt rollback-complete; do
              path="$remote_root/$relative"
              if [ -f "$path" ] && [ ! -L "$path" ]; then
                bytes="$(stat -c '%s' -- "$path" 2>/dev/null || printf invalid)"
                if [[ "$bytes" =~ ^[0-9]+$ ]] && [ "$bytes" -le 12582912 ]; then selected+=("$relative"); fi
              fi
            done
            evidence_status=0
            if [ "${#selected[@]}" -gt 0 ]; then
              printf '%s\0' "${selected[@]}" | tar --create --gzip --file=- --directory="$remote_root" --null --files-from=- || evidence_status=$?
            else
              evidence_status=1
            fi
            if [ "$candidate_cleanup_status" -eq 0 ]; then
              rm -rf -- "$remote_root" || evidence_status=$?
            else
              evidence_status=1
            fi
            if [ "$original_status" -ne 0 ]; then exit "$original_status"; fi
            exit "$evidence_status"
          }
          trap finalize_remote_cleanup EXIT
          wait_for_service_contract_inner() {
            local deadline_seconds="$1"
            shift
            local base_url="$1"
            local health_path="$2"
            local meta_path="$3"
            local expected_revision="$4"
            local deadline=$((SECONDS + deadline_seconds))
            while [ "$SECONDS" -lt "$deadline" ]; do
              if timeout --signal=TERM --kill-after=1s 3s systemctl is-active --quiet song-rank-pg-api &&
                 timeout --signal=TERM --kill-after=1s 3s ss -ltn 'sport = :8765' | grep -q LISTEN; then
                if timeout --signal=TERM --kill-after=1s 8s curl --fail --silent --show-error \
                     --connect-timeout 2 --max-time 5 "$base_url/healthz" > "$health_path" &&
                   timeout --signal=TERM --kill-after=1s 3s jq -e \
                     '.status == "ok" and ((.counts.videos // 0) > 0) and ((.counts.occurrences // 0) > 0)' \
                     "$health_path" >/dev/null &&
                   timeout --signal=TERM --kill-after=1s 8s curl --fail --silent --show-error \
                     --connect-timeout 2 --max-time 5 "$base_url/api/meta" > "$meta_path" &&
                   timeout --signal=TERM --kill-after=1s 3s jq -e --arg expected "$expected_revision" \
                     '(.meta // .) as $m | (($m.active_revision_id // $m.activeRevisionId) == $expected) and (($m.migration_status // $m.migrationStatus) == "active")' \
                     "$meta_path" >/dev/null; then
                  return 0
                fi
              fi
              [ "$SECONDS" -lt "$deadline" ] || break
              sleep 1
            done
            return 1
          }
          wait_for_service_contract() {
            local deadline_seconds="${READINESS_DEADLINE_SECONDS:-45}"
            [[ "$deadline_seconds" =~ ^[1-9][0-9]*$ ]]
            timeout --signal=TERM --kill-after=2s "${deadline_seconds}s" \
              bash -c "$(declare -f wait_for_service_contract_inner); wait_for_service_contract_inner \"\$@\"" \
              p0-readiness "$deadline_seconds" "$@"
          }
          if [ ! -f "$remote_root/release-finalized" ] && [ -f "$remote_root/backup/pg_adapter.py" ] && [ -f "$remote_root/backup/pg_api_server.py" ]; then
            install -m 0644 "$remote_root/backup/pg_adapter.py" /opt/culua/ytb-song-rank/server/pg_adapter.py
            install -m 0644 "$remote_root/backup/pg_api_server.py" /opt/culua/ytb-song-rank/server/pg_api_server.py
            systemctl restart song-rank-pg-api
            wait_for_service_contract "http://127.0.0.1:8765" \
              "$remote_root/cleanup-healthz.json" "$remote_root/cleanup-meta.json" "$expected_revision"
            cmp -s "$remote_root/backup/pg_adapter.py" /opt/culua/ytb-song-rank/server/pg_adapter.py
            cmp -s "$remote_root/backup/pg_api_server.py" /opt/culua/ytb-song-rank/server/pg_api_server.py
            systemctl is-active --quiet song-rank-pg-api
            ss -ltn 'sport = :8765' | grep -q LISTEN
            curl --fail --silent --show-error --max-time 20 http://127.0.0.1:8765/healthz > "$remote_root/cleanup-healthz.json"
            jq -e '.status == "ok" and ((.counts.videos // 0) > 0) and ((.counts.occurrences // 0) > 0)' "$remote_root/cleanup-healthz.json" >/dev/null
            curl --fail --silent --show-error --max-time 20 http://127.0.0.1:8765/api/meta > "$remote_root/cleanup-meta.json"
            jq -e --arg expected "$expected_revision" '(.meta // .) as $m | (($m.active_revision_id // $m.activeRevisionId) == $expected) and (($m.migration_status // $m.migrationStatus) == "active")' "$remote_root/cleanup-meta.json" >/dev/null
            touch "$remote_root/rollback-complete"
            echo "PG_ADAPTER_CLEANUP_ROLLBACK_VERIFIED" >&2
          fi
          REMOTE_CLEANUP
            remote_cleanup_status=$?
            if [ "$remote_cleanup_status" -eq 0 ]; then
              remote_cleanup_ok=1
            else
              cleanup_status=$remote_cleanup_status
            fi
          fi
          if [ -n "${TASK_ROOT:-}" ] && [ -n "${REMOTE_ROOT:-}" ]; then
            timeout --signal=TERM --kill-after=10s 60s ssh "${SSH_OPTS[@]}" "$VPS2_USER@$VPS2_HOST" "df -B1 /" | tee "$TASK_ROOT/vps-storage-after.txt" || cleanup_status=$?
            if [ -s "$TASK_ROOT/vps-storage-after.txt" ]; then
              vps_storage_after_bytes="$(awk 'NR==2 {print $4}' "$TASK_ROOT/vps-storage-after.txt")"
              [[ "$vps_storage_after_bytes" =~ ^[0-9]+$ ]] || cleanup_status=1
              printf 'vpsStorageAfterBytes=%s\n' "$vps_storage_after_bytes" >> "$TASK_ROOT/manifest.txt"
            else
              cleanup_status=1
            fi
            if [ "$remote_cleanup_ok" -eq 1 ]; then
              timeout --signal=TERM --kill-after=10s 60s ssh "${SSH_OPTS[@]}" "$VPS2_USER@$VPS2_HOST" bash -s -- "$REMOTE_ROOT" <<'REMOTE_VERIFY_CLEANUP' || cleanup_status=$?
          set -Eeuo pipefail
          remote_root="$1"
          [[ "$remote_root" =~ ^/tmp/daily-song-list-adapter-[0-9]+$ ]]
          test ! -e "$remote_root"
          REMOTE_VERIFY_CLEANUP
            fi
          fi
          if [ -n "${EVIDENCE_ROOT:-}" ] && [ -n "${REMOTE_ROOT:-}" ]; then
            timeout --signal=TERM --kill-after=10s 60s ssh "${SSH_OPTS[@]}" "$VPS2_USER@$VPS2_HOST"               "curl --fail --silent --show-error --max-time 20 http://127.0.0.1:8765/healthz"               > "$EVIDENCE_ROOT/cleanup-healthz.json" || cleanup_status=$?
            timeout --signal=TERM --kill-after=10s 60s ssh "${SSH_OPTS[@]}" "$VPS2_USER@$VPS2_HOST"               "curl --fail --silent --show-error --max-time 20 http://127.0.0.1:8765/api/meta"               > "$EVIDENCE_ROOT/cleanup-meta.json" || cleanup_status=$?
            timeout --signal=TERM --kill-after=10s 60s ssh "${SSH_OPTS[@]}" "$VPS2_USER@$VPS2_HOST" bash -s --               "$REMOTE_ROOT" > "$EVIDENCE_ROOT/cleanup-state.txt" <<'REMOTE_CLEANUP_EVIDENCE' || cleanup_status=$?
          set -Eeuo pipefail
          remote_root="$1"
          [[ "$remote_root" =~ ^/tmp/daily-song-list-adapter-[0-9]+$ ]]
          test ! -e "$remote_root"
          printf 'remoteRootAbsent=1\n'
          systemctl show --no-pager --property=Id,ActiveState,SubState,MainPID,ExecMainStartTimestamp,Result song-rank-pg-api.service
          ss -ltn 'sport = :8765'
          df -B1 /
          REMOTE_CLEANUP_EVIDENCE
          fi
          if [ -n "${TASK_ROOT:-}" ]; then
            df -B1 / > "$TASK_ROOT/storage-after.txt" || cleanup_status=$?
            printf 'finishedAt=%s\npublicQuickGatePassed=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${PUBLIC_QUICK_GATE_PASSED:-0}" >> "$TASK_ROOT/manifest.txt"
            test -s "$TASK_ROOT/manifest.txt" || cleanup_status=1
            test -s "$TASK_ROOT/storage-before.txt" || cleanup_status=1
            test -s "$TASK_ROOT/storage-after.txt" || cleanup_status=1
            if [ -n "${EVIDENCE_ROOT:-}" ]; then
              install -m 0600 "$TASK_ROOT/manifest.txt" "$EVIDENCE_ROOT/manifest.txt" || cleanup_status=$?
              install -m 0600 "$TASK_ROOT/storage-before.txt" "$EVIDENCE_ROOT/storage-before.txt" || cleanup_status=$?
              install -m 0600 "$TASK_ROOT/storage-after.txt" "$EVIDENCE_ROOT/storage-after.txt" || cleanup_status=$?
              for relative in vps-storage-before.txt vps-storage-after.txt; do
                if [ -f "$TASK_ROOT/$relative" ] && [ ! -L "$TASK_ROOT/$relative" ]; then
                  install -m 0600 "$TASK_ROOT/$relative" "$EVIDENCE_ROOT/$relative" || cleanup_status=$?
                fi
              done
              printf 'remoteCleanupOk=%s\ncleanupStatus=%s\ncandidateGateOutcome=%s\ninstallOutcome=%s\ninstalledContractOutcome=%s\npublicContractOutcome=%s\nfinalizeOutcome=%s\n'                 "$remote_cleanup_ok" "$cleanup_status" "${{ steps.candidate_gate.outcome }}"                 "${{ steps.install_candidate.outcome }}" "${{ steps.installed_contract.outcome }}"                 "${{ steps.public_contract.outcome }}" "${{ steps.finalize_release.outcome }}"                 > "$EVIDENCE_ROOT/cleanup-summary.txt" || cleanup_status=$?
              evidence_bytes="$(du -sb "$EVIDENCE_ROOT" | awk '{print $1}')"
              [[ "$evidence_bytes" =~ ^[0-9]+$ ]] && test "$evidence_bytes" -le 35651584 || cleanup_status=1
              if find "$EVIDENCE_ROOT" -type l -print -quit | grep -q .; then cleanup_status=1; fi
            fi
            cat "$TASK_ROOT/manifest.txt" || cleanup_status=$?
            cat "$TASK_ROOT/storage-before.txt" || cleanup_status=$?
            cat "$TASK_ROOT/storage-after.txt" || cleanup_status=$?
          fi
          exit "$cleanup_status"

      - name: Sanitize bounded upload evidence
        id: sanitize_upload
        if: always() && env.TASK_ROOT != ''
        run: |
          set +e
          RAW_EVIDENCE_ROOT="$TASK_ROOT/release-evidence"
          UPLOAD_EVIDENCE_ROOT="$TASK_ROOT/upload-evidence"
          if [ ! -f "$TASK_ROOT/sanitize_upload_tree.sh" ] || [ -L "$TASK_ROOT/sanitize_upload_tree.sh" ]; then
            case "$TASK_ROOT" in
              "$RUNNER_TEMP"/daily-song-list-adapter.*) ;;
              *) echo "::error::Refusing unsafe fallback TASK_ROOT"; exit 64 ;;
            esac
            test "$UPLOAD_EVIDENCE_ROOT" = "$TASK_ROOT/upload-evidence" || exit 64
            case "$UPLOAD_EVIDENCE_ROOT" in
              "$RUNNER_TEMP"/daily-song-list-adapter.*/upload-evidence) ;;
              *) echo "::error::Refusing unsafe fallback upload cleanup"; exit 64 ;;
            esac
            rm -rf -- "$UPLOAD_EVIDENCE_ROOT" || exit 2
            install -d -m 0700 "$UPLOAD_EVIDENCE_ROOT" || exit 2
            printf 'sanitizerStatus=fallback_minimal\nreason=sanitizer_missing_or_nonregular\n' > "$UPLOAD_EVIDENCE_ROOT/upload-sanitization-summary.txt"
            test -f "$UPLOAD_EVIDENCE_ROOT/upload-sanitization-summary.txt" || exit 2
            test ! -L "$UPLOAD_EVIDENCE_ROOT/upload-sanitization-summary.txt" || exit 2
            fallback_files="$(find -P "$UPLOAD_EVIDENCE_ROOT" -xdev -type f -printf . | wc -c)"
            fallback_bytes="$(du -sb "$UPLOAD_EVIDENCE_ROOT" | awk '{print $1}')"
            test "$fallback_files" -eq 1 || exit 2
            [[ "$fallback_bytes" =~ ^[0-9]+$ ]] && test "$fallback_bytes" -le 65536 || exit 2
            if find -P "$UPLOAD_EVIDENCE_ROOT" -xdev -mindepth 1 ! -type f ! -type d -print -quit | grep -q .; then exit 2; fi
            printf 'safe=1\n' >> "$GITHUB_OUTPUT"
            exit 1
          fi
          timeout --signal=TERM --kill-after=2s 20s "$TASK_ROOT/sanitize_upload_tree.sh" \
            "$RAW_EVIDENCE_ROOT" "$UPLOAD_EVIDENCE_ROOT"
          sanitize_status=$?
          upload_safe=0
          if { [ "$sanitize_status" -eq 0 ] || [ "$sanitize_status" -eq 1 ]; } && \
             [ -d "$UPLOAD_EVIDENCE_ROOT" ] && [ ! -L "$UPLOAD_EVIDENCE_ROOT" ]; then
            upload_bytes="$(du -sb "$UPLOAD_EVIDENCE_ROOT" 2>/dev/null | awk '{print $1}')"
            if [[ "$upload_bytes" =~ ^[0-9]+$ ]] && [ "$upload_bytes" -le 35651584 ] && \
               ! find -P "$UPLOAD_EVIDENCE_ROOT" -xdev -mindepth 1 ! -type f ! -type d -print -quit | grep -q .; then
              upload_safe=1
            fi
          fi
          if [ "$upload_safe" -eq 1 ]; then printf 'safe=1\n' >> "$GITHUB_OUTPUT"; fi
          printf 'UPLOAD_SANITIZATION_STATUS=%s\n' "$sanitize_status" >> "$GITHUB_ENV"
          exit "$sanitize_status"

      - name: Upload bounded release evidence
        if: always() && env.TASK_ROOT != '' && steps.sanitize_upload.outputs.safe == '1'
        uses: actions/upload-artifact@v4
        with:
          name: pg-adapter-contract-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TASK_ROOT }}/upload-evidence/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: Remove runner evidence only after upload attempt
        if: always() && env.TASK_ROOT != ''
        run: |
          set -Eeuo pipefail
          case "$TASK_ROOT" in
            "$RUNNER_TEMP"/daily-song-list-adapter.*) ;;
            *) echo "::error::Refusing unsafe TASK_ROOT cleanup"; exit 1 ;;
          esac
          rm -rf -- "$TASK_ROOT"
          test ! -e "$TASK_ROOT"
          echo "PG_ADAPTER_RUNNER_EVIDENCE_CLEANUP_OK"
