name: Deploy PostgreSQL adapter contract

on:
  workflow_dispatch:
    inputs:
      source_key:
        description: "Source detail key used for the live contract probe"
        required: true
        default: "29ae50b7975dbdcf"
        type: string
      source_channel_id:
        description: "Exact channelId expected for source_key"
        required: true
        default: ""
        type: string
      source_occurrence_count:
        description: "Exact active occurrence count expected for source_key"
        required: true
        default: ""
        type: string
      source_video_count:
        description: "Exact active video count expected for source_key"
        required: true
        default: ""
        type: string
      expected_active_revision:
        description: "Active revision CAS captured before dispatch"
        required: true
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: daily-song-list-pg-adapter-contract
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS2_HOST: "192.255.151.75"
      VPS2_USER: "root"
      SOURCE_KEY: ${{ inputs.source_key }}
      SOURCE_CHANNEL_ID: ${{ inputs.source_channel_id }}
      SOURCE_OCCURRENCE_COUNT: ${{ inputs.source_occurrence_count }}
      SOURCE_VIDEO_COUNT: ${{ inputs.source_video_count }}
      EXPECTED_ACTIVE_REVISION: ${{ inputs.expected_active_revision }}
      PUBLIC_BASE: "https://ytb-song-rank.culua.com"
    steps:
      - name: Create bounded task root
        run: |
          set -Eeuo pipefail
          test -n "$SOURCE_KEY"
          test -n "$SOURCE_CHANNEL_ID"
          test -n "$SOURCE_OCCURRENCE_COUNT"
          test -n "$SOURCE_VIDEO_COUNT"
          test -n "$EXPECTED_ACTIVE_REVISION"
          [[ "$SOURCE_OCCURRENCE_COUNT" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_VIDEO_COUNT" =~ ^[0-9]+$ ]]
          TASK_ROOT="$(mktemp -d "$RUNNER_TEMP/daily-song-list-adapter.XXXXXX")"
          printf 'TASK_ROOT=%s\n' "$TASK_ROOT" >> "$GITHUB_ENV"
          df -B1 / > "$TASK_ROOT/storage-before.txt"
          printf 'runId=%s\nstartedAt=%s\nsourceKey=%s\nsourceChannelId=%s\nsourceOccurrenceCount=%s\nsourceVideoCount=%s\nexpectedActiveRevision=%s\n' \
            "$GITHUB_RUN_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$SOURCE_KEY" "$SOURCE_CHANNEL_ID" \
            "$SOURCE_OCCURRENCE_COUNT" "$SOURCE_VIDEO_COUNT" "$EXPECTED_ACTIVE_REVISION" > "$TASK_ROOT/manifest.txt"

      - name: Fetch adapter sources from this commit
        run: |
          set -Eeuo pipefail
          RAW_BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}"
          curl --fail --location --connect-timeout 8 --max-time 20 "$RAW_BASE/server/pg_adapter.py" -o "$TASK_ROOT/pg_adapter.py"
          curl --fail --location --connect-timeout 8 --max-time 20 "$RAW_BASE/server/pg_api_server.py" -o "$TASK_ROOT/pg_api_server.py"
          curl --fail --location --connect-timeout 8 --max-time 20 "$RAW_BASE/scripts/migration/audit-ranking-source-identities.py" -o "$TASK_ROOT/audit-ranking-source-identities.py"
          PYTHONDONTWRITEBYTECODE=1 python3 - "$TASK_ROOT/pg_adapter.py" "$TASK_ROOT/pg_api_server.py" "$TASK_ROOT/audit-ranking-source-identities.py" <<'PY'
          import sys
          for filename in sys.argv[1:]:
              compile(open(filename, encoding="utf-8").read(), filename, "exec")
          PY
          sha256sum "$TASK_ROOT/pg_adapter.py" "$TASK_ROOT/pg_api_server.py" "$TASK_ROOT/audit-ranking-source-identities.py" >> "$TASK_ROOT/manifest.txt"

      - name: Prepare bounded SSH helper
        env:
          VPS2_PASSWORD: ${{ secrets.VPS2_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$VPS2_PASSWORD"
          mkdir -p "$TASK_ROOT/ssh"
          printf '%s\n' "$VPS2_PASSWORD" > "$TASK_ROOT/ssh/password"
          chmod 600 "$TASK_ROOT/ssh/password"
          cat > "$TASK_ROOT/ssh/askpass.sh" <<'SH'
          #!/bin/sh
          exec cat "$TASK_ROOT/ssh/password"
          SH
          chmod 700 "$TASK_ROOT/ssh/askpass.sh"
          {
            echo "SSH_ASKPASS=$TASK_ROOT/ssh/askpass.sh"
            echo "SSH_ASKPASS_REQUIRE=force"
            echo "DISPLAY=daily-song-list"
          } >> "$GITHUB_ENV"

      - name: Start candidate and verify source-detail contract
        run: |
          set -Eeuo pipefail
          SSH_OPTS=(-o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no -o ConnectTimeout=8)
          REMOTE_ROOT="/tmp/daily-song-list-adapter-${GITHUB_RUN_ID}"
          printf 'REMOTE_ROOT=%s\n' "$REMOTE_ROOT" >> "$GITHUB_ENV"
          ssh "${SSH_OPTS[@]}" "$VPS2_USER@$VPS2_HOST" "set -Eeuo pipefail; rm -rf '$REMOTE_ROOT' /tmp/daily-song-list-adapter-30256082805; install -d -m 0755 '$REMOTE_ROOT/server'; install -m 0644 /dev/null '$REMOTE_ROOT/placeholder';"
          scp "${SSH_OPTS[@]}" "$TASK_ROOT/pg_adapter.py" "$TASK_ROOT/pg_api_server.py" "$TASK_ROOT/audit-ranking-source-identities.py" "$VPS2_USER@$VPS2_HOST:$REMOTE_ROOT/server/"
          ssh "${SSH_OPTS[@]}" "$VPS2_USER@$VPS2_HOST" "set -Eeuo pipefail; sudo -u www-data env PGHOST=/var/run/postgresql PGDATABASE=song_rank PGUSER=www-data PYTHONPATH='$REMOTE_ROOT/server' nohup python3 '$REMOTE_ROOT/server/pg_api_server.py' --host 127.0.0.1 --port 18766 > '$REMOTE_ROOT/candidate.log' 2>&1 & echo \$! > '$REMOTE_ROOT/candidate.pid'; for n in \$(seq 1 20); do curl --fail --max-time 5 http://127.0.0.1:18766/healthz > '$REMOTE_ROOT/candidate-healthz.json' && break; sleep 1; done; test -s '$REMOTE_ROOT/candidate-healthz.json'"
          ssh "${SSH_OPTS[@]}" "$VPS2_USER@$VPS2_HOST" "set +e; python3 '$REMOTE_ROOT/server/audit-ranking-source-identities.py' --base-url http://127.0.0.1:18766 --range all --range 7d --metric videos --page-size 20 --max-pages 100 --expected-active '$EXPECTED_ACTIVE_REVISION' --channel-probe '@shingames7857=UC5zO6IFsWSUHMYgJMv81XKg' --channel-probe '@MEDAzcd=UC0HX1e5jJnhN5Xn0epV2wzA' --channel-probe '@mikoto_songs=UCkZif4byA067Xl_c199w3BQ' --channel-probe '@urameshi_conta=UC8VlcljjGFb4-Ny2Heb0-ew' --source-probe '$SOURCE_KEY,$SOURCE_CHANNEL_ID,$SOURCE_OCCURRENCE_COUNT,$SOURCE_VIDEO_COUNT' > '$REMOTE_ROOT/candidate-identity-audit.log' 2>&1; audit_status=\$?; tail -n 60 '$REMOTE_ROOT/candidate-identity-audit.log'; exit \$audit_status"

      - name: Install verified adapter and retain rollback files until health passes
        run: |
          set -Eeuo pipefail
          SSH_OPTS=(-o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no -o ConnectTimeout=8)
          ssh "${SSH_OPTS[@]}" "$VPS2_USER@$VPS2_HOST" "set -Eeuo pipefail; install -d -m 0755 '$REMOTE_ROOT/backup' /opt/culua/ytb-song-rank/server; cp -p /opt/culua/ytb-song-rank/server/pg_adapter.py '$REMOTE_ROOT/backup/pg_adapter.py'; cp -p /opt/culua/ytb-song-rank/server/pg_api_server.py '$REMOTE_ROOT/backup/pg_api_server.py'; rollback_adapter() { install -m 0644 '$REMOTE_ROOT/backup/pg_adapter.py' /opt/culua/ytb-song-rank/server/pg_adapter.py; install -m 0644 '$REMOTE_ROOT/backup/pg_api_server.py' /opt/culua/ytb-song-rank/server/pg_api_server.py; systemctl restart song-rank-pg-api; }; trap rollback_adapter ERR; install -m 0644 '$REMOTE_ROOT/server/pg_adapter.py' /opt/culua/ytb-song-rank/server/pg_adapter.py; install -m 0644 '$REMOTE_ROOT/server/pg_api_server.py' /opt/culua/ytb-song-rank/server/pg_api_server.py; systemctl restart song-rank-pg-api; for n in \$(seq 1 20); do curl --fail --max-time 5 http://127.0.0.1:8765/healthz >/dev/null && break; sleep 1; done; python3 '$REMOTE_ROOT/server/audit-ranking-source-identities.py' --base-url http://127.0.0.1:8765 --skip-rankings --expected-active '$EXPECTED_ACTIVE_REVISION' --channel-probe '@shingames7857=UC5zO6IFsWSUHMYgJMv81XKg' --channel-probe '@MEDAzcd=UC0HX1e5jJnhN5Xn0epV2wzA' --channel-probe '@mikoto_songs=UCkZif4byA067Xl_c199w3BQ' --channel-probe '@urameshi_conta=UC8VlcljjGFb4-Ny2Heb0-ew' --source-probe '$SOURCE_KEY,$SOURCE_CHANNEL_ID,$SOURCE_OCCURRENCE_COUNT,$SOURCE_VIDEO_COUNT' > '$REMOTE_ROOT/production-local-identity-audit.log' 2>&1 || { tail -n 60 '$REMOTE_ROOT/production-local-identity-audit.log'; false; }; python3 '$REMOTE_ROOT/server/audit-ranking-source-identities.py' --base-url '$PUBLIC_BASE' --skip-rankings --expected-active '$EXPECTED_ACTIVE_REVISION' --channel-probe '@shingames7857=UC5zO6IFsWSUHMYgJMv81XKg' --channel-probe '@MEDAzcd=UC0HX1e5jJnhN5Xn0epV2wzA' --channel-probe '@mikoto_songs=UCkZif4byA067Xl_c199w3BQ' --channel-probe '@urameshi_conta=UC8VlcljjGFb4-Ny2Heb0-ew' --source-probe '$SOURCE_KEY,$SOURCE_CHANNEL_ID,$SOURCE_OCCURRENCE_COUNT,$SOURCE_VIDEO_COUNT' > '$REMOTE_ROOT/production-public-identity-audit.log' 2>&1 || { tail -n 60 '$REMOTE_ROOT/production-public-identity-audit.log'; false; }; tail -n 20 '$REMOTE_ROOT/production-local-identity-audit.log'; tail -n 20 '$REMOTE_ROOT/production-public-identity-audit.log'; rm -rf '$REMOTE_ROOT/backup'; trap - ERR"
          printf 'PUBLIC_IDENTITY_AUDIT_PASSED=1\n' >> "$GITHUB_ENV"

      - name: Verify public API and cleanup
        if: always()
        run: |
          set +e
          SSH_OPTS=(-o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no -o ConnectTimeout=8)
          curl --fail --connect-timeout 8 --max-time 20 --header 'Accept: application/json' --user-agent 'daily-song-list-adapter-release/1' "$PUBLIC_BASE/healthz" > "$TASK_ROOT/public-healthz.json"
          public_status=$?
          curl --fail --connect-timeout 8 --max-time 20 --header 'Accept: application/json' --user-agent 'daily-song-list-adapter-release/1' "$PUBLIC_BASE/api/sources/$SOURCE_KEY?page=1&pageSize=20" > "$TASK_ROOT/public-source.json"
          source_status=$?
          df -B1 / > "$TASK_ROOT/storage-after.txt"
          printf 'finishedAt=%s\npublicIdentityAuditPassed=%s\nhostedPublicHealthExit=%s\nhostedPublicSourceExit=%s\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${PUBLIC_IDENTITY_AUDIT_PASSED:-0}" "$public_status" "$source_status" >> "$TASK_ROOT/manifest.txt"
          echo "ADAPTER_RELEASE_MANIFEST"
          cat "$TASK_ROOT/manifest.txt"
          echo "ADAPTER_RELEASE_STORAGE_BEFORE"
          cat "$TASK_ROOT/storage-before.txt"
          echo "ADAPTER_RELEASE_STORAGE_AFTER"
          cat "$TASK_ROOT/storage-after.txt"
          if [ -n "${REMOTE_ROOT:-}" ]; then
            ssh "${SSH_OPTS[@]}" "$VPS2_USER@$VPS2_HOST" "if test -f '$REMOTE_ROOT/candidate.pid'; then kill \$(cat '$REMOTE_ROOT/candidate.pid') 2>/dev/null || true; fi; rm -rf '$REMOTE_ROOT'" || true
          fi
          rm -rf "$TASK_ROOT"
