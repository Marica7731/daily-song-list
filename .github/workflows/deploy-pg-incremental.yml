              count = matches[0].get("count", matches[0].get("totalOccurrenceCount"))
              if count != expected: die("replacement-card-count key=" + source_key)

          def verify_tuples(group, occurrences):
              for tuple_ in group["tuples"]:
                  matches = [row for row in occurrences if isinstance(row.get("item"), dict) and isinstance(row.get("song"), dict) and row.get("videoId") == tuple_["videoId"] and row.get("seconds") == tuple_["seconds"] and row["item"].get("videoId") == tuple_["videoId"] and row["song"].get("title") == tuple_["replacementTitle"] and row["song"].get("artist") == tuple_["replacementArtist"] and row["song"].get("seconds") == tuple_["seconds"] and (not isinstance(row.get("video"), dict) or row["video"].get("videoId") == tuple_["videoId"]) and row["item"].get("channelId") == row.get("channelId") and row["item"].get("channelHandle") == row.get("channelHandle") and row["item"].get("channelUrl") == row.get("channelUrl")]
                  if len(matches) != 1: die("replacement-tuple video=" + tuple_["videoId"])

          def sql(value):
              return "'" + str(value).replace("'", "''") + "'"

          def verify_candidate_pg(tuples, revision, remote, expected_physical):
              physical = {}
              for row in tuples:
                  key = (row["videoId"], row["occurrenceId"], row["storedRangeId"])
                  comparable = {name: value for name, value in row.items() if name not in {"rangeId", "originalSourceDetailKey", "replacementSourceDetailKey"}}
                  if key in physical and physical[key] != comparable:
