name: Deploy PostgreSQL accepted increment

on:
  workflow_dispatch:
    inputs:
      patch_path:
        description: "Curated accepted-increment NDJSON"
        required: true
        default: "artifacts/migration/candidate.ndjson"
      manifest_path:
        description: "Manifest with source/provenance/hash evidence"
        required: true
        default: "artifacts/migration/manifest.json"
      activate:
        description: "Activate only after candidate API gate (release window)"
        required: true
        default: false
        type: boolean
      require_7d_gate:
        description: "Require complete 7D manifest/time-coverage gate"
        required: false
        default: false
        type: boolean
      source_key:
        description: "Optional source key to match in the manifest"
        required: false
        default: ""
      artifact_name:
        description: "Optional same-repository artifact name for an approved resume"
        required: false
        default: ""
      artifact_run_id:
        description: "Optional producing workflow run ID for artifact_name"
        required: false
        default: ""
      source_sha:
        description: "Optional authoritative data/7d.json commit for a controlled resume"
        required: false
        default: ""
      source_base_sha:
        description: "Parent commit for source_sha when resuming authoritative 7D"
        required: false
        default: ""
      rollback_only:
        description: "Emergency CAS rollback only; never downloads or imports an artifact"
        required: true
        default: false
        type: boolean
      rollback_expected_current_revision:
        description: "Rollback CAS: exact active revision that must currently be active"
        required: false
        type: string
      rollback_target_parent_revision:
        description: "Rollback CAS: exact parent revision to restore"
        required: false
        type: string
      rollback_target_content_sha256:
        description: "Rollback CAS: SHA-256 content hash expected for the target revision"
        required: false
        type: string
      rollback_source_key:
        description: "Rollback public gate: exact active sourceDetailKey"
        required: false
        type: string
      rollback_source_channel_id:
        description: "Rollback public gate: exact active source channelId"
        required: false
        type: string
      rollback_source_channel_handle:
        description: "Rollback public gate: exact active source channelHandle"
        required: false
        type: string
      rollback_source_occurrence_count:
        description: "Rollback public gate: exact active source total occurrence count"
        required: false
        type: string
      rollback_source_video_count:
        description: "Rollback public gate: exact active source video count"
        required: false
        type: string
      rollback_source_tuple_json:
        description: "Rollback public gate: unique source tuple JSON (videoId,title,artist,seconds)"
        required: false
        type: string
  repository_dispatch:
    types: [accepted-increment-ready]
  workflow_run:
    workflows: ["Update core song-list data"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "data/7d.json"
  workflow_call:
    inputs:
      artifact_name:
        type: string
        required: false
        default: ""
      patch_path:
        type: string
        required: false
        default: "candidate.ndjson"
      manifest_path:
        type: string
        required: false
        default: "manifest.json"
      activate:
        type: boolean
        required: false
        default: true
      require_7d_gate:
        type: boolean
        required: false
        default: false
      source_key:
        type: string
        required: false
        default: ""
      artifact_run_id:
        type: string
        required: false
        default: ""
    secrets:
      VPS2_HOST:
        required: true
      VPS2_PASSWORD:
        required: true
      VPS2_KNOWN_HOSTS:
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: daily-song-list-pg-increment
  cancel-in-progress: false

jobs:
  rollback:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback_only == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VPS2_HOST: ${{ secrets.VPS2_HOST }}
      VPS2_USER: ${{ vars.VPS2_USER || 'root' }}
      REMOTE_STATE_DIR: "/var/lib/culua/ytb-song-rank"
      EXPECTED_CURRENT_REVISION: ${{ inputs.rollback_expected_current_revision || '' }}
      EXPECTED_TARGET_REVISION: ${{ inputs.rollback_target_parent_revision || '' }}
      EXPECTED_TARGET_CONTENT_SHA256: ${{ inputs.rollback_target_content_sha256 || '' }}
      EXPECTED_SOURCE_DETAIL_KEY: ${{ inputs.rollback_source_key || '' }}
      EXPECTED_SOURCE_CHANNEL_ID: ${{ inputs.rollback_source_channel_id || '' }}
      EXPECTED_SOURCE_CHANNEL_HANDLE: ${{ inputs.rollback_source_channel_handle || '' }}
      EXPECTED_SOURCE_OCCURRENCE_COUNT: ${{ inputs.rollback_source_occurrence_count || '' }}
      EXPECTED_SOURCE_VIDEO_COUNT: ${{ inputs.rollback_source_video_count || '' }}
      EXPECTED_SOURCE_TUPLE_JSON: ${{ inputs.rollback_source_tuple_json || '' }}
    steps:
      - name: CAS rollback active PostgreSQL revision
        env:
          VPS2_PASSWORD: ${{ secrets.VPS2_PASSWORD }}
          VPS2_KNOWN_HOSTS: ${{ secrets.VPS2_KNOWN_HOSTS }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test -n "$VPS2_HOST" || { echo "PG_ROLLBACK_BLOCKED missing VPS2_HOST"; exit 78; }
          test -n "$VPS2_USER" || { echo "PG_ROLLBACK_BLOCKED missing VPS2_USER"; exit 78; }
          test -n "$VPS2_PASSWORD" || { echo "PG_ROLLBACK_BLOCKED missing VPS2_PASSWORD"; exit 78; }
          test -n "$VPS2_KNOWN_HOSTS" || { echo "PG_ROLLBACK_BLOCKED missing VPS2_KNOWN_HOSTS"; exit 78; }
          for required_rollback_input in \
            EXPECTED_CURRENT_REVISION EXPECTED_TARGET_REVISION EXPECTED_TARGET_CONTENT_SHA256; do
            test -n "${!required_rollback_input}" || {
              echo "PG_ROLLBACK_BLOCKED missing-${required_rollback_input,,}"; exit 78;
            }
          done
          [[ "$EXPECTED_CURRENT_REVISION" =~ ^[A-Za-z0-9._-]+$ ]] || {
            echo "PG_ROLLBACK_BLOCKED invalid-current-revision"; exit 78;
          }
          [[ "$EXPECTED_TARGET_REVISION" =~ ^[A-Za-z0-9._-]+$ ]] || {
            echo "PG_ROLLBACK_BLOCKED invalid-target-revision"; exit 78;
          }
          [[ "$EXPECTED_TARGET_CONTENT_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "PG_ROLLBACK_BLOCKED invalid-target-content-sha256"; exit 78;
          }
          test "$EXPECTED_CURRENT_REVISION" != "$EXPECTED_TARGET_REVISION" || {
            echo "PG_ROLLBACK_BLOCKED expected-current-equals-target"; exit 78;
          }
          for release_wait_attempt in $(seq 1 20); do
            active_releases="$(
              for release_status in in_progress queued; do
                curl --fail --silent --show-error --location --retry 2 --connect-timeout 5 --max-time 30 \
                  -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?status=${release_status}&per_page=100"
              done | jq -sr --argjson current_run "$GITHUB_RUN_ID" '
                [.[].workflow_runs[] |
                  select(.id != $current_run) |
                  select(.name | test("PostgreSQL|PG|7D|curation"; "i")) |
                  {id,name,status,head_sha}
                ] | unique_by(.id)
              '
            )"
            if [ "$(jq -r 'length' <<<"$active_releases")" -eq 0 ]; then
              break
            fi
            echo "PG_ROLLBACK_WAIT concurrent-release attempt=$release_wait_attempt runs=$(jq -c . <<<"$active_releases")"
            if [ "$release_wait_attempt" -eq 20 ]; then
              echo "PG_ROLLBACK_BLOCKED concurrent-release-timeout runs=$(jq -c . <<<"$active_releases")"
              exit 78
            fi
            sleep 30
          done
          TASK_ROOT="$(mktemp -d "${RUNNER_TEMP}/daily-song-list-pg-rollback.XXXXXX")"
          baseline_free_bytes=unknown
          remote_free_before=unknown
          remote_free_after=unknown
          pointer_committed=0
          noop=0
          cleanup() {
            status=$?
            set +e
            if declare -p SSH >/dev/null 2>&1; then
              if remote_free_after="$("${SSH[@]}" "$VPS2_USER@$VPS2_HOST" \
                "df -B1 --output=avail '$REMOTE_STATE_DIR' | tail -n1 | tr -d '[:space:]'")"; then :; else
                remote_free_after=unknown
              fi
            fi
            before_cleanup_bytes=$(( $(du -sk "$TASK_ROOT" 2>/dev/null | awk '{print $1}') * 1024 ))
            rm -rf -- "$TASK_ROOT"
            after_free_bytes=$(( $(df -k "$RUNNER_TEMP" | awk 'NR==2 {print $4}') * 1024 ))
            retained=unchanged
            if [ "$pointer_committed" = 1 ] && [ "$noop" = 1 ]; then
              retained=target-already-active
            elif [ "$pointer_committed" = 1 ] && [ "$status" -eq 0 ]; then
              retained=rollback-target
            elif [ "$pointer_committed" = 1 ]; then
              retained=rollback-target-unverified
            fi
            echo "PG_ROLLBACK_CLEANUP status=$status pointerCommitted=$pointer_committed noop=$noop beforeBytes=$before_cleanup_bytes afterBytes=0 baselineFreeBytes=$baseline_free_bytes afterFreeBytes=$after_free_bytes remoteFreeBeforeBytes=$remote_free_before remoteFreeAfterBytes=$remote_free_after retained=$retained"
            exit "$status"
          }
          trap cleanup EXIT INT TERM
          baseline_free_bytes=$(( $(df -k "$RUNNER_TEMP" | awk 'NR==2 {print $4}') * 1024 ))
          ASKPASS_ROOT="$TASK_ROOT/ssh-askpass"
          mkdir -p "$ASKPASS_ROOT"
          ROLLBACK_PASSWORD_FILE="$ASKPASS_ROOT/vps2.password"
          export ROLLBACK_PASSWORD_FILE
          printf '%s\n' "$VPS2_PASSWORD" > "$ROLLBACK_PASSWORD_FILE"
          ROLLBACK_KNOWN_HOSTS_FILE="$ASKPASS_ROOT/known_hosts"
          printf '%s\n' "$VPS2_KNOWN_HOSTS" > "$ROLLBACK_KNOWN_HOSTS_FILE"
          chmod 600 "$ROLLBACK_PASSWORD_FILE"
          chmod 600 "$ROLLBACK_KNOWN_HOSTS_FILE"
          cat > "$ASKPASS_ROOT/vps2-askpass.sh" <<'SH'
          #!/bin/sh
          exec cat "$ROLLBACK_PASSWORD_FILE"
          SH
          chmod 700 "$ASKPASS_ROOT/vps2-askpass.sh"
          export SSH_ASKPASS="$ASKPASS_ROOT/vps2-askpass.sh" SSH_ASKPASS_REQUIRE=force DISPLAY=codex:0
          SSH=(ssh -o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ROLLBACK_KNOWN_HOSTS_FILE" -o ConnectTimeout=10 -o ConnectionAttempts=1 -o ServerAliveInterval=5 -o ServerAliveCountMax=2)
          remote_free_before="$("${SSH[@]}" "$VPS2_USER@$VPS2_HOST" \
            "df -B1 --output=avail '$REMOTE_STATE_DIR' | tail -n1 | tr -d '[:space:]'")"
          [[ "$remote_free_before" =~ ^[0-9]+$ ]] || {
            echo "PG_ROLLBACK_BLOCKED invalid-remote-free-before"; exit 78;
          }
          active_before="$("${SSH[@]}" "$VPS2_USER@$VPS2_HOST" \
            "sudo -u www-data psql -d song_rank -At -c \"select state_value from migration_state where state_key='active_revision_id'\"")"
          if [ "$active_before" = "$EXPECTED_TARGET_REVISION" ]; then
            noop=1
          elif [ "$active_before" != "$EXPECTED_CURRENT_REVISION" ]; then
            echo "PG_ROLLBACK_BLOCKED preflight-current-mismatch expected=$EXPECTED_CURRENT_REVISION actual=${active_before:-missing}"
            exit 78
          fi
          cat > "$TASK_ROOT/rollback.sql" <<SQL
          BEGIN;
          SELECT pg_advisory_xact_lock(hashtext('daily-song-list/active'));
          DO \$\$
          DECLARE
            current_revision text;
            current_status text;
            current_parent text;
            target_status text;
            target_content_sha256 text;
            affected_rows integer;
          BEGIN
            SELECT state_value
              INTO current_revision
              FROM migration_state
              WHERE state_key='active_revision_id'
              FOR UPDATE;
            IF current_revision = '$EXPECTED_TARGET_REVISION' THEN
              SELECT status, content_sha256
                INTO target_status, target_content_sha256
                FROM migration_revisions
                WHERE revision_id='$EXPECTED_TARGET_REVISION'
                FOR UPDATE;
              IF target_status IS DISTINCT FROM 'active' THEN
                RAISE EXCEPTION 'PG_ROLLBACK_BLOCKED noop target status=% expected=active', target_status;
              END IF;
              IF target_content_sha256 IS DISTINCT FROM '$EXPECTED_TARGET_CONTENT_SHA256' THEN
                RAISE EXCEPTION 'PG_ROLLBACK_BLOCKED noop target content sha mismatch';
              END IF;
            ELSE
              IF current_revision IS DISTINCT FROM '$EXPECTED_CURRENT_REVISION' THEN
                RAISE EXCEPTION 'PG_ROLLBACK_BLOCKED current=% expected=$EXPECTED_CURRENT_REVISION', current_revision;
              END IF;
              SELECT status, parent_revision_id
                INTO current_status, current_parent
                FROM migration_revisions
                WHERE revision_id=current_revision
                FOR UPDATE;
              IF current_status IS DISTINCT FROM 'active' THEN
                RAISE EXCEPTION 'PG_ROLLBACK_BLOCKED current status=% expected=active', current_status;
              END IF;
              IF current_parent IS DISTINCT FROM '$EXPECTED_TARGET_REVISION' THEN
                RAISE EXCEPTION 'PG_ROLLBACK_BLOCKED current parent=% expected=$EXPECTED_TARGET_REVISION', current_parent;
              END IF;
              SELECT status, content_sha256
                INTO target_status, target_content_sha256
                FROM migration_revisions
                WHERE revision_id='$EXPECTED_TARGET_REVISION'
                FOR UPDATE;
              IF target_status IS DISTINCT FROM 'superseded' THEN
                RAISE EXCEPTION 'PG_ROLLBACK_BLOCKED target status=% expected=superseded', target_status;
              END IF;
              IF target_content_sha256 IS DISTINCT FROM '$EXPECTED_TARGET_CONTENT_SHA256' THEN
                RAISE EXCEPTION 'PG_ROLLBACK_BLOCKED target content sha mismatch';
              END IF;
              UPDATE migration_revisions
                SET status='rolled_back'
                WHERE revision_id='$EXPECTED_CURRENT_REVISION' AND status='active';
              GET DIAGNOSTICS affected_rows = ROW_COUNT;
              IF affected_rows <> 1 THEN
                RAISE EXCEPTION 'PG_ROLLBACK_BLOCKED current update rows=% expected=1', affected_rows;
              END IF;
              UPDATE migration_revisions
                SET status='active', activated_at=CURRENT_TIMESTAMP
                WHERE revision_id='$EXPECTED_TARGET_REVISION' AND status='superseded';
              GET DIAGNOSTICS affected_rows = ROW_COUNT;
              IF affected_rows <> 1 THEN
                RAISE EXCEPTION 'PG_ROLLBACK_BLOCKED target update rows=% expected=1', affected_rows;
              END IF;
              UPDATE migration_state
                SET state_value='$EXPECTED_TARGET_REVISION'
                WHERE state_key='active_revision_id' AND state_value='$EXPECTED_CURRENT_REVISION';
              GET DIAGNOSTICS affected_rows = ROW_COUNT;
              IF affected_rows <> 1 THEN
                RAISE EXCEPTION 'PG_ROLLBACK_BLOCKED state update rows=% expected=1', affected_rows;
              END IF;
            END IF;
          END
          \$\$;
          COMMIT;
          SQL
          "${SSH[@]}" "$VPS2_USER@$VPS2_HOST" \
            "sudo -u postgres psql -d song_rank -v ON_ERROR_STOP=1 -f -" \
            < "$TASK_ROOT/rollback.sql" | tee "$TASK_ROOT/rollback-transaction.log"
          pointer_committed=1
          rollback_state="$("${SSH[@]}" "$VPS2_USER@$VPS2_HOST" \
            "sudo -u www-data psql -d song_rank -At -F '|' -c \"select r.revision_id,r.status,r.content_sha256 from migration_state s join migration_revisions r on r.revision_id=s.state_value where s.state_key='active_revision_id'\"")"
          IFS='|' read -r actual_revision actual_status actual_content_sha256 <<<"$rollback_state"
          test "$actual_revision" = "$EXPECTED_TARGET_REVISION" || {
            echo "PG_ROLLBACK_BLOCKED committed-revision-mismatch expected=$EXPECTED_TARGET_REVISION actual=${actual_revision:-missing}"; exit 78;
          }
          test "$actual_status" = active || {
            echo "PG_ROLLBACK_BLOCKED committed-status-mismatch actual=${actual_status:-missing}"; exit 78;
          }
          test "$actual_content_sha256" = "$EXPECTED_TARGET_CONTENT_SHA256" || {
            echo "PG_ROLLBACK_BLOCKED committed-content-sha-mismatch"; exit 78;
          }
          echo "PG_ROLLBACK_TRANSACTION_OK previous=$active_before active=$actual_revision contentSha256=$actual_content_sha256 noop=$noop"
          "${SSH[@]}" "$VPS2_USER@$VPS2_HOST" '
            set -Eeuo pipefail
            systemctl restart song-rank-pg-api
            ready=0
            for n in $(seq 1 30); do
              if systemctl is-active --quiet song-rank-pg-api && ss -ltnH | grep -q :8765; then
                ready=1
                break
              fi
              sleep 1
            done
            test "$ready" = 1 || echo PG_ROLLBACK_OBSERVATION service-listener-timeout >&2
            if ! curl --fail-with-body --silent --show-error --connect-timeout 8 --max-time 300 \
              http://127.0.0.1:8765/healthz >/dev/null; then
              echo PG_ROLLBACK_OBSERVATION service-health-timeout >&2
            fi
          '
          if ! (
          set -Eeuo pipefail
          "${SSH[@]}" "$VPS2_USER@$VPS2_HOST" \
            "curl --fail-with-body --silent --show-error --connect-timeout 8 --max-time 300 http://127.0.0.1:8765/healthz" \
            > "$TASK_ROOT/local-healthz.json"
          "${SSH[@]}" "$VPS2_USER@$VPS2_HOST" \
            "curl --fail-with-body --silent --show-error --connect-timeout 8 --max-time 300 http://127.0.0.1:8765/api/meta" \
            > "$TASK_ROOT/local-meta.json"
          jq -e --arg revision "$EXPECTED_TARGET_REVISION" --arg sha "$EXPECTED_TARGET_CONTENT_SHA256" '
            (.status == "ok") and ((.counts.videos // 0) > 0) and ((.counts.occurrences // 0) > 0)
          ' "$TASK_ROOT/local-healthz.json" >/dev/null
          jq -e --arg revision "$EXPECTED_TARGET_REVISION" --arg sha "$EXPECTED_TARGET_CONTENT_SHA256" '
            (.meta.active_revision_id == $revision) and
            (.meta.migration_status == "active") and
            (.meta.content_sha256 == $sha)
          ' "$TASK_ROOT/local-meta.json" >/dev/null || {
            echo "PG_ROLLBACK_BLOCKED local-meta-gate revision=$EXPECTED_TARGET_REVISION"; exit 78;
          }
          public_health_http="$(curl --fail-with-body --silent --show-error --location --retry 2 --retry-all-errors \
            --connect-timeout 8 --max-time 300 -o "$TASK_ROOT/public-healthz.json" -w '%{http_code}' \
            https://ytb-song-rank.culua.com/healthz)"
          public_meta_http="$(curl --fail-with-body --silent --show-error --location --retry 2 --retry-all-errors \
            --connect-timeout 8 --max-time 300 -o "$TASK_ROOT/public-meta.json" -w '%{http_code}' \
            https://ytb-song-rank.culua.com/api/meta)"
          test "$public_health_http" = 200
          test "$public_meta_http" = 200
          jq -e '
            (.status == "ok") and ((.counts.videos // 0) > 0) and ((.counts.occurrences // 0) > 0)
          ' "$TASK_ROOT/public-healthz.json" >/dev/null
          jq -e --arg revision "$EXPECTED_TARGET_REVISION" --arg sha "$EXPECTED_TARGET_CONTENT_SHA256" '
            (.meta.active_revision_id == $revision) and
            (.meta.migration_status == "active") and
            (.meta.content_sha256 == $sha)
          ' "$TASK_ROOT/public-meta.json" >/dev/null || {
            echo "PG_ROLLBACK_BLOCKED public-meta-gate revision=$EXPECTED_TARGET_REVISION"; exit 78;
          }
          ); then
            echo "PG_ROLLBACK_OBSERVATION post-rollback-health-meta-checks-failed"
          fi
          printf 'baselineFreeBytes=%s\nremoteFreeBeforeBytes=%s\nexpectedCurrentRevision=%s\nexpectedTargetRevision=%s\nexpectedTargetContentSha256=%s\n' \
            "$baseline_free_bytes" "$remote_free_before" "$EXPECTED_CURRENT_REVISION" "$EXPECTED_TARGET_REVISION" "$EXPECTED_TARGET_CONTENT_SHA256" \
            > "$TASK_ROOT/storage.txt"
          echo "PG_ROLLBACK_OBSERVATION_COMPLETE active=$EXPECTED_TARGET_REVISION"
          echo PG_ROLLBACK_STORAGE_BEGIN
          cat "$TASK_ROOT/storage.txt"
          echo PG_ROLLBACK_STORAGE_END
          trap - EXIT INT TERM
          cleanup

  candidate:
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.rollback_only != true) && (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run' || github.event_name == 'push' || github.event_name == 'workflow_call' || vars.DAILY_SONG_PG_INCREMENTAL_ENABLED == '1') }}
    runs-on: [self-hosted, macOS, ARM64, daily-song-list-mac]
    timeout-minutes: 240
    env:
      VPS2_HOST: ${{ secrets.VPS2_HOST }}
      VPS2_USER: ${{ vars.VPS2_USER || 'root' }}
      REMOTE_STATE_DIR: "/var/lib/culua/ytb-song-rank"
      PATCH_PATH: ${{ inputs.patch_path || github.event.client_payload.patch_path || 'artifacts/migration/candidate.ndjson' }}
      MANIFEST_PATH: ${{ inputs.manifest_path || github.event.client_payload.manifest_path || 'artifacts/migration/manifest.json' }}
      ACTIVATE: ${{ inputs.activate || github.event.client_payload.activate || (github.event_name == 'workflow_run') || (github.event_name == 'push') || false }}
      REQUIRE_7D_GATE: ${{ inputs.require_7d_gate || github.event.client_payload.require_7d_gate || false }}
      SOURCE_KEY: ${{ inputs.source_key || github.event.client_payload.source_key || '' }}
      ARTIFACT_NAME: ${{ inputs.artifact_name || '' }}
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id || '' }}
    steps:
      - name: Detect active bounded WDC release window
        id: wdc_window
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QUEUED_LEASE_MAX_AGE_SECONDS: "3600"
        run: |
          set -Eeuo pipefail
          observed_wdc="$(
            for release_status in in_progress queued; do
              curl --fail --silent --show-error --location --retry 2 \
                --connect-timeout 5 --max-time 30 \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H 'Accept: application/vnd.github+json' \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?status=${release_status}&per_page=100"
            done | jq -sr --argjson current_run "$GITHUB_RUN_ID" '
              [.[].workflow_runs[] |
                select(.id != $current_run) |
                select(.name == "Sync complete immutable release to WDC") |
                {id,name,status,head_sha,created_at}
              ] | unique_by(.id)
            '
          )"
          active_wdc="$(jq -c --argjson max_age "$QUEUED_LEASE_MAX_AGE_SECONDS" '
            [.[] | select(
              .status == "in_progress" or
              (.status == "queued" and (now - (.created_at | fromdateiso8601)) <= $max_age)
            )]
          ' <<<"$observed_wdc")"
          stale_queued="$(jq -c --argjson max_age "$QUEUED_LEASE_MAX_AGE_SECONDS" '
            [.[] | select(
              .status == "queued" and (now - (.created_at | fromdateiso8601)) > $max_age
            )]
          ' <<<"$observed_wdc")"
          if [ "$(jq -r 'length' <<<"$stale_queued")" -gt 0 ]; then
            echo "WDC_STALE_QUEUED_LEASE_IGNORED runs=$stale_queued"
          fi
          if [ "$(jq -r 'length' <<<"$active_wdc")" -gt 0 ]; then
            echo 'blocked=true' >> "$GITHUB_OUTPUT"
            echo "PG_INCREMENT_NOOP reason=active-wdc-release runs=$(jq -c . <<<"$active_wdc")"
          else
            echo 'blocked=false' >> "$GITHUB_OUTPUT"
            echo "PG_INCREMENT_RELEASE_WINDOW_CLEAR"
          fi

      - name: Download generated accepted increment
        if: ${{ inputs.artifact_name != '' && steps.wdc_window.outputs.blocked != 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/daily-song-list-pg-artifact
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
      - name: No-op unsuccessful producer workflow_run
        if: ${{ steps.wdc_window.outputs.blocked != 'true' && github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' }}
        run: |
          echo "PG_INCREMENT_NOOP owner=workflow_run reason=producer-conclusion-${{ github.event.workflow_run.conclusion || 'missing' }}"
      - name: Build, activate, and observe candidate
        if: ${{ steps.wdc_window.outputs.blocked != 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
        env:
          VPS2_PASSWORD: ${{ secrets.VPS2_PASSWORD }}
          VPS2_KNOWN_HOSTS: ${{ secrets.VPS2_KNOWN_HOSTS }}
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_ROOT: ${{ runner.temp }}/daily-song-list-pg-artifact
          SOURCE_PUSH_BEFORE: ${{ github.event.before || '' }}
          SOURCE_PUSH_SHA: ${{ github.sha || '' }}
          SOURCE_PUSH_REF: ${{ github.ref || '' }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || '' }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          WORKFLOW_RUN_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name || '' }}
          WORKFLOW_RUN_ARTIFACT_PREFIX: daily-song-list-authoritative-7d
          SOURCE_MANUAL_SHA: ${{ inputs.source_sha || '' }}
          SOURCE_MANUAL_BASE_SHA: ${{ inputs.source_base_sha || '' }}
        run: |
          set -Eeuo pipefail
          for release_wait_attempt in $(seq 1 20); do
            active_releases="$(
              for release_status in in_progress queued; do
                curl --fail --silent --show-error --location --retry 2 --connect-timeout 5 --max-time 30 \
                  -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?status=${release_status}&per_page=100"
              done | jq -sr --argjson current_run "$GITHUB_RUN_ID" '
                [.[].workflow_runs[] |
                  select(.id != $current_run) |
                  select(.name != "Candidate two-day PG bridge v2") |
                  select(.name | test("PostgreSQL|PG|7D"; "i")) |
                  {id,name,status,head_sha}
                ] | unique_by(.id)
              '
            )"
            if [ "$(jq -r 'length' <<<"$active_releases")" -eq 0 ]; then
              break
            fi
            echo "PG_INCREMENT_WAIT concurrent-release attempt=$release_wait_attempt runs=$(jq -c . <<<"$active_releases")"
            if [ "$release_wait_attempt" -eq 20 ]; then
              echo "PG_INCREMENT_BLOCKED concurrent-release-timeout runs=$(jq -c . <<<"$active_releases")"
              exit 75
            fi
            sleep 30
          done
          TASK_ROOT="$(mktemp -d "${RUNNER_TEMP}/daily-song-list-pg-increment.XXXXXX")"
          INPUT_ROOT="$TASK_ROOT/inputs"
          mkdir -p "$INPUT_ROOT"
          bootstrap_cleanup() {
            status=$?
            rm -rf -- "$TASK_ROOT"
            exit "$status"
          }
          trap bootstrap_cleanup EXIT INT TERM
          # BEGIN PG_INCREMENT_ROUTING_BLOCK
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "PG_INCREMENT_BLOCKED invalid-code-sha=$GITHUB_SHA"; exit 78;
          }
          RAW_BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}"
          echo "PG_INCREMENT_CODE_BINDING codeSha=$GITHUB_SHA rawBase=$RAW_BASE"
          fetch_input() {
            source_path="$1"
            destination="$2"
            case "$source_path" in
              /*|*..*) echo "PG_INCREMENT_BLOCKED invalid input path=$source_path"; exit 78 ;;
            esac
            curl --fail --location --retry 2 --retry-all-errors --connect-timeout 5 --max-time 60 \
              "$RAW_BASE/$source_path" -o "$destination"
            test -s "$destination" || { echo "PG_INCREMENT_BLOCKED empty input=$source_path"; exit 78; }
          }
          WORKFLOW_RUN_ROUTE=""
          WORKFLOW_RUN_NOOP=0
          WORKFLOW_RUN_NOOP_REASON=""
          WORKFLOW_RUN_ARTIFACT_ID=""
          WORKFLOW_RUN_ARTIFACT_NAME=""
          WORKFLOW_RUN_ARTIFACT_SIZE=""
          WORKFLOW_RUN_EVIDENCE_ROOT=""
          WORKFLOW_RUN_DATA_PATH=""
          workflow_run_noop() {
            WORKFLOW_RUN_NOOP=1
            WORKFLOW_RUN_NOOP_REASON="$1"
            return 0
          }
          workflow_run_hard_fail() {
            echo "PG_INCREMENT_INPUT_ERROR owner=workflow_run reason=$1" >&2
            return 64
          }
          resolve_workflow_run_route() {
            WORKFLOW_RUN_ROUTE=""
            [ "$GITHUB_EVENT_NAME" = "workflow_run" ] || return 0
            if [ "$WORKFLOW_RUN_CONCLUSION" != "success" ]; then
              workflow_run_noop "producer-conclusion-${WORKFLOW_RUN_CONCLUSION:-missing}"
              return 0
            fi
            [[ "$WORKFLOW_RUN_ID" =~ ^[0-9]+$ ]] || {
              workflow_run_hard_fail invalid-producer-run-id; return 64;
            }
            [[ "$WORKFLOW_RUN_ATTEMPT" =~ ^[0-9]+$ ]] || {
              workflow_run_hard_fail invalid-producer-run-attempt; return 64;
            }
            [[ "$WORKFLOW_RUN_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              workflow_run_hard_fail invalid-producer-head-sha; return 64;
            }
            [ "$WORKFLOW_RUN_HEAD_REPOSITORY" = "$GITHUB_REPOSITORY" ] || {
              workflow_run_hard_fail producer-repository-mismatch; return 64;
            }
            EXPECTED_WORKFLOW_RUN_ARTIFACT_NAME="${WORKFLOW_RUN_ARTIFACT_PREFIX}-${WORKFLOW_RUN_ID}-${WORKFLOW_RUN_ATTEMPT}"
            producer_run_json="$TASK_ROOT/workflow-run.json"
            if ! curl --fail --silent --show-error --location --retry 2 --connect-timeout 5 --max-time 30 \
              -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${WORKFLOW_RUN_ID}" \
              -o "$producer_run_json"; then
              workflow_run_hard_fail producer-run-api-failed; return 64
            fi
            if ! jq -e --argjson run_id "$WORKFLOW_RUN_ID" --argjson run_attempt "$WORKFLOW_RUN_ATTEMPT" \
              --arg repo "$GITHUB_REPOSITORY" --arg sha "$WORKFLOW_RUN_HEAD_SHA" '
              (.id == $run_id) and
              (.run_attempt == $run_attempt) and
              (.conclusion == "success") and
              (.head_sha == $sha) and
              (.head_repository.full_name == $repo)
            ' "$producer_run_json" >/dev/null; then
              workflow_run_hard_fail producer-run-binding-mismatch; return 64
            fi
            producer_artifacts_json="$TASK_ROOT/workflow-run-artifacts.json"
            if ! curl --fail --silent --show-error --location --retry 2 --connect-timeout 5 --max-time 30 \
              -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${WORKFLOW_RUN_ID}/artifacts?per_page=100" \
              -o "$producer_artifacts_json"; then
              workflow_run_hard_fail producer-artifact-api-failed; return 64
            fi
            if ! jq -e '.total_count | type == "number"' "$producer_artifacts_json" >/dev/null || \
               ! jq -e '.artifacts | type == "array"' "$producer_artifacts_json" >/dev/null; then
              workflow_run_hard_fail malformed-producer-artifact-response; return 64
            fi
            artifact_count="$(jq -er '.total_count' "$producer_artifacts_json")" || {
              workflow_run_hard_fail producer-artifact-count-unreadable; return 64;
            }
            artifact_item_count="$(jq -er '.artifacts | length' "$producer_artifacts_json")" || {
              workflow_run_hard_fail producer-artifact-items-unreadable; return 64;
            }
            if [ "$artifact_count" -eq 0 ]; then
              [ "$artifact_item_count" -eq 0 ] || {
                workflow_run_hard_fail inconsistent-zero-artifact-response; return 64;
              }
              workflow_run_noop no-producer-artifacts
              return 0
            fi
            [ "$artifact_item_count" -gt 0 ] || {
              workflow_run_hard_fail missing-artifact-items; return 64;
            }
            matching_artifact_count="$(jq -er --arg expected "$EXPECTED_WORKFLOW_RUN_ARTIFACT_NAME" \
              '[.artifacts[] | select(.name == $expected)] | length' "$producer_artifacts_json")" || {
              workflow_run_hard_fail artifact-name-selection-failed; return 64;
            }
            if [ "$matching_artifact_count" -eq 0 ]; then
              workflow_run_noop no-valid-authoritative-7d-evidence
              return 0
            fi
            [ "$matching_artifact_count" -eq 1 ] || {
              workflow_run_hard_fail ambiguous-authoritative-7d-artifact-name; return 64;
            }
            matched_artifact_json="$TASK_ROOT/workflow-run-authoritative-7d-artifact.json"
            if ! jq -e --arg expected "$EXPECTED_WORKFLOW_RUN_ARTIFACT_NAME" \
              '[.artifacts[] | select(.name == $expected)][0]' "$producer_artifacts_json" > "$matched_artifact_json"; then
              workflow_run_hard_fail artifact-selection-failed; return 64
            fi
            if ! jq -e --argjson run_id "$WORKFLOW_RUN_ID" --arg head "$WORKFLOW_RUN_HEAD_SHA" \
              --arg expected "$EXPECTED_WORKFLOW_RUN_ARTIFACT_NAME" '
              (.name == $expected) and
              (.expired == false) and
              (.size_in_bytes | type == "number" and . > 0) and
              (.workflow_run.id == $run_id) and
              (.workflow_run.head_sha == $head)
            ' "$matched_artifact_json" >/dev/null; then
              workflow_run_hard_fail artifact-run-head-binding-mismatch; return 64
            fi
            if ! WORKFLOW_RUN_ARTIFACT_ID="$(jq -er '.id | select(type == "number")' "$matched_artifact_json")"; then
              workflow_run_hard_fail artifact-id-unreadable; return 64
            fi
            if ! WORKFLOW_RUN_ARTIFACT_SIZE="$(jq -er '.size_in_bytes | select(type == "number" and . > 0)' "$matched_artifact_json")"; then
              workflow_run_hard_fail artifact-size-unreadable; return 64
            fi
            WORKFLOW_RUN_ARTIFACT_NAME="$EXPECTED_WORKFLOW_RUN_ARTIFACT_NAME"
            artifact_zip="$TASK_ROOT/workflow-run-authoritative-7d.zip"
            if ! curl --fail --silent --show-error --location --retry 2 --connect-timeout 5 --max-time 60 \
              -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${WORKFLOW_RUN_ARTIFACT_ID}/zip" \
              -o "$artifact_zip"; then
              workflow_run_hard_fail artifact-download-failed; return 64
            fi
            test -s "$artifact_zip" || {
              workflow_run_hard_fail artifact-download-empty; return 64;
            }
            artifact_members="$TASK_ROOT/workflow-run-authoritative-7d.members"
            if ! unzip -Z1 "$artifact_zip" > "$artifact_members"; then
              workflow_run_hard_fail artifact-list-failed; return 64
            fi
            if grep -Eq '(^/|(^|/)\.\.(/|$)|\\)' "$artifact_members"; then
              workflow_run_hard_fail artifact-path-traversal; return 64
            fi
            WORKFLOW_RUN_EVIDENCE_ROOT="$TASK_ROOT/workflow-run-authoritative-7d"
            mkdir -p "$WORKFLOW_RUN_EVIDENCE_ROOT"
            if ! unzip -q "$artifact_zip" -d "$WORKFLOW_RUN_EVIDENCE_ROOT"; then
              workflow_run_hard_fail artifact-extract-failed; return 64
            fi
            WORKFLOW_RUN_DATA_PATH="$WORKFLOW_RUN_EVIDENCE_ROOT/7d.json"
            artifact_manifest="$WORKFLOW_RUN_EVIDENCE_ROOT/authoritative-7d-manifest.json"
            test -f "$WORKFLOW_RUN_DATA_PATH" || {
              workflow_run_hard_fail missing-artifact-7d-json; return 64;
            }
            test -f "$artifact_manifest" || {
              workflow_run_hard_fail missing-artifact-manifest; return 64;
            }
            if ! jq -e 'type == "object"' "$WORKFLOW_RUN_DATA_PATH" >/dev/null; then
              workflow_run_hard_fail invalid-artifact-7d-json; return 64
            fi
            if ! artifact_data_sha="$(shasum -a 256 "$WORKFLOW_RUN_DATA_PATH" | awk '{print $1}')"; then
              workflow_run_hard_fail artifact-7d-sha-failed; return 64
            fi
            if ! artifact_blob_sha="$(git hash-object "$WORKFLOW_RUN_DATA_PATH")"; then
              workflow_run_hard_fail artifact-7d-blob-sha-failed; return 64
            fi
            [[ "$artifact_data_sha" =~ ^[0-9a-f]{64}$ ]] || {
              workflow_run_hard_fail invalid-artifact-7d-sha; return 64;
            }
            [[ "$artifact_blob_sha" =~ ^[0-9a-f]{40}$ ]] || {
              workflow_run_hard_fail invalid-artifact-7d-blob-sha; return 64;
            }
            if ! jq -e --argjson run_id "$WORKFLOW_RUN_ID" --argjson run_attempt "$WORKFLOW_RUN_ATTEMPT" \
              --arg artifact_name "$EXPECTED_WORKFLOW_RUN_ARTIFACT_NAME" --arg repo "$GITHUB_REPOSITORY" \
              --arg head "$WORKFLOW_RUN_HEAD_SHA" --arg data_sha "$artifact_data_sha" \
              --arg blob_sha "$artifact_blob_sha" '
              (.schemaVersion == 1) and
              (.route == "authoritative-7d") and
              (.artifactName == $artifact_name) and
              (.producerRunId == $run_id) and
              (.producerRunAttempt == $run_attempt) and
              (.producerRepository == $repo) and
              (.producerHeadSha == $head) and
              (.sourceSha | type == "string" and test("^[0-9a-f]{40}$")) and
              (.sourceBlobSha == $blob_sha) and
              (.sourceBaseSha | type == "string" and test("^[0-9a-f]{40}$")) and
              (.dataPath == "7d.json") and
              (.dataSha256 == $data_sha)
            ' "$artifact_manifest" >/dev/null; then
              workflow_run_hard_fail artifact-manifest-binding-failed; return 64
            fi
            SOURCE_COMMIT_ROLE="workflow-run-authoritative-7d-artifact"
            if ! SOURCE_SHA="$(jq -er '.sourceSha | select(type == "string" and test("^[0-9a-f]{40}$"))' "$artifact_manifest")"; then
              workflow_run_hard_fail artifact-source-sha-unreadable; return 64;
            fi
            SOURCE_BASE_SHA="$(jq -er '.sourceBaseSha' "$artifact_manifest")" || {
              workflow_run_hard_fail artifact-source-base-unreadable; return 64;
            }
            artifact_source_blob_sha="$(jq -er '.sourceBlobSha' "$artifact_manifest")" || {
              workflow_run_hard_fail artifact-source-blob-unreadable; return 64;
            }
            source_commit_json="$TASK_ROOT/workflow-run-source-commit.json"
            if ! curl --fail --silent --show-error --location --retry 2 --connect-timeout 5 --max-time 30 \
              -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${SOURCE_SHA}" \
              -o "$source_commit_json"; then
              workflow_run_hard_fail source-commit-api-failed; return 64
            fi
            if ! jq -e --arg source "$SOURCE_SHA" --arg base "$SOURCE_BASE_SHA" '
              (.sha == $source) and
              (.parents[0].sha == $base)
            ' "$source_commit_json" >/dev/null; then
              workflow_run_hard_fail source-commit-binding-failed; return 64
            fi
            WORKFLOW_RUN_ROUTE=authoritative-7d
            SOURCE_RAW_BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SOURCE_SHA}"
            source_data_probe="$TASK_ROOT/workflow-run-source-7d.json"
            if ! curl --fail --silent --show-error --location --retry 2 --connect-timeout 5 --max-time 60 \
              "$SOURCE_RAW_BASE/data/7d.json" -o "$source_data_probe"; then
              workflow_run_hard_fail source-commit-7d-fetch-failed; return 64
            fi
            source_blob_probe="$(git hash-object "$source_data_probe")"
            [ "$source_blob_probe" = "$artifact_source_blob_sha" ] || {
              workflow_run_hard_fail source-commit-7d-blob-mismatch; return 64;
            }
            echo "PG_INCREMENT_ROUTE owner=workflow_run route=authoritative-7d workflowRunId=$WORKFLOW_RUN_ID workflowRunAttempt=$WORKFLOW_RUN_ATTEMPT workflowHead=$WORKFLOW_RUN_HEAD_SHA sourceSha=$SOURCE_SHA sourceBaseSha=$SOURCE_BASE_SHA sourceRole=$SOURCE_COMMIT_ROLE producerArtifactId=$WORKFLOW_RUN_ARTIFACT_ID producerArtifactName=$WORKFLOW_RUN_ARTIFACT_NAME producerArtifactBytes=$WORKFLOW_RUN_ARTIFACT_SIZE"
            return 0
          }
          if ! resolve_workflow_run_route; then
            exit 64
          fi
          resolve_push_7d_route() {
            PUSH_ROUTE=""
            [ "$GITHUB_EVENT_NAME" = "push" ] || return 0
            SOURCE_COMMIT_ROLE="push-data-commit"
            SOURCE_SHA="$SOURCE_PUSH_SHA"
            SOURCE_BASE_SHA="$SOURCE_PUSH_BEFORE"
            [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ "$SOURCE_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo "PG_INCREMENT_INPUT_ERROR invalid-push-identity before=$SOURCE_BASE_SHA sha=$SOURCE_SHA"; return 64;
            }
            PUSH_ROUTE=authoritative-7d
            echo "PG_INCREMENT_ROUTE owner=push route=authoritative-7d sourceSha=$SOURCE_SHA sourceRole=$SOURCE_COMMIT_ROLE"
            return 0
          }
          if ! resolve_push_7d_route; then
            exit 64
          fi
          resolve_manual_7d_route() {
            MANUAL_7D_ROUTE=""
            [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || return 0
            [ -z "$ARTIFACT_NAME" ] || return 0
            [ -n "$SOURCE_MANUAL_SHA" ] || return 0
            SOURCE_COMMIT_ROLE="controlled-manual-7d-resume"
            SOURCE_SHA="$SOURCE_MANUAL_SHA"
            SOURCE_BASE_SHA="$SOURCE_MANUAL_BASE_SHA"
            [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ "$SOURCE_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo "PG_INCREMENT_INPUT_ERROR invalid-manual-identity before=$SOURCE_BASE_SHA sha=$SOURCE_SHA"; return 64;
            }
            MANUAL_7D_ROUTE=authoritative-7d
            echo "PG_INCREMENT_ROUTE owner=workflow_dispatch route=authoritative-7d sourceSha=$SOURCE_SHA sourceRole=$SOURCE_COMMIT_ROLE"
            return 0
          }
          if ! resolve_manual_7d_route; then
            exit 64
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            if [ "$WORKFLOW_RUN_NOOP" = 1 ]; then
              echo "PG_INCREMENT_NOOP owner=workflow_run reason=$WORKFLOW_RUN_NOOP_REASON workflowRunId=${WORKFLOW_RUN_ID:-unknown}"
              exit 0
            fi
            [ "$WORKFLOW_RUN_ROUTE" = "authoritative-7d" ] || {
              echo "PG_INCREMENT_INPUT_ERROR owner=workflow_run reason=unresolved-producer-route" >&2
              exit 64
            }
          fi
          test -n "$VPS2_HOST" || { echo "PG_INCREMENT_BLOCKED missing VPS2_HOST"; exit 78; }
          test -n "$VPS2_USER" || { echo "PG_INCREMENT_BLOCKED missing VPS2_USER"; exit 78; }
          test -n "$VPS2_PASSWORD" || { echo "PG_INCREMENT_BLOCKED missing VPS2_PASSWORD"; exit 78; }
          test -n "$VPS2_KNOWN_HOSTS" || { echo "PG_INCREMENT_BLOCKED missing VPS2_KNOWN_HOSTS"; exit 78; }
          fetch_input "scripts/migration/accepted-source-identities.py" "$INPUT_ROOT/accepted-source-identities.py"
          if [ -n "$ARTIFACT_NAME" ]; then
            PATCH_INPUT="$ARTIFACT_ROOT/$PATCH_PATH"
            MANIFEST_INPUT="$ARTIFACT_ROOT/$MANIFEST_PATH"
            test -f "$PATCH_INPUT" || { echo "PG_INCREMENT_BLOCKED missing artifact patch=$PATCH_PATH"; exit 78; }
            test -f "$MANIFEST_INPUT" || { echo "PG_INCREMENT_BLOCKED missing artifact manifest=$MANIFEST_PATH"; exit 78; }
          elif [ "$PUSH_ROUTE" = "authoritative-7d" ] || \
               [ "$WORKFLOW_RUN_ROUTE" = "authoritative-7d" ] || \
               [ "$MANUAL_7D_ROUTE" = "authoritative-7d" ]; then
            fetch_input "scripts/migration/7d-json-to-patch.py" "$INPUT_ROOT/7d-json-to-patch.py"
            DATA_RAW_BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SOURCE_SHA}"
            DATA_BASE_RAW_BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SOURCE_BASE_SHA}"
            if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
              cp "$WORKFLOW_RUN_DATA_PATH" "$INPUT_ROOT/7d.json"
            else
              curl --fail --location --retry 2 --retry-all-errors --connect-timeout 5 --max-time 60 \
                "$DATA_RAW_BASE/data/7d.json" -o "$INPUT_ROOT/7d.json"
            fi
            curl --fail --location --retry 2 --retry-all-errors --connect-timeout 5 --max-time 60 \
              "$DATA_BASE_RAW_BASE/data/7d.json" -o "$INPUT_ROOT/7d.base.json"
            test -s "$INPUT_ROOT/7d.json" && test -s "$INPUT_ROOT/7d.base.json"
            seven_d_blob_sha="$(git hash-object "$INPUT_ROOT/7d.json")"
            seven_d_base_blob_sha="$(git hash-object "$INPUT_ROOT/7d.base.json")"
            python3 "$INPUT_ROOT/7d-json-to-patch.py" --input "$INPUT_ROOT/7d.json" \
              --base-input "$INPUT_ROOT/7d.base.json" --output "$INPUT_ROOT/7d.patch" \
              --manifest-output "$INPUT_ROOT/7d.manifest" --source-commit "$SOURCE_SHA" \
              --source-base "$SOURCE_BASE_SHA" --source-blob "$seven_d_blob_sha" \
              --base-blob "$seven_d_base_blob_sha"
            PATCH_INPUT="$INPUT_ROOT/7d.patch"
            MANIFEST_INPUT="$INPUT_ROOT/7d.manifest"
            PATCH_PATH="push-7d-authoritative-generated"
            MANIFEST_PATH="push-7d-authoritative-generated"
          fi
          # END PG_INCREMENT_ROUTING_BLOCK
          fetch_input "scripts/migration/pg-schema.sql" "$INPUT_ROOT/pg-schema.sql"
          fetch_input "scripts/migration/import-pg-incremental.py" "$INPUT_ROOT/import-pg-incremental.py"
          fetch_input "scripts/migration/verify-7d-api-contract.py" "$INPUT_ROOT/verify-7d-api-contract.py"
          fetch_input "scripts/migration/legacy_vtuber_identity_reset.py" "$INPUT_ROOT/legacy_vtuber_identity_reset.py"
          fetch_input "scripts/migration/activate-pg-candidate.py" "$INPUT_ROOT/activate-pg-candidate.py"
          fetch_input "server/pg_adapter.py" "$INPUT_ROOT/pg_adapter.py"
          fetch_input "server/pg_api_server.py" "$INPUT_ROOT/pg_api_server.py"
          fetch_input "deploy/vps2/song-rank-pg-api.service" "$INPUT_ROOT/song-rank-pg-api.service"
          if [ -z "$ARTIFACT_NAME" ] && [ "$GITHUB_EVENT_NAME" != "push" ] && \
             [ "$GITHUB_EVENT_NAME" != "workflow_run" ] && [ "$MANUAL_7D_ROUTE" != "authoritative-7d" ]; then
            fetch_input "$PATCH_PATH" "$INPUT_ROOT/patch"
            fetch_input "$MANIFEST_PATH" "$INPUT_ROOT/manifest"
            PATCH_INPUT="$INPUT_ROOT/patch"
            MANIFEST_INPUT="$INPUT_ROOT/manifest"
          fi
          printf 'TASK_ROOT=%s\nPG_INPUT_ROOT=%s\n' "$TASK_ROOT" "$INPUT_ROOT" >> "$GITHUB_ENV"
          test -f "$PATCH_INPUT" || { echo "PG_INCREMENT_BLOCKED missing patch=$PATCH_PATH"; exit 78; }
          test -f "$MANIFEST_INPUT" || { echo "PG_INCREMENT_BLOCKED missing manifest=$MANIFEST_PATH"; exit 78; }
          echo "PG_MANIFEST_BUSINESS_VALIDATION_REMOVED"
          baseline_free_bytes=$(( $(df -k /Users/be | awk 'NR==2 {print $4}') * 1024 ))
          patch_bytes="$(stat -f%z "$PATCH_INPUT")"
          manifest_bytes="$(stat -f%z "$MANIFEST_INPUT")"
          expected_peak_bytes=$((512 * 1024 * 1024))
          hard_cap_bytes=$((2 * 1024 * 1024 * 1024))
          printf 'baselineFreeBytes=%s\npatchBytes=%s\nmanifestBytes=%s\nexpectedPeakBytes=%s\nhardCapBytes=%s\n' "$baseline_free_bytes" "$patch_bytes" "$manifest_bytes" "$expected_peak_bytes" "$hard_cap_bytes" > "$TASK_ROOT/storage.txt"
          SOURCE_IDENTITIES_JSON=""
          EXPECTED_7D_INPUT=""
          expected_patch_sha=""
          mkdir -p "$RUNNER_TEMP/ssh-askpass"
          printf '%s\n' "$VPS2_PASSWORD" > "$RUNNER_TEMP/ssh-askpass/vps2.password"
          SSH_KNOWN_HOSTS="$RUNNER_TEMP/ssh-askpass/known_hosts"
          printf '%s\n' "$VPS2_KNOWN_HOSTS" > "$SSH_KNOWN_HOSTS"
          chmod 600 "$RUNNER_TEMP/ssh-askpass/vps2.password"
          chmod 600 "$SSH_KNOWN_HOSTS"
          cat > "$RUNNER_TEMP/ssh-askpass/vps2-askpass.sh" <<'SH'
          #!/bin/sh
          exec cat "$RUNNER_TEMP/ssh-askpass/vps2.password"
          SH
          chmod 700 "$RUNNER_TEMP/ssh-askpass/vps2-askpass.sh"
