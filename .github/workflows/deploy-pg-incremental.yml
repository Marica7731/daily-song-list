          echo "PG_ROLLBACK_PUBLIC_OK active=$EXPECTED_TARGET_REVISION healthHttp=$public_health_http metaHttp=$public_meta_http sourceHttp=$public_source_http sourcePages=$source_page_count sourceKey=$EXPECTED_SOURCE_DETAIL_KEY channelId=$EXPECTED_SOURCE_CHANNEL_ID"
