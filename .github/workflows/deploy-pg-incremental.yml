          adapter_installed=0
          noop=0
          previous_active=""
          remote_backup_dir=""
          remote_backup_action=remove
          remote_free_after=unknown
          cleanup() {
            status=$?
            trap - EXIT INT TERM
            set +e
            cleanup_failed=0
            pointer_restored=0
            service_restored=0
            candidate_residue=unknown
            if [ -n "${CANDIDATE_PID:-}" ]; then
              if ! "${SSH[@]}" "$VPS2_USER@$VPS2_HOST" "if kill -0 '$CANDIDATE_PID' 2>/dev/null; then kill '$CANDIDATE_PID'; fi; for n in \$(seq 1 10); do if ! kill -0 '$CANDIDATE_PID' 2>/dev/null; then echo PG_7D_CANDIDATE_PROCESS_CLEAN; exit 0; fi; sleep 1; done; exit 1" \
                | tee "$TASK_ROOT/candidate-process-cleanup.log"; then
                echo "PG_INCREMENT_CLEANUP_FAILED candidate-process" >&2
                cleanup_failed=1
