                restore_file() { target=\"\$1\"; key=\"\$2\"; if [ -f '$remote_backup_dir/'\"\$key\".bak ]; then install -m 0644 '$remote_backup_dir/'\"\$key\".bak \"\$target\"; elif [ -f '$remote_backup_dir/'\"\$key\".missing ]; then rm -f -- \"\$target\"; else echo missing-backup-key=\"\$key\" >&2; exit 1; fi; }
                restore_file /opt/culua/ytb-song-rank/pg_adapter.py root-pg-adapter
                restore_file /opt/culua/ytb-song-rank/pg_api_server.py root-pg-api-server
                restore_file /opt/culua/ytb-song-rank/server/pg_adapter.py server-pg-adapter
                restore_file /opt/culua/ytb-song-rank/server/pg_api_server.py server-pg-api-server
                restore_file /etc/systemd/system/song-rank-pg-api.service service
                systemctl daemon-reload
                systemctl restart song-rank-pg-api
                ready=0
                for n in \$(seq 1 30); do
                  if systemctl is-active --quiet song-rank-pg-api && ss -ltnH | grep -q :8765; then ready=1; break; fi
                  sleep 1
                done
                test "\$ready" = 1
                systemctl is-active --quiet song-rank-pg-api
                curl --fail-with-body --silent --show-error --connect-timeout 8 --max-time 300 http://127.0.0.1:8765/healthz >/dev/null
                echo PG_7D_ROLLBACK_SERVICE_VERIFIED
              " | tee "$TASK_ROOT/service-rollback.log" && grep -qx 'PG_7D_ROLLBACK_SERVICE_VERIFIED' "$TASK_ROOT/service-rollback.log"; then
