              if ! "${SSH[@]}" "$VPS2_USER@$VPS2_HOST" "sudo -u postgres psql -d song_rank -v ON_ERROR_STOP=1 -c \"begin; select pg_advisory_xact_lock(hashtext('daily-song-list/active')); do \\\$\\\$ declare current text; begin select state_value into current from migration_state where state_key='active_revision_id' for update; if current = '$REVISION' then raise exception 'candidate still active'; end if; delete from migration_revisions where revision_id='$REVISION' and status in ('draft','ready','superseded'); end; \\\$\\\$; commit;\""; then
                echo "PG_INCREMENT_CLEANUP_FAILED candidate-db-delete" >&2
                cleanup_failed=1
