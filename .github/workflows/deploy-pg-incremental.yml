              contract = json.dumps({"aliasSourceReview": {"selectedIdentities": tuples}}, ensure_ascii=False, separators=(",", ":"))
              script = "SET statement_timeout='45s';\nWITH doc AS (SELECT " + sql(contract) + "::jsonb AS payload),\n" + r'''
          tuples AS (
            SELECT * FROM doc, jsonb_to_recordset(payload->'aliasSourceReview'->'selectedIdentities') AS t(
              "rangeId" text,"storedRangeId" text,"videoId" text,"occurrenceId" text,"sourceId" text,"seconds" integer,
              "originalTitle" text,"originalArtist" text,"replacementTitle" text,"replacementArtist" text,
              "originalGroupKey" text,"originalSourceDetailKey" text,"replacementGroupKey" text,"replacementSourceDetailKey" text)
          ), physical AS (
