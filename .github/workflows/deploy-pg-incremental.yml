              preserved_pointer="$("${SSH[@]}" "$VPS2_USER@$VPS2_HOST" "sudo -u www-data psql -d song_rank -At -c \"select state_value from migration_state where state_key='active_revision_id'\"")"
              preserved_probe_status=$?
