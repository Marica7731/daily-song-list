              if ! "${SSH[@]}" "$VPS2_USER@$VPS2_HOST" "sudo -u postgres psql -d song_rank -v ON_ERROR_STOP=1 -c \"begin; select pg_advisory_xact_lock(hashtext('daily-song-list/active')); do \\\$\\\$ declare current text; begin select state_value into current from migration_state where state_key='active_revision_id' for update; if current <> '$REVISION' then raise exception 'rollback guard failed current=% expected=$REVISION', current; end if; update migration_revisions set status='active',activated_at=current_timestamp where revision_id='$previous_active' and status='superseded'; if not found then raise exception 'rollback parent transition failed'; end if; update migration_revisions set status='superseded' where revision_id='$REVISION' and status='active'; if not found then raise exception 'rollback candidate transition failed'; end if; update migration_state set state_value='$previous_active' where state_key='active_revision_id' and state_value='$REVISION'; if not found then raise exception 'rollback pointer update failed'; end if; end; \\\$\\\$; commit;\""; then
                echo "PG_INCREMENT_ROLLBACK_FAILED transaction" >&2
                cleanup_failed=1
