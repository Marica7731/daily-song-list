              if [ -n '$remote_backup_dir' ]; then
                case '$remote_backup_dir' in /tmp/daily-song-list-pg-increment-backup-[0-9]*-[0-9]*) ;; *) echo invalid-backup-path >&2; exit 1 ;; esac
                case '$remote_backup_action' in remove|retain) ;; *) echo invalid-backup-action >&2; exit 1 ;; esac
