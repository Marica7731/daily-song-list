name: Deploy PostgreSQL accepted increment

on:
  workflow_dispatch:
    inputs:
      patch_path:
        description: "Curated accepted-increment NDJSON"
        required: true
        default: "artifacts/migration/candidate.ndjson"
      manifest_path:
        description: "Manifest with source/provenance/hash evidence"
        required: true
        default: "artifacts/migration/manifest.json"
      activate:
        description: "Activate only after candidate API gate (release window)"
        required: true
        default: false
        type: boolean
      require_7d_gate:
        description: "Require complete 7D manifest/time-coverage gate"
        required: false
        default: false
        type: boolean
      source_key:
        description: "Optional source key to match in the manifest"
        required: false
        default: ""
      artifact_name:
        description: "Optional same-repository artifact name for an approved resume"
        required: false
        default: ""
      artifact_run_id:
        description: "Optional producing workflow run ID for artifact_name"
        required: false
        default: ""
      rollback_only:
        description: "Emergency CAS rollback only; never downloads or imports an artifact"
        required: true
        default: false
        type: boolean
  repository_dispatch:
    types: [accepted-increment-ready]
  workflow_run:
    workflows: ["Update core song-list data"]
    types: [completed]
  workflow_call:
    inputs:
      artifact_name:
        type: string
        required: false
        default: ""
      patch_path:
        type: string
        required: false
        default: "candidate.ndjson"
      manifest_path:
        type: string
        required: false
        default: "manifest.json"
      activate:
        type: boolean
        required: false
        default: true
      require_7d_gate:
        type: boolean
        required: false
        default: false
      source_key:
        type: string
        required: false
        default: ""
      artifact_run_id:
        type: string
        required: false
        default: ""
    secrets:
      VPS2_PASSWORD:
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: daily-song-list-pg-increment
  cancel-in-progress: false

jobs:
  rollback:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback_only == true }}
    runs-on: [self-hosted, macOS, ARM64, daily-song-list-mac]
    timeout-minutes: 15
    env:
      VPS2_HOST: "192.255.151.75"
      VPS2_USER: "root"
      REMOTE_STATE_DIR: "/var/lib/culua/ytb-song-rank"
      EXPECTED_CURRENT_REVISION: "accepted_30389564789_1"
      EXPECTED_TARGET_REVISION: "accepted_30347149376_1"
      EXPECTED_TARGET_CONTENT_SHA256: "5d8a123075e2de5d0221a935004d74fe7e7daf18d0aa90f1f071ebdb3f104b6c"
      EXPECTED_SOURCE_PATH: "%40urameshi_conta"
      EXPECTED_SOURCE_DETAIL_KEY: "d24ec2cab8f7f564"
      EXPECTED_SOURCE_CHANNEL_ID: "UC8VlcljjGFb4-Ny2Heb0-ew"
      EXPECTED_SOURCE_CHANNEL_HANDLE: "/@urameshi_conta"
    steps:
      - name: CAS rollback active PostgreSQL revision
        env:
          VPS2_PASSWORD: ${{ secrets.VPS2_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test -n "$VPS2_PASSWORD" || { echo "PG_ROLLBACK_BLOCKED missing VPS2_PASSWORD"; exit 78; }
          [[ "$EXPECTED_CURRENT_REVISION" =~ ^[A-Za-z0-9._-]+$ ]] || {
            echo "PG_ROLLBACK_BLOCKED invalid-current-revision"; exit 78;
          }
          [[ "$EXPECTED_TARGET_REVISION" =~ ^[A-Za-z0-9._-]+$ ]] || {
            echo "PG_ROLLBACK_BLOCKED invalid-target-revision"; exit 78;
          }
          [[ "$EXPECTED_TARGET_CONTENT_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "PG_ROLLBACK_BLOCKED invalid-target-content-sha256"; exit 78;
          }
          test "$EXPECTED_CURRENT_REVISION" != "$EXPECTED_TARGET_REVISION" || {
            echo "PG_ROLLBACK_BLOCKED expected-current-equals-target"; exit 78;
          }
          for release_wait_attempt in $(seq 1 20); do
            active_releases="$(
              for release_status in in_progress queued; do
                curl --fail --silent --show-error --location --retry 2 --connect-timeout 5 --max-time 30 \
                  -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?status=${release_status}&per_page=100"
              done | jq -sr --argjson current_run "$GITHUB_RUN_ID" '
                [.[].workflow_runs[] |
                  select(.id != $current_run) |
                  select(.name | test("PostgreSQL|PG|7D|curation"; "i")) |
                  {id,name,status,head_sha}
                ] | unique_by(.id)
              '
            )"
            if [ "$(jq -r 'length' <<<"$active_releases")" -eq 0 ]; then
              break
            fi
            echo "PG_ROLLBACK_WAIT concurrent-release attempt=$release_wait_attempt runs=$(jq -c . <<<"$active_releases")"
            if [ "$release_wait_attempt" -eq 20 ]; then
              echo "PG_ROLLBACK_BLOCKED concurrent-release-timeout runs=$(jq -c . <<<"$active_releases")"
              exit 78
            fi
            sleep 30
          done
          TASK_ROOT="$(mktemp -d "${RUNNER_TEMP}/daily-song-list-pg-rollback.XXXXXX")"
          baseline_free_bytes=unknown
          remote_free_before=unknown
          remote_free_after=unknown
          pointer_committed=0
          noop=0
          cleanup() {
            status=$?
            set +e
            if declare -p SSH >/dev/null 2>&1; then
              if remote_free_after="$("${SSH[@]}" "$VPS2_USER@$VPS2_HOST" \
                "df -B1 --output=avail '$REMOTE_STATE_DIR' | tail -n1 | tr -d '[:space:]'")"; then :; else
                remote_free_after=unknown
              fi
            fi
            before_cleanup_bytes=$(( $(du -sk "$TASK_ROOT" 2>/dev/null | awk '{print $1}') * 1024 ))
            rm -rf -- "$TASK_ROOT"
            after_free_bytes=$(( $(df -k /Users/be | awk 'NR==2 {print $4}') * 1024 ))
            retained=unchanged
            if [ "$pointer_committed" = 1 ] && [ "$noop" = 1 ]; then
              retained=target-already-active
            elif [ "$pointer_committed" = 1 ] && [ "$status" -eq 0 ]; then
              retained=rollback-target
            elif [ "$pointer_committed" = 1 ]; then
              retained=rollback-target-unverified
            fi
            echo "PG_ROLLBACK_CLEANUP status=$status pointerCommitted=$pointer_committed noop=$noop beforeBytes=$before_cleanup_bytes afterBytes=0 baselineFreeBytes=$baseline_free_bytes afterFreeBytes=$after_free_bytes remoteFreeBeforeBytes=$remote_free_before remoteFreeAfterBytes=$remote_free_after retained=$retained"
            exit "$status"
          }
          trap cleanup EXIT INT TERM
          baseline_free_bytes=$(( $(df -k /Users/be | awk 'NR==2 {print $4}') * 1024 ))
          ASKPASS_ROOT="$TASK_ROOT/ssh-askpass"
          mkdir -p "$ASKPASS_ROOT"
          ROLLBACK_PASSWORD_FILE="$ASKPASS_ROOT/vps2.password"
          export ROLLBACK_PASSWORD_FILE
          printf '%s\n' "$VPS2_PASSWORD" > "$ROLLBACK_PASSWORD_FILE"
          chmod 600 "$ROLLBACK_PASSWORD_FILE"
          cat > "$ASKPASS_ROOT/vps2-askpass.sh" <<'SH'
          #!/bin/sh
          exec cat "$ROLLBACK_PASSWORD_FILE"
          SH
          chmod 700 "$ASKPASS_ROOT/vps2-askpass.sh"
          export SSH_ASKPASS="$ASKPASS_ROOT/vps2-askpass.sh" SSH_ASKPASS_REQUIRE=force DISPLAY=codex:0
          SSH=(ssh -o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o ConnectionAttempts=1 -o ServerAliveInterval=5 -o ServerAliveCountMax=2)
          remote_free_before="$("${SSH[@]}" "$VPS2_USER@$VPS2_HOST" \
            "df -B1 --output=avail '$REMOTE_STATE_DIR' | tail -n1 | tr -d '[:space:]'")"
          [[ "$remote_free_before" =~ ^[0-9]+$ ]] || {
            echo "PG_ROLLBACK_BLOCKED invalid-remote-free-before"; exit 78;
          }
          active_before="$("${SSH[@]}" "$VPS2_USER@$VPS2_HOST" \
            "sudo -u www-data psql -d song_rank -At -c \"select state_value from migration_state where state_key='active_revision_id'\"")"
          if [ "$active_before" = "$EXPECTED_TARGET_REVISION" ]; then
            noop=1
          elif [ "$active_before" != "$EXPECTED_CURRENT_REVISION" ]; then
            echo "PG_ROLLBACK_BLOCKED preflight-current-mismatch expected=$EXPECTED_CURRENT_REVISION actual=${active_before:-missing}"
            exit 78
          fi
          cat > "$TASK_ROOT/rollback.sql" <<SQL
          BEGIN;
          SELECT pg_advisory_xact_lock(hashtext('daily-song-list/active'));
          DO \$\$
          DECLARE
            current_revision text;
            current_status text;
            current_parent text;
            target_status text;
            target_content_sha256 text;
            affected_rows integer;
          BEGIN
            SELECT state_value
              INTO current_revision
              FROM migration_state
              WHERE state_key='active_revision_id'
              FOR UPDATE;
            IF current_revision = '$EXPECTED_TARGET_REVISION' THEN
              SELECT status, content_sha256
                INTO target_status, target_content_sha256
                FROM migration_revisions
                WHERE revision_id='$EXPECTED_TARGET_REVISION'
                FOR UPDATE;
              IF target_status IS DISTINCT FROM 'active' THEN
                RAISE EXCEPTION 'PG_ROLLBACK_BLOCKED noop target status=% expected=active', target_status;
              END IF;
              IF target_content_sha256 IS DISTINCT FROM '$EXPECTED_TARGET_CONTENT_SHA256' THEN
                RAISE EXCEPTION 'PG_ROLLBACK_BLOCKED noop target content sha mismatch';
              END IF;
            ELSE
              IF current_revision IS DISTINCT FROM '$EXPECTED_CURRENT_REVISION' THEN
                RAISE EXCEPTION 'PG_ROLLBACK_BLOCKED current=% expected=$EXPECTED_CURRENT_REVISION', current_revision;
              END IF;
              SELECT status, parent_revision_id
                INTO current_status, current_parent
                FROM migration_revisions
                WHERE revision_id=current_revision
                FOR UPDATE;
              IF current_status IS DISTINCT FROM 'active' THEN
                RAISE EXCEPTION 'PG_ROLLBACK_BLOCKED current status=% expected=active', current_status;
              END IF;
              IF current_parent IS DISTINCT FROM '$EXPECTED_TARGET_REVISION' THEN
                RAISE EXCEPTION 'PG_ROLLBACK_BLOCKED current parent=% expected=$EXPECTED_TARGET_REVISION', current_parent;
              END IF;
              SELECT status, content_sha256
                INTO target_status, target_content_sha256
                FROM migration_revisions
                WHERE revision_id='$EXPECTED_TARGET_REVISION'
                FOR UPDATE;
              IF target_status IS DISTINCT FROM 'superseded' THEN
                RAISE EXCEPTION 'PG_ROLLBACK_BLOCKED target status=% expected=superseded', target_status;
              END IF;
              IF target_content_sha256 IS DISTINCT FROM '$EXPECTED_TARGET_CONTENT_SHA256' THEN
                RAISE EXCEPTION 'PG_ROLLBACK_BLOCKED target content sha mismatch';
              END IF;
              UPDATE migration_revisions
                SET status='rolled_back'
                WHERE revision_id='$EXPECTED_CURRENT_REVISION' AND status='active';
              GET DIAGNOSTICS affected_rows = ROW_COUNT;
              IF affected_rows <> 1 THEN
                RAISE EXCEPTION 'PG_ROLLBACK_BLOCKED current update rows=% expected=1', affected_rows;
              END IF;
              UPDATE migration_revisions
                SET status='active', activated_at=CURRENT_TIMESTAMP
                WHERE revision_id='$EXPECTED_TARGET_REVISION' AND status='superseded';
              GET DIAGNOSTICS affected_rows = ROW_COUNT;
              IF affected_rows <> 1 THEN
                RAISE EXCEPTION 'PG_ROLLBACK_BLOCKED target update rows=% expected=1', affected_rows;
              END IF;
              UPDATE migration_state
                SET state_value='$EXPECTED_TARGET_REVISION'
                WHERE state_key='active_revision_id' AND state_value='$EXPECTED_CURRENT_REVISION';
              GET DIAGNOSTICS affected_rows = ROW_COUNT;
              IF affected_rows <> 1 THEN
                RAISE EXCEPTION 'PG_ROLLBACK_BLOCKED state update rows=% expected=1', affected_rows;
              END IF;
            END IF;
          END
          \$\$;
          COMMIT;
          SQL
          "${SSH[@]}" "$VPS2_USER@$VPS2_HOST" \
            "sudo -u postgres psql -d song_rank -v ON_ERROR_STOP=1 -f -" \
            < "$TASK_ROOT/rollback.sql" | tee "$TASK_ROOT/rollback-transaction.log"
          pointer_committed=1
          rollback_state="$("${SSH[@]}" "$VPS2_USER@$VPS2_HOST" \
            "sudo -u www-data psql -d song_rank -At -F '|' -c \"select r.revision_id,r.status,r.content_sha256 from migration_state s join migration_revisions r on r.revision_id=s.state_value where s.state_key='active_revision_id'\"")"
          IFS='|' read -r actual_revision actual_status actual_content_sha256 <<<"$rollback_state"
          test "$actual_revision" = "$EXPECTED_TARGET_REVISION" || {
            echo "PG_ROLLBACK_BLOCKED committed-revision-mismatch expected=$EXPECTED_TARGET_REVISION actual=${actual_revision:-missing}"; exit 78;
          }
          test "$actual_status" = active || {
            echo "PG_ROLLBACK_BLOCKED committed-status-mismatch actual=${actual_status:-missing}"; exit 78;
          }
          test "$actual_content_sha256" = "$EXPECTED_TARGET_CONTENT_SHA256" || {
            echo "PG_ROLLBACK_BLOCKED committed-content-sha-mismatch"; exit 78;
          }
          echo "PG_ROLLBACK_TRANSACTION_OK previous=$active_before active=$actual_revision contentSha256=$actual_content_sha256 noop=$noop"
          "${SSH[@]}" "$VPS2_USER@$VPS2_HOST" '
            set -Eeuo pipefail
            systemctl restart song-rank-pg-api
            ready=0
            for n in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8765/healthz >/dev/null; then ready=1; break; fi
              sleep 1
            done
            test "$ready" = 1 || { echo PG_ROLLBACK_BLOCKED service-health-timeout >&2; exit 1; }
          '
          "${SSH[@]}" "$VPS2_USER@$VPS2_HOST" \
            "curl --fail-with-body --silent --show-error --max-time 20 http://127.0.0.1:8765/healthz" \
            > "$TASK_ROOT/local-healthz.json"
          "${SSH[@]}" "$VPS2_USER@$VPS2_HOST" \
            "curl --fail-with-body --silent --show-error --max-time 20 http://127.0.0.1:8765/api/meta" \
            > "$TASK_ROOT/local-meta.json"
          jq -e --arg revision "$EXPECTED_TARGET_REVISION" --arg sha "$EXPECTED_TARGET_CONTENT_SHA256" '
            (.status == "ok") and ((.counts.videos // 0) > 0) and ((.counts.occurrences // 0) > 0)
          ' "$TASK_ROOT/local-healthz.json" >/dev/null
          jq -e --arg revision "$EXPECTED_TARGET_REVISION" --arg sha "$EXPECTED_TARGET_CONTENT_SHA256" '
            (.meta.active_revision_id == $revision) and
            (.meta.migration_status == "active") and
            (.meta.content_sha256 == $sha)
          ' "$TASK_ROOT/local-meta.json" >/dev/null || {
            echo "PG_ROLLBACK_BLOCKED local-meta-gate revision=$EXPECTED_TARGET_REVISION"; exit 78;
          }
          public_health_http="$(curl --fail-with-body --silent --show-error --location --retry 2 --retry-all-errors \
            --connect-timeout 8 --max-time 20 -o "$TASK_ROOT/public-healthz.json" -w '%{http_code}' \
            https://ytb-song-rank.culua.com/healthz)"
          public_meta_http="$(curl --fail-with-body --silent --show-error --location --retry 2 --retry-all-errors \
            --connect-timeout 8 --max-time 20 -o "$TASK_ROOT/public-meta.json" -w '%{http_code}' \
            https://ytb-song-rank.culua.com/api/meta)"
          public_rankings_http="$(curl --fail-with-body --silent --show-error --location --retry 2 --retry-all-errors \
            --connect-timeout 8 --max-time 20 -o "$TASK_ROOT/public-rankings-7d.json" -w '%{http_code}' \
            "https://ytb-song-rank.culua.com/api/rankings?range=7d&view=songs&metric=occurrences&q=%40urameshi_conta&page=1&pageSize=1")"
          public_source_http="$(curl --fail-with-body --silent --show-error --location --retry 2 --retry-all-errors \
            --connect-timeout 8 --max-time 20 -o "$TASK_ROOT/public-source.json" -w '%{http_code}' \
            "https://ytb-song-rank.culua.com/api/sources/$EXPECTED_SOURCE_PATH?page=1&pageSize=1")"
          test "$public_health_http" = 200
          test "$public_meta_http" = 200
          test "$public_rankings_http" = 200
          test "$public_source_http" = 200
          jq -e '
            (.status == "ok") and ((.counts.videos // 0) > 0) and ((.counts.occurrences // 0) > 0)
          ' "$TASK_ROOT/public-healthz.json" >/dev/null
          jq -e --arg revision "$EXPECTED_TARGET_REVISION" --arg sha "$EXPECTED_TARGET_CONTENT_SHA256" '
            (.meta.active_revision_id == $revision) and
            (.meta.migration_status == "active") and
            (.meta.content_sha256 == $sha)
          ' "$TASK_ROOT/public-meta.json" >/dev/null || {
            echo "PG_ROLLBACK_BLOCKED public-meta-gate revision=$EXPECTED_TARGET_REVISION"; exit 78;
          }
          jq -e '
            (.rangeId == "7d") and
            (.view == "songs") and
            (.metric == "occurrences") and
            (.totalCount == 0) and
            ((.records | length) == 0)
          ' "$TASK_ROOT/public-rankings-7d.json" >/dev/null || {
            echo "PG_ROLLBACK_BLOCKED unexpected-urameshi-7d-ranking"; exit 78;
          }
          jq -e \
            --arg source_key "$EXPECTED_SOURCE_DETAIL_KEY" \
            --arg channel_id "$EXPECTED_SOURCE_CHANNEL_ID" \
            --arg channel_handle "$EXPECTED_SOURCE_CHANNEL_HANDLE" '
            def normalize_handle:
              if type == "string" then ltrimstr("/") else "" end;
            (.found == true) and
            (.sourceKey == $source_key) and
            (.record.sourceDetailKey == $source_key) and
            (.record.channelId == $channel_id) and
            ((.record.channelHandle | normalize_handle) == ($channel_handle | normalize_handle))
          ' "$TASK_ROOT/public-source.json" >/dev/null || {
            echo "PG_ROLLBACK_BLOCKED urameshi-source-identity-mismatch"; exit 78;
          }
          printf 'baselineFreeBytes=%s\nremoteFreeBeforeBytes=%s\nexpectedCurrentRevision=%s\nexpectedTargetRevision=%s\nexpectedTargetContentSha256=%s\n' \
            "$baseline_free_bytes" "$remote_free_before" "$EXPECTED_CURRENT_REVISION" "$EXPECTED_TARGET_REVISION" "$EXPECTED_TARGET_CONTENT_SHA256" \
            > "$TASK_ROOT/storage.txt"
          echo "PG_ROLLBACK_PUBLIC_OK active=$EXPECTED_TARGET_REVISION healthHttp=$public_health_http metaHttp=$public_meta_http rankingsHttp=$public_rankings_http sourceHttp=$public_source_http urameshi7dTotalCount=0 sourceKey=$EXPECTED_SOURCE_DETAIL_KEY channelId=$EXPECTED_SOURCE_CHANNEL_ID"
          echo PG_ROLLBACK_STORAGE_BEGIN
          cat "$TASK_ROOT/storage.txt"
          echo PG_ROLLBACK_STORAGE_END
          trap - EXIT INT TERM
          cleanup

  candidate:
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.rollback_only != true) && (github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_call' || vars.DAILY_SONG_PG_INCREMENTAL_ENABLED == '1') }}
    runs-on: [self-hosted, macOS, ARM64, daily-song-list-mac]
    timeout-minutes: 45
    env:
      VPS2_HOST: "192.255.151.75"
      VPS2_USER: "root"
      REMOTE_STATE_DIR: "/var/lib/culua/ytb-song-rank"
      PATCH_PATH: ${{ inputs.patch_path || github.event.client_payload.patch_path || 'artifacts/migration/candidate.ndjson' }}
      MANIFEST_PATH: ${{ inputs.manifest_path || github.event.client_payload.manifest_path || 'artifacts/migration/manifest.json' }}
      ACTIVATE: ${{ inputs.activate || github.event.client_payload.activate || (github.event_name == 'workflow_run') || false }}
      REQUIRE_7D_GATE: ${{ inputs.require_7d_gate || github.event.client_payload.require_7d_gate || false }}
      SOURCE_KEY: ${{ inputs.source_key || github.event.client_payload.source_key || '' }}
      ARTIFACT_NAME: ${{ inputs.artifact_name || '' }}
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id || '' }}
    steps:
      - name: Download generated accepted increment
        if: ${{ inputs.artifact_name != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/daily-song-list-pg-artifact
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
      - name: Candidate compare health and optional activation
        env:
          VPS2_PASSWORD: ${{ secrets.VPS2_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_ROOT: ${{ runner.temp }}/daily-song-list-pg-artifact
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        run: |
          set -Eeuo pipefail
          test -n "$VPS2_PASSWORD" || { echo "PG_INCREMENT_BLOCKED missing VPS2_PASSWORD"; exit 78; }
          for release_wait_attempt in $(seq 1 20); do
            active_releases="$(
              for release_status in in_progress queued; do
                curl --fail --silent --show-error --location --retry 2 --connect-timeout 5 --max-time 30 \
                  -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?status=${release_status}&per_page=100"
              done | jq -sr --argjson current_run "$GITHUB_RUN_ID" '
                [.[].workflow_runs[] |
                  select(.id != $current_run) |
                  select(.name | test("PostgreSQL|PG|7D"; "i")) |
                  {id,name,status,head_sha}
                ] | unique_by(.id)
              '
            )"
            if [ "$(jq -r 'length' <<<"$active_releases")" -eq 0 ]; then
              break
            fi
            echo "PG_INCREMENT_WAIT concurrent-release attempt=$release_wait_attempt runs=$(jq -c . <<<"$active_releases")"
            if [ "$release_wait_attempt" -eq 20 ]; then
              echo "PG_INCREMENT_BLOCKED concurrent-release-timeout runs=$(jq -c . <<<"$active_releases")"
              exit 78
            fi
            sleep 30
          done
          TASK_ROOT="$(mktemp -d "${RUNNER_TEMP}/daily-song-list-pg-increment.XXXXXX")"
          INPUT_ROOT="$TASK_ROOT/inputs"
          mkdir -p "$INPUT_ROOT"
          bootstrap_cleanup() {
            status=$?
            rm -rf -- "$TASK_ROOT"
            exit "$status"
          }
          trap bootstrap_cleanup EXIT INT TERM
          RAW_BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}"
          fetch_input() {
            source_path="$1"
            destination="$2"
            case "$source_path" in
              /*|*..*) echo "PG_INCREMENT_BLOCKED invalid input path=$source_path"; exit 78 ;;
            esac
            curl --fail --location --retry 2 --retry-all-errors --connect-timeout 5 --max-time 60 \
              "$RAW_BASE/$source_path" -o "$destination"
            test -s "$destination" || { echo "PG_INCREMENT_BLOCKED empty input=$source_path"; exit 78; }
          }
          fetch_input "scripts/migration/accepted-source-identities.py" "$INPUT_ROOT/accepted-source-identities.py"
          if [ -n "$ARTIFACT_NAME" ]; then
            PATCH_INPUT="$ARTIFACT_ROOT/$PATCH_PATH"
            MANIFEST_INPUT="$ARTIFACT_ROOT/$MANIFEST_PATH"
            test -f "$PATCH_INPUT" || { echo "PG_INCREMENT_BLOCKED missing artifact patch=$PATCH_PATH"; exit 78; }
            test -f "$MANIFEST_INPUT" || { echo "PG_INCREMENT_BLOCKED missing artifact manifest=$MANIFEST_PATH"; exit 78; }
          elif [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            SOURCE_SHA="$WORKFLOW_RUN_HEAD_SHA"
            SOURCE_BASE_SHA="$(curl --fail --location --retry 2 --connect-timeout 5 --max-time 30 \
              -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${SOURCE_SHA}" | jq -er '.parents[0].sha')"
            SOURCE_COMMITTED_AT="$(curl --fail --location --retry 2 --connect-timeout 5 --max-time 30 \
              -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${SOURCE_SHA}" | jq -er '.commit.committer.date')"
            COMPARE_JSON="$TASK_ROOT/compare.json"
            curl --fail --location --retry 2 --connect-timeout 5 --max-time 60 \
              -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/compare/${SOURCE_BASE_SHA}...${SOURCE_SHA}" -o "$COMPARE_JSON"
            test "$(jq -er '.files | length' "$COMPARE_JSON")" -lt 300 || {
              echo "PG_INCREMENT_BLOCKED compare-api-file-limit sourceSha=$SOURCE_SHA"; exit 78;
            }
            ACCEPTED_PATHS=()
            while IFS= read -r accepted_path; do
              [ -n "$accepted_path" ] && ACCEPTED_PATHS+=("$accepted_path")
            done < <(jq -r '[
              .files[]?.filename |
              select(startswith("data/external/youtube-channel-discovery/accepted/") and endswith(".json"))
            ] | sort[]' "$COMPARE_JSON" || true)
            if [ "${#ACCEPTED_PATHS[@]}" -eq 0 ]; then
              runtime_changes="$(jq -er -r '.files[]?.filename | select(test("^data/(latest|7d|all|72h|1m|status)\\.json$"))' "$COMPARE_JSON" || true)"
              if [ -n "$runtime_changes" ]; then
                echo "PG_INCREMENT_BLOCKED core-data-changed-without-accepted-increment sourceSha=$SOURCE_SHA paths=$(printf '%s,' $runtime_changes)"
                exit 78
              fi
              echo "PG_INCREMENT_NOOP sourceSha=$SOURCE_SHA reason=no-accepted-increment"
              exit 0
            fi
            fetch_input "scripts/migration/accepted-files-to-patch.py" "$INPUT_ROOT/accepted-files-to-patch.py"
            DATA_RAW_BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SOURCE_SHA}"
            ACCEPTED_ARGS=()
            ACCEPTED_INPUTS=()
            ACCEPTED_ROOT="$TASK_ROOT/repository"
            mkdir -p "$ACCEPTED_ROOT"
            for source_path in "${ACCEPTED_PATHS[@]}"; do
              destination="$ACCEPTED_ROOT/$source_path"
              mkdir -p "$(dirname "$destination")"
              curl --fail --location --retry 2 --retry-all-errors --connect-timeout 5 --max-time 60 \
                "$DATA_RAW_BASE/$source_path" -o "$destination"
              test -s "$destination" || { echo "PG_INCREMENT_BLOCKED empty accepted input=$source_path"; exit 78; }
              jq -e '
                (.kind == "youtube-channel-discovery-increment") and
                (.schemaVersion == 1) and
                (.videos | type == "array" and length > 0) and
                (.videoCount == (.videos | length)) and
                (.occurrenceCount == ([.videos[].songs[]?] | length)) and
                all(.videos[];
                  (.videoId | type == "string" and length > 0) and
                  (.songs | type == "array" and length > 0) and
                  ((.channelId // .channelHandle // "") | type == "string" and length > 0)
                )
              ' "$destination" >/dev/null || {
                echo "PG_INCREMENT_BLOCKED accepted-contract input=$source_path"; exit 78;
              }
              ACCEPTED_ARGS+=(--input "$destination")
              ACCEPTED_INPUTS+=("$destination")
            done
            jq -s -e '
              [.[].videos[].videoId] as $video_ids |
              ($video_ids | length > 0) and (($video_ids | unique | length) == ($video_ids | length))
            ' "${ACCEPTED_INPUTS[@]}" >/dev/null || {
              echo "PG_INCREMENT_BLOCKED duplicate-video-across-accepted-files"; exit 78;
            }
            GENERATED_SOURCE_KEY="$(jq -sr '
              [.[].videos[] | (.channelId // .channelHandle // empty) | select(type == "string" and length > 0)] |
              sort | first // ""
            ' "${ACCEPTED_INPUTS[@]}")"
            test -n "$GENERATED_SOURCE_KEY" || { echo "PG_INCREMENT_BLOCKED missing-source-detail-key"; exit 78; }
            python3 "$INPUT_ROOT/accepted-files-to-patch.py" "${ACCEPTED_ARGS[@]}" \
              --output "$INPUT_ROOT/patch" --manifest-output "$INPUT_ROOT/manifest" --range-id all \
              --source-key "$GENERATED_SOURCE_KEY" --source-root "$ACCEPTED_ROOT" \
              --reviewed-at "$SOURCE_COMMITTED_AT"
            GENERATED_PATCH_SHA256="$(shasum -a 256 "$INPUT_ROOT/patch" | awk '{print $1}')"
            python3 "$INPUT_ROOT/accepted-source-identities.py" \
              --patch "$INPUT_ROOT/patch" \
              --output "$INPUT_ROOT/source-identities.json" || {
              echo "PG_INCREMENT_BLOCKED workflow-run-source-identities-invalid"; exit 78;
            }
            test "$(jq -er '.identityEvidence.sourceDetailKey' "$INPUT_ROOT/source-identities.json")" = "$GENERATED_SOURCE_KEY" || {
              echo "PG_INCREMENT_BLOCKED workflow-run-first-source-key-mismatch"; exit 78;
            }
            jq '
              [.files[]? |
                select(.filename | startswith("data/external/youtube-channel-discovery/accepted/")) |
                select(.filename | endswith(".json")) |
                {path:.filename,blobSha:.sha,status:.status}
              ] | sort_by(.path)
            ' "$COMPARE_JSON" > "$INPUT_ROOT/accepted-files.json"
            GENERATED_ACCEPTED_FILES_SHA256="$(jq -cS . "$INPUT_ROOT/accepted-files.json" | shasum -a 256 | awk '{print $1}')"
            jq \
              --arg source_commit_sha "$SOURCE_SHA" \
              --arg source_base_sha "$SOURCE_BASE_SHA" \
              --arg source_committed_at "$SOURCE_COMMITTED_AT" \
              --arg patch_sha256 "$GENERATED_PATCH_SHA256" \
              --arg accepted_files_sha256 "$GENERATED_ACCEPTED_FILES_SHA256" \
              --slurpfile accepted_files "$INPUT_ROOT/accepted-files.json" \
              --slurpfile source_identities "$INPUT_ROOT/source-identities.json" \
              '. + $source_identities[0] + {
                status:"ready",
                handoffKind:"github-accepted-paths",
                source_commit_sha:$source_commit_sha,
                source_base_sha:$source_base_sha,
                source_committed_at:$source_committed_at,
                patch_sha256:$patch_sha256,
                accepted_files_sha256:$accepted_files_sha256,
                inputFiles:[$accepted_files[0][].path],
                acceptedFiles:$accepted_files[0]
              }' "$INPUT_ROOT/manifest" > "$INPUT_ROOT/manifest.next"
            mv "$INPUT_ROOT/manifest.next" "$INPUT_ROOT/manifest"
            PATCH_PATH="workflow-run-generated"
            MANIFEST_PATH="workflow-run-generated"
          fi
          fetch_input "scripts/migration/pg-schema.sql" "$INPUT_ROOT/pg-schema.sql"
          fetch_input "scripts/migration/import-pg-incremental.py" "$INPUT_ROOT/import-pg-incremental.py"
          fetch_input "scripts/migration/activate-pg-candidate.py" "$INPUT_ROOT/activate-pg-candidate.py"
          fetch_input "server/pg_adapter.py" "$INPUT_ROOT/pg_adapter.py"
          fetch_input "server/pg_api_server.py" "$INPUT_ROOT/pg_api_server.py"
          fetch_input "deploy/vps2/song-rank-pg-api.service" "$INPUT_ROOT/song-rank-pg-api.service"
          if [ -z "$ARTIFACT_NAME" ] && [ "$GITHUB_EVENT_NAME" != "workflow_run" ]; then
            fetch_input "$PATCH_PATH" "$INPUT_ROOT/patch"
            fetch_input "$MANIFEST_PATH" "$INPUT_ROOT/manifest"
            PATCH_INPUT="$INPUT_ROOT/patch"
            MANIFEST_INPUT="$INPUT_ROOT/manifest"
          fi
          printf 'TASK_ROOT=%s\nPG_INPUT_ROOT=%s\n' "$TASK_ROOT" "$INPUT_ROOT" >> "$GITHUB_ENV"
          test -f "$PATCH_INPUT" || { echo "PG_INCREMENT_BLOCKED missing patch=$PATCH_PATH"; exit 78; }
          test -f "$MANIFEST_INPUT" || { echo "PG_INCREMENT_BLOCKED missing manifest=$MANIFEST_PATH"; exit 78; }
          if jq -e '.kind == "accepted-increment"' "$MANIFEST_INPUT" >/dev/null; then
            jq -e '
              ((.acceptedVideoCount // 0) > 0) and
              ((.acceptedOccurrenceCount // 0) > 0)
            ' "$MANIFEST_INPUT" >/dev/null || {
              echo "PG_INCREMENT_BLOCKED empty-accepted-increment"; exit 78;
            }
          fi
          if jq -e '.handoffKind == "github-accepted-paths"' "$MANIFEST_INPUT" >/dev/null; then
            jq -e '
              (.status == "ready") and
              (.source_commit_sha | test("^[0-9a-fA-F]{40}$")) and
              (.source_base_sha | test("^[0-9a-fA-F]{40}$")) and
              (.patch_sha256 | test("^[0-9a-f]{64}$")) and
              (.accepted_files_sha256 | test("^[0-9a-f]{64}$")) and
              (.acceptedFiles | type == "array" and length > 0) and
              (.sourceIdentityCount | type == "number" and . > 0) and
              (.sourceIdentityEvidence | type == "array" and length == .sourceIdentityCount) and
              ([.sourceIdentityEvidence[].sourceDetailKey] | length == (unique | length)) and
              (all(.sourceIdentityEvidence[];
                (.acceptedVideoCount | type == "number" and . > 0) and
                (.acceptedOccurrenceCount | type == "number" and . > 0) and
                (.acceptedSongGroupCount | type == "number" and . > 0)
              )) and
              ([.sourceIdentityEvidence[].acceptedVideoCount] | add == .acceptedVideoCount) and
              ([.sourceIdentityEvidence[].acceptedOccurrenceCount] | add == .acceptedOccurrenceCount) and
              (.identityEvidence == .sourceIdentityEvidence[0])
            ' "$MANIFEST_INPUT" >/dev/null || {
              echo "PG_INCREMENT_BLOCKED github-accepted-manifest-not-ready"; exit 78;
            }
          fi
          if jq -e '.kind == "curation-accepted-increment"' "$MANIFEST_INPUT" >/dev/null; then
            jq -e '
              (.status == "ready") and
              (.curationArtifactIncluded == true) and
              (.statusAuditIncluded == true) and
              ((.curationMutationCount // 0) > 0) and
              ((.reviewAudit.unmatched // 0) == 0) and
              ((.reviewAudit.ambiguous // 0) == 0) and
              ((.reviewAudit.invalid // 0) == 0)
            ' "$MANIFEST_INPUT" >/dev/null || {
              echo "PG_INCREMENT_BLOCKED curation-manifest-not-ready"; exit 78;
            }
            test -s "$PATCH_INPUT" || { echo "PG_INCREMENT_BLOCKED empty-curation-patch"; exit 78; }
            echo "PG_INCREMENT_CURATION_GATE_OK mutations=$(jq -r '.curationMutationCount' "$MANIFEST_INPUT")"
          fi
          if [ "$REQUIRE_7D_GATE" = "true" ]; then
            jq -e --arg source_key "$SOURCE_KEY" '
              ((.rangeId == "7d" or .range == "7d") and
               .sourceReachedEnd == true and
               .mediaDownloaded == false and
               (.statusAuditIncluded == true) and
               ((.acceptedVideoCount // 0) > 0) and
               ((.acceptedOccurrenceCount // 0) > 0) and
               (($source_key == "") or (.sourceKey == $source_key)))
            ' "$MANIFEST_INPUT" >/dev/null || {
              echo "PG_INCREMENT_BLOCKED 7d-manifest-gate sourceKey=$SOURCE_KEY"; exit 78;
            }
            echo "PG_INCREMENT_7D_GATE_OK sourceKey=$SOURCE_KEY manifest=$MANIFEST_PATH"
          fi
          baseline_free_bytes=$(( $(df -k /Users/be | awk 'NR==2 {print $4}') * 1024 ))
          patch_bytes="$(stat -f%z "$PATCH_INPUT")"
          manifest_bytes="$(stat -f%z "$MANIFEST_INPUT")"
          test "$patch_bytes" -gt 0 || { echo "PG_INCREMENT_BLOCKED empty-patch"; exit 78; }
          expected_patch_sha="$(jq -er '.patch_sha256 // empty' "$MANIFEST_INPUT" || true)"
          if [ -n "$expected_patch_sha" ]; then
            actual_patch_sha="$(shasum -a 256 "$PATCH_INPUT" | awk '{print $1}')"
            test "$actual_patch_sha" = "$expected_patch_sha" || {
              echo "PG_INCREMENT_BLOCKED patch-sha256-mismatch expected=$expected_patch_sha actual=$actual_patch_sha"; exit 78;
            }
          fi
          expected_peak_bytes=$((512 * 1024 * 1024))
          hard_cap_bytes=$((2 * 1024 * 1024 * 1024))
          printf 'baselineFreeBytes=%s\npatchBytes=%s\nmanifestBytes=%s\nexpectedPeakBytes=%s\nhardCapBytes=%s\n' "$baseline_free_bytes" "$patch_bytes" "$manifest_bytes" "$expected_peak_bytes" "$hard_cap_bytes" > "$TASK_ROOT/storage.txt"
          test "$patch_bytes" -lt "$hard_cap_bytes"
          SOURCE_IDENTITIES_JSON=""
          if jq -e '.kind == "accepted-increment"' "$MANIFEST_INPUT" >/dev/null; then
            SOURCE_IDENTITIES_JSON="$TASK_ROOT/verified-source-identities.json"
            source_identity_args=(
              --patch "$PATCH_INPUT"
              --output "$SOURCE_IDENTITIES_JSON"
            )
            if jq -e '.handoffKind == "github-accepted-paths"' "$MANIFEST_INPUT" >/dev/null; then
              source_identity_args+=(--verify-manifest "$MANIFEST_INPUT")
            fi
            python3 "$INPUT_ROOT/accepted-source-identities.py" "${source_identity_args[@]}" || {
              echo "PG_INCREMENT_BLOCKED accepted-source-identities-mismatch"; exit 78;
            }
            echo "PG_INCREMENT_SOURCE_MANIFEST_OK probes=$(jq -r '.sourceIdentityCount' "$SOURCE_IDENTITIES_JSON")"
          fi
          mkdir -p "$RUNNER_TEMP/ssh-askpass"
          printf '%s\n' "$VPS2_PASSWORD" > "$RUNNER_TEMP/ssh-askpass/vps2.password"
          chmod 600 "$RUNNER_TEMP/ssh-askpass/vps2.password"
          cat > "$RUNNER_TEMP/ssh-askpass/vps2-askpass.sh" <<'SH'
          #!/bin/sh
          exec cat "$RUNNER_TEMP/ssh-askpass/vps2.password"
          SH
          chmod 700 "$RUNNER_TEMP/ssh-askpass/vps2-askpass.sh"
          export SSH_ASKPASS="$RUNNER_TEMP/ssh-askpass/vps2-askpass.sh" SSH_ASKPASS_REQUIRE=force DISPLAY=codex:0
          SSH=(ssh -o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no)
          SCP=(scp -o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no)
          REVISION="accepted_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          printf 'revision=%s\n' "$REVISION" >> "$TASK_ROOT/storage.txt"
          activated=0
          noop=0
          previous_active=""
          remote_backup_dir=""
          remote_free_after=unknown
          cleanup() {
            status=$?
            set +e
            if [ -n "${CANDIDATE_PID:-}" ]; then "${SSH[@]}" "$VPS2_USER@$VPS2_HOST" "kill $CANDIDATE_PID 2>/dev/null || true" || true; fi
            if [ "$status" -ne 0 ] && [ "$activated" = 1 ] && [ -n "$previous_active" ]; then
              "${SSH[@]}" "$VPS2_USER@$VPS2_HOST" "sudo -u postgres psql -d song_rank -v ON_ERROR_STOP=1 -c \"begin; select pg_advisory_xact_lock(hashtext('daily-song-list/active')); do \\\$\\\$ declare current text; begin select state_value into current from migration_state where state_key='active_revision_id' for update; if current <> '$REVISION' then raise exception 'rollback guard failed current=% expected=$REVISION', current; end if; update migration_revisions set status='active',activated_at=current_timestamp where revision_id='$previous_active' and status='superseded'; update migration_revisions set status='superseded' where revision_id='$REVISION' and status='active'; update migration_state set state_value='$previous_active' where state_key='active_revision_id'; end; \\\$\\\$; commit;\"" || true
              if [ -n "$remote_backup_dir" ]; then
                "${SSH[@]}" "$VPS2_USER@$VPS2_HOST" "test ! -f '$remote_backup_dir/pg_adapter.py.bak' || cp -p '$remote_backup_dir/pg_adapter.py.bak' /opt/culua/ytb-song-rank/server/pg_adapter.py; test ! -f '$remote_backup_dir/pg_api_server.py.bak' || cp -p '$remote_backup_dir/pg_api_server.py.bak' /opt/culua/ytb-song-rank/server/pg_api_server.py; test ! -f '$remote_backup_dir/service.bak' || cp -p '$remote_backup_dir/service.bak' /etc/systemd/system/song-rank-pg-api.service; systemctl daemon-reload; systemctl restart song-rank-pg-api || true" || true
              fi
            elif [ "$status" -ne 0 ] && [ -n "${REVISION:-}" ]; then
              "${SSH[@]}" "$VPS2_USER@$VPS2_HOST" "sudo -u postgres psql -d song_rank -v ON_ERROR_STOP=1 -c \"delete from migration_revisions where revision_id='$REVISION' and status in ('draft','ready');\"" || true
            fi
            "${SSH[@]}" "$VPS2_USER@$VPS2_HOST" "rm -f /tmp/import-pg-incremental.py /tmp/pg-schema.sql /tmp/activate-pg-candidate.py /tmp/pg_adapter.py /tmp/pg_api_server.py /tmp/song-rank-pg-api.service /tmp/pg-increment-manifest.json /tmp/pg-increment-candidate.log; test -z '$remote_backup_dir' || rm -rf -- '$remote_backup_dir'" || true
            if remote_free_after="$("${SSH[@]}" "$VPS2_USER@$VPS2_HOST" "df -B1 --output=avail '$REMOTE_STATE_DIR' | tail -n1 | tr -d '[:space:]'")"; then :; else remote_free_after=unknown; fi
            before_cleanup_bytes=$(( $(du -sk "$TASK_ROOT" 2>/dev/null | awk '{print $1}') * 1024 ))
            cat "$TASK_ROOT/storage.txt" 2>/dev/null || true
            rm -rf -- "$TASK_ROOT"
            rm -rf -- "$RUNNER_TEMP/ssh-askpass"
            after_free_bytes=$(( $(df -k /Users/be | awk 'NR==2 {print $4}') * 1024 ))
            retained=old-active
            if [ "$noop" = 1 ]; then retained=no-change; elif [ "$status" -eq 0 ] && [ "$activated" = 1 ]; then retained=active-only; elif [ "$status" -eq 0 ]; then retained=ready-candidate; fi
            echo "PG_INCREMENT_CLEANUP status=$status activated=$activated beforeBytes=$before_cleanup_bytes afterBytes=0 baselineFreeBytes=$baseline_free_bytes afterFreeBytes=$after_free_bytes remoteFreeAfterBytes=$remote_free_after retained=$retained"
            exit "$status"
          }
          trap cleanup EXIT INT TERM
          active_revision_before="$("${SSH[@]}" "$VPS2_USER@$VPS2_HOST" \
            "sudo -u www-data psql -d song_rank -At -c \"select state_value from migration_state where state_key='active_revision_id'\"")"
          test -n "$active_revision_before" || {
            echo "PG_INCREMENT_BLOCKED active-revision-before-missing"; exit 78;
          }
          if jq -e '.kind == "curation-accepted-increment"' "$MANIFEST_INPUT" >/dev/null; then
            curation_snapshot_revision="$(jq -er '.activeSnapshotRevisionId | select(type == "string" and length > 0)' "$MANIFEST_INPUT" || true)"
            test "$curation_snapshot_revision" = "$active_revision_before" || {
              echo "PG_INCREMENT_BLOCKED curation-active-snapshot-mismatch manifest=${curation_snapshot_revision:-missing} active=$active_revision_before"
              exit 78
            }
          fi
          manifest_source_commit="$(jq -er '.source_commit_sha // empty' "$MANIFEST_INPUT" || true)"
          if [ -n "$manifest_source_commit" ]; then
            [[ "$manifest_source_commit" =~ ^[0-9a-fA-F]{40}$ ]] || {
              echo "PG_INCREMENT_BLOCKED invalid-manifest-source-commit"; exit 78;
            }
            existing_source_revision="$("${SSH[@]}" "$VPS2_USER@$VPS2_HOST" "sudo -u www-data psql -d song_rank -At -F '|' -c \"select revision_id,status from migration_revisions where manifest_json->>'source_commit_sha'='$manifest_source_commit' order by created_at desc limit 1\"")"
            case "$existing_source_revision" in
              *"|active"|*"|superseded")
                noop=1
                echo "PG_INCREMENT_NOOP sourceSha=$manifest_source_commit existing=$existing_source_revision"
                cleanup
                ;;
              *"|ready")
                echo "PG_INCREMENT_BLOCKED existing-ready-source sourceSha=$manifest_source_commit revision=$existing_source_revision"
                exit 78
                ;;
            esac
          fi
          "${SCP[@]}" "$INPUT_ROOT/pg-schema.sql" "$INPUT_ROOT/import-pg-incremental.py" "$INPUT_ROOT/activate-pg-candidate.py" "$INPUT_ROOT/pg_adapter.py" "$INPUT_ROOT/pg_api_server.py" "$INPUT_ROOT/song-rank-pg-api.service" "$VPS2_USER@$VPS2_HOST:/tmp/"
          "${SCP[@]}" "$MANIFEST_INPUT" "$VPS2_USER@$VPS2_HOST:/tmp/pg-increment-manifest.json"
          remote_free="$("${SSH[@]}" "$VPS2_USER@$VPS2_HOST" "df -B1 --output=avail '$REMOTE_STATE_DIR' | tail -n1 | tr -d '[:space:]'")"
          printf 'remoteFreeBefore=%s\n' "$remote_free" >> "$TASK_ROOT/storage.txt"
          test "$remote_free" -ge "$patch_bytes"
          "${SSH[@]}" "$VPS2_USER@$VPS2_HOST" "sudo -u postgres psql -d song_rank -v ON_ERROR_STOP=1 -f /tmp/pg-schema.sql; sudo -u postgres psql -d song_rank -v ON_ERROR_STOP=1 -c 'GRANT USAGE ON SCHEMA public TO \"www-data\"; GRANT SELECT,INSERT,UPDATE,DELETE ON ALL TABLES IN SCHEMA public TO \"www-data\";'"
          if [[ "$PATCH_PATH" == *.gz ]]; then
            gzip -dc "$PATCH_INPUT"
          else
            cat "$PATCH_INPUT"
          fi | "${SSH[@]}" "$VPS2_USER@$VPS2_HOST" "sudo -u www-data python3 /tmp/import-pg-incremental.py --revision=$REVISION --manifest-file=/tmp/pg-increment-manifest.json" | tee "$TASK_ROOT/import-result.json"
          candidate_sha="$(jq -er '.contentSha256 | select(type == "string" and test("^[0-9a-f]{64}$"))' "$TASK_ROOT/import-result.json")"
          test -n "$candidate_sha"
          previous_active="$(jq -er '.parentRevisionId | select(type == "string" and length > 0)' "$TASK_ROOT/import-result.json")"
          test "$previous_active" = "$active_revision_before" || {
            echo "PG_INCREMENT_BLOCKED candidate-parent-changed expected=$active_revision_before actual=$previous_active"; exit 78;
          }
          if jq -e '.kind == "accepted-increment"' "$MANIFEST_INPUT" >/dev/null; then
            expected_videos="$(jq -er '.acceptedVideoCount' "$MANIFEST_INPUT")"
            expected_occurrences="$(jq -er '.acceptedOccurrenceCount' "$MANIFEST_INPUT")"
            actual_videos="$(jq -er '.videoCount' "$TASK_ROOT/import-result.json")"
            actual_occurrences="$(jq -er '.occurrenceCount' "$TASK_ROOT/import-result.json")"
            test "$actual_videos" -eq "$expected_videos" || {
              echo "PG_INCREMENT_BLOCKED video-count-mismatch expected=$expected_videos actual=$actual_videos"; exit 78;
            }
            test "$actual_occurrences" -eq "$expected_occurrences" || {
              echo "PG_INCREMENT_BLOCKED occurrence-count-mismatch expected=$expected_occurrences actual=$actual_occurrences"; exit 78;
            }
          fi
          "${SSH[@]}" "$VPS2_USER@$VPS2_HOST" "sudo -u www-data sh -c 'env PGHOST=/var/run/postgresql PGDATABASE=song_rank PGUSER=www-data DAILY_SONG_PG_CANDIDATE_REVISION=$REVISION PYTHONPATH=/tmp nohup python3 /tmp/pg_api_server.py --port 18766 >/tmp/pg-increment-candidate.log 2>&1 & echo \$!'" > "$TASK_ROOT/candidate-pid.txt"
          CANDIDATE_PID="$(cat "$TASK_ROOT/candidate-pid.txt" | tail -n1)"
          echo "candidatePid=$CANDIDATE_PID" >> "$TASK_ROOT/storage.txt"
          ready=0
          for n in $(seq 1 20); do
            if "${SSH[@]}" "$VPS2_USER@$VPS2_HOST" 'curl --fail-with-body --max-time 10 http://127.0.0.1:18766/healthz' > "$TASK_ROOT/candidate-healthz.json"; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then "${SSH[@]}" "$VPS2_USER@$VPS2_HOST" 'cat /tmp/pg-increment-candidate.log || true'; exit 1; fi
          "${SSH[@]}" "$VPS2_USER@$VPS2_HOST" 'curl --fail-with-body --max-time 30 http://127.0.0.1:18766/api/meta' > "$TASK_ROOT/candidate-meta.json"
          "${SSH[@]}" "$VPS2_USER@$VPS2_HOST" 'curl --fail-with-body --max-time 30 "http://127.0.0.1:18766/api/rankings?range=7d&view=songs&metric=occurrences&page=1&pageSize=1"' > "$TASK_ROOT/candidate-rankings-7d.json"
          "${SSH[@]}" "$VPS2_USER@$VPS2_HOST" 'curl --fail-with-body --max-time 30 "http://127.0.0.1:18766/api/rankings?range=all&view=songs&metric=occurrences&page=1&pageSize=1"' > "$TASK_ROOT/candidate-rankings.json"
          "${SSH[@]}" "$VPS2_USER@$VPS2_HOST" 'curl --fail-with-body --max-time 30 "http://127.0.0.1:18766/api/rankings?range=all&view=songs&metric=occurrences&q=Ring&page=1&pageSize=1"' > "$TASK_ROOT/candidate-search.json"
          jq -e --arg revision "$REVISION" '
            (.meta.active_revision_id == $revision) and
            (.meta.migration_status == "ready") and
            ((.counts.videos // 0) > 0) and
            ((.counts.occurrences // 0) > 0)
          ' "$TASK_ROOT/candidate-meta.json" >/dev/null || {
