              else
                echo "PG_INCREMENT_ROLLBACK_FAILED service" >&2
                remote_backup_action=retain
                echo "PG_INCREMENT_CLEANUP_FAILED backup-retained path=$remote_backup_dir reason=service-restore-failed" >&2
                cleanup_failed=1
              fi
            fi
            if [ "$status" -ne 0 ] && [ -n "$previous_active" ] && [ "$pointer_restored" = 0 ]; then
