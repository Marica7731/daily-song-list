              install -m 0644 /tmp/pg_api_server.py /opt/culua/ytb-song-rank/server/pg_api_server.py
              install -m 0644 /tmp/song-rank-pg-api.service /etc/systemd/system/song-rank-pg-api.service
              systemctl daemon-reload
              systemctl enable song-rank-pg-api
              systemctl restart song-rank-pg-api
              ready=0
              for n in \$(seq 1 30); do
                if curl -fsS http://127.0.0.1:8765/healthz >/dev/null; then ready=1; break; fi
                sleep 1
              done
              test \"\$ready\" = 1 || { echo PG_INCREMENT_BLOCKED activated-service-health-timeout >&2; exit 1; }
              curl --fail-with-body --max-time 20 http://127.0.0.1:8765/healthz
              curl --fail-with-body --max-time 20 http://127.0.0.1:8765/api/meta
              curl --fail-with-body --max-time 20 \"http://127.0.0.1:8765/api/rankings?range=all&view=songs&metric=occurrences&page=1&pageSize=1\"
              if [ -n \"$candidate_source_paths\" ]; then
                for source_path in $candidate_source_paths; do
                  curl --fail-with-body --max-time 20 \"http://127.0.0.1:8765/api/sources/\$source_path?page=1&pageSize=1\"
                done
              fi
              systemctl disable --now song-rank-api || true
              systemctl reload nginx
            " | tee -a "$TASK_ROOT/activation-result.txt"
            curl --fail-with-body --silent --show-error --connect-timeout 8 --max-time 20 \
              https://ytb-song-rank.culua.com/healthz -o "$TASK_ROOT/public-healthz.json"
            curl --fail-with-body --silent --show-error --connect-timeout 8 --max-time 20 \
              https://ytb-song-rank.culua.com/api/meta -o "$TASK_ROOT/public-meta.json"
            curl --fail-with-body --silent --show-error --connect-timeout 8 --max-time 20 \
              "https://ytb-song-rank.culua.com/api/rankings?range=all&view=songs&metric=occurrences&page=1&pageSize=1" \
              -o "$TASK_ROOT/public-rankings.json"
            jq -e --arg revision "$REVISION" '
              (.meta.active_revision_id == $revision) and
              (.meta.migration_status == "active") and
              ((.counts.videos // 0) > 0) and
              ((.counts.occurrences // 0) > 0)
            ' "$TASK_ROOT/public-meta.json" >/dev/null || {
              echo "PG_INCREMENT_BLOCKED public-meta-gate revision=$REVISION"; exit 78;
            }
            if [ "$ALIAS_SOURCE_GATE" = 1 ]; then
              python3 "$INPUT_ROOT/verify-alias-source-ledger.py" --manifest "$MANIFEST_INPUT" --phase public --ledger "$alias_ledger" || exit 78
            fi
            if [ -s "$source_identity_probes" ]; then
              probe_index=0
              while IFS= read -r probe_identity; do
                probe_index=$((probe_index + 1))
                candidate_source_key="$(jq -er '.sourceDetailKey' <<<"$probe_identity")"
                probe_video_id="$(jq -er '.videoId' <<<"$probe_identity")"
                probe_occurrence_id="$(jq -er '.occurrenceId' <<<"$probe_identity")"
                probe_channel_id="$(jq -er '.channelId' <<<"$probe_identity")"
                probe_channel_handle="$(jq -er '.channelHandle' <<<"$probe_identity")"
                probe_title_json="$(jq -c '.title' <<<"$probe_identity")"
                probe_artist_json="$(jq -c '.artist' <<<"$probe_identity")"
                probe_seconds_json="$(jq -c '.seconds' <<<"$probe_identity")"
                probe_accepted_occurrences="$(jq -er '.acceptedOccurrenceCount | select(type == "number" and . > 0)' <<<"$probe_identity")" || {
                  echo "PG_INCREMENT_BLOCKED source-rankings-occurrence-count-missing probe=$probe_index"; exit 78;
                }
                probe_accepted_song_groups="$(jq -er '.acceptedSongGroupCount | select(type == "number" and . > 0)' <<<"$probe_identity")" || {
                  echo "PG_INCREMENT_BLOCKED source-rankings-group-count-missing probe=$probe_index"; exit 78;
                }
                candidate_source_path="$(printf '%s' "$candidate_source_key" | jq -sRr @uri)"
                probe_video_path="$(printf '%s' "$probe_video_id" | jq -sRr @uri)"
                public_source_match=0
                public_source_metrics="$TASK_ROOT/public-source-$probe_index-metrics.jsonl"
                : > "$public_source_metrics"
                for source_page in $(seq 1 20); do
                  public_source_file="$TASK_ROOT/public-source-$probe_index-$source_page.json"
                  curl --fail-with-body --silent --show-error --connect-timeout 8 --max-time 20 \
                    "https://ytb-song-rank.culua.com/api/sources/$candidate_source_path?page=$source_page&pageSize=100&q=$probe_video_path" \
                    -o "$public_source_file"
                  source_metrics="$(source_detail_probe_metrics "$public_source_file")" || {
                    echo "PG_INCREMENT_BLOCKED public-source-metrics-invalid key=$candidate_source_key page=$source_page"; exit 78;
                  }
                  printf '%s\n' "$source_metrics" >> "$public_source_metrics"
                  if jq -e '
                    (.found == true) and
                    (.identityMatch == true) and
                    (.tupleMatchCount == 1)
                  ' <<<"$source_metrics" >/dev/null; then
                    public_source_match=1
                    break
                  fi
                  source_page_count="$(jq -er '.pageCount | select(type == "number" and . >= 1)' "$public_source_file")" || {
                    echo "PG_INCREMENT_BLOCKED public-source-pagination-invalid key=$candidate_source_key"; exit 78;
                  }
                  [ "$source_page" -lt "$source_page_count" ] || break
                done
                if [ "$public_source_match" != 1 ]; then
                  while IFS= read -r source_metrics; do
                    echo "PG_INCREMENT_PUBLIC_SOURCE_PAGE probe=$probe_index key=$candidate_source_key metrics=$source_metrics" >&2
                  done < "$public_source_metrics"
                  echo "PG_INCREMENT_BLOCKED public-source-identity-mismatch probe=$probe_index key=$candidate_source_key video=$probe_video_id occurrence=$probe_occurrence_id"; exit 78;
                fi
                verify_rankings_probe public "https://ytb-song-rank.culua.com"
              done < "$source_identity_probes"
              echo "PG_INCREMENT_PUBLIC_SOURCES_OK probes=$source_identity_probe_count"
            fi
            if [ -n "$manifest_source_commit" ]; then
              public_source_commit="$(jq -er '.meta.source_commit_sha // empty' "$TASK_ROOT/public-meta.json" || true)"
              test "$public_source_commit" = "$manifest_source_commit" || {
                echo "PG_INCREMENT_BLOCKED public-source-commit-mismatch expected=$manifest_source_commit actual=$public_source_commit"; exit 78;
              }
            fi
          fi
          echo PG_INCREMENT_STORAGE_BEGIN
          cat "$TASK_ROOT/storage.txt"
          echo PG_INCREMENT_STORAGE_END
          trap - EXIT INT TERM
          cleanup
