              for path in /tmp/import-pg-incremental.py /tmp/verify-7d-api-contract.py /tmp/pg-7d-baseline.json /tmp/pg-7d-expected.json /tmp/activate-pg-candidate.py /tmp/pg-increment-manifest.json; do test ! -e \"\$path\"; done
              echo PG_7D_REMOTE_CLEANUP_VERIFIED
            " > "$remote_cleanup_log" && grep -q '^PG_7D_REMOTE_CLEANUP_VERIFIED$' "$remote_cleanup_log"; then
              echo "PG_7D_REMOTE_CLEANUP_VERIFIED"
            else
              echo "PG_INCREMENT_CLEANUP_FAILED remote-files" >&2
              cleanup_failed=1
            fi
            remote_free_after="$("${SSH[@]}" "$VPS2_USER@$VPS2_HOST" "df -B1 --output=avail '$REMOTE_STATE_DIR' | tail -n1 | tr -d '[:space:]'")"
            remote_free_status=$?
            if [ "$remote_free_status" -ne 0 ] || ! [[ "$remote_free_after" =~ ^[0-9]+$ ]]; then
              remote_free_after=unknown
              echo "PG_INCREMENT_CLEANUP_FAILED remote-storage-evidence" >&2
              cleanup_failed=1
            fi
            before_cleanup_bytes=$(( $(du -sk "$TASK_ROOT" 2>/dev/null | awk '{print $1}') * 1024 ))
            if [ -f "$TASK_ROOT/storage.txt" ]; then cat "$TASK_ROOT/storage.txt"; fi
            rm -rf -- "$TASK_ROOT" || cleanup_failed=1
            rm -rf -- "$RUNNER_TEMP/ssh-askpass" || cleanup_failed=1
            after_free_bytes=$(( $(df -k /Users/be | awk 'NR==2 {print $4}') * 1024 ))
            retained=old-active
            if [ "$noop" = 1 ]; then retained=no-change; elif [ "$status" -eq 0 ] && [ "$activated" = 1 ]; then retained=active-only; elif [ "$status" -eq 0 ]; then retained=ready-candidate; fi
            if [ "$cleanup_failed" -ne 0 ]; then status=1; fi
            echo "PG_INCREMENT_CLEANUP status=$status cleanupFailed=$cleanup_failed activated=$activated pointerRestored=$pointer_restored serviceRestored=$service_restored remoteBackupAction=$remote_backup_action remoteBackupPath=${remote_backup_dir:-none} candidateResidue=$candidate_residue beforeBytes=$before_cleanup_bytes afterBytes=0 baselineFreeBytes=$baseline_free_bytes afterFreeBytes=$after_free_bytes remoteFreeAfterBytes=$remote_free_after retained=$retained"
            exit "$status"
          }
          trap cleanup EXIT INT TERM
          active_revision_before="$("${SSH[@]}" "$VPS2_USER@$VPS2_HOST" \
            "sudo -u www-data psql -d song_rank -At -c \"select state_value from migration_state where state_key='active_revision_id'\"")"
          test -n "$active_revision_before" || {
            echo "PG_INCREMENT_BLOCKED active-revision-before-missing"; exit 75;
          }
          echo "PG_ACTIVE_EVIDENCE_BUSINESS_VALIDATION_REMOVED"
          manifest_source_commit=""
          manifest_source_blob=""
          manifest_source_manifest_sha=""
          "${SCP[@]}" "$INPUT_ROOT/pg-schema.sql" "$INPUT_ROOT/import-pg-incremental.py" "$INPUT_ROOT/verify-7d-api-contract.py" "$INPUT_ROOT/legacy_vtuber_identity_reset.py" "$INPUT_ROOT/activate-pg-candidate.py" "$INPUT_ROOT/pg_adapter.py" "$INPUT_ROOT/pg_api_server.py" "$INPUT_ROOT/song-rank-pg-api.service" "$VPS2_USER@$VPS2_HOST:/tmp/"
          "${SCP[@]}" "$MANIFEST_INPUT" "$VPS2_USER@$VPS2_HOST:/tmp/pg-increment-manifest.json"
          echo "PG_BASELINE_API_VALIDATION_REMOVED"
          remote_free="$("${SSH[@]}" "$VPS2_USER@$VPS2_HOST" "df -B1 --output=avail '$REMOTE_STATE_DIR' | tail -n1 | tr -d '[:space:]'")"
          printf 'remoteFreeBefore=%s\n' "$remote_free" >> "$TASK_ROOT/storage.txt"
          test "$remote_free" -ge "$patch_bytes" || echo "PG_STORAGE_OBSERVATION remoteFree=$remote_free patchBytes=$patch_bytes"
          "${SSH[@]}" "$VPS2_USER@$VPS2_HOST" "sudo -u postgres psql -d song_rank -v ON_ERROR_STOP=1 -f /tmp/pg-schema.sql; sudo -u postgres psql -d song_rank -v ON_ERROR_STOP=1 -c 'GRANT USAGE ON SCHEMA public TO \"www-data\"; GRANT SELECT,INSERT,UPDATE,DELETE ON ALL TABLES IN SCHEMA public TO \"www-data\";'"
          if [[ "$PATCH_PATH" == *.gz ]]; then
            gzip -dc "$PATCH_INPUT"
          else
            cat "$PATCH_INPUT"
          fi | "${SSH[@]}" "$VPS2_USER@$VPS2_HOST" "sudo -u www-data python3 /tmp/import-pg-incremental.py --revision=$REVISION --manifest-file=/tmp/pg-increment-manifest.json" | tee "$TASK_ROOT/import-result.json"
          candidate_sha="$(jq -er '.contentSha256 | select(type == "string" and test("^[0-9a-f]{64}$"))' "$TASK_ROOT/import-result.json")"
          test -n "$candidate_sha"
          previous_active="$(jq -er '.parentRevisionId | select(type == "string" and length > 0)' "$TASK_ROOT/import-result.json")"
          test "$previous_active" = "$active_revision_before" || {
            echo "PG_INCREMENT_BLOCKED candidate-parent-changed expected=$active_revision_before actual=$previous_active"; exit 75;
          }
          echo "PG_CANDIDATE_BUSINESS_VALIDATION_REMOVED"
          candidate_source_paths=""
          source_identity_probes="$TASK_ROOT/source-identity-probes.jsonl"
          : > "$source_identity_probes"
          printf 'candidateContentSha256=%s\n' "$candidate_sha" > "$TASK_ROOT/candidate-gate.txt"
          if [ "$ACTIVATE" = true ]; then
            echo "PG_ACTIVATION_PATH_BEGIN revision=$REVISION parent=$previous_active"
            remote_backup_dir="/tmp/daily-song-list-pg-increment-backup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            "${SSH[@]}" "$VPS2_USER@$VPS2_HOST" "
              set -Eeuo pipefail
              install -d -m 0700 '$remote_backup_dir'
              backup_file() { source_path=\"\$1\"; key=\"\$2\"; if [ -f \"\$source_path\" ]; then cp -p \"\$source_path\" '$remote_backup_dir/'\"\$key\".bak; else : > '$remote_backup_dir/'\"\$key\".missing; fi; }
              backup_file /opt/culua/ytb-song-rank/pg_adapter.py root-pg-adapter
              backup_file /opt/culua/ytb-song-rank/pg_api_server.py root-pg-api-server
              backup_file /opt/culua/ytb-song-rank/server/pg_adapter.py server-pg-adapter
              backup_file /opt/culua/ytb-song-rank/server/pg_api_server.py server-pg-api-server
              backup_file /etc/systemd/system/song-rank-pg-api.service service
              echo PG_7D_BACKUP_COMPLETE
            " | tee "$TASK_ROOT/adapter-backup.log"
            grep -qx 'PG_7D_BACKUP_COMPLETE' "$TASK_ROOT/adapter-backup.log"
            adapter_installed=1
            "${SSH[@]}" "$VPS2_USER@$VPS2_HOST" "
              set -Eeuo pipefail
              install -m 0644 /tmp/pg_adapter.py /opt/culua/ytb-song-rank/pg_adapter.py
              install -m 0644 /tmp/pg_api_server.py /opt/culua/ytb-song-rank/pg_api_server.py
              install -d -m 0755 /opt/culua/ytb-song-rank/server
              install -m 0644 /tmp/pg_adapter.py /opt/culua/ytb-song-rank/server/pg_adapter.py
              install -m 0644 /tmp/pg_api_server.py /opt/culua/ytb-song-rank/server/pg_api_server.py
              install -m 0644 /tmp/song-rank-pg-api.service /etc/systemd/system/song-rank-pg-api.service
              systemctl daemon-reload
              systemctl enable song-rank-pg-api
              systemctl restart song-rank-pg-api
              ready=0
              for n in \$(seq 1 30); do
                if curl -fsS --max-time 10 http://127.0.0.1:8765/healthz >/dev/null; then ready=1; break; fi
                sleep 1
              done
              test \"\$ready\" = 1 || echo PG_ADAPTER_HEALTH_OBSERVATION unavailable >&2
              echo PG_7D_RANGE_ADAPTER_INSTALLED
            " | tee "$TASK_ROOT/adapter-install.log"
            grep -qx 'PG_7D_RANGE_ADAPTER_INSTALLED' "$TASK_ROOT/adapter-install.log"
            echo "PG_BUSINESS_VALIDATION_OBSERVATION_BEGIN phase=adapter"
            if jq -e '.handoffKind == "github-core-7d-authoritative-range"' "$MANIFEST_INPUT" >/dev/null; then
              if ! "${SSH[@]}" "$VPS2_USER@$VPS2_HOST" \
                "python3 /tmp/verify-7d-api-contract.py --phase adapter-old-active --base-url http://127.0.0.1:8765 --compatibility --revision '$previous_active' --status active --baseline /tmp/pg-7d-baseline.json --cache-token '${REVISION}-compatibility'" \
                | tee "$TASK_ROOT/adapter-compatibility.log"; then
                echo "PG_ADAPTER_COMPATIBILITY_OBSERVATION unavailable"
              fi
              grep -qx 'PG_7D_ADAPTER_COMPATIBILITY_OK' "$TASK_ROOT/adapter-compatibility.log" || echo "PG_ADAPTER_COMPATIBILITY_OBSERVATION marker-missing"
            else
              if ! "${SSH[@]}" "$VPS2_USER@$VPS2_HOST" \
                "curl --fail-with-body --max-time 20 http://127.0.0.1:8765/healthz" >/dev/null; then
                echo "PG_ADAPTER_HEALTH_OBSERVATION unavailable"
              fi
            fi
            echo "PG_BUSINESS_VALIDATION_OBSERVATION_END phase=adapter"
            still_previous="$("${SSH[@]}" "$VPS2_USER@$VPS2_HOST" "sudo -u www-data psql -d song_rank -At -c \"select state_value from migration_state where state_key='active_revision_id'\"")"
            test "$still_previous" = "$previous_active" || {
              echo "PG_INCREMENT_BLOCKED adapter-install-changed-active expected=$previous_active actual=$still_previous"; exit 75;
            }
            echo "PG_BUSINESS_VALIDATION_OBSERVATION_BEGIN phase=source"
            activation_source_args=""
            echo "PG_SOURCE_BLOB_VALIDATION_REMOVED"
            echo "PG_BUSINESS_VALIDATION_OBSERVATION_END phase=source"
            if ! activation_output="$("${SSH[@]}" "$VPS2_USER@$VPS2_HOST" "sudo -u www-data python3 /tmp/activate-pg-candidate.py --revision='$REVISION' --expected-active-revision='$active_revision_before' --expected-parent-revision='$previous_active' --expected-content-sha256='$candidate_sha' $activation_source_args")"; then
              printf '%s\n' "$activation_output" | tee "$TASK_ROOT/activation-result.txt"
              echo "PG_INCREMENT_BLOCKED activation failed" >&2
              exit 1
            fi
            printf '%s\n' "$activation_output" | tee "$TASK_ROOT/activation-result.txt"
            activated=1
            echo "PG_ONLINE_BUSINESS_VALIDATION_REMOVED"
            if ! curl --silent --show-error --location --connect-timeout 8 --max-time 20 \
              https://ytb-song-rank.culua.com/healthz -o "$TASK_ROOT/public-healthz.json"; then
              echo "PG_ONLINE_HEALTH_OBSERVATION unavailable"
            fi
          fi
          echo PG_INCREMENT_STORAGE_BEGIN
          cat "$TASK_ROOT/storage.txt"
          echo PG_INCREMENT_STORAGE_END
          trap - EXIT INT TERM
          cleanup
