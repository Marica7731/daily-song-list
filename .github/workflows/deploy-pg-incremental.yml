                  command = ["ssh", "-o", "BatchMode=no", "-o", "NumberOfPasswordPrompts=1", "-o", "ConnectTimeout=8", "-o", "ConnectionAttempts=2", "-o", "ServerAliveInterval=10", "-o", "ServerAliveCountMax=2", "-o", "StrictHostKeyChecking=no", remote, "curl --fail-with-body --max-time 30 " + shlex.quote(url)]
                  result = subprocess.run(command, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=False)
                  if result.returncode:
                      die("http phase=remote detail=" + result.stderr.strip())
                  raw = result.stdout
              else:
                  try:
                      with urllib.request.urlopen(url, timeout=30) as response:
                          if response.status != 200: die("http-status=" + str(response.status))
                          raw = response.read().decode("utf-8")
                  except Exception as exc:
                      die("http phase=public detail=" + str(exc))
              try:
                  return json.loads(raw)
              except json.JSONDecodeError as exc:
                  die("invalid-json detail=" + str(exc))

          def source_pages(base, key, remote, group=None):
              key_path = urllib.parse.quote(key, safe="")
              pages, page, page_count = [], 1, None
              while page_count is None or page <= page_count:
                  if page > MAX_PAGES: die("source-page-cap key=" + key)
                  payload = get_json(base + "/api/sources/" + key_path + "?page=" + str(page) + "&pageSize=100", remote)
                  if payload.get("found") is False:
                      if page != 1: die("source-found-flapped key=" + key)
                      return None, []
                  if payload.get("found") is not True or payload.get("sourceKey") != key:
                      die("source-identity key=" + key)
                  record = payload.get("record")
                  if not isinstance(record, dict) or record.get("sourceDetailKey") != key:
                      die("source-detail-key key=" + key)
                  if record.get("count") != payload.get("totalOccurrenceCount"):
                      die("source-record-count key=" + key)
                  if record.get("timestampCount") != payload.get("totalOccurrenceCount"):
                      die("source-timestamp-count key=" + key)
                  if group and group.get("_original") and (record.get("key") != group["originalGroupKey"] or record.get("title") != group["originalTitle"] or record.get("displayArtist") != group["originalArtist"]):
                      die("source-record-identity key=" + key)
                  if group and not group.get("_original") and (record.get("key") != group["replacementGroupKey"] or record.get("title") != group["replacementTitle"] or record.get("displayArtist") != group["replacementArtist"] or record.get("sourceDetailPath") != ""):
                      die("source-record-identity key=" + key)
                  candidate_pages = payload.get("pageCount")
                  if not isinstance(candidate_pages, int) or candidate_pages < 1 or candidate_pages > MAX_PAGES or payload.get("page") != page:
                      die("source-pagination key=" + key)
                  if page_count is None: page_count = candidate_pages
                  elif page_count != candidate_pages: die("source-page-count-flapped key=" + key)
                  pages.append(payload)
                  page += 1
              total = pages[0].get("totalOccurrenceCount")
              if not isinstance(total, int) or total < 0:
                  die("source-total key=" + key)
              if any(item.get("totalOccurrenceCount") != total for item in pages):
                  die("source-total-flapped key=" + key)
              occurrences = [item for payload in pages for item in payload["record"].get("occurrences", [])]
              if not all(isinstance(item, dict) for item in occurrences): die("source-occurrence-shape key=" + key)
              if len(occurrences) != total:
                  die("source-pagination-total key=" + key)
              if any("curationProvenance" in item or "curationAction" in item or isinstance(item.get("song"), dict) and ("curationProvenance" in item["song"] or "curationAction" in item["song"]) for item in occurrences):
                  die("curation-provenance key=" + key)
              return total, occurrences

          def song(item):
              return item.get("song") if isinstance(item.get("song"), dict) else item

          def exact_card(base, group, old, expected, remote):
              title = group["originalTitle"] if old else group["replacementTitle"]
              artist = group["originalArtist"] if old else group["replacementArtist"]
              source_key = group["originalSourceDetailKey"] if old else group["replacementSourceDetailKey"]
              query = urllib.parse.urlencode({"range": group["rangeId"], "view": "songs", "metric": "occurrences", "pageSize": 100, "q": title, "searchFields": "title"})
              page, page_count, cards = 1, None, []
              while page_count is None or page <= page_count:
                  payload = get_json(base + "/api/rankings?" + query + "&page=" + str(page), remote)
                  if payload.get("page") != page or not isinstance(payload.get("pageCount"), int) or payload["pageCount"] < 1 or payload["pageCount"] > MAX_PAGES:
                      die("rankings-pagination key=" + source_key)
                  page_count = payload["pageCount"] if page_count is None else page_count
                  if payload["pageCount"] != page_count: die("rankings-page-count-flapped key=" + source_key)
                  cards.extend(payload.get("records", [])); page += 1
