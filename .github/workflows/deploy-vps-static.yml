name: Deploy VPS static files

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Static deployment action"
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - restore-previous-index

permissions:
  contents: read

concurrency:
  group: daily-song-list-vps-static-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS2_HOST: "192.255.151.75"
      VPS2_USER: "root"
      REMOTE_PROJECT_DIR: "/opt/culua/ytb-song-rank"
      DEPLOY_ACTION: ${{ inputs.action || 'deploy' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github/workflows/deploy-vps-static.yml
            index.html
            assets
            data/status.json
            data/ui/meta.json
            data/diff
            scripts/compact-static-index.js
            .nojekyll
            CNAME

      - name: Resolve deploy revision
        id: revision
        run: |
          commit_sha="$(git rev-parse HEAD)"
          echo "commit_sha=${commit_sha}" >> "$GITHUB_OUTPUT"

      - name: Prepare previous static index for emergency recovery
        if: inputs.action == 'restore-previous-index'
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/Marica7731/daily-song-list/b108c95646f250526cbf9f08618657ff156608ec/index.html" \
            -o rollback-index.html
          node scripts/compact-static-index.js rollback-index.html

      - name: Install sshpass
        env:
          VPS2_PASSWORD: ${{ secrets.VPS2_PASSWORD }}
        run: |
          if [ -z "${VPS2_PASSWORD}" ]; then
            echo "::error::Missing VPS2_PASSWORD secret."
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Upload static bundle without remote Git fetch
        if: inputs.action != 'restore-previous-index'
        env:
          VPS2_PASSWORD: ${{ secrets.VPS2_PASSWORD }}
          DEPLOY_SHA: ${{ steps.revision.outputs.commit_sha }}
        run: |
          tar -czf - -- index.html assets data/status.json data/ui/meta.json data/diff |
            sshpass -p "${VPS2_PASSWORD}" ssh -o StrictHostKeyChecking=no "${VPS2_USER}@${VPS2_HOST}" "
              set -Eeuo pipefail
              tar -xzf - -C '${REMOTE_PROJECT_DIR}'
              test -s '${REMOTE_PROJECT_DIR}/index.html'
              test -s '${REMOTE_PROJECT_DIR}/data/status.json'
              test -s '${REMOTE_PROJECT_DIR}/data/ui/meta.json'
              test -s '${REMOTE_PROJECT_DIR}/data/diff/latest-all.json'
              test -s '${REMOTE_PROJECT_DIR}/data/diff/latest-7d.json'
              if systemctl list-unit-files song-rank-api.service >/dev/null 2>&1; then
                systemctl restart song-rank-api
              fi
              nginx -t
              systemctl reload nginx
            "

      - name: Restore previous index without remote Git fetch
        if: inputs.action == 'restore-previous-index'
        env:
          VPS2_PASSWORD: ${{ secrets.VPS2_PASSWORD }}
        run: |
          set -Eeuo pipefail
          tar -czf - --transform='s|^rollback-index\.html$|index.html|' -- rollback-index.html |
            sshpass -p "${VPS2_PASSWORD}" ssh -o StrictHostKeyChecking=no "${VPS2_USER}@${VPS2_HOST}" "
              set -Eeuo pipefail
              tar -xzf - -C '${REMOTE_PROJECT_DIR}'
              test -s '${REMOTE_PROJECT_DIR}/index.html'
              grep -q 'assets/app-h95090fdb1212.js' '${REMOTE_PROJECT_DIR}/index.html'
              nginx -t
              systemctl reload nginx
            "

      - name: Verify deployed index
        env:
          VPS2_PASSWORD: ${{ secrets.VPS2_PASSWORD }}
          EXPECTED_SHA: ${{ steps.revision.outputs.commit_sha }}
        run: |
          set -Eeuo pipefail
          if [ "${DEPLOY_ACTION}" = "restore-previous-index" ]; then
            expected_app="$(grep -o 'assets/app-[^"]*\.js' rollback-index.html | head -1)"
          else
            expected_app="$(grep -o 'assets/app-[^"]*\.js' index.html | head -1)"
          fi
          if [ -z "${expected_app}" ]; then
            echo "::error::could not resolve expected app asset from index.html"
            exit 1
          fi
          remote_app="$(
            sshpass -p "${VPS2_PASSWORD}" ssh -o StrictHostKeyChecking=no "${VPS2_USER}@${VPS2_HOST}" "
              set -Eeuo pipefail
              test -s '${REMOTE_PROJECT_DIR}/data/status.json'
              test -s '${REMOTE_PROJECT_DIR}/data/ui/meta.json'
              test -s '${REMOTE_PROJECT_DIR}/data/diff/latest-all.json'
              test -s '${REMOTE_PROJECT_DIR}/data/diff/latest-7d.json'
              grep -o 'assets/app-[^\"]*\.js' '${REMOTE_PROJECT_DIR}/index.html' | head -1
            "
          )"
          if [ "${remote_app}" != "${expected_app}" ]; then
            echo "::error::VPS checkout references ${remote_app}, expected ${expected_app}"
            exit 1
          fi
          if body="$(curl -A 'Mozilla/5.0' -fsSL --retry 5 --retry-delay 3 "https://ytb-song-rank.culua.com/index.html?probe=${EXPECTED_SHA}")"; then
            if ! grep -q "${expected_app}" <<< "${body}"; then
              echo "::error::public index does not reference expected app asset"
              exit 1
            fi
          else
            echo "::warning::public index probe failed from GitHub runner; VPS checkout verification passed"
          fi
          if ! curl -A 'Mozilla/5.0' -fsSL --retry 5 --retry-delay 3 "https://ytb-song-rank.culua.com/data/ui/meta.json?probe=${EXPECTED_SHA}" >/dev/null; then
            echo "::warning::public data/ui/meta.json probe failed from GitHub runner; VPS checkout verification passed"
          fi
          if ! curl -A 'Mozilla/5.0' -fsSL --retry 5 --retry-delay 3 "https://ytb-song-rank.culua.com/data/diff/latest-all.json?probe=${EXPECTED_SHA}" >/dev/null; then
            echo "::warning::public data/diff/latest-all.json probe failed from GitHub runner; VPS checkout verification passed"
          fi
          if ! curl -A 'Mozilla/5.0' -fsSL --retry 5 --retry-delay 3 "https://ytb-song-rank.culua.com/data/diff/latest-7d.json?probe=${EXPECTED_SHA}" >/dev/null; then
            echo "::warning::public data/diff/latest-7d.json probe failed from GitHub runner; VPS checkout verification passed"
          fi
