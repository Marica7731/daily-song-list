name: Deploy VPS static files

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-song-list-vps-static-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS2_HOST: "192.255.151.75"
      VPS2_USER: "root"
      REMOTE_PROJECT_DIR: "/opt/culua/ytb-song-rank"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github/workflows/deploy-vps-static.yml
            index.html
            assets
            data/ui/meta.json
            .nojekyll
            CNAME

      - name: Resolve deploy revision
        id: revision
        run: |
          git fetch --depth=1 origin main --prune
          git checkout -B main FETCH_HEAD
          commit_sha="$(git rev-parse HEAD)"
          echo "commit_sha=${commit_sha}" >> "$GITHUB_OUTPUT"

      - name: Install sshpass
        env:
          VPS2_PASSWORD: ${{ secrets.VPS2_PASSWORD }}
        run: |
          if [ -z "${VPS2_PASSWORD}" ]; then
            echo "::error::Missing VPS2_PASSWORD secret."
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Fast-forward VPS checkout
        env:
          VPS2_PASSWORD: ${{ secrets.VPS2_PASSWORD }}
          DEPLOY_SHA: ${{ steps.revision.outputs.commit_sha }}
        run: |
          sshpass -p "${VPS2_PASSWORD}" ssh -o StrictHostKeyChecking=no "${VPS2_USER}@${VPS2_HOST}" "
            set -Eeuo pipefail
            cd '${REMOTE_PROJECT_DIR}'
            git fetch --quiet origin main --prune
            git checkout main
            if git config --bool core.sparseCheckout | grep -qx true; then
              git sparse-checkout add data/ui
            fi
            git merge --ff-only --quiet '${DEPLOY_SHA}'
            test \"\$(git rev-parse HEAD)\" = '${DEPLOY_SHA}'
            test -s data/ui/meta.json
            if systemctl list-unit-files song-rank-api.service >/dev/null 2>&1; then
              systemctl restart song-rank-api
            fi
            nginx -t
            systemctl reload nginx
          "

      - name: Verify deployed index
        env:
          VPS2_PASSWORD: ${{ secrets.VPS2_PASSWORD }}
          EXPECTED_SHA: ${{ steps.revision.outputs.commit_sha }}
        run: |
          set -Eeuo pipefail
          expected_app="$(grep -o 'assets/app.js?v=[^"]*' index.html | head -1)"
          if [ -z "${expected_app}" ]; then
            echo "::error::could not resolve expected app asset from index.html"
            exit 1
          fi
          remote_app="$(
            sshpass -p "${VPS2_PASSWORD}" ssh -o StrictHostKeyChecking=no "${VPS2_USER}@${VPS2_HOST}" "
              set -Eeuo pipefail
              cd '${REMOTE_PROJECT_DIR}'
              test \"\$(git rev-parse HEAD)\" = '${EXPECTED_SHA}'
              test -s data/ui/meta.json
              grep -o 'assets/app.js?v=[^\"]*' index.html | head -1
            "
          )"
          if [ "${remote_app}" != "${expected_app}" ]; then
            echo "::error::VPS checkout references ${remote_app}, expected ${expected_app}"
            exit 1
          fi
          if body="$(curl -A 'Mozilla/5.0' -fsSL --retry 5 --retry-delay 3 "https://ytb-song-rank.culua.com/index.html?probe=${EXPECTED_SHA}")"; then
            if ! grep -q "${expected_app}" <<< "${body}"; then
              echo "::error::public index does not reference expected app asset"
              exit 1
            fi
          else
            echo "::warning::public index probe failed from GitHub runner; VPS checkout verification passed"
          fi
          curl -A 'Mozilla/5.0' -fsSL --retry 5 --retry-delay 3 "https://ytb-song-rank.culua.com/data/ui/meta.json?probe=${EXPECTED_SHA}" >/dev/null
