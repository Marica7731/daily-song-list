name: Discover one channel candidate

on:
  workflow_dispatch:
    inputs:
      channel_id:
        description: Immutable YouTube channel ID
        required: true
        type: string
      channel_handle:
        description: Canonical YouTube handle
        required: true
        type: string
      channel_slug:
        description: Lowercase artifact slug
        required: true
        type: string
      max_channel_pages:
        description: Maximum pages per tab, including the initial page
        required: true
        type: choice
        options: ["10", "25"]
        default: "10"
      max_videos:
        description: Maximum retained discovery candidates
        required: true
        type: choice
        options: ["250", "500", "1000"]
        default: "500"
      force_refresh:
        description: Start without a prior checkpoint
        required: true
        type: choice
        options: ["false", "true"]
        default: "false"

permissions:
  contents: read

concurrency:
  group: channel-discovery-candidate-${{ inputs.channel_slug }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: [self-hosted, macOS, ARM64, daily-song-list-mac]
    timeout-minutes: 25
    env:
      CHANNEL_ID: ${{ inputs.channel_id }}
      CHANNEL_HANDLE: ${{ inputs.channel_handle }}
      CHANNEL_SLUG: ${{ inputs.channel_slug }}
      MAX_CHANNEL_PAGES: ${{ inputs.max_channel_pages }}
      MAX_VIDEOS: ${{ inputs.max_videos }}
      FORCE_REFRESH: ${{ inputs.force_refresh }}
      NODE_MAX_OLD_SPACE_SIZE_MB: "1536"
      TASK_CAP_BYTES: "2147483648"
      ARTIFACT_CAP_BYTES: "134217728"
      SOURCE_BUNDLE_CAP_BYTES: "2097152"
      DISCOVERY_TIMEOUT_SECONDS: "1200"

    steps:
      - name: Prepare pinned source bundle
        shell: bash
        run: |
          set -Eeuo pipefail

          fail() {
            printf 'CHANNEL_DISCOVERY_SOURCE_FAIL %s\n' "$1" >&2
            exit 78
          }

          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "invalid-github-sha"
          [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || fail "invalid-github-repository"
          [[ "$RUNNER_TEMP" = /* && -d "$RUNNER_TEMP" && ! -L "$RUNNER_TEMP" ]] || fail "unsafe-runner-temp"

          TASK_ROOT="$RUNNER_TEMP/daily-song-channel-discovery-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          SOURCE_ROOT="$TASK_ROOT/source"
          printf 'TASK_ROOT=%s\nSOURCE_ROOT=%s\n' "$TASK_ROOT" "$SOURCE_ROOT" >> "$GITHUB_ENV"
          expected_root="$RUNNER_TEMP/daily-song-channel-discovery-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          [ "$TASK_ROOT" = "$expected_root" ] || fail "unsafe-task-root"
          case "$TASK_ROOT" in "$RUNNER_TEMP"/daily-song-channel-discovery-*) ;; *) fail "unsafe-task-root-pattern" ;; esac
          if [ -e "$TASK_ROOT" ]; then
            [ -d "$TASK_ROOT" ] && [ ! -L "$TASK_ROOT" ] || fail "task-root-not-owned-directory"
            rm -rf -- "$TASK_ROOT"
          fi
          mkdir -m 700 "$TASK_ROOT" "$SOURCE_ROOT"

          export PATH="/Users/be/.local/codex-toolchains/node/bin:/opt/homebrew/bin:/usr/local/bin:/Users/be/.local/bin:$PATH"
          NODE_BIN="$(command -v node || true)"
          [ -n "$NODE_BIN" ] && [ -x "$NODE_BIN" ] || fail "node-runtime-missing"
          case "$NODE_BIN" in /*) ;; *) fail "node-runtime-not-absolute" ;; esac
          NODE_VERSION="$("$NODE_BIN" --version 2>/dev/null || true)"
          [[ "$NODE_VERSION" =~ ^v([0-9]+)\. ]] || fail "node-version-invalid"
          [ "${BASH_REMATCH[1]}" -ge 18 ] || fail "node-version-unsupported"
          printf '%s\n' "$(dirname "$NODE_BIN")" >> "$GITHUB_PATH"
          printf 'NODE_BIN=%s\n' "$NODE_BIN" >> "$GITHUB_ENV"
          printf 'CHANNEL_DISCOVERY_NODE_RUNTIME path=%s version=%s\n' "$NODE_BIN" "$NODE_VERSION"

          raw_base="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA"
          source_bytes=0
          source_files=0
          while IFS='|' read -r relative expected_bytes expected_blob_sha; do
            [ -n "$relative" ] || continue
            case "$relative" in
              assets/*.js|config/*.json|scripts/*.js|scripts/*.jq|scripts/vsinger-http/*.js) ;;
              *) fail "invalid-source-path-$relative" ;;
            esac
            case "$relative" in *..*|/*) fail "unsafe-source-path-$relative" ;; esac
            [[ "$expected_bytes" =~ ^[1-9][0-9]*$ ]] || fail "invalid-source-size-$relative"
            [[ "$expected_blob_sha" =~ ^[0-9a-f]{40}$ ]] || fail "invalid-source-sha-$relative"

            target="$SOURCE_ROOT/$relative"
            mkdir -p "$(dirname "$target")"
            curl --fail --location --silent --show-error \
              --connect-timeout 10 --max-time 60 --max-filesize 262144 \
              --retry 3 --retry-all-errors \
              --output "$target.download" "$raw_base/$relative" ||
              fail "download-$relative"
            [ -f "$target.download" ] && [ ! -L "$target.download" ] || fail "download-type-$relative"
            actual_bytes="$(wc -c < "$target.download" | tr -d ' ')"
            [ "$actual_bytes" = "$expected_bytes" ] || fail "size-$relative"
            actual_blob_sha="$(
              { printf 'blob %s\0' "$actual_bytes"; cat "$target.download"; } |
                shasum | awk 'NR == 1 { print $1 }'
            )"
            [ "$actual_blob_sha" = "$expected_blob_sha" ] || fail "sha-$relative"
            mv "$target.download" "$target"
            source_bytes=$((source_bytes + actual_bytes))
            source_files=$((source_files + 1))
            [ "$source_bytes" -le "$SOURCE_BUNDLE_CAP_BYTES" ] || fail "source-bundle-cap"
            printf 'CHANNEL_DISCOVERY_SOURCE_OK path=%s bytes=%s blob=%s\n' \
              "$relative" "$actual_bytes" "$actual_blob_sha"
          done <<'PINNED_SOURCE_FILES'
          assets/frontend-utils.js|81218|946d916ec7af96b557a5f06003eec68578b9165a
          assets/ranking-utils.js|59367|2623a2f5e5d9bd688e694e1759fcc85d621d746a
          assets/source-filter.js|61184|54f8a1aacaed8471859cafd32d8fddd62ef06714
          config/blocked-vtuber-channels.json|40392|dcd02068f31a32b654a4baf26488e16a6289ee27
          scripts/blocked-vtuber-utils.js|13983|ae88220a840c0350d879c86b745af62951bee9cc
          scripts/build-runtime-data.js|92299|1afab30a25df5af27917534326e6469d22c2ca94
          scripts/channel-discovery-candidate-artifact-gate.jq|9618|54e348c83453515fa560d2a264a1307ceb8be2bb
          scripts/channel-discovery-candidate-records-gate.jq|6993|25097ed05c3abcf616e9fcb0f3a6e3d73136d22c
          scripts/channel-metadata-cache.js|9419|85d3caffac760d3e9e47f855157070645d81541e
          scripts/curation.js|43979|b3bc02ce4058ec1cd30e2df5df9da941ada1d511
          scripts/entry-repair.js|24257|970ec9d8e9bdfae21c3e904fe241547ad20de0a5
          scripts/range-config.js|2160|49d23580a15d32aaa201a68cc64cf405087ed456
          scripts/recent-all-continuity.js|2452|6411fe3212fc83648e962c247f7de21495783d64
          scripts/song-aliases.js|5296|16adce1dc66253a968c8dcd7702bb5fff247f8bd
          scripts/song-search-index.js|16185|76a920c26b01b2e3253ea52a8299602e6f82b62e
          scripts/song-utils.js|60926|b6202d3d3186adb76dfd2beb4b8fae1cdc4f10b7
          scripts/update-songlist.js|137229|cec90db7bb8b27f308908ce1e91d838d7d5789f1
          scripts/video-catalog.js|18509|fa561d4780156e9a37b908cbfeb174671c3b6ffa
          scripts/vsinger-http/html-utils.js|4045|68533aafd3df5c53c8a4fdd4b0cb416e34b764c1
          scripts/vsinger-http/http-client.js|7000|86e7317b3e0904ade6d39945df5888e11da46562
          scripts/vsinger-http/model.js|4678|811a8d65ae37f657717de4a8dc4c7320e00ef694
          scripts/vsinger-http/runtime-importer.js|21502|32e39dfd70200b0c6494b254695e33108f22f2fc
          scripts/youtube-channel-discovery-core.js|99194|0212005e04522802085049fb0a75a2fc55307e68
          scripts/youtube-channel-discovery.js|2444|1d78bdeeefe0b9dc6db6e7caf185f531cfed51b4
          PINNED_SOURCE_FILES

          [ "$source_files" -eq 24 ] || fail "source-file-count"
          js_files="$(find "$SOURCE_ROOT" -type f -name '*.js' | wc -l | tr -d ' ')"
          [ "$js_files" -eq 21 ] || fail "source-js-count"
          while IFS= read -r js_file; do
            "$NODE_BIN" --check "$js_file" >/dev/null || fail "node-check-${js_file#"$SOURCE_ROOT/"}"
          done < <(find "$SOURCE_ROOT" -type f -name '*.js' | LC_ALL=C sort)
          NODE_OPTIONS= NODE_PATH= "$NODE_BIN" -e \
            'require(process.argv[1]); require(process.argv[2]);' \
            "$SOURCE_ROOT/scripts/youtube-channel-discovery.js" \
            "$SOURCE_ROOT/scripts/youtube-channel-discovery-core.js" ||
            fail "source-module-load"
          printf 'SOURCE_BUNDLE_BYTES=%s\n' "$source_bytes" >> "$GITHUB_ENV"
          printf 'CHANNEL_DISCOVERY_SOURCE_BUNDLE_OK files=%s bytes=%s commit=%s\n' \
            "$source_files" "$source_bytes" "$GITHUB_SHA"

      - name: Run and verify candidate-only discovery
        id: candidate
        shell: bash
        run: |
          set -Eeuo pipefail

          fail() {
            printf 'CHANNEL_DISCOVERY_FAIL %s\n' "$1" >&2
            exit 78
          }

          [[ "$CHANNEL_ID" =~ ^UC[A-Za-z0-9_-]{22}$ ]] || fail "invalid-channel-id"
          [[ "$CHANNEL_HANDLE" =~ ^@[A-Za-z0-9._-]{3,30}$ ]] || fail "invalid-channel-handle"
          [[ "$CHANNEL_SLUG" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]] || fail "invalid-channel-slug"
          case "$MAX_CHANNEL_PAGES" in 10|25) ;; *) fail "invalid-max-channel-pages" ;; esac
          case "$MAX_VIDEOS" in 250|500|1000) ;; *) fail "invalid-max-videos" ;; esac
          case "$FORCE_REFRESH" in false|true) ;; *) fail "invalid-force-refresh" ;; esac
          [[ "$RUNNER_TEMP" = /* && -d "$RUNNER_TEMP" && ! -L "$RUNNER_TEMP" ]] || fail "unsafe-runner-temp"

          EXPECTED_TASK_ROOT="$RUNNER_TEMP/daily-song-channel-discovery-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          [ "$TASK_ROOT" = "$EXPECTED_TASK_ROOT" ] || fail "unexpected-task-root"
          [ "$SOURCE_ROOT" = "$TASK_ROOT/source" ] || fail "unexpected-source-root"
          [ -d "$TASK_ROOT" ] && [ ! -L "$TASK_ROOT" ] || fail "missing-task-root"
          [ -d "$SOURCE_ROOT" ] && [ ! -L "$SOURCE_ROOT" ] || fail "missing-source-root"
          NORMALIZED_CHANNEL_HANDLE="$(printf '%s' "$CHANNEL_HANDLE" | tr '[:upper:]' '[:lower:]')"
          CHANNEL_URL="https://www.youtube.com/$NORMALIZED_CHANNEL_HANDLE"
          ARTIFACT_DIR="$TASK_ROOT/artifact"
          CACHE_DIR="$TASK_ROOT/cache"
          mkdir -m 700 "$ARTIFACT_DIR" "$CACHE_DIR"
          printf 'ARTIFACT_DIR=%s\n' "$ARTIFACT_DIR" >> "$GITHUB_ENV"

          task_bytes() {
            local kib
            kib="$(du -sk "$TASK_ROOT" | awk 'NR == 1 { print $1 }')"
            [[ "$kib" =~ ^[0-9]+$ ]] || return 78
            printf '%s\n' "$((kib * 1024))"
          }

          discovery_rss_bytes() {
            local kib
            if [ -z "${discovery_pid:-}" ] || ! kill -0 "$discovery_pid" 2>/dev/null; then
              printf '0\n'
              return
            fi
            kib="$(ps -o rss= -p "$discovery_pid" | awk 'NF == 1 { print $1 }')"
            [[ "$kib" =~ ^[0-9]+$ ]] || return 78
            printf '%s\n' "$((kib * 1024))"
          }

          stop_owned_pid() {
            if [ -n "${discovery_pid:-}" ] && kill -0 "$discovery_pid" 2>/dev/null; then
              kill -TERM "$discovery_pid" 2>/dev/null || true
              wait "$discovery_pid" 2>/dev/null || true
            fi
            discovery_pid=""
          }
          # DIAGNOSTIC_FUNCTION_BEGIN
          emit_discovery_failure_diagnostic() {
            local status="$1"
            local log_file="$ARTIFACT_DIR/discovery.log"
            local log_bytes=0
            local diagnostic_task_bytes=0
            local log_state="missing-or-unsafe"
            diagnostic_task_bytes="$(task_bytes 2>/dev/null || printf '0\n')"
            [[ "$diagnostic_task_bytes" =~ ^[0-9]+$ ]] || diagnostic_task_bytes=0
            if [ -f "$log_file" ] && [ ! -L "$log_file" ]; then
              log_state="regular"
              log_bytes="$(wc -c < "$log_file" | tr -d ' ')"
              [[ "$log_bytes" =~ ^[0-9]+$ ]] || log_bytes=0
            fi
            printf 'CHANNEL_DISCOVERY_DIAGNOSTIC_BEGIN status=%s state=%s logBytes=%s taskBytes=%s tailLines=80 tailBytes=16384\n' \
              "$status" "$log_state" "$log_bytes" "$diagnostic_task_bytes" >&2
            if [ "$log_state" = "regular" ]; then
              LC_ALL=C tail -n 80 "$log_file" | LC_ALL=C tail -c 16384 >&2 ||
                printf 'CHANNEL_DISCOVERY_DIAGNOSTIC_TAIL_UNAVAILABLE\n' >&2
            else
              printf 'CHANNEL_DISCOVERY_DIAGNOSTIC_LOG_UNAVAILABLE\n' >&2
            fi
            printf '\nCHANNEL_DISCOVERY_DIAGNOSTIC_END status=%s\n' "$status" >&2
          }
          # DIAGNOSTIC_FUNCTION_END
          finalize_step() {
            local status=$?
            trap - EXIT
            set +e
            stop_owned_pid
            printf 'before_bytes=%s\npeak_task_bytes=%s\npeak_rss_bytes=%s\nafter_bytes=%s\n' \
              "${before_bytes:-0}" "${peak_task_bytes:-0}" "${peak_rss_bytes:-0}" "${after_bytes:-0}" >> "$GITHUB_OUTPUT"
            exit "$status"
          }
          trap finalize_step EXIT

          before_bytes="$(task_bytes)" || fail "task-before-sample"
          [ "$before_bytes" -le "$TASK_CAP_BYTES" ] || fail "task-before-cap"
          peak_task_bytes="$before_bytes"
          peak_rss_bytes=0

          jq -n \
            --arg sourceCommit "$GITHUB_SHA" \
            --arg channelId "$CHANNEL_ID" \
            --arg channelHandle "$NORMALIZED_CHANNEL_HANDLE" \
            --arg channelSlug "$CHANNEL_SLUG" \
            --arg channelUrl "$CHANNEL_URL" \
            --argjson maxChannelPages "$MAX_CHANNEL_PAGES" \
            --argjson maxVideos "$MAX_VIDEOS" \
            --argjson forceRefresh "$FORCE_REFRESH" \
            '{
              schemaVersion: 1,
              kind: "channel-discovery-candidate-run",
              sourceCommit: $sourceCommit,
              channelId: $channelId,
              channelHandle: $channelHandle,
              channelSlug: $channelSlug,
              channelUrl: $channelUrl,
              expectedChannelId: $channelId,
              expectedChannelHandle: $channelHandle,
              expectedChannelUrl: $channelUrl,
              expectedTabs: ["streams", "videos"],
              maxChannelPages: $maxChannelPages,
              maxVideos: $maxVideos,
              forceRefresh: $forceRefresh,
              candidateOnly: true
            }' > "$ARTIFACT_DIR/request.json"

          if [ "$FORCE_REFRESH" = "true" ]; then
            NODE_OPTIONS= NODE_PATH= "$NODE_BIN" "--max-old-space-size=$NODE_MAX_OLD_SPACE_SIZE_MB" \
              "$SOURCE_ROOT/scripts/youtube-channel-discovery.js" \
              --channel-url "$CHANNEL_URL" \
              --expected-channel-id "$CHANNEL_ID" \
              --expected-channel-handle "$NORMALIZED_CHANNEL_HANDLE" \
              --channel-slug "$CHANNEL_SLUG" \
              --source-commit "$GITHUB_SHA" \
              --force-refresh "$FORCE_REFRESH" \
              --output-dir "$ARTIFACT_DIR" \
              --cache-dir "$CACHE_DIR" \
              --max-channel-pages "$MAX_CHANNEL_PAGES" \
              --max-videos "$MAX_VIDEOS" \
              --max-inspect 0 \
              --request-timeout-ms 15000 \
              --request-interval-ms 2500 \
              --request-jitter-ms 1000 \
              --tab streams \
              --tab videos \
              --candidate-only \
              --fresh \
              > "$ARTIFACT_DIR/discovery.log" 2>&1 &
          else
            NODE_OPTIONS= NODE_PATH= "$NODE_BIN" "--max-old-space-size=$NODE_MAX_OLD_SPACE_SIZE_MB" \
              "$SOURCE_ROOT/scripts/youtube-channel-discovery.js" \
              --channel-url "$CHANNEL_URL" \
              --expected-channel-id "$CHANNEL_ID" \
              --expected-channel-handle "$NORMALIZED_CHANNEL_HANDLE" \
              --channel-slug "$CHANNEL_SLUG" \
              --source-commit "$GITHUB_SHA" \
              --force-refresh "$FORCE_REFRESH" \
              --output-dir "$ARTIFACT_DIR" \
              --cache-dir "$CACHE_DIR" \
              --max-channel-pages "$MAX_CHANNEL_PAGES" \
              --max-videos "$MAX_VIDEOS" \
              --max-inspect 0 \
              --request-timeout-ms 15000 \
              --request-interval-ms 2500 \
              --request-jitter-ms 1000 \
              --tab streams \
              --tab videos \
              --candidate-only \
              > "$ARTIFACT_DIR/discovery.log" 2>&1 &
          fi
          discovery_pid=$!
          deadline=$((SECONDS + DISCOVERY_TIMEOUT_SECONDS))
          monitor_status=0

          while kill -0 "$discovery_pid" 2>/dev/null; do
            [ "$SECONDS" -lt "$deadline" ] || { monitor_status=124; break; }
            rss_bytes="$(discovery_rss_bytes)" || { monitor_status=78; break; }
            current_task_bytes="$(task_bytes)" || { monitor_status=78; break; }
            [ "$rss_bytes" -le "$TASK_CAP_BYTES" ] || { monitor_status=78; break; }
            [ "$current_task_bytes" -le "$TASK_CAP_BYTES" ] || { monitor_status=78; break; }
            [ "$rss_bytes" -le "$peak_rss_bytes" ] || peak_rss_bytes="$rss_bytes"
            [ "$current_task_bytes" -le "$peak_task_bytes" ] || peak_task_bytes="$current_task_bytes"
            sleep 1
          done

          if [ "$monitor_status" -ne 0 ]; then
            stop_owned_pid
            fail "discovery-monitor-status-$monitor_status"
          fi
          set +e
          wait "$discovery_pid"
          discovery_status=$?
          set -e
          discovery_pid=""
          if [ "$discovery_status" -ne 0 ]; then
            emit_discovery_failure_diagnostic "$discovery_status"
            fail "discovery-exit-$discovery_status"
          fi

          for required in request.json manifest.json checkpoint.json candidate-manifest.ndjson; do
            [ -s "$ARTIFACT_DIR/$required" ] && [ ! -L "$ARTIFACT_DIR/$required" ] || fail "missing-$required"
          done
          [ -d "$ARTIFACT_DIR/pages" ] && [ ! -L "$ARTIFACT_DIR/pages" ] || fail "missing-pages"
          find "$ARTIFACT_DIR/pages" -type l -print -quit | grep -q . && fail "page-evidence-symlink"

          jq -r '.pageEvidenceFiles[] | [.path,.sha256,(.bytes|tostring)] | @tsv' "$ARTIFACT_DIR/manifest.json" |
            while IFS=$'\t' read -r evidence_path expected_sha expected_bytes; do
              case "$evidence_path" in
                pages/[0-9][0-9]-streams.html|pages/[0-9][0-9]-videos.html|pages/[0-9][0-9]-streams-continuation-[0-9][0-9][0-9].json|pages/[0-9][0-9]-videos-continuation-[0-9][0-9][0-9].json) ;;
                *) exit 78 ;;
              esac
              [ -f "$ARTIFACT_DIR/$evidence_path" ] && [ ! -L "$ARTIFACT_DIR/$evidence_path" ] || exit 78
              [ "$(wc -c < "$ARTIFACT_DIR/$evidence_path" | tr -d ' ')" = "$expected_bytes" ] || exit 78
              [ "$(shasum -a 256 "$ARTIFACT_DIR/$evidence_path" | awk '{print $1}')" = "$expected_sha" ] || exit 78
            done || fail "physical-page-evidence"

          jq -e -s \
            --arg expectedSourceCommit "$GITHUB_SHA" \
            --arg expectedChannelId "$CHANNEL_ID" \
            --arg expectedChannelHandle "$NORMALIZED_CHANNEL_HANDLE" \
            --arg expectedChannelUrl "$CHANNEL_URL" \
            --slurpfile requestFile "$ARTIFACT_DIR/request.json" \
            --slurpfile sourceManifestFile "$ARTIFACT_DIR/manifest.json" \
            --slurpfile checkpointFile "$ARTIFACT_DIR/checkpoint.json" \
            -f "$SOURCE_ROOT/scripts/channel-discovery-candidate-artifact-gate.jq" \
            "$ARTIFACT_DIR/candidate-manifest.ndjson" >/dev/null || fail "artifact-gate"

          jq -e -s \
            --arg expectedSourceCommit "$GITHUB_SHA" \
            --arg expectedChannelId "$CHANNEL_ID" \
            --arg expectedChannelHandle "$NORMALIZED_CHANNEL_HANDLE" \
            --arg expectedChannelUrl "$CHANNEL_URL" \
            --argjson maxVideos "$MAX_VIDEOS" \
            --slurpfile sourceManifestFile "$ARTIFACT_DIR/manifest.json" \
            -f "$SOURCE_ROOT/scripts/channel-discovery-candidate-records-gate.jq" \
            "$ARTIFACT_DIR/candidate-manifest.ndjson" >/dev/null || fail "records-gate"

          NODE_OPTIONS= NODE_PATH= ARTIFACT_DIR="$ARTIFACT_DIR" SOURCE_ROOT="$SOURCE_ROOT" \
            "$NODE_BIN" "--max-old-space-size=$NODE_MAX_OLD_SPACE_SIZE_MB" - <<'VERIFY_RAW_CONTINUATIONS'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const path = require("node:path");
          const artifactDir = process.env.ARTIFACT_DIR;
          const sourceRoot = process.env.SOURCE_ROOT;
          const core = require(path.join(sourceRoot, "scripts/youtube-channel-discovery-core.js"));
          const { extractSearchItems } = require(path.join(sourceRoot, "scripts/update-songlist.js"));
          const source = JSON.parse(fs.readFileSync(path.join(artifactDir, "manifest.json"), "utf8"));
          const request = JSON.parse(fs.readFileSync(path.join(artifactDir, "request.json"), "utf8"));
          const evidenceBodies = source.pageEvidenceFiles.map((entry) =>
            fs.readFileSync(path.join(artifactDir, entry.path)));
          const replay = core.recomputeCandidateArtifactEvidence(evidenceBodies, source, {
            channelUrl: request.channelUrl,
            expectedChannelId: request.channelId,
            expectedChannelHandle: request.channelHandle,
            candidateOnly: true,
            maxChannelPages: request.maxChannelPages,
            singerName: source.singerName || "",
            keywords: source.keywords,
            candidateEvidenceNowMs: source.candidateEvidenceNowMs,
          }, extractSearchItems);
          assert.equal(replay.rawItemCount, source.rawItemCount);
          assert.equal(replay.pageCandidateCountSum, source.pageCandidateCountSum);
          assert.equal(replay.candidateCount, source.candidateCount);
          const records = fs.readFileSync(path.join(artifactDir, "candidate-manifest.ndjson"), "utf8")
            .trim().split("\n").filter(Boolean).map((line) => JSON.parse(line));
          const evidenceById = (items) => new Map(items.map((item) => [
            item.youtubeVideoId,
            JSON.stringify(item.discoveryEvidenceRefs || []),
          ]));
          assert.deepEqual(evidenceById(records), evidenceById(replay.rawVideos));
          VERIFY_RAW_CONTINUATIONS

          after_bytes="$(task_bytes)" || fail "task-after-sample"
          [ "$after_bytes" -le "$TASK_CAP_BYTES" ] || fail "task-after-cap"
          [ "$after_bytes" -le "$peak_task_bytes" ] || peak_task_bytes="$after_bytes"
          artifact_bytes="$(du -sk "$ARTIFACT_DIR" | awk 'NR == 1 { print $1 * 1024 }')"
          [[ "$artifact_bytes" =~ ^[0-9]+$ ]] || fail "artifact-size-sample"
          [ "$artifact_bytes" -le "$ARTIFACT_CAP_BYTES" ] || fail "artifact-size-cap"

          jq -n \
            --argjson beforeBytes "$before_bytes" \
            --argjson peakTaskBytes "$peak_task_bytes" \
            --argjson peakDiscoveryRssBytes "$peak_rss_bytes" \
            --argjson afterBytes "$after_bytes" \
            --argjson taskCapBytes "$TASK_CAP_BYTES" \
            --argjson sourceBundleBytes "$SOURCE_BUNDLE_BYTES" \
            --argjson sourceBundleCapBytes "$SOURCE_BUNDLE_CAP_BYTES" \
            --argjson artifactBytes "$artifact_bytes" \
            --argjson artifactCapBytes "$ARTIFACT_CAP_BYTES" \
            '{beforeBytes:$beforeBytes,peakTaskBytes:$peakTaskBytes,peakDiscoveryRssBytes:$peakDiscoveryRssBytes,afterBytes:$afterBytes,taskCapBytes:$taskCapBytes,sourceBundleBytes:$sourceBundleBytes,sourceBundleCapBytes:$sourceBundleCapBytes,artifactBytes:$artifactBytes,artifactCapBytes:$artifactCapBytes}' \
            > "$ARTIFACT_DIR/resource-usage.json"

          final_task_bytes="$(task_bytes)" || fail "task-final-sample"
          [ "$final_task_bytes" -le "$TASK_CAP_BYTES" ] || fail "task-final-cap"
          final_artifact_bytes="$(du -sk "$ARTIFACT_DIR" | awk 'NR == 1 { print $1 * 1024 }')"
          [[ "$final_artifact_bytes" =~ ^[0-9]+$ ]] || fail "artifact-final-size-sample"
          [ "$final_artifact_bytes" -le "$ARTIFACT_CAP_BYTES" ] || fail "artifact-final-size-cap"
          printf 'CHANNEL_DISCOVERY_CANDIDATE_OK candidates=%s artifactBytes=%s\n' \
            "$(jq -r '.candidateCount' "$ARTIFACT_DIR/manifest.json")" "$final_artifact_bytes"

      - name: Upload bounded candidate artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: channel-discovery-${{ inputs.channel_slug }}
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 3

      - name: Cleanup owned task root
        if: always()
        shell: bash
        env:
          REPORT_BEFORE_BYTES: ${{ steps.candidate.outputs.before_bytes }}
          REPORT_PEAK_TASK_BYTES: ${{ steps.candidate.outputs.peak_task_bytes }}
          REPORT_PEAK_RSS_BYTES: ${{ steps.candidate.outputs.peak_rss_bytes }}
          REPORT_AFTER_BYTES: ${{ steps.candidate.outputs.after_bytes }}
        run: |
          set -Eeuo pipefail
          cleanup_before_bytes=0
          cleanup_after_bytes=0
          if [ -n "${TASK_ROOT:-}" ]; then
            expected="$RUNNER_TEMP/daily-song-channel-discovery-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            [ "$TASK_ROOT" = "$expected" ] || exit 78
            case "$TASK_ROOT" in "$RUNNER_TEMP"/daily-song-channel-discovery-*) ;; *) exit 78 ;; esac
            if [ -e "$TASK_ROOT" ]; then
              [ -d "$TASK_ROOT" ] && [ ! -L "$TASK_ROOT" ] || exit 78
              cleanup_before_bytes="$(du -sk "$TASK_ROOT" | awk 'NR == 1 { print $1 * 1024 }')"
              rm -rf -- "$TASK_ROOT"
            fi
            [ ! -e "$TASK_ROOT" ] || exit 78
          fi
          {
            printf '### Candidate discovery resource report\n\n'
            printf -- '- source bundle: %s bytes\n' "${SOURCE_BUNDLE_BYTES:-unavailable}"
            printf -- '- task before discovery: %s bytes\n' "${REPORT_BEFORE_BYTES:-unavailable}"
            printf -- '- peak task root: %s bytes\n' "${REPORT_PEAK_TASK_BYTES:-unavailable}"
            printf -- '- peak discovery PID RSS: %s bytes\n' "${REPORT_PEAK_RSS_BYTES:-unavailable}"
            printf -- '- task after discovery/gates: %s bytes\n' "${REPORT_AFTER_BYTES:-unavailable}"
            printf -- '- cleanup before: %s bytes\n' "$cleanup_before_bytes"
            printf -- '- cleanup after: %s bytes\n' "$cleanup_after_bytes"
          } >> "$GITHUB_STEP_SUMMARY"
