name: enrich-snapshot-pilot-linkage-v2

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact main commit; checkout HEAD must equal it
        required: true
        type: string
      sample_id:
        description: One frozen day; both is executed Jul29 then Jul22
        required: true
        type: choice
        options:
          - both
          - jul29-sample25
          - jul22-raw456
      release_cutoff_utc:
        description: Inclusive 7D lower-bound in UTC
        required: true
        type: string
      raw_input:
        description: Read-only materialized raw input path
        required: true
        type: string
      provider_ndjson:
        description: Read-only provider NDJSON path
        required: true
        type: string
      artist_bindings:
        description: Versioned 12-row sidecar path
        required: true
        type: string
      source_index:
        description: Formal source index mapping IDs to immutable source paths/URLs
        required: true
        type: string
      formal_source_candidate:
        description: Pinned formal source candidate metadata
        required: true
        default: config/snapshot-recovery/formal-source-candidate.json
        type: string

permissions:
  contents: read

concurrency:
  group: enrich-snapshot-pilot-linkage-v2-singleton
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: [self-hosted, macOS, ARM64, daily-song-list-mac]
    timeout-minutes: 240
    steps:
      - name: Checkout exact dispatch source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 1
          persist-credentials: false
      - name: Run read-only source capture and linkage candidate
        shell: bash
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SAMPLE_ID: ${{ inputs.sample_id }}
          RELEASE_CUTOFF_UTC: ${{ inputs.release_cutoff_utc }}
          RAW_INPUT: ${{ inputs.raw_input }}
          PROVIDER_NDJSON: ${{ inputs.provider_ndjson }}
          ARTIST_BINDINGS: ${{ inputs.artist_bindings }}
          SOURCE_INDEX: ${{ inputs.source_index }}
          FORMAL_SOURCE: ${{ inputs.formal_source_candidate }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          actual_head="$(git rev-parse HEAD)"
          [[ "$actual_head" == "$SOURCE_COMMIT" ]]
          out="$RUNNER_TEMP/enrich-snapshot-pilot-linkage-v2-${GITHUB_RUN_ID}"
          python3 scripts/migration/run-snapshot-enrichment-pilot.py \
            --sample-id "$SAMPLE_ID" \
            --source-commit "$SOURCE_COMMIT" \
            --raw-input "$RAW_INPUT" \
            --provider-ndjson "$PROVIDER_NDJSON" \
            --artist-bindings "$ARTIST_BINDINGS" \
            --source-index "$SOURCE_INDEX" \
            --formal-source-candidate "$FORMAL_SOURCE" \
            --release-cutoff-utc "$RELEASE_CUTOFF_UTC" \
            --output-root "$out"
      - name: Upload candidate artifact only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enrich-snapshot-pilot-linkage-v2-${{ github.run_id }}-${{ inputs.sample_id }}
          path: ${{ runner.temp }}/enrich-snapshot-pilot-linkage-v2-${{ github.run_id }}/
          if-no-files-found: error
      # No product data, PG, import, commit, push, dispatch, activation, or restart.
