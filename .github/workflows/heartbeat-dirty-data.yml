
name: Heartbeat dirty data batch

on:
  workflow_dispatch:
    inputs:
      max_records:
        description: "Exact records to process in this bounded batch"
        required: false
        default: "25"
      scope:
        description: "current, history, or all"
        required: false
        default: "all"
      types:
        description: "Comma-separated approved classifications"
        required: false
        default: "confirmed_noise,parser_corruption"
  push:
    branches: [main]
    paths:
      - ".github/dirty-heartbeat.trigger"

permissions:
  actions: write
  contents: write

concurrency:
  group: daily-song-list-dirty-heartbeat
  cancel-in-progress: true

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout bounded delivery surface
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitignore
            /.github/workflows/heartbeat-dirty-data.yml
            /.github/dirty-heartbeat.trigger
            /package.json
            /package-lock.json
            /scripts/**
            /assets/**
            /config/**
            /test/static-github-pipeline.test.mjs
            /test/static-quality-ranges.test.js
            /test/heartbeat-dirty-batch.test.mjs
            /data/review/**
            /data/static/**

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve bounded heartbeat input
        id: input
        env:
          REQUESTED_MAX_RECORDS: ${{ inputs.max_records || '25' }}
          REQUESTED_SCOPE: ${{ inputs.scope || 'all' }}
          REQUESTED_TYPES: ${{ inputs.types || 'confirmed_noise,parser_corruption' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -Eeuo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            REQUESTED_MAX_RECORDS="$(jq -er '.maxRecords // 25' .github/dirty-heartbeat.trigger)"
            REQUESTED_SCOPE="$(jq -er '.scope // "all"' .github/dirty-heartbeat.trigger)"
            REQUESTED_TYPES="$(jq -er '.types // ["confirmed_noise","parser_corruption"] | join(",")' .github/dirty-heartbeat.trigger)"
          fi
          [[ "$REQUESTED_MAX_RECORDS" =~ ^[0-9]+$ ]] && (( REQUESTED_MAX_RECORDS >= 1 && REQUESTED_MAX_RECORDS <= 50 )) || {
            echo "HEARTBEAT_INVALID_MAX_RECORDS value=$REQUESTED_MAX_RECORDS" >&2
            exit 77
          }
          [[ "$REQUESTED_SCOPE" =~ ^(current|history|all)$ ]] || {
            echo "HEARTBEAT_INVALID_SCOPE value=$REQUESTED_SCOPE" >&2
            exit 78
          }
          IFS=',' read -r -a type_parts <<< "$REQUESTED_TYPES"
          for type in "${type_parts[@]}"; do
            [[ "$type" == "confirmed_noise" || "$type" == "parser_corruption" ]] || {
              echo "HEARTBEAT_INVALID_TYPE value=$type" >&2
              exit 79
            }
          done
          echo "max_records=$REQUESTED_MAX_RECORDS" >> "$GITHUB_OUTPUT"
          echo "scope=$REQUESTED_SCOPE" >> "$GITHUB_OUTPUT"
          echo "types=$REQUESTED_TYPES" >> "$GITHUB_OUTPUT"

      - name: Require a green Check code gate
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 180); do
            run_selector=()
            if [[ "$EVENT_NAME" == "push" ]]; then
              run_selector+=(--commit "$TARGET_SHA")
            fi
            conclusion="$(
              gh run list --repo "$GITHUB_REPOSITORY" \
                --workflow check-code.yml \
                --branch main \
                --status completed \
                "${run_selector[@]}" \
                --json conclusion \
                --jq '[.[].conclusion] | if index("success") then "success" elif index("failure") or index("cancelled") then "failed" else "pending" end' \
                2>/dev/null || printf 'pending'
            )"
            if [[ "$conclusion" == "success" ]]; then
              echo "HEARTBEAT_GATE_OK sha=$TARGET_SHA attempt=$attempt"
              echo "conclusion=success" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$conclusion" == "failed" ]]; then
              echo "HEARTBEAT_GATE_FAILED sha=$TARGET_SHA" >&2
              exit 71
            fi
            sleep 5
          done
          echo "HEARTBEAT_GATE_TIMEOUT sha=$TARGET_SHA" >&2
          exit 72

      - name: Rebuild derived static sources
        run: |
          set -Eeuo pipefail
          npm run static:rebuild

      - name: Export classified review candidates from rebuilt static sources
        env:
          STATIC_DATA_ROOT: ${{ github.workspace }}/data/static/v1
          STATIC_REVIEW_ROOT: ${{ github.workspace }}/data/review
        run: node scripts/static/export-static-dirty-review.js

      - name: Generate an exact bounded curation batch
        id: batch
        env:
          STATIC_REVIEW_ROOT: ${{ github.workspace }}/data/review
          STATIC_CURATION_OVERRIDES_PATH: ${{ github.workspace }}/config/curation-overrides.json
          STATIC_HEARTBEAT_STATE_PATH: ${{ github.workspace }}/data/review/heartbeat-state.json
          STATIC_HEARTBEAT_PATCH_PATH: ${{ github.workspace }}/data/review/heartbeat-patch.json
          MAX_RECORDS: ${{ steps.input.outputs.max_records }}
          SCOPE: ${{ steps.input.outputs.scope }}
          TYPES: ${{ steps.input.outputs.types }}
        run: |
          set -Eeuo pipefail
          before_days_hash="$(
            find data/static/v1/days -type f -print0 |
              sort -z |
              xargs -0 shasum -a 256 |
              shasum -a 256 |
              awk '{print $1}'
          )"
          echo "days_hash_before=$before_days_hash" >> "$GITHUB_OUTPUT"
          node scripts/static/heartbeat-dirty-batch.js \
            --max-records "$MAX_RECORDS" \
            --scope "$SCOPE" \
            --types "$TYPES"
          selected="$(jq -er '.records | length' data/review/heartbeat-patch.json)"
          echo "selected=$selected" >> "$GITHUB_OUTPUT"
          if (( selected == 0 )); then
            echo "HEARTBEAT_EMPTY_BATCH scope=$SCOPE types=$TYPES"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/apply-curation-patch.js data/review/heartbeat-patch.json
          node scripts/static/rebuild-only.js
          npm run static:validate
          expected_generated_at="$(jq -er '.generatedAt' data/static/v1/meta.json)"
          expected_meta_sha="$(jq -S -c 'del(.generatedAt)' data/static/v1/meta.json | shasum -a 256 | awk '{print $1}')"
          [[ "$expected_meta_sha" =~ ^[0-9a-f]{64}$ ]] || {
            echo "HEARTBEAT_INVALID_EXPECTED_META_SHA value=$expected_meta_sha" >&2
            exit 75
          }
          echo "expected_generated_at=$expected_generated_at" >> "$GITHUB_OUTPUT"
          echo "expected_meta_sha=$expected_meta_sha" >> "$GITHUB_OUTPUT"
          after_days_hash="$(
            find data/static/v1/days -type f -print0 |
              sort -z |
              xargs -0 shasum -a 256 |
              shasum -a 256 |
              awk '{print $1}'
          )"
          echo "days_hash_after=$after_days_hash" >> "$GITHUB_OUTPUT"
          [[ "$before_days_hash" == "$after_days_hash" ]] || {
            echo "HEARTBEAT_RAW_HISTORY_CHANGED before=$before_days_hash after=$after_days_hash" >&2
            exit 73
          }
          echo "should_publish=true" >> "$GITHUB_OUTPUT"

      - name: Commit only exact selectors and review state
        id: commit
        if: steps.batch.outputs.should_publish == 'true'
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- config/curation-overrides.json data/review/heartbeat-state.json data/review/heartbeat-summary.json
          if git diff --cached --name-only | grep -E '^data/static/v1/days/'; then
            echo "HEARTBEAT_STAGED_RAW_HISTORY" >&2
            exit 74
          fi
          if git diff --cached --quiet; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "HEARTBEAT_NO_DERIVED_CHANGES"
            exit 0
          fi
          git commit -m "data: heartbeat dirty batch"
          # Rebuild-only output is published from the job, never committed by this workflow.
          git restore --worktree -- data/static/v1
          index_file="$(mktemp)"
          trap 'rm -f "$index_file"' EXIT
          allowed_paths='config/curation-overrides.json|data/review/heartbeat-state.json|data/review/heartbeat-summary.json'
          for attempt in 1 2 3 4 5; do
            git fetch --depth=1 origin main
            base="$(git rev-parse FETCH_HEAD)"
            GIT_INDEX_FILE="$index_file" git read-tree "$base"
            for path in config/curation-overrides.json data/review/heartbeat-state.json data/review/heartbeat-summary.json; do
              mode="$(git ls-files -s -- "$path" | awk 'NR == 1 { print $1 }')"
              blob="$(git hash-object -w "$path")"
              GIT_INDEX_FILE="$index_file" git update-index --add --cacheinfo "$mode,$blob,$path"
            done
            tree="$(GIT_INDEX_FILE="$index_file" git write-tree)"
            commit="$(git commit-tree "$tree" -p "$base" -m "data: heartbeat dirty batch")"
            mapfile -t paths < <(git diff --name-only "$base" "$commit")
            for path in "${paths[@]}"; do
              if [[ ! "$path" =~ ^($allowed_paths)$ ]]; then
                echo "HEARTBEAT_TRANSPLANT_UNEXPECTED_PATH path=$path" >&2
                exit 76
              fi
            done
            if git push origin "$commit:main"; then
              echo "updated=true" >> "$GITHUB_OUTPUT"
              echo "commit=$commit" >> "$GITHUB_OUTPUT"
              echo "HEARTBEAT_PUSHED commit=$commit attempt=$attempt"
              exit 0
            fi
            echo "HEARTBEAT_PUSH_RACE retry=$attempt"
            sleep $((attempt * 3))
          done
          echo "HEARTBEAT_PUSH_RACE_EXHAUSTED" >&2
          exit 77

      - name: Dispatch Pages and verify the published snapshot
        id: publish
        if: steps.commit.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DATA_COMMIT: ${{ steps.commit.outputs.commit }}
          EXPECTED_GENERATED_AT: ${{ steps.batch.outputs.expected_generated_at }}
          EXPECTED_META_SHA: ${{ steps.batch.outputs.expected_meta_sha }}
        run: |
          set -Eeuo pipefail
          data_commit="$DATA_COMMIT"
          [[ "$data_commit" =~ ^[0-9a-f]{40}$ ]] || {
            echo "HEARTBEAT_INVALID_DATA_COMMIT value=$data_commit" >&2
            exit 78
          }
          expected_generated_at="$EXPECTED_GENERATED_AT"
          expected_meta_sha="$EXPECTED_META_SHA"
          [[ -n "$expected_generated_at" ]] || {
            echo "HEARTBEAT_MISSING_EXPECTED_GENERATED_AT" >&2
            exit 78
          }
          [[ "$expected_meta_sha" =~ ^[0-9a-f]{64}$ ]] || {
            echo "HEARTBEAT_INVALID_EXPECTED_META_SHA value=$expected_meta_sha" >&2
            exit 78
          }
          before_deploy="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-pages.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0' 2>/dev/null || printf '0')"
          gh workflow run deploy-pages.yml --ref main
          deploy_id=""
          for find_attempt in $(seq 1 36); do
            latest_deploy="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-pages.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0' 2>/dev/null || printf '0')"
            if [[ "$latest_deploy" != "$before_deploy" && "$latest_deploy" =~ ^[0-9]+$ ]]; then
              deploy_id="$latest_deploy"
              break
            fi
            sleep 5
          done
          [[ -n "$deploy_id" ]] || {
            echo "HEARTBEAT_PAGES_DISPATCH_NOT_FOUND" >&2
            exit 78
          }
          echo "HEARTBEAT_PAGES_DISPATCH id=$deploy_id data_commit=$data_commit"

          deploy_relation() {
            gh api "repos/$GITHUB_REPOSITORY/compare/$data_commit...$1" --jq '.status' 2>/dev/null || true
          }

          find_superseding_success() {
            local rows id sha relation
            rows="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-pages.yml --limit 30 --json databaseId,status,conclusion,headSha --jq '.[] | select(.status == "completed" and .conclusion == "success") | [.databaseId,.headSha] | @tsv' 2>/dev/null || true)"
            while IFS=$'\t' read -r id sha; do
              [[ -n "$id" && -n "$sha" && "$id" != "$deploy_id" ]] || continue
              relation="$(deploy_relation "$sha")"
              if [[ "$relation" == "ahead" || "$relation" == "identical" ]]; then
                SUPERSEDING_ID="$id"
                SUPERSEDING_SHA="$sha"
                return 0
              fi
            done <<< "$rows"
            return 1
          }

          find_live_descendant_meta() {
            local rows sha candidate_meta candidate_sha candidate_generated_at
            rows="$(gh api "repos/$GITHUB_REPOSITORY/compare/$data_commit...main" --jq '.commits | reverse | .[].sha' 2>/dev/null || true)"
            while read -r sha; do
              [[ -n "$sha" ]] || continue
              candidate_meta="$(curl -fsSL --max-time 20 "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$sha/data/static/v1/meta.json" 2>/dev/null || true)"
              [[ -n "$candidate_meta" ]] || continue
              candidate_sha="$(printf '%s' "$candidate_meta" | jq -S -c 'del(.generatedAt)' 2>/dev/null | sha256sum | awk '{print $1}')"
              if [[ "$candidate_sha" == "$live_meta_sha" ]]; then
                candidate_generated_at="$(printf '%s' "$candidate_meta" | jq -er '.generatedAt' 2>/dev/null || true)"
                [[ -n "$candidate_generated_at" ]] || continue
                LIVE_DESCENDANT_SHA="$sha"
                LIVE_DESCENDANT_GENERATED_AT="$candidate_generated_at"
                return 0
              fi
            done <<< "$rows"
            return 1
          }

          failed_attempts=0
          for attempt in $(seq 1 180); do
            status="$(gh run view "$deploy_id" --repo "$GITHUB_REPOSITORY" --json status,conclusion --jq '.status + ":" + (.conclusion // "none")' 2>/dev/null || true)"
            if [[ "$status" == "completed:success" ]]; then
              deployed_sha="$(gh run view "$deploy_id" --repo "$GITHUB_REPOSITORY" --json headSha --jq '.headSha')"
            elif [[ "$status" == "completed:failure" || "$status" == "completed:cancelled" ]]; then
              failed_attempts=$((failed_attempts + 1))
              if find_superseding_success; then
                deploy_id="$SUPERSEDING_ID"
                deployed_sha="$SUPERSEDING_SHA"
                echo "HEARTBEAT_PAGES_SUPERSEDED id=$deploy_id data_commit=$data_commit deployed_sha=$deployed_sha"
              elif (( failed_attempts >= 36 )); then
                # A concurrent deployment can finish just after the last polling iteration.
                # Recheck successful descendants once before declaring the bounded wait failed.
                echo "HEARTBEAT_PAGES_GRACE id=$deploy_id status=$status"
                sleep 12
                if find_superseding_success; then
                  deploy_id="$SUPERSEDING_ID"
                  deployed_sha="$SUPERSEDING_SHA"
                  echo "HEARTBEAT_PAGES_SUPERSEDED id=$deploy_id data_commit=$data_commit deployed_sha=$deployed_sha grace=true"
                else
                  echo "HEARTBEAT_PAGES_FAILED id=$deploy_id status=$status" >&2
                  exit 78
                fi
              else
                sleep 5
                continue
              fi
            else
              sleep 5
              continue
            fi

            if [[ "$deployed_sha" != "$data_commit" ]]; then
              relation="$(deploy_relation "$deployed_sha")"
              if [[ "$relation" != "ahead" && "$relation" != "identical" ]]; then
                echo "HEARTBEAT_PAGES_SHA_MISMATCH expected=$data_commit actual=$deployed_sha relation=${relation:-unknown}" >&2
                exit 78
              fi
              echo "HEARTBEAT_PAGES_DESCENDANT data_commit=$data_commit deployed_sha=$deployed_sha relation=$relation"
            fi
            live_payload_seen=false
            live_meta_seen=false
            live_meta_sha=""
            live_generated_at=""
            # Pages can serve the previous artifact for several minutes after a successful deployment.
            for live_attempt in $(seq 1 72); do
              live_meta="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://marica7731.github.io/daily-song-list/data/static/v1/meta.json?heartbeat=$data_commit&attempt=$live_attempt" 2>/dev/null || true)"
              if [[ -n "$live_meta" ]]; then
                live_payload_seen=true
                if printf '%s' "$live_meta" | jq -e . >/dev/null 2>&1; then
                  live_meta_seen=true
                  live_generated_at="$(printf '%s' "$live_meta" | jq -er '.generatedAt')"
                  live_meta_sha="$(printf '%s' "$live_meta" | jq -S -c 'del(.generatedAt)' | sha256sum | awk '{print $1}')"
                  if [[ "$live_meta_sha" == "$expected_meta_sha" ]]; then
                    generated_at="$live_generated_at"
                    echo "HEARTBEAT_PAGES_OK id=$deploy_id generatedAt=$generated_at metaSha=$live_meta_sha attempt=$live_attempt"
                    echo "deploy_run_id=$deploy_id" >> "$GITHUB_OUTPUT"
                    echo "generated_at=$generated_at" >> "$GITHUB_OUTPUT"
                    echo "meta_sha=$live_meta_sha" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  echo "HEARTBEAT_PAGES_STALE attempt=$live_attempt expected=$expected_meta_sha actual=$live_meta_sha generatedAt=$live_generated_at"
                  if (( live_attempt % 6 == 0 )) && find_live_descendant_meta; then
                    generated_at="$LIVE_DESCENDANT_GENERATED_AT"
                    echo "HEARTBEAT_PAGES_OK source=descendant sha=$LIVE_DESCENDANT_SHA id=$deploy_id generatedAt=$generated_at metaSha=$live_meta_sha attempt=$live_attempt"
                    echo "deploy_run_id=$deploy_id" >> "$GITHUB_OUTPUT"
                    echo "generated_at=$generated_at" >> "$GITHUB_OUTPUT"
                    echo "meta_sha=$live_meta_sha" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                fi
              fi
              sleep 5
            done

            if [[ "$live_payload_seen" == "true" && "$live_meta_seen" == "true" ]]; then
              # A concurrent Pages deployment can finish just after the six-minute live loop.
              # Keep a bounded grace window so a verified successor is not rejected by one minute.
              echo "HEARTBEAT_PAGES_LIVE_GRACE id=$deploy_id expected=$expected_meta_sha actual=${live_meta_sha:-none}"
              for grace_attempt in $(seq 1 36); do
                sleep 5
                live_meta="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://marica7731.github.io/daily-song-list/data/static/v1/meta.json?heartbeat=$data_commit&grace=$grace_attempt" 2>/dev/null || true)"
                if [[ -n "$live_meta" ]] && printf '%s' "$live_meta" | jq -e . >/dev/null 2>&1; then
                  live_generated_at="$(printf '%s' "$live_meta" | jq -er '.generatedAt')"
                  live_meta_sha="$(printf '%s' "$live_meta" | jq -S -c 'del(.generatedAt)' | sha256sum | awk '{print $1}')"
                  if [[ "$live_meta_sha" == "$expected_meta_sha" ]]; then
                    generated_at="$live_generated_at"
                    echo "HEARTBEAT_PAGES_OK id=$deploy_id generatedAt=$generated_at metaSha=$live_meta_sha attempt=grace$grace_attempt"
                    echo "deploy_run_id=$deploy_id" >> "$GITHUB_OUTPUT"
                    echo "generated_at=$generated_at" >> "$GITHUB_OUTPUT"
                    echo "meta_sha=$live_meta_sha" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  echo "HEARTBEAT_PAGES_STALE attempt=grace$grace_attempt expected=$expected_meta_sha actual=$live_meta_sha generatedAt=$live_generated_at"
                  if (( grace_attempt % 6 == 0 )) && find_live_descendant_meta; then
                    generated_at="$LIVE_DESCENDANT_GENERATED_AT"
                    echo "HEARTBEAT_PAGES_OK source=descendant sha=$LIVE_DESCENDANT_SHA id=$deploy_id generatedAt=$generated_at metaSha=$live_meta_sha attempt=grace$grace_attempt"
                    echo "deploy_run_id=$deploy_id" >> "$GITHUB_OUTPUT"
                    echo "generated_at=$generated_at" >> "$GITHUB_OUTPUT"
                    echo "meta_sha=$live_meta_sha" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                fi
              done
            fi
            if [[ "$live_payload_seen" == "true" ]]; then
              if [[ "$live_meta_seen" == "true" ]]; then
                if find_live_descendant_meta; then
                  generated_at="$LIVE_DESCENDANT_GENERATED_AT"
                  echo "HEARTBEAT_PAGES_OK source=descendant sha=$LIVE_DESCENDANT_SHA id=$deploy_id generatedAt=$generated_at metaSha=$live_meta_sha attempt=final"
                  echo "deploy_run_id=$deploy_id" >> "$GITHUB_OUTPUT"
                  echo "generated_at=$generated_at" >> "$GITHUB_OUTPUT"
                  echo "meta_sha=$live_meta_sha" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                echo "HEARTBEAT_PAGES_META_MISMATCH expected=$expected_meta_sha actual=${live_meta_sha:-none}" >&2
              else
                echo "HEARTBEAT_PAGES_META_INVALID" >&2
              fi
              exit 78
            fi
            generated_at="$expected_generated_at"
            echo "::warning title=Live Pages edge unavailable::Using the successful Pages deployment commit and this run's rebuilt meta.json digest for bounded verification."
            echo "HEARTBEAT_PAGES_EDGE_UNAVAILABLE id=$deploy_id generatedAt=$generated_at metaSha=$expected_meta_sha fallback=rebuilt"
            echo "deploy_run_id=$deploy_id" >> "$GITHUB_OUTPUT"
            echo "generated_at=$generated_at" >> "$GITHUB_OUTPUT"
            echo "meta_sha=$expected_meta_sha" >> "$GITHUB_OUTPUT"
            exit 0
          done
          echo "HEARTBEAT_PAGES_TIMEOUT id=$deploy_id" >&2
          exit 79

      - name: Publish evidence
        if: always()
        env:
          SELECTED: ${{ steps.batch.outputs.selected }}
          SHOULD_PUBLISH: ${{ steps.batch.outputs.should_publish }}
          UPDATED: ${{ steps.commit.outputs.updated }}
          DEPLOY_RUN_ID: ${{ steps.publish.outputs.deploy_run_id }}
          GENERATED_AT: ${{ steps.publish.outputs.generated_at }}
        run: |
          {
            echo "### Heartbeat dirty data batch"
            echo "- trigger: ${{ github.event_name }}"
            echo "- input scope: ${{ steps.input.outputs.scope }}"
            echo "- input types: ${{ steps.input.outputs.types }}"
            echo "- selected: ${SELECTED:-0}"
            echo "- should publish: ${SHOULD_PUBLISH:-false}"
            echo "- updated: ${UPDATED:-false}"
            echo "- Pages run: ${DEPLOY_RUN_ID:-not-dispatched}"
            echo "- live generatedAt: ${GENERATED_AT:-not-checked}"
          } >> "$GITHUB_STEP_SUMMARY"
