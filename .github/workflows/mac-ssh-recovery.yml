name: Temporary Mac SSH recovery

run-name: Mac SSH recovery (${{ inputs.mode }})

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Diagnose first; repair only after controller review
        required: true
        default: diagnose
        type: choice
        options:
          - diagnose
          - repair

permissions:
  contents: read

concurrency:
  group: temporary-mac-ssh-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Diagnose or repair Mac SSH
    runs-on: [self-hosted, macOS, ARM64, daily-song-list-mac]
    timeout-minutes: 10
    steps:
      - name: Inspect and optionally repair SSH
        shell: bash
        env:
          RECOVERY_MODE: ${{ inputs.mode }}
          RECOVERY_PUBLIC_KEY: ${{ secrets.CODEX_TEMP_MAC_SSH_RECOVERY_PUBLIC_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077

          target_user="be"
          target_home="/Users/be"
          ssh_dir="${target_home}/.ssh"
          auth_file="${ssh_dir}/authorized_keys"

          if [[ "${RECOVERY_MODE}" != "diagnose" && "${RECOVERY_MODE}" != "repair" ]]; then
            echo "MAC_SSH_RECOVERY_INVALID_MODE"
            exit 64
          fi

          if ! /usr/bin/dscl . -read "/Users/${target_user}" NFSHomeDirectory >/dev/null 2>&1; then
            echo "MAC_SSH_RECOVERY_TARGET_USER_MISSING"
            exit 65
          fi
          actual_home="$(/usr/bin/dscl . -read "/Users/${target_user}" NFSHomeDirectory | /usr/bin/awk '{print $2}')"
          if [[ "${actual_home}" != "${target_home}" ]]; then
            echo "MAC_SSH_RECOVERY_HOME_MISMATCH actual=${actual_home}"
            exit 65
          fi

          public_key_line_count="$(printf '%s\n' "${RECOVERY_PUBLIC_KEY}" | /usr/bin/awk 'NF { count += 1 } END { print count + 0 }')"
          public_key_type="$(printf '%s\n' "${RECOVERY_PUBLIC_KEY}" | /usr/bin/awk 'NF { print $1; exit }')"
          public_key_body="$(printf '%s\n' "${RECOVERY_PUBLIC_KEY}" | /usr/bin/awk 'NF { print $2; exit }')"
          if [[ "${public_key_line_count}" != "1" || "${public_key_type}" != "ssh-ed25519" || ! "${public_key_body}" =~ ^[A-Za-z0-9+/]+={0,3}$ ]]; then
            echo "MAC_SSH_RECOVERY_PUBLIC_KEY_INVALID"
            exit 66
          fi
          canonical_public_key="${public_key_type} ${public_key_body}"
          public_key_fingerprint="$(printf '%s\n' "${canonical_public_key}" | /usr/bin/ssh-keygen -lf - | /usr/bin/awk '{print $2}')"

          runner_user="$(/usr/bin/id -un)"
          default_interface="$(/sbin/route -n get default 2>/dev/null | /usr/bin/awk '/interface:/{print $2; exit}')"
          lan_ip=""
          if [[ -n "${default_interface}" ]]; then
            lan_ip="$(/usr/sbin/ipconfig getifaddr "${default_interface}" 2>/dev/null || true)"
          fi
          if [[ -z "${lan_ip}" ]]; then
            for candidate_interface in en0 en1; do
              lan_ip="$(/usr/sbin/ipconfig getifaddr "${candidate_interface}" 2>/dev/null || true)"
              [[ -n "${lan_ip}" ]] && break
            done
          fi

          sudo_available=false
          if /usr/bin/sudo -n true >/dev/null 2>&1; then
            sudo_available=true
          fi

          echo "MAC_SSH_DIAG runner_user=${runner_user} target_user=${target_user} default_interface=${default_interface:-unknown} lan_ip=${lan_ip:-unknown} sudo_available=${sudo_available}"
          echo "MAC_SSH_DIAG public_key_fingerprint=${public_key_fingerprint}"

          remote_login_rc=0
          set +e
          if [[ "${sudo_available}" == "true" ]]; then
            remote_login_output="$(/usr/bin/sudo -n /usr/sbin/systemsetup -getremotelogin 2>&1)"
            remote_login_rc=$?
          else
            remote_login_output="$(/usr/sbin/systemsetup -getremotelogin 2>&1)"
            remote_login_rc=$?
          fi
          set -e
          remote_login_output="$(printf '%s' "${remote_login_output}" | /usr/bin/tr '\n' ' ' | /usr/bin/cut -c1-240)"
          echo "MAC_SSH_DIAG remote_login_rc=${remote_login_rc} remote_login=${remote_login_output}"

          sshd_config_rc=0
          set +e
          if [[ "${sudo_available}" == "true" ]]; then
            sshd_config_output="$(/usr/bin/sudo -n /usr/sbin/sshd -t 2>&1)"
            sshd_config_rc=$?
          else
            sshd_config_output="$(/usr/sbin/sshd -t 2>&1)"
            sshd_config_rc=$?
          fi
          set -e
          sshd_config_output="$(printf '%s' "${sshd_config_output}" | /usr/bin/tr '\n' ' ' | /usr/bin/cut -c1-400)"
          echo "MAC_SSH_DIAG sshd_config_rc=${sshd_config_rc} sshd_config=${sshd_config_output:-ok}"

          listener_rc=0
          set +e
          if [[ "${sudo_available}" == "true" ]]; then
            listener_output="$(/usr/bin/sudo -n /usr/sbin/lsof -nP -iTCP:22 -sTCP:LISTEN 2>&1)"
            listener_rc=$?
          else
            listener_output="$(/usr/sbin/lsof -nP -iTCP:22 -sTCP:LISTEN 2>&1)"
            listener_rc=$?
          fi
          set -e
          listener_summary="$(printf '%s\n' "${listener_output}" | /usr/bin/awk 'NR == 1 || NR == 2 { printf "%s%s", separator, $0; separator=" | " }' | /usr/bin/cut -c1-400)"
          echo "MAC_SSH_DIAG listener_rc=${listener_rc} listener=${listener_summary:-none}"

          auth_exists=false
          auth_owner="missing"
          auth_mode="missing"
          auth_entries=0
          target_key_present=false
          if [[ -e "${auth_file}" ]]; then
            auth_exists=true
            auth_owner="$(/usr/bin/stat -f '%Su:%Sg' "${auth_file}")"
            auth_mode="$(/usr/bin/stat -f '%Lp' "${auth_file}")"
            auth_entries="$(/usr/bin/awk 'NF && $1 !~ /^#/ { count += 1 } END { print count + 0 }' "${auth_file}")"
            if /usr/bin/grep -Fq "${public_key_body}" "${auth_file}"; then
              target_key_present=true
            fi
          fi
          ssh_dir_owner="missing"
          ssh_dir_mode="missing"
          if [[ -d "${ssh_dir}" ]]; then
            ssh_dir_owner="$(/usr/bin/stat -f '%Su:%Sg' "${ssh_dir}")"
            ssh_dir_mode="$(/usr/bin/stat -f '%Lp' "${ssh_dir}")"
          fi
          echo "MAC_SSH_DIAG ssh_dir_owner=${ssh_dir_owner} ssh_dir_mode=${ssh_dir_mode} auth_exists=${auth_exists} auth_owner=${auth_owner} auth_mode=${auth_mode} auth_entries=${auth_entries} target_key_present=${target_key_present}"

          launchd_rc=0
          set +e
          launchd_output="$(/bin/launchctl print system/com.openssh.sshd 2>&1)"
          launchd_rc=$?
          set -e
          launchd_summary="$(printf '%s\n' "${launchd_output}" | /usr/bin/awk '/state =|path =|last exit code =|program =/ { printf "%s%s", separator, $0; separator=" | " }' | /usr/bin/cut -c1-400)"
          echo "MAC_SSH_DIAG launchd_rc=${launchd_rc} launchd=${launchd_summary:-unavailable}"

          if [[ "${RECOVERY_MODE}" == "diagnose" ]]; then
            echo "MAC_SSH_DIAG_COMPLETE"
            exit 0
          fi

          if [[ "${sshd_config_rc}" != "0" ]]; then
            echo "MAC_SSH_REPAIR_BLOCKED_INVALID_SSHD_CONFIG"
            exit 67
          fi

          timestamp="$(/bin/date -u +%Y%m%dT%H%M%SZ)"
          backup_path="none"
          key_action="already-present"

          if [[ "${runner_user}" == "${target_user}" ]]; then
            /usr/bin/install -d -m 700 "${ssh_dir}"
            if [[ -e "${auth_file}" ]]; then
              backup_path="${auth_file}.codex-recovery-backup-${GITHUB_RUN_ID}-${timestamp}"
              /bin/cp -p "${auth_file}" "${backup_path}"
            else
              : > "${auth_file}"
            fi
            if ! /usr/bin/grep -Fq "${public_key_body}" "${auth_file}"; then
              printf '%s\n' "${canonical_public_key}" >> "${auth_file}"
              key_action="appended"
            fi
            /bin/chmod 700 "${ssh_dir}"
            /bin/chmod 600 "${auth_file}"
          else
            if [[ "${sudo_available}" != "true" ]]; then
              echo "MAC_SSH_REPAIR_BLOCKED_TARGET_USER_AND_NO_SUDO"
              exit 68
            fi
            /usr/bin/sudo -n /usr/bin/install -d -m 700 -o "${target_user}" -g staff "${ssh_dir}"
            if /usr/bin/sudo -n /usr/bin/test -e "${auth_file}"; then
              backup_path="${auth_file}.codex-recovery-backup-${GITHUB_RUN_ID}-${timestamp}"
              /usr/bin/sudo -n /bin/cp -p "${auth_file}" "${backup_path}"
            else
              /usr/bin/sudo -n /usr/bin/touch "${auth_file}"
            fi
            if ! /usr/bin/sudo -n /usr/bin/grep -Fq "${public_key_body}" "${auth_file}"; then
              printf '%s\n' "${canonical_public_key}" | /usr/bin/sudo -n /usr/bin/tee -a "${auth_file}" >/dev/null
              key_action="appended"
            fi
            /usr/bin/sudo -n /usr/sbin/chown -R "${target_user}:staff" "${ssh_dir}"
            /usr/bin/sudo -n /bin/chmod 700 "${ssh_dir}"
            /usr/bin/sudo -n /bin/chmod 600 "${auth_file}"
          fi

          if [[ "${sudo_available}" == "true" ]]; then
            /usr/bin/sudo -n /usr/sbin/systemsetup -setremotelogin on >/dev/null
            /usr/bin/sudo -n /usr/sbin/sshd -t
            /usr/bin/sudo -n /bin/launchctl kickstart -k system/com.openssh.sshd
          fi

          if ! /usr/bin/grep -Fq "${public_key_body}" "${auth_file}"; then
            echo "MAC_SSH_REPAIR_KEY_VERIFY_FAILED"
            exit 69
          fi
          final_ssh_dir_mode="$(/usr/bin/stat -f '%Lp' "${ssh_dir}")"
          final_auth_mode="$(/usr/bin/stat -f '%Lp' "${auth_file}")"
          if [[ "${final_ssh_dir_mode}" != "700" || "${final_auth_mode}" != "600" ]]; then
            echo "MAC_SSH_REPAIR_MODE_VERIFY_FAILED ssh_dir=${final_ssh_dir_mode} auth=${final_auth_mode}"
            exit 69
          fi

          echo "MAC_SSH_REPAIR_COMPLETE key_action=${key_action} backup_path=${backup_path} lan_ip=${lan_ip:-unknown} sudo_available=${sudo_available}"
