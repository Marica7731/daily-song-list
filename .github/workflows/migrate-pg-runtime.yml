name: Migrate PostgreSQL runtime candidate

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "migrate-pg or restore-sqlite (verified previous active only)"
        required: true
        default: migrate-pg
        type: choice
        options:
          - migrate-pg
          - restore-sqlite
      activate:
        description: Activate after candidate/API checks (set true only for an approved release window)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: daily-song-list-pg-runtime-migration
  cancel-in-progress: false

jobs:
  restore:
    if: ${{ inputs.mode == 'restore-sqlite' }}
    runs-on: [self-hosted, macOS, ARM64, daily-song-list-mac]
    timeout-minutes: 45
    env:
      VPS2_HOST: "192.255.151.75"
      VPS2_USER: "root"
      REMOTE_STATE_DIR: "/var/lib/culua/ytb-song-rank"
      SOURCE_DB: "/Users/be/actions-runner-cache/daily-song-list-runtime-db/song-rank.sqlite"
      EXPECTED_BYTES: "14829768704"
      EXPECTED_SHA256: "858041e58988b35f9a60b96ec15668ecb907de41b2b7373a37b4c5e2872fc5b0"
    steps:
      - name: Configure bounded restore root
        run: |
          set -Eeuo pipefail
          TASK_ROOT="$(mktemp -d "${RUNNER_TEMP}/daily-song-list-sqlite-restore.XXXXXX")"
          printf 'TASK_ROOT=%s\n' "$TASK_ROOT" >> "$GITHUB_ENV"
          printf 'startedAt=%s\nexpectedBytes=%s\nexpectedSha256=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$EXPECTED_BYTES" "$EXPECTED_SHA256" > "$TASK_ROOT/restore-limits.txt"
          df -k / > "$TASK_ROOT/mac-df-baseline.txt"

      - name: Prepare password SSH helper
        env:
          VPS2_PASSWORD: ${{ secrets.VPS2_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$VPS2_PASSWORD"
          mkdir -p "$RUNNER_TEMP/ssh-askpass"
          cat > "$RUNNER_TEMP/ssh-askpass/vps2-askpass.sh" <<'SH'
          #!/bin/sh
          printf '%s\n' "${VPS2_PASSWORD}"
          SH
          chmod 700 "$RUNNER_TEMP/ssh-askpass/vps2-askpass.sh"
          {
            echo "SSH_ASKPASS=$RUNNER_TEMP/ssh-askpass/vps2-askpass.sh"
            echo "SSH_ASKPASS_REQUIRE=force"
            echo "DISPLAY=codex:0"
          } >> "$GITHUB_ENV"

      - name: Preflight verified rollback source and empty target
        run: |
          set -Eeuo pipefail
          test -f "$SOURCE_DB"
          source_bytes="$(stat -f%z "$SOURCE_DB")"
          source_sha="$(shasum -a 256 "$SOURCE_DB" | cut -d' ' -f1)"
          test "$source_bytes" = "$EXPECTED_BYTES"
          test "$source_sha" = "$EXPECTED_SHA256"
          remote_probe="$(ssh -o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no "$VPS2_USER@$VPS2_HOST" "free=\$(df -B1 --output=avail '$REMOTE_STATE_DIR' | tail -n 1 | tr -d '[:space:]'); old=0; part=0; test -f '$REMOTE_STATE_DIR/song-rank.sqlite' && old=\$(stat -c%s '$REMOTE_STATE_DIR/song-rank.sqlite') || true; test -f '$REMOTE_STATE_DIR/song-rank.sqlite.restore.part' && part=\$(stat -c%s '$REMOTE_STATE_DIR/song-rank.sqlite.restore.part') || true; printf '%s %s %s\\n' \"\$free\" \"\$old\" \"\$part\"")"
          read -r remote_free remote_old remote_part <<< "$remote_probe"
          printf 'sourceBytes=%s\nsourceSha256=%s\nremoteFreeBefore=%s\nremoteOldBytes=%s\nremotePartBytes=%s\n' "$source_bytes" "$source_sha" "$remote_free" "$remote_old" "$remote_part" > "$TASK_ROOT/preflight.txt"
          test "$remote_old" = "0" || { echo "SQLITE_RESTORE_BLOCKED target_exists_bytes=$remote_old"; exit 78; }
          test "$remote_part" = "0" || { echo "SQLITE_RESTORE_BLOCKED stale_part_bytes=$remote_part"; exit 78; }
          test "$remote_free" -ge "$EXPECTED_BYTES" || { echo "SQLITE_RESTORE_BLOCKED insufficient_remote_free=$remote_free"; exit 78; }
      - name: Stream verified previous active in bounded chunks
        timeout-minutes: 40
        run: |
          set -Eeuo pipefail
          REMOTE_DB="$REMOTE_STATE_DIR/song-rank.sqlite"
          REMOTE_PART="$REMOTE_DB.restore.part"
          chunk_bytes=134217728
          chunk_count=$(( (EXPECTED_BYTES + chunk_bytes - 1) / chunk_bytes ))
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              ssh -o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no "$VPS2_USER@$VPS2_HOST" "rm -f -- '$REMOTE_PART'" || true
            fi
            before_bytes=0
            if [ -d "$TASK_ROOT" ]; then before_bytes=$(( $(du -sk "$TASK_ROOT" | cut -f1) * 1024 )); fi
            df -k / > "$TASK_ROOT/mac-df-after.txt" 2>/dev/null || true
            echo "SQLITE_RESTORE_CLEANUP status=$status beforeBytes=$before_bytes retained=for-upload"
            exit "$status"
          }
          trap cleanup EXIT INT TERM
          ssh -o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no "$VPS2_USER@$VPS2_HOST" "rm -f -- '$REMOTE_PART'; install -m 0600 /dev/null '$REMOTE_PART'"
          for ((index=0; index<chunk_count; index++)); do
            base=$(( index * chunk_bytes ))
            remaining=$(( EXPECTED_BYTES - base ))
            take=$chunk_bytes
            [ "$remaining" -lt "$take" ] && take="$remaining"
            dd if="$SOURCE_DB" bs="$chunk_bytes" skip="$index" count=1 2>/dev/null |
              ssh -o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no "$VPS2_USER@$VPS2_HOST" "cat >> '$REMOTE_PART'; stat -c%s '$REMOTE_PART'" > "$TASK_ROOT/chunk-size.txt"
            remote_written="$(tail -n 1 "$TASK_ROOT/chunk-size.txt")"
            written=$(( base + take ))
            test "$remote_written" = "$written"
            printf 'chunk=%s/%s bytes=%s expected=%s\n' "$((index + 1))" "$chunk_count" "$remote_written" "$EXPECTED_BYTES" | tee -a "$TASK_ROOT/restore-checkpoint.log"
          done
          remote_sha="$(ssh -o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no "$VPS2_USER@$VPS2_HOST" "sha256sum '$REMOTE_PART' | cut -d' ' -f1")"
          test "$remote_sha" = "$EXPECTED_SHA256"
          ssh -o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no "$VPS2_USER@$VPS2_HOST" "mv -- '$REMOTE_PART' '$REMOTE_DB'; chown www-data:www-data '$REMOTE_DB'; chmod 0644 '$REMOTE_DB'; systemctl start song-rank-api; curl --fail --max-time 10 http://127.0.0.1:8765/healthz; curl --fail --max-time 10 http://127.0.0.1:8765/api/meta >/dev/null; curl --fail --max-time 10 \"http://127.0.0.1:8765/api/rankings?range=all&view=songs&metric=occurrences&page=1&pageSize=1\" >/dev/null"
          printf 'remoteBytes=%s\nremoteSha256=%s\nchunkBytes=%s\nchunkCount=%s\nrestoredAt=%s\n' "$EXPECTED_BYTES" "$remote_sha" "$chunk_bytes" "$chunk_count" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$TASK_ROOT/restore-report.txt"
      - name: Upload bounded restore evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-rollback-evidence-${{ github.run_id }}
          path: ${{ env.TASK_ROOT }}
          if-no-files-found: ignore
          retention-days: 7


      - name: Cleanup bounded restore root and partial target
        if: always()
        run: |
          set +e
          ssh -o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no "$VPS2_USER@$VPS2_HOST" "rm -f -- '$REMOTE_STATE_DIR/song-rank.sqlite.restore.part'" || true
          if [ -n "${TASK_ROOT:-}" ] && [ -d "$TASK_ROOT" ]; then
            df -k / > "$TASK_ROOT/mac-df-cleanup.txt" 2>/dev/null || true
            rm -rf -- ""
          fi
  migrate:
    if: ${{ inputs.mode != 'restore-sqlite' }}
    runs-on: [self-hosted, macOS, ARM64, daily-song-list-mac]
    timeout-minutes: 240
    env:
      VPS2_HOST: "192.255.151.75"
      VPS2_USER: "root"
      REMOTE_STATE_DIR: "/var/lib/culua/ytb-song-rank"
      SOURCE_DB: "/Users/be/actions-runner-cache/daily-song-list-runtime-db/song-rank.sqlite"
      EXPECTED_PG_PEAK_BYTES: "23622320128"
      PG_HARD_CAP_BYTES: "30064771072"
    steps:
      - name: Configure Mac toolchain and task root
        run: |
          set -Eeuo pipefail
          echo "/Users/be/.local/bin" >> "$GITHUB_PATH"
          echo "/Users/be/.local/codex-toolchains/python312/bin" >> "$GITHUB_PATH"
          TASK_ROOT="$(mktemp -d /tmp/daily-song-list-pg-runtime.XXXXXX)"
          printf 'TASK_ROOT=%s\n' "$TASK_ROOT" >> "$GITHUB_ENV"
          printf 'REVISION=full_runtime_%s_%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          printf 'startedAt=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$TASK_ROOT/state.txt"
          df -k / > "$TASK_ROOT/mac-df-baseline.txt"
          printf 'expectedPeakBytes=%s\nhardCapBytes=%s\nsourceDb=%s\n' "$EXPECTED_PG_PEAK_BYTES" "$PG_HARD_CAP_BYTES" "$SOURCE_DB" > "$TASK_ROOT/limits.txt"

      - name: Download migration files into task root
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          MIGRATION_ROOT="$TASK_ROOT/repo"
          printf 'MIGRATION_ROOT=%s\n' "$MIGRATION_ROOT" >> "$GITHUB_ENV"
          files=(
            scripts/migration/pg-schema.sql
            scripts/migration/export-runtime-tables.py
            scripts/migration/import-runtime-tables.py
            scripts/migration/activate-pg-candidate.py
            server/pg_adapter.py
            server/pg_api_server.py
            deploy/vps2/song-rank-pg-api.service
          )
          for path in "${files[@]}"; do
            target="$MIGRATION_ROOT/$path"
            mkdir -p "$(dirname "$target")"
            curl --fail --silent --show-error --location --retry 2 --max-time 30 \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/$path" \
              -o "$target"
          done
          find "$MIGRATION_ROOT" -type f -print | sort > "$TASK_ROOT/downloaded-files.txt"

      - name: Prepare password SSH helper
        env:
          VPS2_PASSWORD: ${{ secrets.VPS2_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$VPS2_PASSWORD"
          mkdir -p "$RUNNER_TEMP/ssh-askpass"
          cat > "$RUNNER_TEMP/ssh-askpass/vps2-askpass.sh" <<'SH'
          #!/bin/sh
          printf '%s\n' "${VPS2_PASSWORD}"
          SH
          chmod 700 "$RUNNER_TEMP/ssh-askpass/vps2-askpass.sh"
          {
            echo "SSH_ASKPASS=$RUNNER_TEMP/ssh-askpass/vps2-askpass.sh"
            echo "SSH_ASKPASS_REQUIRE=force"
            echo "DISPLAY=codex:0"
          } >> "$GITHUB_ENV"

      - name: Verify input and preflight storage
        id: preflight
        timeout-minutes: 10
        run: |
          set -Eeuo pipefail
          test -f "$SOURCE_DB"
          bytes="$(stat -f%z "$SOURCE_DB")"
          sha="$(shasum -a 256 "$SOURCE_DB" | awk '{print $1}')"
          sqlite_value() { python3 - "$SOURCE_DB" "$1" <<'PY'
          import sqlite3, sys
          db, key = sys.argv[1:]
          with sqlite3.connect(f"file:{db}?mode=ro", uri=True) as conn:
              row = conn.execute("select value from meta where key=?", (key,)).fetchone()
          print(row[0] if row else "")
          PY
          }
          source_commit="$(sqlite_value source_commit_sha)"
          source_latest_sha="$(sqlite_value source_latest_sha256)"
          videos="$(sqlite_value latest_videos)"
          occurrences="$(sqlite_value latest_occurrences)"
          cat > "$TASK_ROOT/manifest.json" <<JSON
          {"schemaVersion":1,"sourceKind":"mac-runtime-sqlite-stream","sourceDbBytes":$bytes,"sourceDbSha256":"$sha","sourceCommit":"$source_commit","sourceLatestSha256":"$source_latest_sha","latestVideos":$videos,"latestOccurrences":$occurrences,"sevenDayStatus":"pending_new_accepted_increment","startedAt":"$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          JSON
          remote_probe="$(ssh -o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no "$VPS2_USER@$VPS2_HOST" "free=\$(df -B1 --output=avail '$REMOTE_STATE_DIR' | tail -n 1 | tr -d '[:space:]'); old=0; test -f '$REMOTE_STATE_DIR/song-rank.sqlite' && old=\$(stat -c%s '$REMOTE_STATE_DIR/song-rank.sqlite') || true; printf '%s %s\\n' \"\$free\" \"\$old\"")"
          read -r remote_free remote_old <<< "$remote_probe"
          printf 'sourceBytes=%s\nsourceSha256=%s\nremoteFreeBefore=%s\nremoteOldBytes=%s\n' "$bytes" "$sha" "$remote_free" "$remote_old" > "$TASK_ROOT/preflight.txt"
          printf 'remoteFreeAfterPreflight=%s\n' "$remote_free" >> "$TASK_ROOT/preflight.txt"
          test "$remote_free" -ge "$EXPECTED_PG_PEAK_BYTES"
          if [ "$remote_old" -gt 0 ]; then
            echo "PG_PREFLIGHT_OLD_SQLITE_PRESERVED bytes=$remote_old"
          fi

      - name: Install schema and bounded receiver
        timeout-minutes: 10
        run: |
          set -Eeuo pipefail
          scp -o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no "$MIGRATION_ROOT/scripts/migration/pg-schema.sql" "$MIGRATION_ROOT/scripts/migration/import-runtime-tables.py" "$MIGRATION_ROOT/scripts/migration/activate-pg-candidate.py" "$MIGRATION_ROOT/server/pg_adapter.py" "$MIGRATION_ROOT/server/pg_api_server.py" "$MIGRATION_ROOT/deploy/vps2/song-rank-pg-api.service" "$VPS2_USER@$VPS2_HOST:/tmp/"
          scp -o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no "$TASK_ROOT/manifest.json" "$VPS2_USER@$VPS2_HOST:/tmp/daily-song-list-pg-manifest.json"
          ssh -o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no "$VPS2_USER@$VPS2_HOST" "sudo -u postgres psql -d song_rank -v ON_ERROR_STOP=1 -f /tmp/pg-schema.sql; sudo -u postgres psql -d song_rank -v ON_ERROR_STOP=1 -c 'GRANT USAGE ON SCHEMA public TO \"www-data\"; GRANT SELECT,INSERT,UPDATE,DELETE ON TABLE migration_revisions,migration_video_rows,migration_occurrence_rows,migration_audit_rows,migration_state,runtime_meta,runtime_videos,runtime_occurrences,runtime_songs,runtime_ranking_rows,runtime_source_details,runtime_source_occurrences,runtime_channel_metadata,runtime_external_songs,runtime_external_videos,runtime_external_occurrences TO \"www-data\";'"

      - name: Stream full SQLite projection to PG candidate
        timeout-minutes: 180
        env:
          REVISION: full_runtime_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          python3 "$MIGRATION_ROOT/scripts/migration/export-runtime-tables.py" --db "$SOURCE_DB" 2>"$TASK_ROOT/export-runtime.log" |
            ssh -o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no "$VPS2_USER@$VPS2_HOST" "sudo -u www-data python3 /tmp/import-runtime-tables.py --revision=$REVISION --manifest-file=/tmp/daily-song-list-pg-manifest.json" | tee "$TASK_ROOT/import-result.json"
          echo "REVISION=$REVISION" >> "$GITHUB_ENV"

      - name: Candidate API contract gate
        timeout-minutes: 12
        run: |
          set -Eeuo pipefail
          candidate_sha="$(ssh -o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no "$VPS2_USER@$VPS2_HOST" "sudo -u www-data psql -d song_rank -Atqc \"select content_sha256 from migration_revisions where revision_id='$REVISION' and status='ready'\"")"
          test -n "$candidate_sha"
          ssh -o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no "$VPS2_USER@$VPS2_HOST" "install -m 0644 /tmp/pg_adapter.py /opt/culua/ytb-song-rank/pg_adapter.py; install -m 0644 /tmp/pg_api_server.py /opt/culua/ytb-song-rank/pg_api_server.py; sudo -u www-data sh -c 'env PGHOST=/var/run/postgresql PGDATABASE=song_rank PGUSER=www-data DAILY_SONG_PG_CANDIDATE_REVISION=$REVISION PYTHONPATH=/opt/culua/ytb-song-rank nohup python3 /opt/culua/ytb-song-rank/pg_api_server.py --port 18766 >/tmp/daily-song-list-pg-candidate.log 2>&1 & echo \$! >/tmp/daily-song-list-pg-candidate.pid'"
          # The candidate server binds to loopback on VPS2; run the contract
          # probes there instead of probing the Mac runner loopback.
          ssh -o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no "$VPS2_USER@$VPS2_HOST" "set -Eeuo pipefail; curl --fail-with-body --max-time 10 \"http://127.0.0.1:18766/healthz\" > /tmp/daily-song-list-pg-candidate-healthz.json; curl --fail-with-body --max-time 10 \"http://127.0.0.1:18766/api/meta\" > /tmp/daily-song-list-pg-candidate-api-meta.json; curl --fail-with-body --max-time 10 \"http://127.0.0.1:18766/api/rankings?range=all&view=songs&metric=occurrences&page=1&pageSize=1\" > /tmp/daily-song-list-pg-candidate-rankings.json"
          scp -o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no "$VPS2_USER@$VPS2_HOST:/tmp/daily-song-list-pg-candidate-healthz.json" "$TASK_ROOT/candidate-healthz.json"
          scp -o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no "$VPS2_USER@$VPS2_HOST:/tmp/daily-song-list-pg-candidate-api-meta.json" "$TASK_ROOT/candidate-api-meta.json"
          scp -o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no "$VPS2_USER@$VPS2_HOST:/tmp/daily-song-list-pg-candidate-rankings.json" "$TASK_ROOT/candidate-rankings.json"
          printf 'candidateContentSha256=%s\n' "$candidate_sha" > "$TASK_ROOT/candidate-gate.txt"

      - name: Activate candidate and switch API
        if: ${{ inputs.activate }}
        timeout-minutes: 12
        run: |
          set -Eeuo pipefail
          candidate_sha="$(awk -F= '/candidateContentSha256/{print $2}' "$TASK_ROOT/candidate-gate.txt")"
          ssh -o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no "$VPS2_USER@$VPS2_HOST" "install -m 0755 /tmp/activate-pg-candidate.py /opt/culua/ytb-song-rank/activate-pg-candidate.py; sudo -u www-data python3 /opt/culua/ytb-song-rank/activate-pg-candidate.py --revision='$REVISION' --expected-content-sha256='$candidate_sha'; install -m 0644 /tmp/song-rank-pg-api.service /etc/systemd/system/song-rank-pg-api.service; systemctl daemon-reload; systemctl disable --now song-rank-api || true; systemctl enable --now song-rank-pg-api; for n in \$(seq 1 30); do curl -fsS http://127.0.0.1:8765/healthz >/dev/null && break; sleep 1; done; curl -fsS http://127.0.0.1:8765/healthz; curl -fsS http://127.0.0.1:8765/api/meta; curl -fsS 'http://127.0.0.1:8765/api/rankings?range=all&view=songs&metric=occurrences&page=1&pageSize=1'; systemctl reload nginx"

      - name: Upload bounded migration evidence
        if: ${{ always() && env.TASK_ROOT != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: pg-runtime-migration-${{ github.run_id }}
          path: ${{ env.TASK_ROOT }}
          if-no-files-found: warn

      - name: Cleanup task roots and candidate process
        if: always()
        run: |
          set +e
          ssh -o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no "$VPS2_USER@$VPS2_HOST" "if test -f /tmp/daily-song-list-pg-candidate.pid; then kill \$(cat /tmp/daily-song-list-pg-candidate.pid) 2>/dev/null || true; fi; rm -f /tmp/daily-song-list-pg-candidate.pid /tmp/daily-song-list-pg-manifest.json /tmp/import-runtime-tables.py /tmp/activate-pg-candidate.py /tmp/pg-schema.sql /tmp/pg_adapter.py /tmp/pg_api_server.py /tmp/song-rank-pg-api.service /tmp/daily-song-list-pg-candidate.log /tmp/daily-song-list-pg-candidate-healthz.json /tmp/daily-song-list-pg-candidate-api-meta.json /tmp/daily-song-list-pg-candidate-rankings.json" || true
          rm -rf -- "${TASK_ROOT:-/tmp/nonexistent-daily-song-list-task-root}"
