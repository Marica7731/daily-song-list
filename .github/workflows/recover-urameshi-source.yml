name: Recover @urameshi_conta 7D and publish PG increment

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "candidate manifest, one resumable detail shard, or legacy detail"
        required: false
        default: "candidate"
        type: choice
        options:
          - candidate
          - detail
          - detail-shard
      candidate_run_id:
        description: Prior candidate-stage run to reuse for detail collection
        required: false
        default: ""
        type: string
      candidate_artifact_name:
        description: Exact candidate artifact name from candidate_run_id
        required: false
        default: ""
        type: string
      detail_shard_index:
        description: "One deterministic candidate shard (0 through 5)"
        required: false
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
      checkpoint_run_id:
        description: "Prior detail-shard run whose checkpoint artifact is resumed"
        required: false
        default: ""
        type: string
      checkpoint_artifact_name:
        description: "Exact checkpoint artifact name from checkpoint_run_id"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-song-list-source-urameshi-7d
  cancel-in-progress: false

jobs:
  collect:
    runs-on: [self-hosted, macOS, ARM64, daily-song-list-mac]
    timeout-minutes: 180
    env:
      SOURCE_KEY: "@urameshi_conta"
      STAGE: ${{ inputs.stage || 'candidate' }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id || '' }}
      CANDIDATE_ARTIFACT_NAME: ${{ inputs.candidate_artifact_name || '' }}
      DETAIL_SHARD_INDEX: ${{ inputs.detail_shard_index || '0' }}
      CHECKPOINT_RUN_ID: ${{ inputs.checkpoint_run_id || '' }}
      CHECKPOINT_ARTIFACT_NAME: ${{ inputs.checkpoint_artifact_name || '' }}
      DISCOVERY_URL: "https://www.youtube.com/results?search_query=%E6%AD%8C%E6%9E%A0&sp=CAMSBggDEAEYAg%253D%253D"
      CHANNEL_URL: "https://www.youtube.com/@urameshi_conta"
      SINGER_NAME: "うら飯 紺汰"
      SOURCE_RANGE_ID: "7d"
      SCRATCH_CAP_BYTES: "4294967296"
      YOUTUBE_DISCOVERY_REQUEST_TIMEOUT_MS: "15000"
      DAILY_SONG_COMMENT_REPLY_LIMIT: "2"
      DISCOVERY_MAX_CHANNEL_PAGES: "2000"
      DISCOVERY_MAX_CANDIDATES: "10000"
      DISCOVERY_REQUEST_INTERVAL_MS: "1000"
      DISCOVERY_REQUEST_JITTER_MS: "500"
    steps:
      - name: Collect bounded 7D detail and accepted increment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          TASK_ROOT="$(mktemp -d "${RUNNER_TEMP}/daily-song-list-urameshi-7d.XXXXXX")"
          RELEASE_ROOT="$TASK_ROOT/release"
          REPO_ROOT="$TASK_ROOT/repo"
          mkdir -p "$RELEASE_ROOT" "$REPO_ROOT"
          if [ "$STAGE" = "detail-shard" ]; then
            case "$DETAIL_SHARD_INDEX" in 0|1|2|3|4|5) ;; *) echo "URAMESHI_7D_BLOCKED invalid-detail-shard=$DETAIL_SHARD_INDEX" >&2; exit 78 ;; esac
            ARTIFACT_NAME="urameshi-7d-detail-shard-${DETAIL_SHARD_INDEX}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          else
            ARTIFACT_NAME="urameshi-7d-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          printf 'startedAt=%s\nexpectedPeakBytes=4294967296\nhardCapBytes=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$SCRATCH_CAP_BYTES" > "$TASK_ROOT/storage.txt"
          df -k "$RUNNER_TEMP" > "$TASK_ROOT/mac-df-baseline.txt"
          printf 'TASK_ROOT=%s\nRELEASE_ROOT=%s\nARTIFACT_NAME=%s\n' "$TASK_ROOT" "$RELEASE_ROOT" "$ARTIFACT_NAME" >> "$GITHUB_ENV"
          checkpoint_mirror_pid=""
          stop_checkpoint_mirror() {
            if [ -n "${checkpoint_mirror_pid:-}" ]; then
              kill "$checkpoint_mirror_pid" 2>/dev/null || true
              wait "$checkpoint_mirror_pid" 2>/dev/null || true
              checkpoint_mirror_pid=""
            fi
          }
          on_exit() {
            status=$?
            stop_checkpoint_mirror
            printf 'exitStatus=%s\nendedAt=%s\n' "$status" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$TASK_ROOT/storage.txt"
            used_bytes=$(( $(du -sk "$TASK_ROOT" 2>/dev/null | awk '{print $1}') * 1024 ))
            printf 'peakObservedBytes=%s\n' "$used_bytes" >> "$TASK_ROOT/storage.txt"
            if [ "$used_bytes" -gt "$SCRATCH_CAP_BYTES" ]; then
              echo "URAMESHI_7D_BLOCKED scratch-cap-exceeded bytes=$used_bytes cap=$SCRATCH_CAP_BYTES" >&2
            fi
            if [ "$status" -ne 0 ]; then
              echo "URAMESHI_7D_PARTIAL taskRoot=$TASK_ROOT" >&2
            fi
            exit "$status"
          }
          trap on_exit EXIT INT TERM
          check_space() {
            used_bytes=$(( $(du -sk "$TASK_ROOT" 2>/dev/null | awk '{print $1}') * 1024 ))
            test "$used_bytes" -le "$SCRATCH_CAP_BYTES" || { echo "URAMESHI_7D_BLOCKED scratch-cap-exceeded bytes=$used_bytes cap=$SCRATCH_CAP_BYTES"; exit 78; }
            printf 'checkpoint=%s usedBytes=%s\n' "$1" "$used_bytes" >> "$TASK_ROOT/storage.txt"
          }
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          echo "/Users/be/.local/bin" >> "$GITHUB_PATH"
          echo "/Users/be/.local/codex-toolchains/node/bin" >> "$GITHUB_PATH"
          echo "/Users/be/.local/codex-toolchains/python312/bin" >> "$GITHUB_PATH"
          export PATH="/opt/homebrew/bin:/usr/local/bin:/Users/be/.local/bin:/Users/be/.local/codex-toolchains/node/bin:/Users/be/.local/codex-toolchains/python312/bin:$PATH"
          NODE_BIN="$(command -v node || true)"
          NPM_CMD=()
          if command -v npm >/dev/null 2>&1; then
            NPM_CMD=(npm)
          elif [ -n "$NODE_BIN" ]; then
            NODE_ROOT="$(cd "$(dirname "$NODE_BIN")/.." && pwd)"
            for npm_cli in \
              "$NODE_ROOT/lib/node_modules/npm/bin/npm-cli.js" \
              "/opt/homebrew/lib/node_modules/npm/bin/npm-cli.js" \
              "/usr/local/lib/node_modules/npm/bin/npm-cli.js" \
              "/Users/be/.local/lib/node_modules/npm/bin/npm-cli.js"; do
              if [ -f "$npm_cli" ]; then
                NPM_CMD=("$NODE_BIN" "$npm_cli")
                break
              fi
            done
          fi
          if [ -z "$NODE_BIN" ] || [ "${#NPM_CMD[@]}" -eq 0 ]; then
            echo "URAMESHI_7D_BLOCKED node-runtime-missing node=${NODE_BIN:-missing}" >&2
            exit 78
          fi
          echo "URAMESHI_7D_NODE_RUNTIME node=$NODE_BIN npm=${NPM_CMD[*]}"
          source_file_count=0
          source_directory_count=0
          downloaded_bytes=0
          download_source_file() {
            source_path="$1"
            case "$source_path" in
              /*|*..*) echo "URAMESHI_7D_BLOCKED invalid-source-path=$source_path" >&2; exit 78 ;;
            esac
            source_file_count=$((source_file_count + 1))
            test "$source_file_count" -le 512 || {
              echo "URAMESHI_7D_BLOCKED source-path-cap-exceeded count=$source_file_count" >&2; exit 78;
            }
            destination="$REPO_ROOT/$source_path"
            mkdir -p "$(dirname "$destination")"
            curl --fail --location --retry 2 --retry-all-errors --connect-timeout 5 --max-time 60 --max-filesize 16777216 \
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/${source_path}" -o "$destination"
            file_bytes="$(stat -f%z "$destination")"
            downloaded_bytes=$((downloaded_bytes + file_bytes))
            test "$downloaded_bytes" -le 268435456 || {
              echo "URAMESHI_7D_BLOCKED source-bytes-cap-exceeded bytes=$downloaded_bytes" >&2; exit 78;
            }
          }
          download_source_directory() {
            source_directory="$1"
            source_directory_count=$((source_directory_count + 1))
            test "$source_directory_count" -le 128 || {
              echo "URAMESHI_7D_BLOCKED source-directory-cap-exceeded count=$source_directory_count" >&2; exit 78;
            }
            listing="$TASK_ROOT/contents-$(printf '%s' "$source_directory" | tr '/.' '__').json"
            curl --fail --location --retry 2 --retry-all-errors --connect-timeout 5 --max-time 30 --max-filesize 5242880 \
              -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${source_directory}?ref=${GITHUB_SHA}" -o "$listing"
            jq -e 'type == "array"' "$listing" >/dev/null || {
              echo "URAMESHI_7D_BLOCKED source-directory-list-invalid path=$source_directory" >&2; exit 78;
            }
            while IFS=$'\t' read -r entry_type entry_path; do
              if [ "$entry_type" = "dir" ]; then
                download_source_directory "$entry_path"
              elif [ "$entry_type" = "file" ]; then
                download_source_file "$entry_path"
              else
                echo "URAMESHI_7D_BLOCKED unsupported-source-entry type=$entry_type path=$entry_path" >&2
                exit 78
              fi
            done < <(jq -r '.[] | [.type,.path] | @tsv' "$listing")
          }
          download_source_file package.json
          download_source_directory scripts
          download_source_directory assets
          download_source_directory config
          printf 'sourcePathCount=%s\nsourceDirectoryCount=%s\nsourceBytes=%s\n' "$source_file_count" "$source_directory_count" "$downloaded_bytes" >> "$TASK_ROOT/storage.txt"
          echo "URAMESHI_7D_SOURCE_FETCH paths=$source_file_count directories=$source_directory_count bytes=$downloaded_bytes"
          cd "$REPO_ROOT"
          check_space source-code-fetch
          CANDIDATE_MANIFEST_PATH=""
          candidate_manifest_sha=""
          if [ "$STAGE" = "detail" ]; then
            echo "URAMESHI_7D_BLOCKED legacy-detail-is-not-resumable use=detail-shard" >&2
            exit 78
          fi
          if [ "$STAGE" = "detail-shard" ]; then
            test -n "$CANDIDATE_RUN_ID" && test -n "$CANDIDATE_ARTIFACT_NAME" || {
              echo "URAMESHI_7D_BLOCKED detail-shard-requires-candidate-artifact" >&2; exit 78;
            }
            mkdir -p "$TASK_ROOT/candidate-input"
            gh run download "$CANDIDATE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$CANDIDATE_ARTIFACT_NAME" --dir "$TASK_ROOT/candidate-input"
            CANDIDATE_MANIFEST_PATH="$(find "$TASK_ROOT/candidate-input" -type f -name candidate-manifest.ndjson -print -quit)"
            test -s "$CANDIDATE_MANIFEST_PATH" || { echo "URAMESHI_7D_BLOCKED candidate artifact missing manifest" >&2; exit 78; }
            candidate_manifest_sha="$(shasum -a 256 "$CANDIDATE_MANIFEST_PATH" | awk '{print $1}')"
            echo "URAMESHI_7D_REUSE_CANDIDATE run=$CANDIDATE_RUN_ID artifact=$CANDIDATE_ARTIFACT_NAME sha=$candidate_manifest_sha"
            if [ -n "$CHECKPOINT_RUN_ID" ] || [ -n "$CHECKPOINT_ARTIFACT_NAME" ]; then
              test -n "$CHECKPOINT_RUN_ID" && test -n "$CHECKPOINT_ARTIFACT_NAME" || {
                echo "URAMESHI_7D_BLOCKED checkpoint-input-pair-required" >&2; exit 78;
              }
              mkdir -p "$TASK_ROOT/checkpoint-input" "$TASK_ROOT/discovery"
              gh run download "$CHECKPOINT_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$CHECKPOINT_ARTIFACT_NAME" --dir "$TASK_ROOT/checkpoint-input"
              prior_checkpoint="$(find "$TASK_ROOT/checkpoint-input" -type f -name checkpoint.json -print -quit)"
              prior_progress="$(find "$TASK_ROOT/checkpoint-input" -type f -name partial-manifest.json -print -quit)"
              test -s "$prior_checkpoint" && test -s "$prior_progress" || {
                echo "URAMESHI_7D_BLOCKED checkpoint artifact incomplete" >&2; exit 78;
              }
              jq -e --arg candidate_sha "$candidate_manifest_sha" --argjson requested_shard "$DETAIL_SHARD_INDEX" '
                .kind == "urameshi-7d-detail-checkpoint" and
                .candidateManifestSha256 == $candidate_sha and
                .nextShardIndex == $requested_shard
              ' "$prior_progress" >/dev/null || {
                echo "URAMESHI_7D_BLOCKED checkpoint lineage mismatch" >&2; exit 78;
              }
              cp "$prior_checkpoint" "$TASK_ROOT/discovery/checkpoint.json"
              echo "URAMESHI_7D_CHECKPOINT_REUSED run=$CHECKPOINT_RUN_ID artifact=$CHECKPOINT_ARTIFACT_NAME shard=$DETAIL_SHARD_INDEX"
            elif [ "$DETAIL_SHARD_INDEX" != "0" ]; then
              echo "URAMESHI_7D_BLOCKED detail-shard-requires-checkpoint" >&2
              exit 78
            fi
          elif [ "$STAGE" = "candidate" ]; then
            "${NPM_CMD[@]}" run youtube:discover-channel -- --channel-url "$CHANNEL_URL" --discovery-url "$DISCOVERY_URL" --singer-name "$SINGER_NAME" \
              --output-dir "$TASK_ROOT/discovery" --cache-dir "$TASK_ROOT/cache" --max-channel-pages "$DISCOVERY_MAX_CHANNEL_PAGES" \
              --max-candidates "$DISCOVERY_MAX_CANDIDATES" --candidate-only --request-interval-ms "$DISCOVERY_REQUEST_INTERVAL_MS" --request-jitter-ms "$DISCOVERY_REQUEST_JITTER_MS"
          else
            echo "URAMESHI_7D_BLOCKED unsupported-stage=$STAGE" >&2
            exit 78
          fi
          candidate_manifest_args=()
          if [ -n "$CANDIDATE_MANIFEST_PATH" ]; then
            candidate_manifest_args=(--candidate-manifest "$CANDIDATE_MANIFEST_PATH")
          fi
          check_space candidate-manifest
          if [ "$STAGE" = "candidate" ]; then
            DISCOVERY_MANIFEST="$TASK_ROOT/discovery/manifest.json"
            test -s "$DISCOVERY_MANIFEST" || { echo "URAMESHI_7D_BLOCKED missing discovery manifest"; exit 78; }
            jq -e '(.pageSummaries | length > 0) and all(.pageSummaries[]; .reachedEnd == true)' "$DISCOVERY_MANIFEST" >/dev/null || {
              echo "URAMESHI_7D_BLOCKED reachedEnd=false"; exit 78;
            }
            jq -c '.[]' "$TASK_ROOT/discovery/raw-videos.json" > "$RELEASE_ROOT/candidate-manifest.ndjson"
            discovery_sha="$(shasum -a 256 "$DISCOVERY_MANIFEST" | awk '{print $1}')"
            jq --arg source "$SOURCE_KEY" --arg discoverySha "$discovery_sha" '.sourceKey=$source | .rangeId="7d" | .sourceReachedEnd=true | .mediaDownloaded=false | .candidateOnly=true | .discoveryManifestSha256=$discoverySha | .candidateManifestPath="candidate-manifest.ndjson"' "$DISCOVERY_MANIFEST" > "$RELEASE_ROOT/manifest.json"
            cp "$DISCOVERY_MANIFEST" "$RELEASE_ROOT/source-manifest.json"
            cp "$TASK_ROOT/storage.txt" "$RELEASE_ROOT/storage-before-upload.txt"
            echo "URAMESHI_7D_CANDIDATE_READY candidates=$(jq -r '.candidateCount // 0' "$DISCOVERY_MANIFEST") reachedEnd=true"
            exit 0
          fi
          test "$STAGE" = "detail-shard" || { echo "URAMESHI_7D_BLOCKED unsupported-stage=$STAGE" >&2; exit 78; }
          shard="$DETAIL_SHARD_INDEX"
          checkpoint_path="$TASK_ROOT/discovery/checkpoint.json"
          sync_checkpoint() {
            if [ -s "$checkpoint_path" ]; then
              cp "$checkpoint_path" "$RELEASE_ROOT/checkpoint.json.next"
              mv "$RELEASE_ROOT/checkpoint.json.next" "$RELEASE_ROOT/checkpoint.json"
            fi
          }
          write_partial_manifest() {
            partial_complete="$1"
            next_shard="$2"
            sync_checkpoint
            completed_count="$(jq -r '(.completedVideoIds // []) | length' "$checkpoint_path" 2>/dev/null || echo 0)"
            detail_count="$(jq -r '(.details // []) | length' "$checkpoint_path" 2>/dev/null || echo 0)"
            checkpoint_sha="$(test -s "$RELEASE_ROOT/checkpoint.json" && shasum -a 256 "$RELEASE_ROOT/checkpoint.json" | awk '{print $1}' || true)"
            jq -n \
              --arg candidate_sha "$candidate_manifest_sha" \
              --arg checkpoint_sha "$checkpoint_sha" \
              --argjson completed_shard "$shard" \
              --argjson next_shard "$next_shard" \
              --argjson complete "$partial_complete" \
              --argjson completed_count "$completed_count" \
              --argjson detail_count "$detail_count" \
              '{schemaVersion:1,kind:"urameshi-7d-detail-checkpoint",candidateManifestSha256:$candidate_sha,checkpointSha256:$checkpoint_sha,completedShardIndex:$completed_shard,nextShardIndex:$next_shard,complete:$complete,completedVideoCount:$completed_count,detailCount:$detail_count,generatedAt:(now|todateiso8601)}' \
              > "$RELEASE_ROOT/partial-manifest.json"
            for progress_file in manifest.json raw-videos.json video-details.json audits.json report.md; do
              test -f "$TASK_ROOT/discovery/$progress_file" && cp "$TASK_ROOT/discovery/$progress_file" "$RELEASE_ROOT/$progress_file" || true
            done
            cp "$TASK_ROOT/storage.txt" "$RELEASE_ROOT/storage-before-upload.txt"
          }
          write_partial_manifest false "$shard"
          checkpoint_mirror() {
            while true; do
              sync_checkpoint
              sleep 20
            done
          }
          checkpoint_mirror &
          checkpoint_mirror_pid=$!
          set +e
          "${NPM_CMD[@]}" run youtube:discover-channel -- --channel-url "$CHANNEL_URL" --discovery-url "$DISCOVERY_URL" --singer-name "$SINGER_NAME" \
            --output-dir "$TASK_ROOT/discovery" --cache-dir "$TASK_ROOT/cache" --max-channel-pages "$DISCOVERY_MAX_CHANNEL_PAGES" \
            --max-candidates "$DISCOVERY_MAX_CANDIDATES" "${candidate_manifest_args[@]}" --max-inspect 2000 --inspect-shard-count 6 --inspect-shard-index "$shard" \
            --request-interval-ms 5000 --request-jitter-ms 2500
          detail_status=$?
          set -e
          stop_checkpoint_mirror
          sync_checkpoint
          check_space "detail-shard-$shard"
          test -s "$RELEASE_ROOT/checkpoint.json" || { echo "URAMESHI_7D_BLOCKED missing-detail-checkpoint shard=$shard" >&2; exit 78; }
          if [ "$detail_status" -ne 0 ]; then
            write_partial_manifest false "$shard"
            echo "URAMESHI_7D_SHARD_CHECKPOINT complete=false shard=$shard nextShard=$shard"
            exit "$detail_status"
          fi
          if [ "$shard" -lt 5 ]; then
            next_shard=$((shard + 1))
            write_partial_manifest true "$next_shard"
            echo "URAMESHI_7D_SHARD_CHECKPOINT complete=true shard=$shard nextShard=$next_shard"
            exit 0
          fi
          write_partial_manifest true 6
          echo "URAMESHI_7D_SHARD_CHECKPOINT complete=true shard=5 nextShard=6"
          DISCOVERY_MANIFEST="$TASK_ROOT/discovery/manifest.json"
          DETAILS="$TASK_ROOT/discovery/video-details.json"
          test -s "$DISCOVERY_MANIFEST" || { echo "URAMESHI_7D_BLOCKED missing discovery manifest"; exit 78; }
          test -s "$DETAILS" || { echo "URAMESHI_7D_BLOCKED missing video details"; exit 78; }
          jq -e '(.pageSummaries | length > 0) and all(.pageSummaries[]; .reachedEnd == true)' "$DISCOVERY_MANIFEST" >/dev/null || {
            echo "URAMESHI_7D_BLOCKED reachedEnd=false"; exit 78;
          }
          python3 scripts/migration/7d-status-audit.py --details "$DETAILS" \
            --output "$TASK_ROOT/status-audit.json" --review-queue "$TASK_ROOT/review-queue.ndjson"
          "${NPM_CMD[@]}" run youtube:import-channel-discovery -- --input-dir "$TASK_ROOT/discovery" --report-path "$TASK_ROOT/import-report.json"
          "${NPM_CMD[@]}" run youtube:export-channel-increment -- --input-dir "$TASK_ROOT/discovery" --output "$TASK_ROOT/accepted.json"
          python3 scripts/migration/accepted-files-to-patch.py --input "$TASK_ROOT/accepted.json" \
            --output "$TASK_ROOT/candidate.ndjson" --manifest-output "$TASK_ROOT/manifest.json" \
            --range-id "$SOURCE_RANGE_ID" --source-key "$SOURCE_KEY" --status-audit "$TASK_ROOT/status-audit.json"
          discovery_sha="$(shasum -a 256 "$DISCOVERY_MANIFEST" | awk '{print $1}')"
          jq --arg source "$SOURCE_KEY" --arg discoverySha "$discovery_sha" \
            --slurpfile discovery "$DISCOVERY_MANIFEST" \
            '.sourceKey=$source | .sourceReachedEnd=true | .mediaDownloaded=false | .discoveryManifestSha256=$discoverySha | .candidateCount=($discovery[0].candidateCount // 0) | .inspectedVideoCount=($discovery[0].usableVideoCount // 0) | .timeCoverageEvidence="publishedAt retained in detail/status audit"' \
            "$TASK_ROOT/manifest.json" > "$TASK_ROOT/manifest.next.json"
          mv "$TASK_ROOT/manifest.next.json" "$TASK_ROOT/manifest.json"
          test "$(jq -er '.acceptedVideoCount' "$TASK_ROOT/manifest.json")" -gt 0
          test "$(jq -er '.acceptedOccurrenceCount' "$TASK_ROOT/manifest.json")" -gt 0
          cp "$DISCOVERY_MANIFEST" "$RELEASE_ROOT/source-manifest.json"
          cp "$TASK_ROOT/manifest.json" "$RELEASE_ROOT/manifest.json"
          cp "$TASK_ROOT/candidate.ndjson" "$RELEASE_ROOT/candidate.ndjson"
          cp "$TASK_ROOT/accepted.json" "$RELEASE_ROOT/accepted.json"
          cp "$TASK_ROOT/status-audit.json" "$RELEASE_ROOT/status-audit.json"
          cp "$TASK_ROOT/review-queue.ndjson" "$RELEASE_ROOT/review-queue.ndjson"
          cp "$TASK_ROOT/import-report.json" "$RELEASE_ROOT/import-report.json"
          test -f "$TASK_ROOT/discovery/checkpoint.json" && cp "$TASK_ROOT/discovery/checkpoint.json" "$RELEASE_ROOT/checkpoint.json" || true
          cp "$TASK_ROOT/storage.txt" "$RELEASE_ROOT/storage-before-upload.txt"
          trap - EXIT INT TERM

      - name: Upload accepted 7D evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.RELEASE_ROOT }}
          if-no-files-found: error
          retention-days: 2

      - name: Cleanup source task root
        if: always()
        run: |
          set -Eeuo pipefail
          before_bytes=0
          if [ -n "${TASK_ROOT:-}" ] && [ -d "$TASK_ROOT" ]; then
            before_bytes=$(( $(du -sk "$TASK_ROOT" | awk '{print $1}') * 1024 ))
            rm -rf -- "$TASK_ROOT"
          fi
          echo "URAMESHI_7D_CLEANUP status=success beforeBytes=$before_bytes afterBytes=0 retained=artifact:$ARTIFACT_NAME"

  deploy:
    if: ${{ inputs.stage == 'detail-shard' && inputs.detail_shard_index == '5' }}
    needs: collect
    uses: ./.github/workflows/deploy-pg-incremental.yml
    with:
      artifact_name: urameshi-7d-${{ github.run_id }}-${{ github.run_attempt }}
      patch_path: candidate.ndjson
      manifest_path: manifest.json
      activate: true
      require_7d_gate: true
      source_key: "@urameshi_conta"
    secrets: inherit
