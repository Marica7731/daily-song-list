name: Watch static update freshness
# Push-path fallback: the heartbeat trigger runs this watchdog when GitHub schedule delivery is delayed.

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/static-freshness-watchdog.yml"
      - ".github/dirty-heartbeat.trigger"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: daily-song-list-static-freshness
  cancel-in-progress: true

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Release completed serialized repair run
        id: unstick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          stale_run=37346473983
          stale_sha=5215fe8b80f55ea63a8344572a18b6e797e21ecc
          ghq() { timeout 20 gh api "$@"; }
          status=""
          head_sha=""
          name=""
          created_at=""
          age_seconds=-1
          if run_json="$(ghq "/repos/$GITHUB_REPOSITORY/actions/runs/$stale_run")"; then
            status="$(printf '%s' "$run_json" | jq -er '.status // empty')"
            head_sha="$(printf '%s' "$run_json" | jq -er '.head_sha // empty')"
            name="$(printf '%s' "$run_json" | jq -er '.name // empty')"
            created_at="$(printf '%s' "$run_json" | jq -er '.created_at // empty')"
            if [[ -n "$created_at" ]]; then
              age_seconds=$(( $(date -u +%s) - $(date -u -d "$created_at" +%s) ))
            fi
          else
            echo "UNSTICK_RUN_MISSING run=$stale_run"
          fi
          cancelled=false
          if [[ "$status" == "in_progress" && "$head_sha" == "$stale_sha" && "$name" == "Repair dropped static videos" && "$age_seconds" -ge 1800 ]]; then
            timeout 20 gh api -X POST "/repos/$GITHUB_REPOSITORY/actions/runs/$stale_run/cancel" >/dev/null
            cancelled=true
          fi
          echo "cancelled=$cancelled status=$status age_seconds=$age_seconds" >> "$GITHUB_OUTPUT"
          printf 'unstick cancelled=%s status=%s age_seconds=%s\n' "$cancelled" "$status" "$age_seconds"

      - name: Recover missed static updates
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_DEPLOYMENTS_API: /repos/${{ github.repository }}/deployments?environment=github-pages&per_page=1
          REPO_META_URL: https://raw.githubusercontent.com/Marica7731/daily-song-list/main/data/static/v1/meta.json
          STALE_MINUTES: "45"
          STALL_MINUTES: "90"
        run: |
          set -Eeuo pipefail
          fetch_pages_deployment_epoch() {
            local deployment_id
            # Do not follow the github.io redirect: Pages sends it to the custom domain, whose
            # Cloudflare path can be unhealthy even while GitHub's deployment is green.
            deployment_id="$(gh api "$PAGES_DEPLOYMENTS_API" --jq '.[0].id // empty')"
            [[ "$deployment_id" =~ ^[0-9]+$ ]] || {
              echo "PAGES_DEPLOYMENT_MISSING" >&2
              return 1
            }
            gh api "/repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses?per_page=30" |
              jq -er '[.[] | select(.state == "success")] | sort_by(.created_at) | last | .created_at | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601'
          }

          fetch_repo_generated_at() {
            curl --fail --silent --show-error \
              --header 'Accept: application/json' \
              --header 'Cache-Control: no-cache' "$REPO_META_URL" |
              jq -er '.generatedAt | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601'
          }

          now_epoch="$(date +%s)"
          site_age_minutes=-1
          repo_age_minutes=-1
          active_updates="$(
            gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow static-update.yml \
              --limit 20 \
              --json status \
              --jq '[.[] | select(.status == "requested" or .status == "pending" or .status == "waiting" or .status == "queued" or .status == "in_progress")] | length'
          )"
          active_deploys="$(
            gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow deploy-pages.yml \
              --limit 10 \
              --json status \
              --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length'
          )"
          pending_repo="$(
            curl --fail --silent --show-error --location \
              --header 'Accept: application/json' \
              --header 'Cache-Control: no-cache' "$REPO_META_URL" |
              jq -er '.pendingVideoCount // 0'
          )"
          collection_age_minutes=9999
          last_successful_update="$(
            gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow static-update.yml \
              --limit 30 \
              --json conclusion,updatedAt \
              --jq '[.[] | select(.conclusion == "success")] | sort_by(.updatedAt) | last | .updatedAt // empty' \
              2>/dev/null || true
          )"
          if [[ -n "$last_successful_update" ]]; then
            collection_age_minutes="$(((now_epoch - $(date -u -d "$last_successful_update" +%s)) / 60))"
          fi

          triggered=false
          reason=fresh_data
          if (( active_updates > 0 )); then
            reason=active_static_update
          elif (( active_deploys > 0 )); then
            reason=active_pages_deploy
          else
            site_deployed_epoch="$(fetch_pages_deployment_epoch)"
            repo_generated_epoch="$(fetch_repo_generated_at)"
            site_age_minutes="$(((now_epoch - site_deployed_epoch) / 60))"
            repo_age_minutes="$(((now_epoch - repo_generated_epoch) / 60))"

            if (( pending_repo > 0 && collection_age_minutes >= STALL_MINUTES )); then
              # Repair chains continuously in the shared group and keep the published meta warm, so
              # the age checks below never fire even while the collection queue stops draining.
              gh workflow run --repo "$GITHUB_REPOSITORY" static-update.yml --ref main
              triggered=true
              reason=stalled_collection_queue
            elif (( site_age_minutes >= STALE_MINUTES && repo_age_minutes >= STALE_MINUTES )); then
              gh workflow run --repo "$GITHUB_REPOSITORY" static-update.yml --ref main
              triggered=true
              reason=stale_static_update
            elif (( site_age_minutes >= STALE_MINUTES )); then
              gh workflow run --repo "$GITHUB_REPOSITORY" deploy-pages.yml --ref main
              triggered=true
              reason=stale_pages_deploy
            fi
          fi

          {
            echo "triggered=$triggered"
            echo "reason=$reason"
            echo "site_age_minutes=$site_age_minutes"
            echo "repo_age_minutes=$repo_age_minutes"
            echo "active_updates=$active_updates"
            echo "active_deploys=$active_deploys"
            echo "pending_repo=$pending_repo"
            echo "collection_age_minutes=$collection_age_minutes"
          } >> "$GITHUB_OUTPUT"

          printf 'site_age_minutes=%s repo_age_minutes=%s active_updates=%s active_deploys=%s pending_repo=%s collection_age_minutes=%s triggered=%s reason=%s\n' \
            "$site_age_minutes" "$repo_age_minutes" "$active_updates" "$active_deploys" "$pending_repo" "$collection_age_minutes" "$triggered" "$reason"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Static freshness watchdog"
            echo "- triggered: ${{ steps.freshness.outputs.triggered }}"
            echo "- reason: ${{ steps.freshness.outputs.reason }}"
            echo "- site age: ${{ steps.freshness.outputs.site_age_minutes }} minutes"
            echo "- repository age: ${{ steps.freshness.outputs.repo_age_minutes }} minutes"
            echo "- active updates: ${{ steps.freshness.outputs.active_updates }}"
            echo "- active deploys: ${{ steps.freshness.outputs.active_deploys }}"
            echo "- pending videos (repo meta): ${{ steps.freshness.outputs.pending_repo }}"
            echo "- minutes since last successful static update: ${{ steps.freshness.outputs.collection_age_minutes }}"
          } >> "$GITHUB_STEP_SUMMARY"
