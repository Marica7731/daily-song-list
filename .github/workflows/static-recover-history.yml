name: Recover GitHub static song history

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "legacy imports the pinned all baseline; date resumes one pinned missing day"
        required: true
        default: "legacy"
        type: choice
        options:
          - legacy
          - date
      recovery_date:
        description: "Required for date mode: 2026-08-23 through 2026-08-31"
        required: false
        default: ""
      through_date:
        description: "Optional inclusive end date; advances only after the current date has no remaining candidates"
        required: false
        default: ""
      video_limit:
        description: "Bounded eligible videos inspected in this run"
        required: false
        default: "180"

permissions:
  actions: write
  contents: write

concurrency:
  group: daily-song-list-static-update
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout bounded recovery inputs
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/static-recover-history.yml
            /.github/workflows/deploy-pages.yml
            /package.json
            /package-lock.json
            /scripts/**
            /assets/**
            /config/**
            /data/static/**

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate bounded recovery batch
        run: |
          set -Eeuo pipefail
          limit="${{ inputs.video_limit || '180' }}"
          [[ "$limit" =~ ^[0-9]+$ ]] && (( limit >= 1 && limit <= 200 )) || {
            echo "STATIC_RECOVERY_LIMIT_INVALID limit=$limit max=200" >&2
            exit 70
          }

      - name: Recover one bounded immutable source
        env:
          STATIC_RECOVERY_LIMIT: ${{ inputs.video_limit || '180' }}
          STATIC_MAX_SHARD_BYTES: "4000000"
          DAILY_SONG_FETCH_RETRIES: "2"
          DAILY_SONG_REQUEST_TIMEOUT_MS: "12000"
          DAILY_SONG_REQUEST_DELAY_MS: "2500"
          DAILY_SONG_REQUEST_JITTER_MS: "1500"
          DAILY_SONG_429_COOLDOWN_MS: "60000"
          DAILY_SONG_RETRY_JITTER_MS: "5000"
          DAILY_SONG_MAX_429_ERRORS: "8"
        run: npm run static:recover -- --mode "${{ inputs.mode }}" --date "${{ inputs.recovery_date }}"

      - name: Validate recovered static shards
        run: npm run static:validate

      - name: Read recovery outcome
        id: outcome
        run: |
          set -Eeuo pipefail
          status=$(node -p "require('./data/static/v1/recovery/last-run.json').status")
          no_progress=$(node -p "require('./data/static/v1/recovery/last-run.json').noProgressAttempts || 0")
          remaining=$(node -p "require('./data/static/v1/recovery/last-run.json').remaining || 0")
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "no_progress=$no_progress" >> "$GITHUB_OUTPUT"
          echo "remaining=$remaining" >> "$GITHUB_OUTPUT"

      - name: Commit persistent recovery data only
        id: commit
        run: |
          set -Eeuo pipefail
          mapfile -t changed < <(git status --short --untracked-files=all | awk '{print $2}')
          for path in "${changed[@]}"; do
            [[ "$path" == data/static/v1/* ]] || {
              echo "STATIC_RECOVERY_UNEXPECTED_PATH path=$path" >&2
              exit 71
            }
          done
          if [[ ${#changed[@]} -eq 0 ]]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/static/v1
          git commit -m "data: recover static song history"
          git fetch --depth=2 origin main
          git rebase origin/main
          mapfile -t committed < <(git diff --name-only origin/main HEAD)
          for path in "${committed[@]}"; do
            [[ "$path" == data/static/v1/* ]] || {
              echo "STATIC_RECOVERY_REBASE_UNEXPECTED_PATH path=$path" >&2
              exit 73
            }
          done
          [[ ${#committed[@]} -gt 0 ]] || {
            echo "STATIC_RECOVERY_REBASE_EMPTY" >&2
            exit 74
          }
          git push origin HEAD:main
          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "STATIC_RECOVERY_PUSHED commit=$(git rev-parse HEAD)"

      - name: Deploy recovered immutable snapshot
        if: steps.commit.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main

      - name: Resume an incomplete date checkpoint
        if: inputs.mode == 'date' && fromJSON(steps.outcome.outputs.remaining) > 0 && fromJSON(steps.outcome.outputs.no_progress) < 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run static-recover-history.yml --ref main -f mode=date -f recovery_date="${{ inputs.recovery_date }}" -f through_date="${{ inputs.through_date }}" -f video_limit="${{ inputs.video_limit || '180' }}"

      - name: Advance to the next pinned date
        if: inputs.mode == 'date' && inputs.through_date != '' && fromJSON(steps.outcome.outputs.remaining) == 0 && inputs.recovery_date != inputs.through_date
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          current="${{ inputs.recovery_date }}"
          through="${{ inputs.through_date }}"
          next=$(date -u -d "$current + 1 day" +%F)
          [[ "$next" < "$through" || "$next" == "$through" ]] || {
            echo "STATIC_RECOVERY_SEQUENCE_RANGE_INVALID current=$current next=$next through=$through" >&2
            exit 72
          }
          gh workflow run static-recover-history.yml --ref main -f mode=date -f recovery_date="$next" -f through_date="$through" -f video_limit="${{ inputs.video_limit || '180' }}"
