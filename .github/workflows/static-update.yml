name: Update GitHub static song data

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/static-update.yml"
      - "scripts/static/**"
      - "scripts/update-songlist.js"
      - "scripts/song-utils.js"
      - "config/curation-overrides.json"
      - "config/collected-vtubers.json"
      - "config/artist-catalogs/**"
      - "config/non-song-rules.json"
      - "data/static/v1/imports/**"
  schedule:
    # Primary hourly cadence; static-freshness-watchdog covers missed triggers.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      video_limit:
        description: "Base pending videos per drain run (auto-scaled to 120 above 500 pending; capped at 120)"
        required: false
        default: "60"
      priority_video_ids:
        description: "Comma-separated YouTube video IDs to inspect first (maximum 20)"
        required: false
        default: ""
      drain_round:
        description: "Internal pending-drain continuation round (0-96)"
        required: false
        default: "0"
      drain_cooldown_seconds:
        description: "Bounded cooldown before a new pending-drain window (0-900)"
        required: false
        default: "0"

permissions:
  actions: write
  contents: write

concurrency:
  group: daily-song-list-static-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout bounded static inputs
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitignore
            /.github/workflows/static-update.yml
            /package.json
            /package-lock.json
            /scripts/**
            /assets/**
            /config/**
            /data/static/**

      - name: Require a green Check code gate on code pushes
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 180); do
            status="$(
              gh run list --repo "$GITHUB_REPOSITORY" \
                --workflow check-code.yml \
                --commit "$TARGET_SHA" \
                --limit 1 \
                --json status,conclusion \
                --jq 'if length == 0 then "missing:none" else .[0].status + ":" + (.[0].conclusion // "none") end' \
                2>/dev/null || printf 'missing:none'
            )"
            case "$status" in
              completed:success)
                echo "STATIC_UPDATE_GATE_OK sha=$TARGET_SHA attempt=$attempt"
                exit 0
                ;;
              completed:failure|completed:cancelled|completed:timed_out|completed:action_required|completed:stale)
                echo "STATIC_UPDATE_GATE_FAILED sha=$TARGET_SHA status=$status" >&2
                exit 71
                ;;
            esac
            if (( attempt % 12 == 0 )); then
              echo "STATIC_UPDATE_GATE_WAIT sha=$TARGET_SHA attempt=$attempt status=$status"
            fi
            sleep 5
          done
          echo "STATIC_UPDATE_GATE_TIMEOUT sha=$TARGET_SHA status=$status" >&2
          exit 72

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve bounded drain size
        id: drain
        env:
          REQUESTED_VIDEO_LIMIT: ${{ inputs.video_limit || '60' }}
          REQUESTED_PRIORITY_VIDEO_IDS: ${{ inputs.priority_video_ids || '' }}
          REQUESTED_DRAIN_ROUND: ${{ inputs.drain_round || '0' }}
          REQUESTED_DRAIN_COOLDOWN_SECONDS: ${{ inputs.drain_cooldown_seconds || '0' }}
        run: |
          set -Eeuo pipefail
          [[ "$REQUESTED_DRAIN_ROUND" =~ ^[0-9]+$ ]] || {
            echo "STATIC_UPDATE_INVALID_DRAIN_ROUND value=$REQUESTED_DRAIN_ROUND" >&2
            exit 77
          }
          (( REQUESTED_DRAIN_ROUND <= 96 )) || {
            echo "STATIC_UPDATE_DRAIN_ROUND_OUT_OF_RANGE value=$REQUESTED_DRAIN_ROUND max=96" >&2
            exit 77
          }
          echo "drain_round=$REQUESTED_DRAIN_ROUND" >> "$GITHUB_OUTPUT"
          [[ "$REQUESTED_DRAIN_COOLDOWN_SECONDS" =~ ^[0-9]+$ ]] || {
            echo "STATIC_UPDATE_INVALID_DRAIN_COOLDOWN value=$REQUESTED_DRAIN_COOLDOWN_SECONDS" >&2
            exit 77
          }
          (( REQUESTED_DRAIN_COOLDOWN_SECONDS <= 900 )) || {
            echo "STATIC_UPDATE_DRAIN_COOLDOWN_OUT_OF_RANGE value=$REQUESTED_DRAIN_COOLDOWN_SECONDS max=900" >&2
            exit 77
          }
          echo "drain_cooldown_seconds=$REQUESTED_DRAIN_COOLDOWN_SECONDS" >> "$GITHUB_OUTPUT"
          [[ "$REQUESTED_VIDEO_LIMIT" =~ ^[0-9]+$ ]] || {
            echo "STATIC_UPDATE_INVALID_VIDEO_LIMIT value=$REQUESTED_VIDEO_LIMIT" >&2
            exit 77
          }
          (( REQUESTED_VIDEO_LIMIT >= 1 )) || {
            echo "STATIC_UPDATE_INVALID_VIDEO_LIMIT value=$REQUESTED_VIDEO_LIMIT" >&2
            exit 77
          }
          video_limit="$REQUESTED_VIDEO_LIMIT"
          if (( video_limit > 120 )); then
            echo "STATIC_UPDATE_LIMIT_CAPPED requested=$video_limit effective=120"
            video_limit=120
          fi
          pending="$(node -e "const fs=require('node:fs'); const meta=JSON.parse(fs.readFileSync('data/static/v1/meta.json','utf8')); process.stdout.write(String(Number(meta.pendingVideoCount)||0));")"
          [[ "$pending" =~ ^[0-9]+$ ]] || {
            echo "STATIC_UPDATE_INVALID_PENDING value=$pending" >&2
            exit 76
          }
          if (( pending > 500 && video_limit < 120 )); then
            echo "STATIC_UPDATE_PENDING_BATCH_SCALED requested=$video_limit effective=120 pending=$pending threshold=500"
            video_limit=120
          fi
          echo "video_limit=$video_limit" >> "$GITHUB_OUTPUT"

          priority_ids=""
          priority_count=0
          declare -A seen_priority=()
          IFS=',' read -ra requested_ids <<< "$REQUESTED_PRIORITY_VIDEO_IDS"
          for requested_id in "${requested_ids[@]}"; do
            video_id="${requested_id//[[:space:]]/}"
            [[ -z "$video_id" ]] && continue
            [[ "$video_id" =~ ^[A-Za-z0-9_-]{11}$ ]] || {
              echo "STATIC_UPDATE_INVALID_PRIORITY_VIDEO_ID" >&2
              exit 78
            }
            [[ -z "${seen_priority[$video_id]:-}" ]] || continue
            if (( priority_count >= 20 )); then
              echo "STATIC_UPDATE_PRIORITY_VIDEO_LIMIT" >&2
              exit 78
            fi
            seen_priority[$video_id]=1
            if [[ -n "$priority_ids" ]]; then priority_ids+=","; fi
            priority_ids+="$video_id"
            priority_count=$((priority_count + 1))
          done
          echo "priority_video_ids=$priority_ids" >> "$GITHUB_OUTPUT"

      - name: Apply bounded continuation cooldown
        if: steps.drain.outputs.drain_cooldown_seconds != '0'
        env:
          DRAIN_COOLDOWN_SECONDS: ${{ steps.drain.outputs.drain_cooldown_seconds }}
        run: |
          set -Eeuo pipefail
          echo "STATIC_UPDATE_PENDING_DRAIN_COOLDOWN seconds=$DRAIN_COOLDOWN_SECONDS"
          sleep "$DRAIN_COOLDOWN_SECONDS"
          echo "STATIC_UPDATE_PENDING_DRAIN_COOLDOWN_COMPLETE seconds=$DRAIN_COOLDOWN_SECONDS"

      - name: Collect one bounded batch and rebuild static shards
        env:
          STATIC_VIDEO_LIMIT: ${{ steps.drain.outputs.video_limit }}
          STATIC_PRIORITY_VIDEO_IDS: ${{ steps.drain.outputs.priority_video_ids }}
          STATIC_PAGE_SIZE: "50"
          STATIC_MAX_SHARD_BYTES: "4000000"
          DAILY_SONG_FETCH_RETRIES: "2"
          DAILY_SONG_REQUEST_TIMEOUT_MS: "12000"
          DAILY_SONG_REQUEST_DELAY_MS: "400"
          DAILY_SONG_REQUEST_JITTER_MS: "250"
          DAILY_SONG_MAX_429_ERRORS: "6"
        # 120 videos x 2 retries x 12s plus six 180s 429 cooldowns can exhaust the collection
        # envelope; a killed update writes nothing, so bounding it keeps commit/validate/dispatch
        # steps reachable even on a throttled day.
        run: timeout --signal=TERM --kill-after=30s 1800 npm run static:update

      - name: Validate resumability and shard limits
        run: npm run static:validate

      - name: Commit persistent data only
        id: commit
        run: |
          set -Eeuo pipefail
          mapfile -t changed < <(git status --short --untracked-files=all | awk '{print $2}')
          for path in "${changed[@]}"; do
            [[ "$path" == data/static/v1/* ]] || {
              echo "STATIC_UPDATE_UNEXPECTED_PATH path=$path" >&2
              exit 71
            }
          done
          if [[ ${#changed[@]} -eq 0 ]]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "STATIC_UPDATE_NO_CHANGES"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data/static/v1
          git commit -m "data: update static song shards"
          for publish_attempt in 1 2 3; do
            if ! git fetch --deepen=10 origin main || ! git rebase origin/main; then
              git rebase --abort >/dev/null 2>&1 || true
              echo "STATIC_UPDATE_REBASE_RETRY attempt=$publish_attempt" >&2
              if [[ $publish_attempt -eq 3 ]]; then
                echo "STATIC_UPDATE_REBASE_EXHAUSTED" >&2
                exit 75
              fi
              sleep 2
              continue
            fi
            mapfile -t committed < <(git diff --name-only origin/main HEAD)
            for path in "${committed[@]}"; do
              [[ "$path" == data/static/v1/* ]] || {
                echo "STATIC_UPDATE_REBASE_UNEXPECTED_PATH path=$path" >&2
                exit 73
              }
            done
            if [[ ${#committed[@]} -eq 0 ]]; then
              echo "updated=false" >> "$GITHUB_OUTPUT"
              echo "STATIC_UPDATE_ALREADY_PUBLISHED commit=$(git rev-parse HEAD)"
              break
            fi
            if git push origin HEAD:main; then
              echo "updated=true" >> "$GITHUB_OUTPUT"
              echo "STATIC_UPDATE_PUSHED commit=$(git rev-parse HEAD) attempts=$publish_attempt"
              break
            fi
            if [[ $publish_attempt -eq 3 ]]; then
              echo "STATIC_UPDATE_PUSH_RACE_EXHAUSTED" >&2
              exit 75
            fi
            echo "STATIC_UPDATE_PUSH_RACE retry=$publish_attempt"
          done

      - name: Publish evidence
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const meta = JSON.parse(fs.readFileSync('data/static/v1/meta.json', 'utf8'));
          console.log(JSON.stringify({
            sourceSnapshotId: meta.sourceSnapshotId,
            sourceCapturedAt: meta.sourceCapturedAt,
            processedVideoCount: meta.processedVideoCount,
            pendingVideoCount: meta.pendingVideoCount,
            videoCount: meta.videoCount,
            songOccurrenceCount: meta.songOccurrenceCount,
            channelSetlistImports: meta.channelSetlistImports || [],
            updated: process.env.UPDATED,
          }, null, 2));
          NODE
        env:
          UPDATED: ${{ steps.commit.outputs.updated }}

      - name: Deploy the new immutable static snapshot
        if: steps.commit.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main

      - name: Queue immediate continuation while backlog remains
        id: continuation
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          VIDEO_LIMIT: ${{ steps.drain.outputs.video_limit }}
          PRIORITY_VIDEO_IDS: ${{ steps.drain.outputs.priority_video_ids }}
          DRAIN_ROUND: ${{ steps.drain.outputs.drain_round }}
          STATIC_PENDING_PRIORITY_THRESHOLD: "500"
          STATIC_UPDATE_DRAIN_ROUND_LIMIT: "96"
          STATIC_UPDATE_DRAIN_COOLDOWN_SECONDS: "600"
        run: |
          set -Eeuo pipefail
          echo "drain_pending=false" >> "$GITHUB_OUTPUT"
          ledger="data/static/v1/recovery/dropped-videos.json"
          dropped=0
          if [[ -f "$ledger" ]]; then
            dropped="$(node -e "const fs=require('node:fs'); const l=JSON.parse(fs.readFileSync('$ledger','utf8')); process.stdout.write(String(l.droppedVideoCount||0));")"
          fi
          [[ "$dropped" =~ ^[0-9]+$ ]] || {
            echo "STATIC_UPDATE_INVALID_DROPPED value=$dropped" >&2
            exit 77
          }
          pending="$(node -e "const fs=require('node:fs'); const meta=JSON.parse(fs.readFileSync('data/static/v1/meta.json','utf8')); process.stdout.write(String(Number(meta.pendingVideoCount)||0));")"
          [[ "$pending" =~ ^[0-9]+$ ]] || {
            echo "STATIC_UPDATE_INVALID_PENDING value=$pending" >&2
            exit 76
          }
          if (( pending == 0 )); then
            echo "STATIC_UPDATE_DRAINED pending=0"
            exit 0
          fi
          if (( pending > STATIC_PENDING_PRIORITY_THRESHOLD )); then
            echo "drain_pending=true" >> "$GITHUB_OUTPUT"
            next_round=$((DRAIN_ROUND + 1))
            drain_cooldown_seconds=0
            if (( DRAIN_ROUND >= STATIC_UPDATE_DRAIN_ROUND_LIMIT )); then
              next_round=0
              drain_cooldown_seconds=$STATIC_UPDATE_DRAIN_COOLDOWN_SECONDS
              echo "STATIC_UPDATE_PENDING_DRAIN_WINDOW_COMPLETE pending=$pending dropped=$dropped round=$DRAIN_ROUND max=$STATIC_UPDATE_DRAIN_ROUND_LIMIT next_round=$next_round cooldown_seconds=$drain_cooldown_seconds"
            fi
            echo "STATIC_UPDATE_PENDING_PRIORITY pending=$pending threshold=$STATIC_PENDING_PRIORITY_THRESHOLD dropped=$dropped round=$next_round"
            for dispatch_attempt in 1 2 3; do
              if gh workflow run static-update.yml --ref main -f video_limit="$VIDEO_LIMIT" -f priority_video_ids="$PRIORITY_VIDEO_IDS" -f drain_round="$next_round" -f drain_cooldown_seconds="$drain_cooldown_seconds"; then
                echo "STATIC_UPDATE_PENDING_DRAIN_DISPATCHED attempt=$dispatch_attempt round=$next_round"
                exit 0
              fi
              if [[ $dispatch_attempt -eq 3 ]]; then
                echo "STATIC_UPDATE_PENDING_DRAIN_DISPATCH_FAILED attempt=$dispatch_attempt" >&2
                exit 85
              fi
              sleep 2
            done
          fi
          if (( dropped > 0 )); then
            echo "STATIC_UPDATE_DEFER_TO_REPAIR pending=$pending dropped=$dropped"
            exit 0
          fi
          echo "drain_pending=true" >> "$GITHUB_OUTPUT"
          next_round=$((DRAIN_ROUND + 1))
          echo "STATIC_UPDATE_CONTINUE pending=$pending video_limit=$VIDEO_LIMIT priority_video_ids=$PRIORITY_VIDEO_IDS round=$next_round"
          gh workflow run static-update.yml --ref main -f video_limit="$VIDEO_LIMIT" -f priority_video_ids="$PRIORITY_VIDEO_IDS" -f drain_round="$next_round"

      - name: Hand off dropped videos to the repair workflow
        if: success() && steps.continuation.outputs.drain_pending != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          ledger="data/static/v1/recovery/dropped-videos.json"
          if [[ ! -f "$ledger" ]]; then
            node scripts/static/repair-dropped.js
          fi
          dropped="$(node -e "const fs=require('node:fs'); const l=JSON.parse(fs.readFileSync('$ledger','utf8')); process.stdout.write(String(l.droppedVideoCount||0));")"
          [[ "$dropped" =~ ^[0-9]+$ ]] || {
            echo "STATIC_UPDATE_INVALID_DROPPED value=$dropped" >&2
            exit 79
          }
          if (( dropped == 0 )); then
            echo "STATIC_UPDATE_NO_DROPPED_VIDEOS dropped=0"
            exit 0
          fi
          echo "STATIC_UPDATE_HANDOFF dropped=$dropped"
          gh workflow run static-repair-dropped.yml --ref main
  # Re-arm marker: a push through this path starts a bounded recovery run after a superseded schedule at 2026-10-06T03:58Z.
  # Re-armed 2026-10-19T04:05Z: the 02:23Z and 03:23Z hourly schedules never fired and the pending queue stopped draining.
  # Re-armed 2026-10-19T12:16Z: the 11:23Z and 12:23Z hourly schedules never fired; last successful collection was 10:51Z.

# Re-arm the canonical yorushika static rebuild after recovery publishing.
  # Re-armed 2026-10-20T12:45Z: re-arm collection after the controlled orphan reset.
