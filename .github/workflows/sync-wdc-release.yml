name: Sync WDC release from old site

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force rebuild even if active revision is unchanged"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: daily-song-list-wdc-release-sync
  cancel-in-progress: false

env:
  VPS2_HOST: ${{ secrets.VPS2_HOST }}
  VPS2_USER: "root"
  WDC_HOST: ${{ secrets.WDC_HOST }}
  WDC_USER: ${{ secrets.WDC_USER }}
  WDC_RELEASES_ROOT: "/opt/culua/ytb-song-rank/releases"
  PUBLIC_BASE: "https://ytb-song-rank.culua.com"
  FORCE: ${{ inputs.force || 'false' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 600
    environment: wdc-shadow
    steps:
      - name: Checkout migration scripts
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts/migration/build-release-bundle.py
            scripts/migration/build-serving-sqlite.py
            scripts/migration/materialize-pg-release-snapshot.py

      - name: Prepare SSH helpers
        env:
          VPS2_PASSWORD: ${{ secrets.VPS2_PASSWORD }}
          WDC_SSH_PRIVATE_KEY: ${{ secrets.WDC_SSH_PRIVATE_KEY }}
          WDC_KNOWN_HOSTS: ${{ secrets.WDC_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$VPS2_PASSWORD"
          mkdir -p /tmp/ssh
          printf '%s\n' "$VPS2_PASSWORD" > /tmp/ssh/vps2-password
          printf '%s\n' "$WDC_SSH_PRIVATE_KEY" > /tmp/ssh/wdc-key
          printf '%s\n' "$WDC_KNOWN_HOSTS" > /tmp/ssh/wdc-knownhosts
          chmod 600 /tmp/ssh/vps2-password /tmp/ssh/wdc-key
          cat > /tmp/ssh/vps2-askpass.sh <<'SH'
          #!/bin/sh
          exec cat /tmp/ssh/vps2-password
          SH
          chmod 700 /tmp/ssh/vps2-askpass.sh
          {
            echo "SSH_ASKPASS=/tmp/ssh/vps2-askpass.sh"
            echo "SSH_ASKPASS_REQUIRE=force"
            echo "DISPLAY=daily-song-list"
            echo "WDC_KNOWN_HOSTS_FILE=/tmp/ssh/wdc-knownhosts"
          } >> "$GITHUB_ENV"

      - name: Check active revision changed (local 8765 via SSH, public fallback)
        id: check
        run: |
          set -Eeuo pipefail
          SSH_OPTS=(-o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no -o ConnectTimeout=8)
          ACTIVE_JSON="$(ssh "${SSH_OPTS[@]}" "$VPS2_USER@$VPS2_HOST" \
            "timeout 60 curl -s --max-time 50 http://127.0.0.1:8765/api/meta 2>/dev/null || true" 2>/dev/null || true)"
          if [ -z "$ACTIVE_JSON" ] || ! printf '%s' "$ACTIVE_JSON" | python3 -c "import json,sys;json.load(sys.stdin)" 2>/dev/null; then
            echo "LOCAL_META_UNAVAILABLE; trying public fallback"
            ACTIVE_JSON="$(curl -s --max-time 90 "${PUBLIC_BASE}/api/meta" || true)"
          fi
          if [ -z "$ACTIVE_JSON" ] || ! printf '%s' "$ACTIVE_JSON" | python3 -c "import json,sys;json.load(sys.stdin)" 2>/dev/null; then
            echo "PUBLIC_META_UNAVAILABLE"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CURRENT_ACTIVE=$(printf '%s' "$ACTIVE_JSON" | python3 -c "import json,sys;print(json.load(sys.stdin).get('meta',{}).get('active_revision_id',''))")
          CONTENT=$(printf '%s' "$ACTIVE_JSON" | python3 -c "import json,sys;print(json.load(sys.stdin).get('meta',{}).get('content_sha256',''))")
          echo "current_active=$CURRENT_ACTIVE content=${CONTENT:0:16}"
          PREV="$(ssh "${SSH_OPTS[@]}" "$VPS2_USER@$VPS2_HOST" "cat /tmp/dsl-wdc-last-active 2>/dev/null || true" 2>/dev/null || true)"
          echo "prev_active=$PREV"
          if [ "$CURRENT_ACTIVE" = "$PREV" ] && [ -n "$CURRENT_ACTIVE" ] && [ "$FORCE" != "true" ]; then
            echo "NO_CHANGE"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "CHANGED_TO $CURRENT_ACTIVE"
          echo "$CURRENT_ACTIVE" > /tmp/current-active.txt
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "active=$CURRENT_ACTIVE" >> "$GITHUB_OUTPUT"
          echo "content=$CONTENT" >> "$GITHUB_OUTPUT"

      - name: Materialize + build bundle on old production (read-only)
        if: steps.check.outputs.skip != 'true'
        id: materialize
        run: |
          set -Eeuo pipefail
          SSH_OPTS=(-o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          REMOTE_ROOT="/tmp/dsl-wdc-sync-${GITHUB_RUN_ID}"
          ssh "${SSH_OPTS[@]}" "$VPS2_USER@$VPS2_HOST" "mkdir -p '$REMOTE_ROOT'"
          scp "${SSH_OPTS[@]}" scripts/migration/build-release-bundle.py scripts/migration/build-serving-sqlite.py scripts/migration/materialize-pg-release-snapshot.py "$VPS2_USER@$VPS2_HOST:$REMOTE_ROOT/"
          ssh "${SSH_OPTS[@]}" "$VPS2_USER@$VPS2_HOST" bash -s -- "$REMOTE_ROOT" "$ACTIVE" "$GITHUB_RUN_ID" <<'REMOTE'
          set -Eeuo pipefail
          remote_root="$1"; expected_active="$2"; run_id="$3"
          cd "$remote_root"
          rm -rf -- /tmp/dsl-wdc-pages /tmp/dsl-wdc-bundles
          rm -f -- /tmp/dsl-wdc-meta.json
          install -d -o www-data -g www-data -m 0750 /tmp/dsl-wdc-pages
          systemd-run --quiet --wait --pipe --collect \
            --unit="dsl-wdc-snapshot-$run_id" \
            --uid=www-data --gid=www-data \
            --property=MemoryMax=700M \
            --property=RuntimeMaxSec=32400 \
            --property=WorkingDirectory=/opt/culua/ytb-song-rank \
            --setenv=PGHOST=/var/run/postgresql \
            --setenv=PGDATABASE=song_rank \
            --setenv=PGUSER=www-data \
            --setenv=PYTHONPATH=/opt/culua/ytb-song-rank/server \
            /usr/bin/python3 "$remote_root/materialize-pg-release-snapshot.py" \
              --output /tmp/dsl-wdc-pages \
              --meta-output /tmp/dsl-wdc-meta.json \
              --expected-revision "$expected_active"
          python3 build-release-bundle.py \
            --input /tmp/dsl-wdc-pages --output /tmp/dsl-wdc-bundles \
            --active-revision-id "$(python3 -c "import json;print(json.load(open('/tmp/dsl-wdc-meta.json'))['active_revision_id'])")" \
            --expected-parent-revision-id "$(python3 -c "import json;print(json.load(open('/tmp/dsl-wdc-meta.json'))['parent_revision_id'])")" \
            --source-commit-sha "$(python3 -c "import json;print(json.load(open('/tmp/dsl-wdc-meta.json'))['source_commit_sha'])")" \
            --generated-at "$(python3 -c "import json;print(json.load(open('/tmp/dsl-wdc-meta.json'))['built_at'])")" \
            --latest-event-time "$(python3 -c "import json;print(json.load(open('/tmp/dsl-wdc-meta.json'))['latest_generated_at'])")"
          BUNDLE_DIR=$(ls -dt /tmp/dsl-wdc-bundles/*/ | head -1)
          python3 build-serving-sqlite.py --bundle-dir "$BUNDLE_DIR"
          REMOTE
          BUNDLE_DIR=$(ssh "${SSH_OPTS[@]}" "$VPS2_USER@$VPS2_HOST" "ls -dt /tmp/dsl-wdc-bundles/*/ | head -1" 2>/dev/null || true)
          BUNDLE_SHA=$(basename "$BUNDLE_DIR")
          echo "bundle_sha=$BUNDLE_SHA"
          echo "bundle_sha=$BUNDLE_SHA" >> "$GITHUB_OUTPUT"
        env:
          ACTIVE: ${{ steps.check.outputs.active }}

      - name: Deploy bundle to vps-wdc
        if: steps.check.outputs.skip != 'true'
        run: |
          set -Eeuo pipefail
          SSH_OPTS=(-o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          BUNDLE_SHA="${{ steps.materialize.outputs.bundle_sha }}"
          test -n "$BUNDLE_SHA" || { echo "no bundle sha"; exit 66; }
          mkdir -p /tmp/bundle
          ssh "${SSH_OPTS[@]}" "$VPS2_USER@$VPS2_HOST" "cd /tmp/dsl-wdc-bundles && tar czf /tmp/dsl-wdc-${BUNDLE_SHA}.tar.gz '$BUNDLE_SHA' && ls -la /tmp/dsl-wdc-${BUNDLE_SHA}.tar.gz"
          scp "${SSH_OPTS[@]}" "$VPS2_USER@$VPS2_HOST:/tmp/dsl-wdc-${BUNDLE_SHA}.tar.gz" /tmp/bundle/
          WDC_SSH=(-o StrictHostKeyChecking=yes -o UserKnownHostsFile=/tmp/ssh/wdc-knownhosts -o ConnectTimeout=10 -i /tmp/ssh/wdc-key)
          scp "${WDC_SSH[@]}" /tmp/bundle/dsl-wdc-${BUNDLE_SHA}.tar.gz "$WDC_USER@$WDC_HOST:/tmp/"
          ssh "${WDC_SSH[@]}" "$WDC_USER@$WDC_HOST" bash -s -- "$BUNDLE_SHA" "$WDC_RELEASES_ROOT" "$ACTIVE" <<'REMOTE'
          set -Eeuo pipefail
          sha="$1"; root="$2"; expected_active="$3"
          cd /tmp
          test -f "/tmp/dsl-wdc-$sha.tar.gz"
          tar xzf "/tmp/dsl-wdc-$sha.tar.gz" -C "$root"
          chown -R daily-song-list:daily-song-list "$root/$sha"
          rm -f "$root/current"
          ln -sf "$sha" "$root/current"
          readlink -f "$root/current"
          systemctl restart daily-song-list-api
          sleep 2
          systemctl is-active daily-song-list-api
          curl -s --max-time 20 "http://127.0.0.1:18777/api/meta" \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['meta'];assert d['active_revision_id']==sys.argv[1];assert d['content_sha256']==sys.argv[2];print('deployed content:',d['content_sha256'][:16])" \
                "$expected_active" "$sha"
          echo "WDC_DEPLOYED $sha"
          rm -f "/tmp/dsl-wdc-$sha.tar.gz"
          REMOTE
        env:
          ACTIVE: ${{ steps.check.outputs.active }}

      - name: Verify new domain
        if: steps.check.outputs.skip != 'true' && success()
        run: |
          set -Eeuo pipefail
          health_code=$(curl -sS -o /tmp/wdc-health.json -w "%{http_code}" --max-time 40 "https://next.ytb-song-rank.culua.com/healthz")
          meta_code=$(curl -sS -o /tmp/wdc-meta.json -w "%{http_code}" --max-time 40 "https://next.ytb-song-rank.culua.com/api/meta")
          echo "next healthz: $health_code meta: $meta_code"
          test "$health_code" = "200"
          test "$meta_code" = "200"
          python3 - "$ACTIVE" "$BUNDLE_SHA" <<'PY'
          import json
          import sys

          expected_active, expected_bundle = sys.argv[1:]
          health = json.load(open("/tmp/wdc-health.json", encoding="utf-8"))
          meta = json.load(open("/tmp/wdc-meta.json", encoding="utf-8"))["meta"]
          assert health["status"] == "ok"
          assert health["activeRevisionId"] == expected_active
          assert health["currentRelease"] == expected_bundle
          assert meta["active_revision_id"] == expected_active
          assert meta["content_sha256"] == expected_bundle
          print(f"WDC_DOMAIN_VERIFIED revision={expected_active} bundle={expected_bundle}")
          PY
        env:
          ACTIVE: ${{ steps.check.outputs.active }}
          BUNDLE_SHA: ${{ steps.materialize.outputs.bundle_sha }}

      - name: Record deployed active revision
        if: steps.check.outputs.skip != 'true' && success()
        run: |
          set -Eeuo pipefail
          SSH_OPTS=(-o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no -o ConnectTimeout=10)
          printf '%s\n' "$ACTIVE" | ssh "${SSH_OPTS[@]}" "$VPS2_USER@$VPS2_HOST" "cat > /tmp/dsl-wdc-last-active"
          echo "WDC_ACTIVE_RECORDED $ACTIVE"
        env:
          ACTIVE: ${{ steps.check.outputs.active }}

      - name: Finalize WDC sync cleanup
        if: always()
        run: |
          set -Eeuo pipefail
          SSH_OPTS=(-o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no -o ConnectTimeout=10)
          ssh "${SSH_OPTS[@]}" "$VPS2_USER@$VPS2_HOST" bash -s -- "$GITHUB_RUN_ID" "$BUNDLE_SHA" <<'REMOTE'
          set -Eeuo pipefail
          run_id="$1"; bundle_sha="$2"
          systemctl stop "dsl-wdc-snapshot-$run_id.service" 2>/dev/null || true
          rm -rf -- "/tmp/dsl-wdc-sync-$run_id" /tmp/dsl-wdc-pages /tmp/dsl-wdc-bundles
          rm -f -- /tmp/dsl-wdc-meta.json
          if [[ "$bundle_sha" =~ ^[0-9a-f]{64}$ ]]; then
            rm -f -- "/tmp/dsl-wdc-$bundle_sha.tar.gz"
          fi
          echo "WDC_OLD_VPS_CLEANUP_OK run=$run_id"
          REMOTE
          if [[ "$BUNDLE_SHA" =~ ^[0-9a-f]{64}$ ]]; then
            WDC_SSH=(-o StrictHostKeyChecking=yes -o UserKnownHostsFile=/tmp/ssh/wdc-knownhosts -o ConnectTimeout=10 -i /tmp/ssh/wdc-key)
            ssh "${WDC_SSH[@]}" "$WDC_USER@$WDC_HOST" "rm -f -- '/tmp/dsl-wdc-$BUNDLE_SHA.tar.gz'"
          fi
        env:
          BUNDLE_SHA: ${{ steps.materialize.outputs.bundle_sha }}
