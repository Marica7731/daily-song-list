name: Sync complete immutable release to WDC

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even when active revision and build logic are unchanged"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: daily-song-list-wdc-release-sync-v3
  cancel-in-progress: false

env:
  VPS2_HOST: ${{ secrets.VPS2_HOST }}
  VPS2_USER: "root"
  WDC_HOST: ${{ secrets.WDC_HOST }}
  WDC_USER: ${{ secrets.WDC_USER }}
  WDC_PROJECT_ROOT: "/opt/culua/ytb-song-rank"
  WDC_RELEASES_ROOT: "/opt/culua/ytb-song-rank/releases"
  WDC_SERVER_PATH: "/opt/culua/ytb-song-rank/server/release_serving_server.py"
  WDC_STATIC_ROOT: "/opt/culua/ytb-song-rank/static"
  WDC_SERVICE_UNIT_PATH: "/etc/systemd/system/daily-song-list-api.service"
  WDC_NGINX_AVAILABLE_PATH: "/etc/nginx/sites-available/next.ytb-song-rank.culua.com.conf"
  WDC_NGINX_ENABLED_PATH: "/etc/nginx/sites-enabled/next.ytb-song-rank.culua.com.conf"
  WDC_SERVICE: "daily-song-list-api"
  WDC_API_PORT: "18777"
  # Decimal bytes. Reaching the 40 GB line is a hard failure, not a warning.
  WDC_PROJECT_MAX_BYTES: "40000000000"
  # Keep host-level headroom so this project cannot crowd out unrelated workloads.
  WDC_FILESYSTEM_RESERVE_BYTES: "5000000000"
  # One Mac run may account for a roughly 13 GB release plus bounded build intermediates.
  MAC_RUN_MAX_BYTES: "32000000000"
  # Reserve host space outside the exact run root for the runner and unrelated work.
  MAC_FILESYSTEM_RESERVE_BYTES: "15000000000"
  MAC_PYTHON: "/Users/be/.local/bin/python3"
  MAC_NODE: "/Users/be/.local/codex-toolchains/node/bin/node"
  PYTHONDONTWRITEBYTECODE: "1"
  # The installer copies only six small control files/symlinks, never serving.sqlite.
  WDC_CONTROL_BACKUP_MAX_BYTES: "134217728"
  FORCE: ${{ inputs.force || 'false' }}

jobs:
  ubuntu_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release gate inputs
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            server/release_serving_server.py
            server/pg_adapter.py
            scripts/migration/7d-json-to-patch.py
            scripts/migration/materialize-pg-release-snapshot.py
            scripts/migration/materialize-ranking-pages.py
            scripts/migration/build-serving-store.py
            scripts/migration/build-release-bundle.py
            scripts/migration/prepare-wdc-frontend.py
            scripts/migration/patch-next-frontend.py
            scripts/migration/pg-peer-relay.py
            scripts/migration/requirements-wdc-mac.txt
            deploy/install-wdc-release.sh
            deploy/daily-song-list-api.service
            deploy/nginx-next-api.conf
            assets/app.js
            index.html
            .github/workflows/sync-wdc-release.yml
            .github/workflows/update-core.yml
            .github/workflows/test-next-serving-v3.yml
            tests/test_next_serving_v3.py
            tests/test_pg_peer_relay.py

      - name: Run bounded Ubuntu release gate
        run: |
          set -Eeuo pipefail
          python3 -B - <<'PY'
          import ast
          from pathlib import Path
          for name in (
              "server/release_serving_server.py",
              "server/pg_adapter.py",
              "scripts/migration/7d-json-to-patch.py",
              "scripts/migration/materialize-pg-release-snapshot.py",
              "scripts/migration/materialize-ranking-pages.py",
              "scripts/migration/build-serving-store.py",
              "scripts/migration/build-release-bundle.py",
              "scripts/migration/prepare-wdc-frontend.py",
              "scripts/migration/patch-next-frontend.py",
              "scripts/migration/pg-peer-relay.py",
              "tests/test_pg_peer_relay.py",
          ):
              ast.parse(Path(name).read_text(encoding="utf-8"), filename=name)
          print("PYTHON_AST_OK")
          PY
          bash -n deploy/install-wdc-release.sh
          node --check assets/app.js
          PYTHONDONTWRITEBYTECODE=1 PYTHONWARNINGS=error::ResourceWarning \
            python3 -B -m unittest discover -s tests -p 'test_next_serving_v3.py' -v
          PYTHONDONTWRITEBYTECODE=1 \
            python3 -B -m unittest discover -s tests -p 'test_pg_peer_relay.py' -v

  sync:
    needs: ubuntu_gate
    runs-on: [self-hosted, macOS, ARM64, daily-song-list-mac]
    timeout-minutes: 600
    environment: wdc-shadow
    env:
      WDC_SOURCE_ROOT: ${{ github.workspace }}/wdc-release-source
    defaults:
      run:
        working-directory: wdc-release-source

    steps:
      - name: Reset bounded isolated Mac source checkout
        working-directory: .
        run: |
          set -Eeuo pipefail
          OWNER_PATH="$GITHUB_WORKSPACE/.wdc-release-source-owned"
          [[ "$WDC_SOURCE_ROOT" == "$GITHUB_WORKSPACE/wdc-release-source" ]]
          [[ "${WDC_SOURCE_ROOT%/*}" == "$GITHUB_WORKSPACE" ]]
          [[ "${WDC_SOURCE_ROOT##*/}" == "wdc-release-source" ]]
          if [[ -e "$WDC_SOURCE_ROOT" || -L "$WDC_SOURCE_ROOT" ]]; then
            [[ -d "$WDC_SOURCE_ROOT" && ! -L "$WDC_SOURCE_ROOT" ]]
            [[ -f "$OWNER_PATH" ]]
            [[ "$(cat "$OWNER_PATH")" == "daily-song-list-wdc-source-v1" ]]
            source_real="$(/usr/bin/python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$WDC_SOURCE_ROOT")"
            [[ "$source_real" == "$WDC_SOURCE_ROOT" ]]
            rm -rf -- "$WDC_SOURCE_ROOT"
          fi
          printf '%s\n' "daily-song-list-wdc-source-v1" > "$OWNER_PATH"
          install -d -m 0700 "$WDC_SOURCE_ROOT"
          echo "WDC_SOURCE_CHECKOUT_RESET root=$WDC_SOURCE_ROOT"

      - name: Checkout complete serving implementation
        uses: actions/checkout@v4
        with:
          path: wdc-release-source
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            server/release_serving_server.py
            server/pg_adapter.py
            scripts/migration/7d-json-to-patch.py
            scripts/migration/materialize-pg-release-snapshot.py
            scripts/migration/materialize-ranking-pages.py
            scripts/migration/build-serving-store.py
            scripts/migration/build-release-bundle.py
            scripts/migration/prepare-wdc-frontend.py
            scripts/migration/patch-next-frontend.py
            scripts/migration/pg-peer-relay.py
            scripts/migration/requirements-wdc-mac.txt
            deploy/install-wdc-release.sh
            deploy/daily-song-list-api.service
            deploy/nginx-next-api.conf
            assets/app.js
            index.html
            .github/workflows/sync-wdc-release.yml
            .github/workflows/update-core.yml
            .github/workflows/test-next-serving-v3.yml
            tests/test_next_serving_v3.py
            tests/test_pg_peer_relay.py

      - name: Reserve exact Mac run root
        run: |
          set -Eeuo pipefail
          source_git_kib="$(du -sk "$WDC_SOURCE_ROOT/.git" | awk '{print $1}')"
          [[ "$source_git_kib" =~ ^[0-9]+$ ]]
          source_git_bytes=$((source_git_kib * 1024))
          (( source_git_bytes < 1000000000 )) || {
            echo "WDC_SOURCE_CHECKOUT_LIMIT_EXCEEDED bytes=$source_git_bytes" >&2
            exit 74
          }
          echo "WDC_SOURCE_CHECKOUT_BYTES bytes=$source_git_bytes limit=1000000000"
          MAC_RUN_ROOT="/Users/be/codex-temp/dsl-wdc-sync-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$MAC_RUN_ROOT"
          install -d -m 0700 "$MAC_RUN_ROOT"
          printf '%s:%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$MAC_RUN_ROOT/.codex-owned-run"
          cat > "$MAC_RUN_ROOT/check-run-storage.py" <<'PY'
          from __future__ import annotations

          import os
          import shutil
          import stat
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          maximum = int(sys.argv[2])
          reserve = int(sys.argv[3])
          phase = sys.argv[4]
          reserve_full_budget = sys.argv[5] == "true"
          success_label = {
              "PREFLIGHT": "MAC_STORAGE_PREFLIGHT_OK",
              "BUNDLE": "MAC_STORAGE_BUNDLE_OK",
          }.get(phase)
          if success_label is None:
              raise SystemExit(f"MAC_STORAGE_PHASE_INVALID phase={phase}")
          if not root.is_absolute() or root.parent != Path("/Users/be/codex-temp"):
              raise SystemExit(f"MAC_RUN_ROOT_UNSAFE root={root}")
          root_stat = root.lstat()
          if not stat.S_ISDIR(root_stat.st_mode) or root.is_symlink():
              raise SystemExit(f"MAC_RUN_ROOT_NOT_DIRECTORY root={root}")
          total = 0
          pending = [root]
          while pending:
              directory = pending.pop()
              with os.scandir(directory) as entries:
                  for entry in entries:
                      entry_stat = entry.stat(follow_symlinks=False)
                      path = Path(entry.path)
                      if stat.S_ISLNK(entry_stat.st_mode):
                          raise SystemExit(f"MAC_RUN_SYMLINK_REJECTED path={path}")
                      if stat.S_ISDIR(entry_stat.st_mode):
                          pending.append(path)
                      elif stat.S_ISREG(entry_stat.st_mode):
                          total += entry_stat.st_size
                      else:
                          raise SystemExit(f"MAC_RUN_NON_REGULAR_REJECTED path={path}")
          if maximum != 32_000_000_000 or reserve != 15_000_000_000:
              raise SystemExit("MAC_STORAGE_LIMIT_CONFIGURATION_INVALID")
          if total >= maximum:
              raise SystemExit(f"MAC_RUN_LIMIT_EXCEEDED phase={phase} bytes={total} max={maximum}")
          free = shutil.disk_usage(root).free
          required_free = reserve + (maximum - total if reserve_full_budget else 0)
          if free < required_free:
              raise SystemExit(
                  f"MAC_FILESYSTEM_RESERVE_VIOLATION phase={phase} free={free} "
                  f"required={required_free} reserve={reserve}"
              )
          print(
              f"{success_label} run_bytes={total} max={maximum} "
              f"free={free} reserve={reserve} required_free={required_free}"
          )
          PY
          chmod 0500 "$MAC_RUN_ROOT/check-run-storage.py"
          test -x "$MAC_PYTHON"
          test -x "$MAC_NODE"
          "$MAC_PYTHON" -B "$MAC_RUN_ROOT/check-run-storage.py" \
            "$MAC_RUN_ROOT" "$MAC_RUN_MAX_BYTES" "$MAC_FILESYSTEM_RESERVE_BYTES" \
            PREFLIGHT true
          echo "MAC_RUN_ROOT=$MAC_RUN_ROOT" >> "$GITHUB_ENV"

      - name: Install hash-locked Mac Python dependencies into exact run root
        run: |
          set -Eeuo pipefail
          PYTHON_DEPS_ROOT="$MAC_RUN_ROOT/python-deps"
          test ! -e "$PYTHON_DEPS_ROOT"
          install -d -m 0700 "$PYTHON_DEPS_ROOT"
          "$MAC_PYTHON" -m pip install \
            --target "$PYTHON_DEPS_ROOT" \
            --only-binary=:all: \
            --require-hashes \
            --no-deps \
            --no-cache-dir \
            --no-compile \
            --timeout 30 \
            --retries 2 \
            -r scripts/migration/requirements-wdc-mac.txt
          PYTHONPATH="$PYTHON_DEPS_ROOT:$WDC_SOURCE_ROOT/server:$WDC_SOURCE_ROOT" "$MAC_PYTHON" -B - <<'PY'
          import psycopg
          if psycopg.__version__ != "3.3.4":
              raise SystemExit(f"unexpected psycopg version: {psycopg.__version__}")
          if psycopg.pq.__impl__ != "binary":
              raise SystemExit(f"psycopg binary implementation required: {psycopg.pq.__impl__}")
          print("MAC_RUN_LOCAL_PSYCOPG_OK", psycopg.__version__, psycopg.pq.__impl__)
          PY
          echo "PYTHON_DEPS_ROOT=$PYTHON_DEPS_ROOT" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$PYTHON_DEPS_ROOT:$WDC_SOURCE_ROOT/server:$WDC_SOURCE_ROOT" >> "$GITHUB_ENV"

      - name: Run release regression tests
        run: |
          set -Eeuo pipefail
          "$MAC_PYTHON" -B - <<'PY'
          import ast
          from pathlib import Path
          for name in (
              "server/release_serving_server.py",
              "server/pg_adapter.py",
              "scripts/migration/7d-json-to-patch.py",
              "scripts/migration/materialize-pg-release-snapshot.py",
              "scripts/migration/materialize-ranking-pages.py",
              "scripts/migration/build-serving-store.py",
              "scripts/migration/build-release-bundle.py",
              "scripts/migration/prepare-wdc-frontend.py",
              "scripts/migration/patch-next-frontend.py",
              "scripts/migration/pg-peer-relay.py",
          ):
              ast.parse(Path(name).read_text(encoding="utf-8"), filename=name)
          print("PYTHON_AST_OK")
          PY
          "$MAC_PYTHON" scripts/migration/materialize-pg-release-snapshot.py --help >/dev/null
          bash -n deploy/install-wdc-release.sh
          "$MAC_NODE" --check assets/app.js
          PYTHONWARNINGS=error::ResourceWarning \
            PYTHONDONTWRITEBYTECODE=1 "$MAC_PYTHON" -B -m unittest discover -s tests -p 'test_next_serving_v3.py' -v
          PYTHONDONTWRITEBYTECODE=1 \
            "$MAC_PYTHON" -B -m unittest discover -s tests -p 'test_pg_peer_relay.py' -v
          BUILD_LOGIC_SHA="$({
            shasum -a 256 server/release_serving_server.py
            shasum -a 256 server/pg_adapter.py
            shasum -a 256 scripts/migration/materialize-pg-release-snapshot.py
            shasum -a 256 scripts/migration/materialize-ranking-pages.py
            shasum -a 256 scripts/migration/build-serving-store.py
            shasum -a 256 scripts/migration/build-release-bundle.py
            shasum -a 256 scripts/migration/prepare-wdc-frontend.py
            shasum -a 256 scripts/migration/pg-peer-relay.py
            shasum -a 256 scripts/migration/requirements-wdc-mac.txt
            shasum -a 256 assets/app.js
            shasum -a 256 index.html
            shasum -a 256 deploy/daily-song-list-api.service
            shasum -a 256 deploy/nginx-next-api.conf
            shasum -a 256 deploy/install-wdc-release.sh
            shasum -a 256 .github/workflows/sync-wdc-release.yml
          } | shasum -a 256 | awk '{print $1}')"
          echo "BUILD_LOGIC_SHA=$BUILD_LOGIC_SHA" >> "$GITHUB_ENV"
          echo "build logic: $BUILD_LOGIC_SHA"

      - name: Prepare hashed frontend release assets
        run: |
          set -Eeuo pipefail
          FRONTEND_ROOT="$MAC_RUN_ROOT/frontend"
          test ! -e "$FRONTEND_ROOT"
          "$MAC_PYTHON" scripts/migration/prepare-wdc-frontend.py \
            --app assets/app.js \
            --index index.html \
            --output "$FRONTEND_ROOT"
          APP_PATH="$("$MAC_PYTHON" - "$FRONTEND_ROOT/frontend-manifest.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1],encoding="utf-8"))["appPath"])
          PY
          )"
          [[ "$APP_PATH" =~ ^assets/app-h[0-9a-f]{12}\.js$ ]]
          "$MAC_NODE" --check "$FRONTEND_ROOT/$APP_PATH"
          grep -Fq "$APP_PATH" "$FRONTEND_ROOT/index.html"
          echo "FRONTEND_ROOT=$FRONTEND_ROOT" >> "$GITHUB_ENV"

      - name: Prepare SSH helpers
        env:
          VPS2_PASSWORD: ${{ secrets.VPS2_PASSWORD }}
          VPS2_KNOWN_HOSTS: ${{ secrets.VPS2_KNOWN_HOSTS }}
          WDC_SSH_PRIVATE_KEY: ${{ secrets.WDC_SSH_PRIVATE_KEY }}
          WDC_KNOWN_HOSTS: ${{ secrets.WDC_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$VPS2_PASSWORD"
          test -n "$VPS2_KNOWN_HOSTS"
          test -n "$WDC_SSH_PRIVATE_KEY"
          test -n "$WDC_KNOWN_HOSTS"
          SSH_ROOT="$MAC_RUN_ROOT/ssh"
          install -d -m 0700 "$SSH_ROOT"
          printf '%s\n' "$VPS2_PASSWORD" > "$SSH_ROOT/vps2-password"
          printf '%s\n' "$VPS2_KNOWN_HOSTS" > "$SSH_ROOT/vps2-knownhosts"
          printf '%s\n' "$WDC_SSH_PRIVATE_KEY" > "$SSH_ROOT/wdc-key"
          printf '%s\n' "$WDC_KNOWN_HOSTS" > "$SSH_ROOT/wdc-knownhosts"
          chmod 600 "$SSH_ROOT/vps2-password" "$SSH_ROOT/vps2-knownhosts" \
            "$SSH_ROOT/wdc-key" "$SSH_ROOT/wdc-knownhosts"
          cat > "$SSH_ROOT/vps2-askpass.sh" <<'SH'
          #!/bin/sh
          exec cat "$(dirname "$0")/vps2-password"
          SH
          chmod 700 "$SSH_ROOT/vps2-askpass.sh"
          {
            echo "SSH_ROOT=$SSH_ROOT"
            echo "SSH_ASKPASS=$SSH_ROOT/vps2-askpass.sh"
            echo "SSH_ASKPASS_REQUIRE=force"
            echo "DISPLAY=daily-song-list"
          } >> "$GITHUB_ENV"

      - name: Compare active revision and deployed build logic
        id: check
        run: |
          set -Eeuo pipefail
          VPS2_SSH=(-o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_ROOT/vps2-knownhosts" -o ConnectTimeout=8)
          WDC_SSH=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_ROOT/wdc-knownhosts" -o ConnectTimeout=8 -i "$SSH_ROOT/wdc-key")

          ACTIVE_JSON="$(ssh "${VPS2_SSH[@]}" "$VPS2_USER@$VPS2_HOST" \
            "timeout 65 curl --silent --show-error --fail --max-time 60 http://127.0.0.1:8765/api/meta" 2>/dev/null)"
          CURRENT_ACTIVE="$(printf '%s' "$ACTIVE_JSON" | "$MAC_PYTHON" -c 'import json,sys; print(json.load(sys.stdin).get("meta",{}).get("active_revision_id", ""))')"
          CURRENT_CONTENT="$(printf '%s' "$ACTIVE_JSON" | "$MAC_PYTHON" -c 'import json,sys; print(json.load(sys.stdin).get("meta",{}).get("content_sha256", ""))')"
          CURRENT_SOURCE_COMMIT="$(printf '%s' "$ACTIVE_JSON" | "$MAC_PYTHON" -c 'import json,sys; m=json.load(sys.stdin).get("meta",{}); print(m.get("source_commit_sha") or m.get("sourceCommitSha") or "")')"
          test -n "$CURRENT_ACTIVE" || { echo "old production returned no active revision" >&2; exit 65; }
          [[ "$CURRENT_ACTIVE" =~ ^[A-Za-z0-9._:-]{1,200}$ ]] || {
            echo "old production returned an unsafe active revision marker" >&2
            exit 65
          }
          [[ "$CURRENT_CONTENT" =~ ^[0-9a-f]{64}$ ]] || {
            echo "old production returned an unsafe content hash" >&2
            exit 65
          }
          [[ "$CURRENT_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "old production returned an unsafe source commit" >&2
            exit 65
          }

          DEPLOYED_HEALTH="$(ssh "${WDC_SSH[@]}" "$WDC_USER@$WDC_HOST" \
            "curl --silent --show-error --max-time 5 http://127.0.0.1:$WDC_API_PORT/healthz 2>/dev/null || true" 2>/dev/null || true)"
          DEPLOYED_STATUS="$(printf '%s' "$DEPLOYED_HEALTH" | "$MAC_PYTHON" -c 'import json,sys; print(json.load(sys.stdin).get("status", ""))' 2>/dev/null || true)"
          DEPLOYED_ACTIVE="$(printf '%s' "$DEPLOYED_HEALTH" | "$MAC_PYTHON" -c 'import json,sys; print(json.load(sys.stdin).get("activeRevision", ""))' 2>/dev/null || true)"
          DEPLOYED_LOGIC="$(printf '%s' "$DEPLOYED_HEALTH" | "$MAC_PYTHON" -c 'import json,sys; print(json.load(sys.stdin).get("buildLogicSha", ""))' 2>/dev/null || true)"
          DEPLOYED_SOURCE_COMMIT="$(printf '%s' "$DEPLOYED_HEALTH" | "$MAC_PYTHON" -c 'import json,sys; print(json.load(sys.stdin).get("sourceCommit", ""))' 2>/dev/null || true)"
          DEPLOYED_RELEASE="$(printf '%s' "$DEPLOYED_HEALTH" | "$MAC_PYTHON" -c 'import json,sys; data=json.load(sys.stdin); print(data.get("releaseContentSha") or data.get("currentRelease") or "")' 2>/dev/null || true)"

          echo "old active=$CURRENT_ACTIVE content=${CURRENT_CONTENT:0:16} source=${CURRENT_SOURCE_COMMIT:0:16}"
          echo "wdc status=${DEPLOYED_STATUS:-none} active=${DEPLOYED_ACTIVE:-none} release=${DEPLOYED_RELEASE:0:16} source=${DEPLOYED_SOURCE_COMMIT:0:16} logic=${DEPLOYED_LOGIC:-none}"
          if [[ "$DEPLOYED_STATUS" != "ok" || ! "$DEPLOYED_RELEASE" =~ ^[0-9a-f]{64}$ ]]; then
            echo "WDC_PREVIOUS_RELEASE_INVALID status=${DEPLOYED_STATUS:-none} release=${DEPLOYED_RELEASE:-none}" >&2
            exit 66
          fi
          echo "deployed_release=$DEPLOYED_RELEASE" >> "$GITHUB_OUTPUT"
          if [[ "$DEPLOYED_STATUS" == "ok" \
             && "$DEPLOYED_RELEASE" =~ ^[0-9a-f]{64}$ \
             && "$CURRENT_ACTIVE" == "$DEPLOYED_ACTIVE" \
             && "$CURRENT_SOURCE_COMMIT" == "$DEPLOYED_SOURCE_COMMIT" \
             && "$BUILD_LOGIC_SHA" == "$DEPLOYED_LOGIC" \
             && "$FORCE" != "true" ]]; then
            echo "NO_CHANGE"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "active=$CURRENT_ACTIVE" >> "$GITHUB_OUTPUT"
          echo "content=$CURRENT_CONTENT" >> "$GITHUB_OUTPUT"
          echo "source_commit=$CURRENT_SOURCE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Start bounded VPS2 peer relay and materialize on Mac
        if: steps.check.outputs.skip != 'true'
        id: materialize
        timeout-minutes: 540
        env:
          ACTIVE: ${{ steps.check.outputs.active }}
          EXPECTED_CONTENT: ${{ steps.check.outputs.content }}
          EXPECTED_SOURCE_COMMIT: ${{ steps.check.outputs.source_commit }}
        run: |
          set -Eeuo pipefail
          VPS2_SSH=(-o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_ROOT/vps2-knownhosts" -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          RELAY_ROOT="/tmp/dsl-pg-relay-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          RELAY_UNIT="dsl-wdc-pg-relay-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          RELAY_READY="$RELAY_ROOT/ready.json"
          [[ "$RELAY_ROOT" =~ ^/tmp/dsl-pg-relay-[0-9]+-[0-9]+$ ]]
          ssh "${VPS2_SSH[@]}" "$VPS2_USER@$VPS2_HOST" bash -s -- \
            "$RELAY_ROOT" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" <<'REMOTE'
          set -Eeuo pipefail
          relay_root="$1"; run_id="$2"; run_attempt="$3"
          [[ "$relay_root" == "/tmp/dsl-pg-relay-${run_id}-${run_attempt}" ]]
          test ! -e "$relay_root"
          install -d -o www-data -g www-data -m 0750 "$relay_root"
          REMOTE
          scp "${VPS2_SSH[@]}" scripts/migration/pg-peer-relay.py \
            "$VPS2_USER@$VPS2_HOST:$RELAY_ROOT/pg-peer-relay.py"
          ssh "${VPS2_SSH[@]}" "$VPS2_USER@$VPS2_HOST" bash -s -- \
            "$RELAY_ROOT" "$RELAY_UNIT" "$RELAY_READY" <<'REMOTE'
          set -Eeuo pipefail
          relay_root="$1"; relay_unit="$2"; ready_file="$3"
          [[ "$relay_root" =~ ^/tmp/dsl-pg-relay-[0-9]+-[0-9]+$ ]]
          [[ "$relay_unit" =~ ^dsl-wdc-pg-relay-[0-9]+-[0-9]+$ ]]
          [[ "$ready_file" == "$relay_root/ready.json" ]]
          chown www-data:www-data "$relay_root/pg-peer-relay.py"
          chmod 0550 "$relay_root/pg-peer-relay.py"
          systemd-run --quiet --collect --unit="$relay_unit" \
            --uid=www-data --gid=www-data \
            --property=NoNewPrivileges=yes --property=MemoryMax=128M \
            --property=TasksMax=32 --property=RuntimeMaxSec=32400 \
            /usr/bin/python3 "$relay_root/pg-peer-relay.py" \
              --listen-host 127.0.0.1 --listen-port 0 \
              --socket /var/run/postgresql/.s.PGSQL.5432 \
              --max-connections 8 --ready-file "$ready_file" \
              --require-user www-data
          for _ in $(seq 1 100); do
            test -s "$ready_file" && break
            systemctl is-active --quiet "$relay_unit.service"
            sleep 0.1
          done
          test -s "$ready_file"
          REMOTE
          RELAY_JSON="$(ssh "${VPS2_SSH[@]}" "$VPS2_USER@$VPS2_HOST" "cat '$RELAY_READY'")"
          RELAY_PORT="$(printf '%s' "$RELAY_JSON" | "$MAC_PYTHON" -c 'import json,sys; print(int(json.load(sys.stdin)["port"]))')"
          [[ "$RELAY_PORT" =~ ^[0-9]+$ ]] && (( RELAY_PORT > 0 && RELAY_PORT <= 65535 ))
          LOCAL_PORT="$("$MAC_PYTHON" - <<'PY'
          import socket
          with socket.socket() as listener:
              listener.bind(("127.0.0.1", 0))
              print(listener.getsockname()[1])
          PY
          )"
          TUNNEL_CONTROL="$MAC_RUN_ROOT/ssh/vps2-tunnel-control"
          ssh "${VPS2_SSH[@]}" -M -S "$TUNNEL_CONTROL" -fN \
            -o ExitOnForwardFailure=yes \
            -L "127.0.0.1:${LOCAL_PORT}:127.0.0.1:${RELAY_PORT}" \
            "$VPS2_USER@$VPS2_HOST"
          {
            echo "RELAY_ROOT=$RELAY_ROOT"
            echo "RELAY_UNIT=$RELAY_UNIT"
            echo "RELAY_READY=$RELAY_READY"
            echo "TUNNEL_CONTROL=$TUNNEL_CONTROL"
            echo "PG_RELAY_LOCAL_PORT=$LOCAL_PORT"
          } >> "$GITHUB_ENV"

          BUILD_ROOT="$MAC_RUN_ROOT/build"
          PAGES_ROOT="$BUILD_ROOT/pages"
          BUNDLES_ROOT="$BUILD_ROOT/bundles"
          SERVING_DB="$BUILD_ROOT/serving.sqlite"
          CANONICAL_SNAPSHOT="$BUILD_ROOT/canonical-runtime.sqlite"
          META_FILE="$BUILD_ROOT/source-meta.json"
          install -d -m 0700 "$BUILD_ROOT"
          "$MAC_PYTHON" -B - <<'PY'
          import psycopg
          if psycopg.__version__ != "3.3.4" or psycopg.pq.__impl__ != "binary":
              raise SystemExit("run-local psycopg 3.3.4 binary driver required")
          print("MAC_PG_DRIVER_OK", psycopg.__version__, psycopg.pq.__impl__)
          PY
          unset PGPASSWORD DAILY_SONG_POSTGRES_DSN
          MATERIALIZE_LOG="$MAC_RUN_ROOT/materialize.log"
          env \
            PYTHONUNBUFFERED=1 \
            PGHOST=127.0.0.1 \
            PGPORT="$LOCAL_PORT" \
            PGDATABASE=song_rank \
            PGUSER=www-data \
            PGAPPNAME="dsl-wdc-snapshot-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            PYTHONPATH="$PYTHON_DEPS_ROOT:$WDC_SOURCE_ROOT/server:$WDC_SOURCE_ROOT" \
            "$MAC_PYTHON" scripts/migration/materialize-pg-release-snapshot.py \
              --output "$PAGES_ROOT" \
              --meta-output "$META_FILE" \
              --snapshot-output "$CANONICAL_SNAPSHOT" \
              --expected-revision "$ACTIVE" \
              2>&1 | tee "$MATERIALIZE_LOG"
          # PostgreSQL is no longer needed after the one read-only transaction closes.
          # Remove the control socket before the exact run-root regular-file audit.
          ssh -S "$TUNNEL_CONTROL" -O exit "$VPS2_USER@$VPS2_HOST"
          for _ in {1..50}; do
            [[ ! -e "$TUNNEL_CONTROL" ]] && break
            sleep 0.1
          done
          test ! -e "$TUNNEL_CONTROL"
          test -s "$META_FILE"
          test -s "$CANONICAL_SNAPSHOT"
          "$MAC_PYTHON" - "$META_FILE" "$ACTIVE" "$EXPECTED_CONTENT" "$EXPECTED_SOURCE_COMMIT" <<'PY'
          import json, sys
          marker = json.load(open(sys.argv[1], encoding="utf-8"))
          assert marker["active_revision_id"] == sys.argv[2], marker
          assert marker["content_sha256"] == sys.argv[3], marker
          assert marker["source_commit_sha"] == sys.argv[4], marker
          assert int(marker["ranking_rows"]) > 0, marker
          assert int(marker["source_occurrences"]) > 0, marker
          print("MAC_PG_CANONICAL_SNAPSHOT_OK", marker["active_revision_id"])
          PY
          BUILT_AT="$("$MAC_PYTHON" - "$META_FILE" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1],encoding="utf-8")).get("built_at") or "")
          PY
          )"
          "$MAC_PYTHON" scripts/migration/build-serving-store.py \
            --source-db "$CANONICAL_SNAPSHOT" \
            --ranking-root "$PAGES_ROOT" \
            --output "$SERVING_DB" \
            --active-revision-id "$ACTIVE" \
            --required-ranges "7d,all" \
            --built-at "$BUILT_AT" \
            --consume-source-db
          test -s "$SERVING_DB"
          test ! -e "$CANONICAL_SNAPSHOT"
          "$MAC_PYTHON" scripts/migration/build-release-bundle.py \
            --input "$PAGES_ROOT" \
            --output "$BUNDLES_ROOT" \
            --serving-sqlite "$SERVING_DB" \
            --server-artifact server/release_serving_server.py \
            --frontend-root "$FRONTEND_ROOT" \
            --nginx-artifact deploy/nginx-next-api.conf \
            --systemd-artifact deploy/daily-song-list-api.service \
            --link-serving-sqlite \
            --active-revision-id "$ACTIVE" \
            --expected-parent-revision-id "$("$MAC_PYTHON" -c "import json; print(json.load(open('$META_FILE')).get('parent_revision_id') or '')")" \
            --source-commit-sha "$("$MAC_PYTHON" -c "import json; print(json.load(open('$META_FILE')).get('source_commit_sha') or '')")" \
            --server-commit-sha "$GITHUB_SHA" \
            --build-logic-sha "$BUILD_LOGIC_SHA" \
            --generated-at "$BUILT_AT" \
            --latest-event-time "$("$MAC_PYTHON" -c "import json; print(json.load(open('$META_FILE')).get('latest_generated_at') or '')")"
          BUNDLE_RESULT="$("$MAC_PYTHON" - "$BUNDLES_ROOT" <<'PY'
          import json,os,re,stat,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          children=list(root.iterdir())
          if len(children)!=1 or children[0].is_symlink() or not children[0].is_dir() or not re.fullmatch(r"[0-9a-f]{64}",children[0].name):
              raise SystemExit(f"bundle root must contain exactly one 64hex directory: {[p.name for p in children]}")
          release=children[0]
          total=0
          for directory,dirnames,filenames in os.walk(release,followlinks=False):
              for name in dirnames:
                  path=Path(directory)/name
                  if path.is_symlink():raise SystemExit(f"symlink directory in bundle: {path}")
              for name in filenames:
                  path=Path(directory)/name
                  mode=path.lstat().st_mode
                  if not stat.S_ISREG(mode):raise SystemExit(f"non-regular bundle file: {path}")
                  total+=path.lstat().st_size
          if total<=0:raise SystemExit("empty release bundle")
          frontend=json.loads((release/"artifacts/frontend/frontend-manifest.json").read_text(encoding="utf-8"))
          app_relative=str(frontend.get("appPath") or "")
          if not re.fullmatch(r"assets/app-h[0-9a-f]{12}\.js",app_relative):
              raise SystemExit(f"invalid frontend app path: {app_relative!r}")
          print(release.name,total,app_relative)
          PY
          )"
          read -r BUNDLE_SHA RELEASE_SIZE_BYTES APP_RELATIVE <<< "$BUNDLE_RESULT"
          [[ "$BUNDLE_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RELEASE_SIZE_BYTES" =~ ^[0-9]+$ ]]
          [[ "$APP_RELATIVE" =~ ^assets/app-h[0-9a-f]{12}\.js$ ]]
          (( RELEASE_SIZE_BYTES > 0 ))
          rm -f -- "$SERVING_DB"
          "$MAC_PYTHON" -B "$MAC_RUN_ROOT/check-run-storage.py" \
            "$MAC_RUN_ROOT" "$MAC_RUN_MAX_BYTES" "$MAC_FILESYSTEM_RESERVE_BYTES" \
            BUNDLE false

          AFTER_BUILD_JSON="$(ssh "${VPS2_SSH[@]}" "$VPS2_USER@$VPS2_HOST" \
            "timeout 65 curl --silent --show-error --fail --max-time 60 http://127.0.0.1:8765/api/meta")"
          LIVE_META_JSON="$AFTER_BUILD_JSON" "$MAC_PYTHON" - \
            "$ACTIVE" "$EXPECTED_CONTENT" "$EXPECTED_SOURCE_COMMIT" "$META_FILE" <<'PY'
          import json,os,sys
          expected=tuple(sys.argv[1:4])
          marker=json.load(open(sys.argv[4],encoding="utf-8"))
          raw=json.loads(os.environ["LIVE_META_JSON"])
          meta=raw.get("meta") or {}
          live=(
              str(meta.get("active_revision_id") or meta.get("activeRevisionId") or ""),
              str(meta.get("content_sha256") or meta.get("contentSha256") or ""),
              str(meta.get("source_commit_sha") or meta.get("sourceCommitSha") or ""),
          )
          built=(str(marker.get("active_revision_id") or ""),str(marker.get("content_sha256") or ""),str(marker.get("source_commit_sha") or ""))
          if live!=expected or built!=expected:
              raise SystemExit(f"SOURCE_TRIPLET_DRIFT_AFTER_BUILD live={live} built={built} expected={expected}")
          print("SOURCE_TRIPLET_STABLE_AFTER_BUILD",*live)
          PY
          echo "bundle_sha=$BUNDLE_SHA" >> "$GITHUB_OUTPUT"
          echo "release_size_bytes=$RELEASE_SIZE_BYTES" >> "$GITHUB_OUTPUT"
          echo "app_relative=$APP_RELATIVE" >> "$GITHUB_OUTPUT"
          echo "MAC_RELEASE_READY sha=$BUNDLE_SHA bytes=$RELEASE_SIZE_BYTES app=$APP_RELATIVE"

      - name: Stream bounded bundle directly from Mac and activate WDC
        if: steps.check.outputs.skip != 'true'
        id: deploy
        timeout-minutes: 90
        env:
          BUNDLE_SHA: ${{ steps.materialize.outputs.bundle_sha }}
          RELEASE_SIZE_BYTES: ${{ steps.materialize.outputs.release_size_bytes }}
          APP_RELATIVE: ${{ steps.materialize.outputs.app_relative }}
          PREVIOUS_RELEASE_SHA: ${{ steps.check.outputs.deployed_release }}
          ACTIVE: ${{ steps.check.outputs.active }}
          EXPECTED_CONTENT: ${{ steps.check.outputs.content }}
          EXPECTED_SOURCE_COMMIT: ${{ steps.check.outputs.source_commit }}
        run: |
          set -Eeuo pipefail
          VPS2_SSH=(-o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_ROOT/vps2-knownhosts" -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          WDC_SSH=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_ROOT/wdc-knownhosts" -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -i "$SSH_ROOT/wdc-key")
          [[ "$BUNDLE_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PREVIOUS_RELEASE_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RELEASE_SIZE_BYTES" =~ ^[0-9]+$ ]] && (( RELEASE_SIZE_BYTES > 0 ))
          [[ "$APP_RELATIVE" =~ ^assets/app-h[0-9a-f]{12}\.js$ ]]
          BUNDLE_ROOT="$MAC_RUN_ROOT/build/bundles"
          test -d "$BUNDLE_ROOT/$BUNDLE_SHA"
          ARCHIVE_UPPER_BOUND=$((RELEASE_SIZE_BYTES + RELEASE_SIZE_BYTES / 100 + 67108864))
          WDC_INCOMING_ROOT="$WDC_PROJECT_ROOT/incoming/dsl-wdc-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${BUNDLE_SHA}"
          WDC_INCOMING_PART="$WDC_INCOMING_ROOT/release.tar.gz.part"
          echo "incoming_root=$WDC_INCOMING_ROOT" >> "$GITHUB_OUTPUT"
          echo "WDC_INCOMING_ROOT=$WDC_INCOMING_ROOT" >> "$GITHUB_ENV"

          # Read-only hard gate before the first current-run write on WDC.
          ssh "${WDC_SSH[@]}" "$WDC_USER@$WDC_HOST" bash -s -- \
            "$WDC_PROJECT_ROOT" "$WDC_RELEASES_ROOT" "$WDC_INCOMING_ROOT" \
            "$ARCHIVE_UPPER_BOUND" "$RELEASE_SIZE_BYTES" \
            "$WDC_PROJECT_MAX_BYTES" "$WDC_FILESYSTEM_RESERVE_BYTES" \
            "$WDC_CONTROL_BACKUP_MAX_BYTES" "$WDC_SERVER_PATH" \
            "$WDC_STATIC_ROOT/index.html" "$WDC_STATIC_ROOT/$APP_RELATIVE" \
            "$WDC_SERVICE_UNIT_PATH" "$WDC_NGINX_AVAILABLE_PATH" \
            "$WDC_NGINX_ENABLED_PATH" <<'REMOTE'
          set -Eeuo pipefail
          project_root="$1"; releases_root="$2"; incoming_root="$3"
          archive_upper="$4"; release_bytes="$5"; max_bytes="$6"; reserve_bytes="$7"
          control_backup_max="$8"; server_target="$9"; index_target="${10}"; app_target="${11}"
          unit_target="${12}"; nginx_available_target="${13}"; nginx_enabled_target="${14}"
          [[ "$project_root" == "/opt/culua/ytb-song-rank" ]]
          [[ "$releases_root" == "$project_root/releases" ]]
          [[ "$incoming_root" =~ ^/opt/culua/ytb-song-rank/incoming/dsl-wdc-[0-9]+-[0-9]+-[0-9a-f]{64}$ ]]
          test ! -e "$incoming_root"
          for value in "$archive_upper" "$release_bytes" "$max_bytes" "$reserve_bytes" "$control_backup_max"; do
            [[ "$value" =~ ^[0-9]+$ ]]
          done
          (( max_bytes == 40000000000 && reserve_bytes >= 5000000000 && control_backup_max == 134217728 ))
          control_backup_bytes="$(python3 - "$control_backup_max" \
            "$server_target" "$index_target" "$app_target" "$unit_target" \
            "$nginx_available_target" "$nginx_enabled_target" <<'PY'
          import os,stat,sys
          limit=int(sys.argv[1]);targets=sys.argv[2:]
          if len(targets)!=6:raise SystemExit("WDC_CONTROL_TARGET_COUNT_INVALID")
          total=0
          for target in targets:
              try:info=os.lstat(target)
              except FileNotFoundError:continue
              if not (stat.S_ISREG(info.st_mode) or stat.S_ISLNK(info.st_mode)):
                  raise SystemExit(f"WDC_CONTROL_TARGET_UNSAFE path={target}")
              total+=info.st_size
          if total>=limit:
              raise SystemExit(f"WDC_CONTROL_BACKUP_LIMIT_EXCEEDED bytes={total} max={limit}")
          print(total)
          PY
          )"
          [[ "$control_backup_bytes" =~ ^[0-9]+$ ]] && (( control_backup_bytes < control_backup_max ))
          current_bytes="$(du -sb -- "$project_root" | awk '{print $1}')"
          available_bytes="$(python3 - "$project_root" <<'PY'
          import os,sys
          stats=os.statvfs(sys.argv[1]);print(stats.f_bavail*stats.f_frsize)
          PY
          )"
          # One archive plus one extracted release. Activation uses a same-filesystem
          # rename from releases/.incoming-* and never copies serving.sqlite.
          incoming_bytes=$((archive_upper + release_bytes + control_backup_max))
          projected_bytes=$((current_bytes + incoming_bytes))
          (( projected_bytes < max_bytes )) || { echo "WDC_STORAGE_LIMIT_EXCEEDED projected=$projected_bytes max=$max_bytes" >&2; exit 74; }
          (( available_bytes - incoming_bytes >= reserve_bytes )) || { echo "WDC_FILESYSTEM_RESERVE_VIOLATION available=$available_bytes incoming=$incoming_bytes reserve=$reserve_bytes" >&2; exit 75; }
          echo "WDC_STORAGE_PREFLIGHT_OK current=$current_bytes projected=$projected_bytes available=$available_bytes control_backup=$control_backup_bytes control_limit=$control_backup_max"
          REMOTE

          RECEIVER="$MAC_RUN_ROOT/receive-bounded.sh"
          cat > "$RECEIVER" <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          part="$1"; upper="$2"
          [[ "$part" =~ ^/opt/culua/ytb-song-rank/incoming/dsl-wdc-[0-9]+-[0-9]+-[0-9a-f]{64}/release\.tar\.gz\.part$ ]]
          [[ "$upper" =~ ^[0-9]+$ ]] && (( upper > 0 ))
          test ! -e "$part"
          umask 077
          head -c "$((upper + 1))" > "$part"
          actual="$(wc -c < "$part" | tr -d ' ')"
          if (( actual <= 0 || actual > upper )); then
            rm -f -- "$part"
            echo "WDC_STREAM_BOUND_EXCEEDED actual=$actual upper=$upper" >&2
            exit 76
          fi
          echo "WDC_STREAM_RECEIVED bytes=$actual upper=$upper"
          SH
          chmod 0700 "$RECEIVER"

          BEFORE_WDC_JSON="$(ssh "${VPS2_SSH[@]}" "$VPS2_USER@$VPS2_HOST" \
            "timeout 65 curl --silent --show-error --fail --max-time 60 http://127.0.0.1:8765/api/meta")"
          LIVE_META_JSON="$BEFORE_WDC_JSON" "$MAC_PYTHON" - \
            "$ACTIVE" "$EXPECTED_CONTENT" "$EXPECTED_SOURCE_COMMIT" "$MAC_RUN_ROOT/build/source-meta.json" <<'PY'
          import json,os,sys
          expected=tuple(sys.argv[1:4])
          marker=json.load(open(sys.argv[4],encoding="utf-8"))
          raw=json.loads(os.environ["LIVE_META_JSON"])
          meta=raw.get("meta") or {}
          live=(
              str(meta.get("active_revision_id") or meta.get("activeRevisionId") or ""),
              str(meta.get("content_sha256") or meta.get("contentSha256") or ""),
              str(meta.get("source_commit_sha") or meta.get("sourceCommitSha") or ""),
          )
          built=(str(marker.get("active_revision_id") or ""),str(marker.get("content_sha256") or ""),str(marker.get("source_commit_sha") or ""))
          if live!=expected or built!=expected:
              raise SystemExit(f"SOURCE_TRIPLET_DRIFT_BEFORE_WDC_WRITE live={live} built={built} expected={expected}")
          print("SOURCE_TRIPLET_STABLE_BEFORE_WDC_WRITE",*live)
          PY

          ssh "${WDC_SSH[@]}" "$WDC_USER@$WDC_HOST" bash -s -- \
            "$WDC_PROJECT_ROOT" "$WDC_INCOMING_ROOT" <<'REMOTE'
          set -Eeuo pipefail
          project_root="$1"; incoming_root="$2"
          [[ "$project_root" == "/opt/culua/ytb-song-rank" ]]
          [[ "$incoming_root" =~ ^/opt/culua/ytb-song-rank/incoming/dsl-wdc-[0-9]+-[0-9]+-[0-9a-f]{64}$ ]]
          install -d -m 0750 "$project_root/incoming"
          install -d -m 0750 "$incoming_root"
          REMOTE
          scp "${WDC_SSH[@]}" "$RECEIVER" deploy/install-wdc-release.sh \
            "$WDC_USER@$WDC_HOST:$WDC_INCOMING_ROOT/"
          ssh "${WDC_SSH[@]}" "$WDC_USER@$WDC_HOST" \
            "chmod 0700 '$WDC_INCOMING_ROOT/receive-bounded.sh' '$WDC_INCOMING_ROOT/install-wdc-release.sh'"
          COPYFILE_DISABLE=1 tar -C "$BUNDLE_ROOT" -czf - "$BUNDLE_SHA" | \
            ssh "${WDC_SSH[@]}" "$WDC_USER@$WDC_HOST" \
              "$WDC_INCOMING_ROOT/receive-bounded.sh" "$WDC_INCOMING_PART" "$ARCHIVE_UPPER_BOUND"
          ARCHIVE_SIZE_BYTES="$(ssh "${WDC_SSH[@]}" "$WDC_USER@$WDC_HOST" "wc -c < '$WDC_INCOMING_PART' | tr -d ' '")"
          [[ "$ARCHIVE_SIZE_BYTES" =~ ^[0-9]+$ ]] && (( ARCHIVE_SIZE_BYTES > 0 && ARCHIVE_SIZE_BYTES <= ARCHIVE_UPPER_BOUND ))

          BEFORE_ACTIVATE_JSON="$(ssh "${VPS2_SSH[@]}" "$VPS2_USER@$VPS2_HOST" \
            "timeout 65 curl --silent --show-error --fail --max-time 60 http://127.0.0.1:8765/api/meta")"
          LIVE_META_JSON="$BEFORE_ACTIVATE_JSON" "$MAC_PYTHON" - \
            "$ACTIVE" "$EXPECTED_CONTENT" "$EXPECTED_SOURCE_COMMIT" "$MAC_RUN_ROOT/build/source-meta.json" <<'PY'
          import json,os,sys
          expected=tuple(sys.argv[1:4])
          marker=json.load(open(sys.argv[4],encoding="utf-8"))
          meta=(json.loads(os.environ["LIVE_META_JSON"]).get("meta") or {})
          live=(str(meta.get("active_revision_id") or meta.get("activeRevisionId") or ""),str(meta.get("content_sha256") or meta.get("contentSha256") or ""),str(meta.get("source_commit_sha") or meta.get("sourceCommitSha") or ""))
          built=(str(marker.get("active_revision_id") or ""),str(marker.get("content_sha256") or ""),str(marker.get("source_commit_sha") or ""))
          if live!=expected or built!=expected:raise SystemExit(f"SOURCE_TRIPLET_DRIFT_BEFORE_ACTIVATE live={live} built={built} expected={expected}")
          print("SOURCE_TRIPLET_STABLE_BEFORE_ACTIVATE",*live)
          PY

          ssh "${WDC_SSH[@]}" "$WDC_USER@$WDC_HOST" bash -s -- \
            "$BUNDLE_SHA" "$WDC_RELEASES_ROOT" "$WDC_SERVER_PATH" "$WDC_SERVICE" \
            "$GITHUB_SHA" "$BUILD_LOGIC_SHA" "$WDC_API_PORT" "$WDC_STATIC_ROOT" \
            "$WDC_SERVICE_UNIT_PATH" "$WDC_NGINX_AVAILABLE_PATH" "$WDC_NGINX_ENABLED_PATH" \
            "$WDC_PROJECT_ROOT" "$WDC_PROJECT_MAX_BYTES" "$WDC_FILESYSTEM_RESERVE_BYTES" \
            "$RELEASE_SIZE_BYTES" "$ARCHIVE_SIZE_BYTES" "$PREVIOUS_RELEASE_SHA" \
            "$WDC_INCOMING_ROOT" "$WDC_INCOMING_PART" "$ACTIVE" "$EXPECTED_SOURCE_COMMIT" \
            "$WDC_CONTROL_BACKUP_MAX_BYTES" "$APP_RELATIVE" <<'REMOTE'
          set -Eeuo pipefail
          sha="$1"; root="$2"; server_path="$3"; service="$4"; server_commit="$5"; build_logic="$6"; port="$7"
          static_root="$8"; unit_path="$9"; nginx_available="${10}"; nginx_enabled="${11}"
          project_root="${12}"; max_bytes="${13}"; reserve_bytes="${14}"; release_bytes="${15}"; archive_bytes="${16}"
          previous_release_sha="${17}"; incoming_root="${18}"; archive="${19}"; expected_active="${20}"; expected_source_commit="${21}"
          control_backup_max="${22}"; app_relative="${23}"
          installer="$incoming_root/install-wdc-release.sh"
          [[ "$sha" =~ ^[0-9a-f]{64}$ && "$previous_release_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$project_root" == "/opt/culua/ytb-song-rank" && "$root" == "$project_root/releases" ]]
          [[ "$incoming_root" =~ ^/opt/culua/ytb-song-rank/incoming/dsl-wdc-[0-9]+-[0-9]+-[0-9a-f]{64}$ ]]
          [[ "$archive" == "$incoming_root/release.tar.gz.part" ]]
          [[ "$app_relative" =~ ^assets/app-h[0-9a-f]{12}\.js$ ]]
          (( max_bytes == 40000000000 && reserve_bytes >= 5000000000 && control_backup_max == 134217728 ))
          test -s "$archive"; test -x "$installer"
          [[ "$(wc -c < "$archive" | tr -d ' ')" == "$archive_bytes" ]]
          control_backup_bytes="$(python3 - "$control_backup_max" \
            "$server_path" "$static_root/index.html" "$static_root/$app_relative" \
            "$unit_path" "$nginx_available" "$nginx_enabled" <<'PY'
          import os,stat,sys
          limit=int(sys.argv[1]);targets=sys.argv[2:]
          if len(targets)!=6:raise SystemExit("WDC_CONTROL_TARGET_COUNT_INVALID")
          total=0
          for target in targets:
              try:info=os.lstat(target)
              except FileNotFoundError:continue
              if not (stat.S_ISREG(info.st_mode) or stat.S_ISLNK(info.st_mode)):
                  raise SystemExit(f"WDC_CONTROL_TARGET_UNSAFE path={target}")
              total+=info.st_size
          if total>=limit:
              raise SystemExit(f"WDC_CONTROL_BACKUP_LIMIT_EXCEEDED bytes={total} max={limit}")
          print(total)
          PY
          )"
          [[ "$control_backup_bytes" =~ ^[0-9]+$ ]] && (( control_backup_bytes < control_backup_max ))
          current_bytes="$(du -sb -- "$project_root" | awk '{print $1}')"
          available_bytes="$(python3 - "$project_root" <<'PY'
          import os,sys
          stats=os.statvfs(sys.argv[1]);print(stats.f_bavail*stats.f_frsize)
          PY
          )"
          # The archive is already part of current_bytes. The extracted directory and
          # final release are siblings below releases/, so mv is a same-filesystem rename
          # and does not create a second serving.sqlite copy.
          projected_bytes=$((current_bytes + release_bytes + control_backup_max))
          (( projected_bytes < max_bytes )) || { echo "WDC_STORAGE_LIMIT_EXCEEDED_AFTER_ARCHIVE projected=$projected_bytes max=$max_bytes" >&2; exit 74; }
          (( available_bytes - release_bytes - control_backup_max >= reserve_bytes )) || { echo "WDC_FILESYSTEM_RESERVE_VIOLATION_AFTER_ARCHIVE available=$available_bytes release=$release_bytes control_limit=$control_backup_max reserve=$reserve_bytes" >&2; exit 75; }
          echo "WDC_STORAGE_AFTER_ARCHIVE_OK current=$current_bytes projected=$projected_bytes available=$available_bytes control_backup=$control_backup_bytes control_limit=$control_backup_max"
          mkdir -p "$root"
          incoming="$(mktemp -d "$root/.incoming-$sha.XXXXXX")"
          trap 'rm -rf -- "$incoming"' EXIT
          python3 - "$archive" "$incoming" "$sha" "$expected_active" "$expected_source_commit" "$server_commit" "$build_logic" <<'PY'
          import json,tarfile,sys
          from pathlib import Path
          archive,incoming,sha,active,source_commit,server_commit,logic=Path(sys.argv[1]),Path(sys.argv[2]).resolve(),*sys.argv[3:]
          with tarfile.open(archive,"r:gz") as bundle:
              members=bundle.getmembers()
              for member in members:
                  if member.issym() or member.islnk() or member.isdev():raise SystemExit(f"unsafe tar member: {member.name}")
                  target=(incoming/member.name).resolve()
                  if incoming not in target.parents and target!=incoming:raise SystemExit(f"tar traversal: {member.name}")
              bundle.extractall(incoming)
          release=incoming/sha
          meta=json.loads((release/"meta.json").read_text(encoding="utf-8"))
          manifest=json.loads((release/"manifest.json").read_text(encoding="utf-8"))
          assert meta["contentSha256"]==sha and manifest["contentSha256"]==sha
          assert meta["activeRevisionId"]==active
          assert meta["sourceCommitSha"]==source_commit
          assert meta["serverCommitSha"]==server_commit and meta["buildLogicSha"]==logic
          print("WDC_INCOMING_IDENTITY_OK",sha,active,meta["sourceCommitSha"])
          PY
          if [[ -d "$root/$sha" ]]; then
            cmp "$incoming/$sha/manifest.json" "$root/$sha/manifest.json"
            rm -rf -- "$incoming/$sha"
          else
            echo "WDC_SAME_FS_MV_NO_DB_COPY incoming=$incoming/$sha release=$root/$sha"
            mv "$incoming/$sha" "$root/$sha"
          fi
          chown -R daily-song-list:daily-song-list "$root/$sha"
          "$installer" --action activate --sha "$sha" --releases-root "$root" \
            --server-path "$server_path" --static-root "$static_root" \
            --service-unit-path "$unit_path" --nginx-available-path "$nginx_available" \
            --nginx-enabled-path "$nginx_enabled" --service "$service" \
            --expected-server-commit "$server_commit" --expected-build-logic-sha "$build_logic" \
            --previous-release-sha "$previous_release_sha" --port "$port"
          health="$(curl --silent --show-error --fail --max-time 10 "http://127.0.0.1:$port/healthz")"
          printf '%s' "$health" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["status"]=="ok" and d["releaseContentSha"]==sys.argv[1] and d["activeRevision"]==sys.argv[2] and d["sourceCommit"]==sys.argv[3]' "$sha" "$expected_active" "$expected_source_commit"
          echo "WDC_ACTIVATION_IDENTITY_OK sha=$sha active=$expected_active source=$expected_source_commit"
          REMOTE

          AFTER_ACTIVATE_JSON="$(ssh "${VPS2_SSH[@]}" "$VPS2_USER@$VPS2_HOST" \
            "timeout 65 curl --silent --show-error --fail --max-time 60 http://127.0.0.1:8765/api/meta")"
          LIVE_META_JSON="$AFTER_ACTIVATE_JSON" "$MAC_PYTHON" - \
            "$ACTIVE" "$EXPECTED_CONTENT" "$EXPECTED_SOURCE_COMMIT" "$MAC_RUN_ROOT/build/source-meta.json" <<'PY'
          import json,os,sys
          expected=tuple(sys.argv[1:4])
          marker=json.load(open(sys.argv[4],encoding="utf-8"))
          meta=(json.loads(os.environ["LIVE_META_JSON"]).get("meta") or {})
          live=(str(meta.get("active_revision_id") or meta.get("activeRevisionId") or ""),str(meta.get("content_sha256") or meta.get("contentSha256") or ""),str(meta.get("source_commit_sha") or meta.get("sourceCommitSha") or ""))
          built=(str(marker.get("active_revision_id") or ""),str(marker.get("content_sha256") or ""),str(marker.get("source_commit_sha") or ""))
          if live!=expected or built!=expected:raise SystemExit(f"SOURCE_TRIPLET_DRIFT_AFTER_ACTIVATE live={live} built={built} expected={expected}")
          print("SOURCE_TRIPLET_STABLE_AFTER_ACTIVATE",*live)
          PY

      - name: Verify public next domain
        if: steps.check.outputs.skip != 'true'
