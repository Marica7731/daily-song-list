name: Sync complete immutable release to WDC

on:
  schedule:
    # One daily attempt; long builds no longer manufacture 20-minute duplicates.
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run latest head now; an identical immutable identity still exits without copying"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: daily-song-list-wdc-release-server-v4
  cancel-in-progress: false

env:
  VPS2_HOST: ${{ secrets.VPS2_HOST }}
  VPS2_USER: "root"
  WDC_HOST: ${{ secrets.WDC_HOST }}
  WDC_USER: ${{ secrets.WDC_USER }}
  FORCE: ${{ inputs.force || 'false' }}
  WDC_PROJECT_MAX_BYTES: "40000000000"
  WDC_HOST_RESERVE_BYTES: "20000000000"
  WDC_TEMP_VOLUME_BYTES: "32000000000"
  WDC_RELEASE_MAX_BYTES: "16000000000"
  WDC_MEMORY_MAX_BYTES: "2684354560"
  WDC_SWAP_MAX_BYTES: "1073741824"
  VPS2_RELAY_MAX_BYTES: "16000000000"
  VPS2_RELAY_MAX_CONNECTIONS: "2"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  ubuntu_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout bounded release inputs
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            server/release_serving_server.py
            server/pg_adapter.py
            scripts/migration/7d-json-to-patch.py
            scripts/migration/materialize-pg-release-snapshot.py
            scripts/migration/materialize-ranking-pages.py
            scripts/migration/build-serving-store.py
            scripts/migration/build-release-bundle.py
            scripts/migration/check-wdc-readme-scope.py
            scripts/migration/prepare-wdc-frontend.py
            scripts/migration/patch-next-frontend.py
            scripts/migration/pg-peer-relay.py
            scripts/migration/requirements-wdc-linux.txt
            deploy/check-wdc-build-storage.py
            deploy/cleanup-wdc-bounded-build.sh
            deploy/daily-song-list-api.service
            deploy/finalize-wdc-bounded-release.sh
            deploy/install-wdc-release.sh
            deploy/nginx-next-api.conf
            deploy/orchestrate-wdc-bounded-release.sh
            deploy/run-wdc-bounded-build.sh
            deploy/start-wdc-pg-tunnel.sh
            deploy/verify-wdc-public-release.py
            deploy/verify-wdc-release-data.py
            deploy/wdc-vps2-askpass.sh
            assets/app.js
            index.html
            .github/workflows/check-code.yml
            .github/workflows/sync-wdc-release.yml
            .github/workflows/test-next-serving-v3.yml
            .github/workflows/update-backfill.yml
            .github/workflows/update-core.yml
            tests/test_next_serving_v3.py
            tests/test_pg_peer_relay.py

      - name: Run bounded server-side release gate
        run: |
          set -Eeuo pipefail
          python3 -B - <<'PY'
          import ast
          from pathlib import Path
          paths=(
              "server/release_serving_server.py",
              "server/pg_adapter.py",
              "scripts/migration/7d-json-to-patch.py",
              "scripts/migration/materialize-pg-release-snapshot.py",
              "scripts/migration/materialize-ranking-pages.py",
              "scripts/migration/build-serving-store.py",
              "scripts/migration/build-release-bundle.py",
              "scripts/migration/check-wdc-readme-scope.py",
              "scripts/migration/prepare-wdc-frontend.py",
              "scripts/migration/patch-next-frontend.py",
              "scripts/migration/pg-peer-relay.py",
              "deploy/check-wdc-build-storage.py",
              "deploy/verify-wdc-public-release.py",
              "deploy/verify-wdc-release-data.py",
              "tests/test_next_serving_v3.py",
              "tests/test_pg_peer_relay.py",
          )
          for name in paths:
              ast.parse(Path(name).read_text(encoding="utf-8"),filename=name)
          print("WDC_PYTHON_AST_OK",len(paths))
          PY
          for script in \
            deploy/cleanup-wdc-bounded-build.sh \
            deploy/finalize-wdc-bounded-release.sh \
            deploy/install-wdc-release.sh \
            deploy/orchestrate-wdc-bounded-release.sh \
            deploy/run-wdc-bounded-build.sh \
            deploy/start-wdc-pg-tunnel.sh \
            deploy/wdc-vps2-askpass.sh; do
            bash -n "$script"
          done
          node --check assets/app.js
          wheels="$RUNNER_TEMP/wdc-linux-wheels"
          install -d -m 0700 "$wheels"
          python3 -m pip download \
            --dest "$wheels" \
            --only-binary=:all: \
            --require-hashes \
            --no-deps \
            --no-cache-dir \
            --timeout 30 \
            --retries 2 \
            -r scripts/migration/requirements-wdc-linux.txt
          test "$(find "$wheels" -maxdepth 1 -type f | wc -l)" = "3"
          PYTHONWARNINGS=error::ResourceWarning \
            python3 -B -m unittest discover -s tests -p 'test_next_serving_v3.py' -v
          python3 -B -m unittest discover -s tests -p 'test_pg_peer_relay.py' -v
          echo "WDC_UBUNTU_SERVER_GATE_OK"

  sync:
    needs: ubuntu_gate
    runs-on: ubuntu-latest
    timeout-minutes: 600
    environment: wdc-shadow
    steps:
      - name: Checkout hashed sparse controller inputs
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            server/release_serving_server.py
            server/pg_adapter.py
            scripts/migration/7d-json-to-patch.py
            scripts/migration/materialize-pg-release-snapshot.py
            scripts/migration/materialize-ranking-pages.py
            scripts/migration/build-serving-store.py
            scripts/migration/build-release-bundle.py
            scripts/migration/prepare-wdc-frontend.py
            scripts/migration/patch-next-frontend.py
            scripts/migration/pg-peer-relay.py
            scripts/migration/requirements-wdc-linux.txt
            deploy/check-wdc-build-storage.py
            deploy/cleanup-wdc-bounded-build.sh
            deploy/daily-song-list-api.service
            deploy/finalize-wdc-bounded-release.sh
            deploy/install-wdc-release.sh
            deploy/nginx-next-api.conf
            deploy/orchestrate-wdc-bounded-release.sh
            deploy/run-wdc-bounded-build.sh
            deploy/start-wdc-pg-tunnel.sh
            deploy/verify-wdc-public-release.py
            deploy/verify-wdc-release-data.py
            deploy/wdc-vps2-askpass.sh
            assets/app.js
            index.html
            .github/workflows/sync-wdc-release.yml

      - name: Prepare exact controller SSH root
        env:
          VPS2_PASSWORD: ${{ secrets.VPS2_PASSWORD }}
          VPS2_KNOWN_HOSTS: ${{ secrets.VPS2_KNOWN_HOSTS }}
          WDC_SSH_PRIVATE_KEY: ${{ secrets.WDC_SSH_PRIVATE_KEY }}
          WDC_KNOWN_HOSTS: ${{ secrets.WDC_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$VPS2_PASSWORD"
          test -n "$VPS2_KNOWN_HOSTS"
          test -n "$WDC_SSH_PRIVATE_KEY"
          test -n "$WDC_KNOWN_HOSTS"
          root="$RUNNER_TEMP/dsl-wdc-controller-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$root" =~ /dsl-wdc-controller-[0-9]+-[0-9]+$ ]]
          test ! -e "$root"
          install -d -m 0700 "$root"
          printf '%s\n' "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" > "$root/.codex-owned-run"
          printf '%s\n' "$VPS2_PASSWORD" > "$root/vps2-password"
          printf '%s\n' "$VPS2_KNOWN_HOSTS" > "$root/vps2-knownhosts"
          printf '%s\n' "$WDC_SSH_PRIVATE_KEY" > "$root/wdc-key"
          printf '%s\n' "$WDC_KNOWN_HOSTS" > "$root/wdc-knownhosts"
          cat > "$root/vps2-askpass.sh" <<'SH'
          #!/bin/sh
          set -eu
          exec cat -- "$(dirname "$0")/vps2-password"
          SH
          chmod 0600 "$root/.codex-owned-run" "$root/vps2-password" \
            "$root/vps2-knownhosts" "$root/wdc-key" "$root/wdc-knownhosts"
          chmod 0700 "$root/vps2-askpass.sh"
          echo "SSH_ROOT=$root" >> "$GITHUB_ENV"

      - name: Build on WDC within fixed disk memory and wire budgets
        run: |
          set -Eeuo pipefail
          deploy/orchestrate-wdc-bounded-release.sh

      - name: Cleanup exact controller SSH root
        if: always()
        run: |
          set -Eeuo pipefail
          root="${SSH_ROOT:-$RUNNER_TEMP/dsl-wdc-controller-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}"
          [[ "$root" == "$RUNNER_TEMP/dsl-wdc-controller-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ]]
          if [[ -e "$root" || -L "$root" ]]; then
            [[ -d "$root" && ! -L "$root" ]]
            [[ "$(cat "$root/.codex-owned-run")" == "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" ]]
            rm -rf -- "$root"
          fi
          echo "WDC_CONTROLLER_ROOT_CLEAN"
