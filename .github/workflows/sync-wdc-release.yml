      - name: Verify complete public correctness and asset contract
        if: steps.check.outputs.skip != 'true'
        env:
          BUNDLE_SHA: ${{ steps.materialize.outputs.bundle_sha }}
          ACTIVE: ${{ steps.check.outputs.active }}
          SOURCE_COMMIT: ${{ steps.check.outputs.source_commit }}
        run: |
          set -Eeuo pipefail
          "$MAC_PYTHON" - "$BUNDLE_SHA" "$BUILD_LOGIC_SHA" "$GITHUB_SHA" "$ACTIVE" "$SOURCE_COMMIT" <<'PY'
          from __future__ import annotations
          import gzip,json,math,re,sys
          from urllib.error import HTTPError
          from urllib.parse import quote,urlencode
          from urllib.request import Request,urlopen

          base="https://next.ytb-song-rank.culua.com"
          expected_sha,expected_logic,expected_commit,expected_active,expected_source=sys.argv[1:]
          expected_views={"songs","artists","vtubers","videos"}
          expected_metrics={"occurrences","songs","videos"}
          expected_scopes={"all","niche","visible","visibleNiche"}

          def raw(path,accept="application/json",encoding=""):
              headers={"Accept":accept,"User-Agent":"daily-song-list-complete-release-gate/3"}
              if encoding:headers["Accept-Encoding"]=encoding
              with urlopen(Request(base+path,headers=headers),timeout=20) as response:
                  body=response.read();response_headers=response.headers
                  if response_headers.get("Content-Encoding")=="gzip":body=gzip.decompress(body)
                  return response.status,response_headers,body

          def fetch(path,*,source=None,gzip_required=False):
              status,headers,body=raw(path,encoding="gzip" if gzip_required else "")
              assert status==200,(path,status)
              assert headers.get("X-Release-Sha")==expected_sha,(path,headers.get("X-Release-Sha"))
              assert headers.get("X-Server-Commit")==expected_commit,(path,headers.get("X-Server-Commit"))
              if source is not None:assert headers.get("X-Data-Source")==source,(path,headers.get("X-Data-Source"))
              if gzip_required:assert headers.get("Content-Encoding")=="gzip",(path,headers)
              return json.loads(body),headers

          health,_=fetch("/healthz")
          assert health.get("status")=="ok" and health.get("releaseContentSha")==expected_sha,health
          assert health.get("buildLogicSha")==expected_logic,health
          assert health.get("activeRevision")==expected_active and health.get("sourceCommit")==expected_source,health
          assert set(health.get("views") or [])==expected_views,health
          assert set(health.get("metrics") or [])==expected_metrics,health
          assert set(health.get("rankingScopes") or [])==expected_scopes,health

          meta,_=fetch("/api/meta",source="local-release")
          meta_identity=meta.get("meta") or {}
          assert meta_identity.get("active_revision_id")==expected_active,meta
          assert meta_identity.get("source_commit_sha")==expected_source,meta
          capabilities=meta.get("capabilities") or {}
          assert set(capabilities.get("views") or [])==expected_views,meta
          assert set(capabilities.get("metrics") or [])==expected_metrics,meta
          assert set(capabilities.get("rankingScopes") or [])==expected_scopes,meta
          assert capabilities.get("localSearch") is True and capabilities.get("localSources") is True,meta
          assert capabilities.get("oldOriginDependency") is False and capabilities.get("sourceFallbackEnabled") is False,meta

          all_song_records=[]
          for range_id in ("7d","all"):
              for view in sorted(expected_views):
                  for metric in sorted(expected_metrics):
                      query=urlencode({"v":expected_sha,"range":range_id,"view":view,"metric":metric,"page":1,"pageSize":30})
                      payload,_=fetch("/api/rankings?"+query,source="local-release-chunk",gzip_required=True)
                      records=payload.get("records") or []
                      assert records,(range_id,view,metric,payload)
                      keys=[str(record.get("key") or "") for record in records]
                      assert all(keys) and len(keys)==len(set(keys)),(range_id,view,metric,keys)
                      if view=="artists":
                          for record in records:
                              assert int(record.get("songCount") or 0)>=len(record.get("songs") or []),record
                              assert len(record.get("songs") or [])<=3,record
                      if range_id=="all" and view=="songs" and metric=="occurrences":all_song_records=records

          base_query={"v":expected_sha,"range":"all","view":"songs","metric":"occurrences","page":1,"pageSize":30}
          base_rank,_=fetch("/api/rankings?"+urlencode(base_query),source="local-release-chunk")
          scope_totals={"all":int(base_rank.get("totalCount") or 0)}
          for scope,flags in {
              "niche":{"nicheOnly":1},
              "visible":{"hideUnknownArtist":1},
              "visibleNiche":{"nicheOnly":1,"hideUnknownArtist":1},
          }.items():
              scoped,_=fetch("/api/rankings?"+urlencode({**base_query,**flags}),source="local-serving-sqlite")
              assert scoped.get("scopeKey")==scope,scoped
              scope_totals[scope]=int(scoped.get("totalCount") or 0)
          assert any(value!=scope_totals["all"] for key,value in scope_totals.items() if key!="all"),scope_totals

          search_record=next((record for record in all_song_records if record.get("title") and (record.get("artist") or record.get("displayArtist"))),None)
          assert search_record is not None,all_song_records
          for field,value in (("title",search_record["title"]),("artist",search_record.get("artist") or search_record.get("displayArtist"))):
              query=urlencode({**base_query,"q":str(value),"searchFields":field,"pageSize":12})
              searched,_=fetch("/api/rankings?"+query,source="local-serving-sqlite")
              records=searched.get("records") or []
              assert records,(field,value,searched)
              keys=[str(record.get("key") or "") for record in records]
              assert len(keys)==len(set(keys)),(field,keys)

          source_candidates=[]
          for source_key in dict.fromkeys(
              str(record.get("sourceDetailKey") or "") for record in all_song_records[:12]
          ):
              if not source_key:continue
              query=urlencode({"v":expected_sha,"range":"all","page":1,"pageSize":1})
              detail,_=fetch("/api/sources/"+quote(source_key,safe="")+"?"+query,source="local-serving-sqlite")
              if int(detail.get("totalVideoCount") or 0)>=2:source_candidates.append((source_key,detail))
          assert source_candidates,"no multi-page source detail found"
          source_key,probe=min(source_candidates,key=lambda item:int(item[1].get("totalVideoCount") or 0))
          total_videos=int(probe.get("totalVideoCount") or 0)
          page_size=min(200,max(1,total_videos-1))
          first_query=urlencode({"v":expected_sha,"range":"all","page":1,"pageSize":page_size})
          first_page,_=fetch("/api/sources/"+quote(source_key,safe="")+"?"+first_query,source="local-serving-sqlite")
          total_occurrences=int(first_page.get("totalOccurrenceCount") or 0)
          page_count=int(first_page.get("pageCount") or 0)
          assert page_count>=2 and page_count==math.ceil(total_videos/page_size),(source_key,total_videos,page_size,page_count)
          occurrences=[]
          for page in range(1,page_count+1):
              query=urlencode({"v":expected_sha,"range":"all","page":page,"pageSize":page_size})
              detail,_=fetch("/api/sources/"+quote(source_key,safe="")+"?"+query,source="local-serving-sqlite")
              assert int(detail.get("page") or 0)==page,detail
              assert int(detail.get("totalVideoCount") or 0)==total_videos,detail
              assert int(detail.get("totalOccurrenceCount") or 0)==total_occurrences,detail
              occurrences.extend((detail.get("record") or {}).get("occurrences") or [])
          video_ids={str(item.get("videoId") or (item.get("item") or {}).get("videoId") or "") for item in occurrences}
          video_ids.discard("")
          assert len(video_ids)==total_videos,(len(video_ids),total_videos)
          assert len(occurrences)==total_occurrences,(len(occurrences),total_occurrences)

          invalid_path="/api/sources/"+quote(source_key,safe="")+"?"+urlencode({"v":expected_sha,"range":"all","page":0})
          try:raw(invalid_path)
          except HTTPError as error:
              body=json.loads(error.read())
              assert error.code==400 and body.get("error")=="invalid_pagination",(error.code,body)
          else:raise AssertionError("invalid page unexpectedly succeeded")

          status,html_headers,html=raw("/",accept="text/html",encoding="gzip")
          assert status==200 and "max-age=60" in str(html_headers.get("Cache-Control") or ""),html_headers
          text=html.decode("utf-8")
          app_match=re.search(r'assets/app-h[0-9a-f]{12}\.js',text);css_match=re.search(r'assets/styles-h[0-9a-f]{12}\.css',text)
          assert app_match and css_match,text[:1000]
          for asset in (app_match.group(0),css_match.group(0)):
              status,headers,body=raw("/"+asset,accept="*/*",encoding="gzip")
              assert status==200 and headers.get("Content-Encoding")=="gzip",(asset,headers)
              assert "immutable" in str(headers.get("Cache-Control") or ""),(asset,headers)
              assert len(body)>1000,(asset,len(body))
          print("PUBLIC_COMPLETE_CONTRACT_OK",expected_sha,scope_totals,source_key,total_videos,total_occurrences)
          PY

      - name: Finalize successful WDC release and retain two revisions
        if: success() && steps.check.outputs.skip != 'true'
        env:
          BUNDLE_SHA: ${{ steps.materialize.outputs.bundle_sha }}
          WDC_INCOMING_ROOT: ${{ steps.deploy.outputs.incoming_root }}
          ACTIVE: ${{ steps.check.outputs.active }}
          SOURCE_COMMIT: ${{ steps.check.outputs.source_commit }}
        run: |
          set -Eeuo pipefail
          WDC_SSH=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_ROOT/wdc-knownhosts" -o ConnectTimeout=8 -i "$SSH_ROOT/wdc-key")
          ssh "${WDC_SSH[@]}" "$WDC_USER@$WDC_HOST" bash -s -- \
            "$BUNDLE_SHA" "$WDC_RELEASES_ROOT" "$WDC_SERVER_PATH" "$WDC_STATIC_ROOT" \
            "$WDC_SERVICE_UNIT_PATH" "$WDC_NGINX_AVAILABLE_PATH" "$WDC_NGINX_ENABLED_PATH" "$WDC_SERVICE" \
            "$WDC_PROJECT_ROOT" "$WDC_PROJECT_MAX_BYTES" "$WDC_FILESYSTEM_RESERVE_BYTES" \
            "$WDC_INCOMING_ROOT" "$WDC_API_PORT" "$ACTIVE" "$SOURCE_COMMIT" <<'REMOTE'
          set -Eeuo pipefail
          sha="$1";root="$2";server="$3";static="$4";unit="$5";available="$6";enabled="$7";service="$8"
          project_root="$9";max_bytes="${10}";reserve_bytes="${11}";incoming_root="${12}"
          port="${13}";expected_active="${14}";expected_source="${15}"
          [[ "$project_root" == "/opt/culua/ytb-song-rank" && "$root" == "$project_root/releases" ]]
          [[ "$incoming_root" =~ ^/opt/culua/ytb-song-rank/incoming/dsl-wdc-[0-9]+-[0-9]+-[0-9a-f]{64}$ ]]
          [[ "$max_bytes" == "40000000000" && "$reserve_bytes" =~ ^[0-9]+$ ]]
          (( reserve_bytes >= 5000000000 ))
          state="$root/.rollback-$sha"
          previous="$(cat "$state/previous-release-sha")"
          [[ "$previous" =~ ^[0-9a-f]{64}$ ]]
          systemctl is-active --quiet "$service"
          health="$(curl --silent --show-error --fail --max-time 10 "http://127.0.0.1:$port/healthz")"
          printf '%s' "$health" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["status"]=="ok" and d["releaseContentSha"]==sys.argv[1] and d["activeRevision"]==sys.argv[2] and d["sourceCommit"]==sys.argv[3]' "$sha" "$expected_active" "$expected_source"
          echo "WDC_FINALIZE_IDENTITY_OK sha=$sha active=$expected_active source=$expected_source"
          python3 - "$root" "$sha" "$previous" <<'PY'
          import re,shutil,sys
          from pathlib import Path
          root=Path(sys.argv[1]).resolve();current=sys.argv[2];previous=Path(sys.argv[3]).name if sys.argv[3] else ""
          if root==Path("/"):raise SystemExit("unsafe release root")
          keep={current,previous};removed=[]
          for path in root.iterdir():
              if not path.is_dir() or not re.fullmatch(r"[0-9a-f]{64}",path.name) or path.name in keep:continue
              if root not in path.resolve().parents:raise SystemExit(f"unsafe release path: {path}")
              shutil.rmtree(path);removed.append(path.name)
          print("RELEASE_RETENTION_OK",sorted(keep),removed)
          PY
          "$incoming_root/install-wdc-release.sh" --action finalize --sha "$sha" --releases-root "$root" \
            --server-path "$server" --static-root "$static" --service-unit-path "$unit" \
            --nginx-available-path "$available" --nginx-enabled-path "$enabled" --service "$service"
          project_bytes="$(du -sb -- "$project_root" | awk '{print $1}')"
          filesystem_available_bytes="$(python3 - "$project_root" <<'PY'
          import os,sys
          stats=os.statvfs(sys.argv[1]);print(stats.f_bavail*stats.f_frsize)
          PY
          )"
          [[ "$project_bytes" =~ ^[0-9]+$ && "$filesystem_available_bytes" =~ ^[0-9]+$ ]]
          (( project_bytes < max_bytes )) || {
            echo "WDC_STORAGE_LIMIT_EXCEEDED_FINAL project=$project_bytes max=$max_bytes" >&2
            exit 74
          }
          (( filesystem_available_bytes >= reserve_bytes )) || {
            echo "WDC_FILESYSTEM_RESERVE_VIOLATION_FINAL available=$filesystem_available_bytes reserve=$reserve_bytes" >&2
            exit 75
          }
          echo "WDC_STORAGE_FINAL_OK project=$project_bytes max=$max_bytes available=$filesystem_available_bytes reserve=$reserve_bytes"
          REMOTE

      - name: Roll back WDC release after failed public gate
        if: failure() && steps.check.outputs.skip != 'true' && steps.materialize.outputs.bundle_sha != ''
        env:
