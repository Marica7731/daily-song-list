name: Sync complete immutable release to WDC

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even when active revision and build logic are unchanged"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: daily-song-list-wdc-release-sync-v3
  cancel-in-progress: false

env:
  VPS2_HOST: ${{ secrets.VPS2_HOST }}
  VPS2_USER: "root"
  WDC_HOST: ${{ secrets.WDC_HOST }}
  WDC_USER: ${{ secrets.WDC_USER }}
  WDC_PROJECT_ROOT: "/opt/culua/ytb-song-rank"
  WDC_RELEASES_ROOT: "/opt/culua/ytb-song-rank/releases"
  WDC_SERVER_PATH: "/opt/culua/ytb-song-rank/server/release_serving_server.py"
  WDC_STATIC_ROOT: "/opt/culua/ytb-song-rank/static"
  WDC_SERVICE_UNIT_PATH: "/etc/systemd/system/daily-song-list-api.service"
  WDC_NGINX_AVAILABLE_PATH: "/etc/nginx/sites-available/next.ytb-song-rank.culua.com.conf"
  WDC_NGINX_ENABLED_PATH: "/etc/nginx/sites-enabled/next.ytb-song-rank.culua.com.conf"
  WDC_SERVICE: "daily-song-list-api"
  WDC_API_PORT: "18777"
  # Decimal bytes. Reaching the 40 GB line is a hard failure, not a warning.
  WDC_PROJECT_MAX_BYTES: "40000000000"
  # Keep host-level headroom so this project cannot crowd out unrelated workloads.
  WDC_FILESYSTEM_RESERVE_BYTES: "5000000000"
  FORCE: ${{ inputs.force || 'false' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 600
    environment: wdc-shadow

    steps:
      - name: Checkout complete serving implementation
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            server/release_serving_server.py
            server/pg_adapter.py
            scripts/migration/materialize-pg-release-snapshot.py
            scripts/migration/materialize-ranking-pages.py
            scripts/migration/build-serving-store.py
            scripts/migration/build-release-bundle.py
            scripts/migration/prepare-wdc-frontend.py
            scripts/migration/patch-next-frontend.py
            deploy/install-wdc-release.sh
            deploy/daily-song-list-api.service
            deploy/nginx-next-api.conf
            assets/app.js
            index.html
            .github/workflows/sync-wdc-release.yml
            .github/workflows/test-next-serving-v3.yml
            tests/test_next_serving_v3.py

      - name: Run release regression tests
        run: |
          set -Eeuo pipefail
          python3 -m py_compile \
            server/release_serving_server.py \
            server/pg_adapter.py \
            scripts/migration/materialize-pg-release-snapshot.py \
            scripts/migration/materialize-ranking-pages.py \
            scripts/migration/build-serving-store.py \
            scripts/migration/build-release-bundle.py \
            scripts/migration/prepare-wdc-frontend.py \
            scripts/migration/patch-next-frontend.py
          bash -n deploy/install-wdc-release.sh
          node --check assets/app.js
          PYTHONWARNINGS=error::ResourceWarning \
            python3 -m unittest discover -s tests -p 'test_next_serving_v3.py' -v
          BUILD_LOGIC_SHA="$({
            sha256sum server/release_serving_server.py
            sha256sum server/pg_adapter.py
            sha256sum scripts/migration/materialize-pg-release-snapshot.py
            sha256sum scripts/migration/materialize-ranking-pages.py
            sha256sum scripts/migration/build-serving-store.py
            sha256sum scripts/migration/build-release-bundle.py
            sha256sum scripts/migration/prepare-wdc-frontend.py
            sha256sum assets/app.js
            sha256sum index.html
            sha256sum deploy/daily-song-list-api.service
            sha256sum deploy/nginx-next-api.conf
            sha256sum deploy/install-wdc-release.sh
            sha256sum .github/workflows/sync-wdc-release.yml
          } | sha256sum | awk '{print $1}')"
          echo "BUILD_LOGIC_SHA=$BUILD_LOGIC_SHA" >> "$GITHUB_ENV"
          echo "build logic: $BUILD_LOGIC_SHA"

      - name: Prepare hashed frontend release assets
        run: |
          set -Eeuo pipefail
          FRONTEND_ROOT="/tmp/dsl-wdc-frontend-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$FRONTEND_ROOT"
          python3 scripts/migration/prepare-wdc-frontend.py \
            --app assets/app.js \
            --index index.html \
            --output "$FRONTEND_ROOT"
          APP_PATH="$(python3 - "$FRONTEND_ROOT/frontend-manifest.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1],encoding="utf-8"))["appPath"])
          PY
          )"
          [[ "$APP_PATH" =~ ^assets/app-h[0-9a-f]{12}\.js$ ]]
          node --check "$FRONTEND_ROOT/$APP_PATH"
          grep -Fq "$APP_PATH" "$FRONTEND_ROOT/index.html"
          echo "FRONTEND_ROOT=$FRONTEND_ROOT" >> "$GITHUB_ENV"

      - name: Prepare SSH helpers
        env:
          VPS2_PASSWORD: ${{ secrets.VPS2_PASSWORD }}
          WDC_SSH_PRIVATE_KEY: ${{ secrets.WDC_SSH_PRIVATE_KEY }}
          WDC_KNOWN_HOSTS: ${{ secrets.WDC_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$VPS2_PASSWORD"
          test -n "$WDC_SSH_PRIVATE_KEY"
          test -n "$WDC_KNOWN_HOSTS"
          mkdir -p /tmp/ssh
          printf '%s\n' "$VPS2_PASSWORD" > /tmp/ssh/vps2-password
          printf '%s\n' "$WDC_SSH_PRIVATE_KEY" > /tmp/ssh/wdc-key
          printf '%s\n' "$WDC_KNOWN_HOSTS" > /tmp/ssh/wdc-knownhosts
          chmod 600 /tmp/ssh/vps2-password /tmp/ssh/wdc-key /tmp/ssh/wdc-knownhosts
          cat > /tmp/ssh/vps2-askpass.sh <<'SH'
          #!/bin/sh
          exec cat /tmp/ssh/vps2-password
          SH
          chmod 700 /tmp/ssh/vps2-askpass.sh
          {
            echo "SSH_ASKPASS=/tmp/ssh/vps2-askpass.sh"
            echo "SSH_ASKPASS_REQUIRE=force"
            echo "DISPLAY=daily-song-list"
          } >> "$GITHUB_ENV"

      - name: Compare active revision and deployed build logic
        id: check
        run: |
          set -Eeuo pipefail
          VPS2_SSH=(-o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no -o ConnectTimeout=8)
          WDC_SSH=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/tmp/ssh/wdc-knownhosts -o ConnectTimeout=8 -i /tmp/ssh/wdc-key)

          ACTIVE_JSON="$(ssh "${VPS2_SSH[@]}" "$VPS2_USER@$VPS2_HOST" \
            "timeout 65 curl --silent --show-error --fail --max-time 60 http://127.0.0.1:8765/api/meta" 2>/dev/null)"
          CURRENT_ACTIVE="$(printf '%s' "$ACTIVE_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("meta",{}).get("active_revision_id", ""))')"
          CURRENT_CONTENT="$(printf '%s' "$ACTIVE_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("meta",{}).get("content_sha256", ""))')"
          test -n "$CURRENT_ACTIVE" || { echo "old production returned no active revision" >&2; exit 65; }
          [[ "$CURRENT_ACTIVE" =~ ^[A-Za-z0-9._:-]{1,200}$ ]] || {
            echo "old production returned an unsafe active revision marker" >&2
            exit 65
          }

          DEPLOYED_HEALTH="$(ssh "${WDC_SSH[@]}" "$WDC_USER@$WDC_HOST" \
            "curl --silent --show-error --max-time 5 http://127.0.0.1:$WDC_API_PORT/healthz 2>/dev/null || true" 2>/dev/null || true)"
          DEPLOYED_STATUS="$(printf '%s' "$DEPLOYED_HEALTH" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status", ""))' 2>/dev/null || true)"
          DEPLOYED_ACTIVE="$(printf '%s' "$DEPLOYED_HEALTH" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("activeRevision", ""))' 2>/dev/null || true)"
          DEPLOYED_LOGIC="$(printf '%s' "$DEPLOYED_HEALTH" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("buildLogicSha", ""))' 2>/dev/null || true)"
          DEPLOYED_RELEASE="$(printf '%s' "$DEPLOYED_HEALTH" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("releaseContentSha", ""))' 2>/dev/null || true)"

          echo "old active=$CURRENT_ACTIVE content=${CURRENT_CONTENT:0:16}"
          echo "wdc status=${DEPLOYED_STATUS:-none} active=${DEPLOYED_ACTIVE:-none} release=${DEPLOYED_RELEASE:0:16} logic=${DEPLOYED_LOGIC:-none}"
          if [[ "$DEPLOYED_STATUS" == "ok" \
             && "$DEPLOYED_RELEASE" =~ ^[0-9a-f]{64}$ \
             && "$CURRENT_ACTIVE" == "$DEPLOYED_ACTIVE" \
             && "$BUILD_LOGIC_SHA" == "$DEPLOYED_LOGIC" \
             && "$FORCE" != "true" ]]; then
            echo "NO_CHANGE"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "active=$CURRENT_ACTIVE" >> "$GITHUB_OUTPUT"
          echo "content=$CURRENT_CONTENT" >> "$GITHUB_OUTPUT"

      - name: Materialize pages and canonical serving store on VPS2
        if: steps.check.outputs.skip != 'true'
        id: materialize
        env:
          ACTIVE: ${{ steps.check.outputs.active }}
        run: |
          set -Eeuo pipefail
          VPS2_SSH=(-o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          REMOTE_ROOT="/tmp/dsl-wdc-sync-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "remote_root=$REMOTE_ROOT" >> "$GITHUB_OUTPUT"
          ssh "${VPS2_SSH[@]}" "$VPS2_USER@$VPS2_HOST" \
            "test ! -e '$REMOTE_ROOT' && install -d -m 0750 '$REMOTE_ROOT'"
          scp "${VPS2_SSH[@]}" \
            server/release_serving_server.py \
            server/pg_adapter.py \
            scripts/migration/materialize-pg-release-snapshot.py \
            scripts/migration/build-serving-store.py \
            scripts/migration/build-release-bundle.py \
            deploy/nginx-next-api.conf \
            deploy/daily-song-list-api.service \
            "$VPS2_USER@$VPS2_HOST:$REMOTE_ROOT/"
          scp -r "${VPS2_SSH[@]}" "$FRONTEND_ROOT" \
            "$VPS2_USER@$VPS2_HOST:$REMOTE_ROOT/frontend"

          ssh "${VPS2_SSH[@]}" "$VPS2_USER@$VPS2_HOST" bash -s -- \
            "$REMOTE_ROOT" "$ACTIVE" "$GITHUB_SHA" "$BUILD_LOGIC_SHA" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" <<'REMOTE'
          set -Eeuo pipefail
          remote_root="$1"
          expected_active="$2"
          server_commit="$3"
          build_logic_sha="$4"
          run_id="$5"
          run_attempt="$6"
          cd "$remote_root"
          build_root="$remote_root/build"
          pages_root="$build_root/pages"
          bundles_root="$build_root/bundles"
          serving_db="$build_root/serving.sqlite"
          canonical_snapshot="$build_root/canonical-runtime.sqlite"
          meta_file="$build_root/source-meta.json"
          frontend_root="$remote_root/frontend"
          chown root:www-data "$remote_root"
          chmod 0750 "$remote_root"
          install -d -o www-data -g www-data -m 0750 "$build_root"

          run_isolated() {
            local phase="$1"
            shift
            local started_at status
            started_at="$(date --iso-8601=seconds)"
            set +e
            systemd-run --quiet --wait --pipe --collect \
              --unit="dsl-wdc-${phase}-${run_id}-${run_attempt}" \
              --uid=www-data \
              --gid=www-data \
              --property=MemoryMax=700M \
              --property=Nice=15 \
              --property=CPUWeight=10 \
              --property=IOWeight=10 \
              --property=RuntimeMaxSec=32400 \
              --property="WorkingDirectory=$remote_root" \
              "$@"
            status=$?
            set -e
            if (( status != 0 )); then
              echo "RUN_ISOLATED_FAILED phase=$phase status=$status started_at=$started_at" >&2
              journalctl -k --since "$started_at" --no-pager \
                | grep -Ei 'oom|out of memory|killed process|memory cgroup' >&2 || true
              return "$status"
            fi
          }

          # Resolve parent/overlay/authoritative-7d semantics through the same
          # adapter as production, inside one repeatable-read, read-only PG
          # transaction.  Pages, every filtered scope, and complete sources
          # are emitted from that one immutable database view.
          run_isolated snapshot /usr/bin/env \
            PGHOST=/var/run/postgresql \
            PGDATABASE=song_rank \
            PGUSER=www-data \
            PYTHONPATH="$remote_root" \
            /usr/bin/python3 "$remote_root/materialize-pg-release-snapshot.py" \
            --output "$pages_root" \
            --meta-output "$meta_file" \
            --snapshot-output "$canonical_snapshot" \
            --expected-revision "$expected_active"

          test -s "$meta_file"
          test -s "$canonical_snapshot"
          python3 - "$meta_file" "$expected_active" <<'PY'
          import json, sys
          path, expected = sys.argv[1:]
          marker = json.load(open(path, encoding="utf-8"))
          assert marker["active_revision_id"] == expected, marker
          ranges=("7d", "all")
          views=("songs", "artists", "vtubers", "videos")
          metrics=("occurrences", "songs", "videos")
          scopes=("all", "niche", "visible", "visibleNiche")
          assert int(marker["page_files"]) >= len(ranges)*len(views)*len(metrics), marker
          assert int(marker["ranking_scope_series"]) == len(ranges)*len(views)*len(metrics)*len(scopes), marker
          assert int(marker["ranking_rows"]) > 0, marker
          assert int(marker["source_details"]) > 0, marker
          assert int(marker["source_occurrences"]) > 0, marker
          for range_id in ("7d", "all"):
              stats = marker["source_ranges"][range_id]
              assert int(stats["details"]) > 0, marker
              assert int(stats["occurrences"]) > 0, marker
          print("PG_CANONICAL_SNAPSHOT_OK", marker["ranking_rows"], marker["source_occurrences"])
          PY

          built_at="$(python3 -c "import json; print(json.load(open('$meta_file')).get('built_at') or '')")"
          run_isolated serving /usr/bin/python3 "$remote_root/build-serving-store.py" \
            --source-db "$canonical_snapshot" \
            --ranking-root "$pages_root" \
            --output "$serving_db" \
            --active-revision-id "$expected_active" \
            --required-ranges "7d,all" \
            --built-at "$built_at"

          # The release is pinned to expected_active by one repeatable-read
          # transaction.  A later canonical activation must not invalidate that
          # internally consistent immutable snapshot; record the source drift so
          # the next scheduled sync can catch up.  Missing or unsafe metadata
          # still fails closed before any WDC upload.
          after_active="$(curl --silent --show-error --fail --max-time 60 \
            http://127.0.0.1:8765/api/meta | \
            python3 -c 'import json,sys; print(json.load(sys.stdin).get("meta",{}).get("active_revision_id", ""))')"
          [[ "$after_active" =~ ^[A-Za-z0-9._:-]{1,200}$ ]] || {
            echo "SOURCE_ACTIVE_INVALID after build: ${after_active:-missing}" >&2
            exit 67
          }
          if [[ "$after_active" == "$expected_active" ]]; then
            echo "SOURCE_ACTIVE_STABLE revision=$expected_active"
          else
            echo "::warning title=Source active revision advanced::SOURCE_ACTIVE_DRIFT snapshot=$expected_active current=$after_active; publishing the pinned immutable snapshot"
          fi
          {
            echo "### WDC source revision"
            echo "- immutable snapshot: $expected_active"
            echo "- canonical active after build: $after_active"
          } >> "$GITHUB_STEP_SUMMARY"

          run_isolated bundle /usr/bin/python3 "$remote_root/build-release-bundle.py" \
            --input "$pages_root" \
            --output "$bundles_root" \
            --serving-sqlite "$serving_db" \
            --server-artifact "$remote_root/release_serving_server.py" \
            --frontend-root "$frontend_root" \
            --nginx-artifact "$remote_root/nginx-next-api.conf" \
            --systemd-artifact "$remote_root/daily-song-list-api.service" \
            --active-revision-id "$expected_active" \
            --expected-parent-revision-id "$(python3 -c "import json; print(json.load(open('$meta_file')).get('parent_revision_id') or '')")" \
            --source-commit-sha "$(python3 -c "import json; print(json.load(open('$meta_file')).get('source_commit_sha') or '')")" \
            --server-commit-sha "$server_commit" \
            --build-logic-sha "$build_logic_sha" \
            --generated-at "$built_at" \
            --latest-event-time "$(python3 -c "import json; print(json.load(open('$meta_file')).get('latest_generated_at') or '')")"

          bundle_dir="$(find "$bundles_root" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | head -1)"
          [[ "$bundle_dir" =~ ^[0-9a-f]{64}$ ]] || { echo "INVALID_BUNDLE_SHA $bundle_dir" >&2; exit 68; }
          release_size_bytes="$(du -sb -- "$bundles_root/$bundle_dir" | awk '{print $1}')"
          [[ "$release_size_bytes" =~ ^[0-9]+$ ]] && (( release_size_bytes > 0 ))
          archive_path="$remote_root/dsl-wdc-$bundle_dir.tar.gz"
          tar -C "$bundles_root" -czf "$archive_path" "$bundle_dir"
          archive_size_bytes="$(stat -c '%s' -- "$archive_path")"
          [[ "$archive_size_bytes" =~ ^[0-9]+$ ]] && (( archive_size_bytes > 0 ))
          printf '%s\n' "$bundle_dir" > "$remote_root/bundle-sha"
          printf '%s\n' "$release_size_bytes" > "$remote_root/release-size-bytes"
          printf '%s\n' "$archive_size_bytes" > "$remote_root/archive-size-bytes"
          ls -lh "$archive_path"
          echo "WDC_BUNDLE_SIZE_OK release_bytes=$release_size_bytes archive_bytes=$archive_size_bytes"
          REMOTE

          BUNDLE_SHA="$(ssh "${VPS2_SSH[@]}" "$VPS2_USER@$VPS2_HOST" "cat '$REMOTE_ROOT/bundle-sha'")"
          RELEASE_SIZE_BYTES="$(ssh "${VPS2_SSH[@]}" "$VPS2_USER@$VPS2_HOST" "cat '$REMOTE_ROOT/release-size-bytes'")"
          ARCHIVE_SIZE_BYTES="$(ssh "${VPS2_SSH[@]}" "$VPS2_USER@$VPS2_HOST" "cat '$REMOTE_ROOT/archive-size-bytes'")"
          [[ "$BUNDLE_SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "invalid bundle sha: $BUNDLE_SHA" >&2; exit 69; }
          [[ "$RELEASE_SIZE_BYTES" =~ ^[0-9]+$ ]] && (( RELEASE_SIZE_BYTES > 0 ))
          [[ "$ARCHIVE_SIZE_BYTES" =~ ^[0-9]+$ ]] && (( ARCHIVE_SIZE_BYTES > 0 ))
          echo "bundle_sha=$BUNDLE_SHA" >> "$GITHUB_OUTPUT"
          echo "release_size_bytes=$RELEASE_SIZE_BYTES" >> "$GITHUB_OUTPUT"
          echo "archive_size_bytes=$ARCHIVE_SIZE_BYTES" >> "$GITHUB_OUTPUT"

      - name: Transfer and atomically deploy WDC release
        if: steps.check.outputs.skip != 'true'
        env:
          BUNDLE_SHA: ${{ steps.materialize.outputs.bundle_sha }}
          REMOTE_ROOT: ${{ steps.materialize.outputs.remote_root }}
          RELEASE_SIZE_BYTES: ${{ steps.materialize.outputs.release_size_bytes }}
          ARCHIVE_SIZE_BYTES: ${{ steps.materialize.outputs.archive_size_bytes }}
        run: |
          set -Eeuo pipefail
          VPS2_SSH=(-o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          WDC_SSH=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/tmp/ssh/wdc-knownhosts -o ConnectTimeout=10 -i /tmp/ssh/wdc-key)
          [[ "$BUNDLE_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RELEASE_SIZE_BYTES" =~ ^[0-9]+$ ]] && (( RELEASE_SIZE_BYTES > 0 ))
          [[ "$ARCHIVE_SIZE_BYTES" =~ ^[0-9]+$ ]] && (( ARCHIVE_SIZE_BYTES > 0 ))

          # This read-only gate runs before the archive is copied to WDC. It
          # measures only this project's exact root and reserves a second
          # release-sized copy for rollback. It never scans or cleans siblings.
          ssh "${WDC_SSH[@]}" "$WDC_USER@$WDC_HOST" bash -s -- \
            "$WDC_PROJECT_ROOT" "$WDC_RELEASES_ROOT" "$ARCHIVE_SIZE_BYTES" \
            "$RELEASE_SIZE_BYTES" "$WDC_PROJECT_MAX_BYTES" \
            "$WDC_FILESYSTEM_RESERVE_BYTES" <<'REMOTE'
          set -Eeuo pipefail
          project_root="$1"; releases_root="$2"; archive_bytes="$3"; release_bytes="$4"
          max_bytes="$5"; reserve_bytes="$6"
          [[ "$project_root" == "/opt/culua/ytb-song-rank" ]]
          [[ "$releases_root" == "$project_root/releases" ]]
          for value in "$archive_bytes" "$release_bytes" "$max_bytes" "$reserve_bytes"; do
            [[ "$value" =~ ^[0-9]+$ ]]
          done
          (( archive_bytes > 0 && release_bytes > 0 ))
          (( max_bytes == 40000000000 && reserve_bytes >= 5000000000 ))
          test -d "$project_root"
          current_bytes="$(du -sb -- "$project_root" | awk '{print $1}')"
          available_bytes="$(df -B1 --output=avail -- "$project_root" | tail -1 | tr -d ' ')"
          [[ "$current_bytes" =~ ^[0-9]+$ && "$available_bytes" =~ ^[0-9]+$ ]]
          rollback_bytes="$release_bytes"
          incoming_bytes=$((archive_bytes + release_bytes + rollback_bytes))
          projected_bytes=$((current_bytes + incoming_bytes))
          if (( projected_bytes >= max_bytes )); then
            echo "WDC_STORAGE_LIMIT_EXCEEDED current=$current_bytes archive=$archive_bytes release=$release_bytes rollback=$rollback_bytes projected=$projected_bytes max=$max_bytes" >&2
            exit 74
          fi
          if (( available_bytes - incoming_bytes < reserve_bytes )); then
            echo "WDC_FILESYSTEM_RESERVE_VIOLATION available=$available_bytes incoming=$incoming_bytes reserve=$reserve_bytes" >&2
            exit 75
          fi
          echo "WDC_STORAGE_PREFLIGHT_OK current=$current_bytes archive=$archive_bytes release=$release_bytes rollback=$rollback_bytes projected=$projected_bytes max=$max_bytes available=$available_bytes reserve=$reserve_bytes"
          REMOTE

          mkdir -p /tmp/dsl-wdc-transfer
          scp "${VPS2_SSH[@]}" \
            "$VPS2_USER@$VPS2_HOST:$REMOTE_ROOT/dsl-wdc-$BUNDLE_SHA.tar.gz" \
            /tmp/dsl-wdc-transfer/
          [[ "$(stat -c '%s' -- "/tmp/dsl-wdc-transfer/dsl-wdc-$BUNDLE_SHA.tar.gz")" == "$ARCHIVE_SIZE_BYTES" ]]
          scp "${WDC_SSH[@]}" \
            "/tmp/dsl-wdc-transfer/dsl-wdc-$BUNDLE_SHA.tar.gz" \
            deploy/install-wdc-release.sh \
            "$WDC_USER@$WDC_HOST:/tmp/"

          ssh "${WDC_SSH[@]}" "$WDC_USER@$WDC_HOST" bash -s -- \
            "$BUNDLE_SHA" "$WDC_RELEASES_ROOT" "$WDC_SERVER_PATH" "$WDC_SERVICE" \
            "$GITHUB_SHA" "$BUILD_LOGIC_SHA" "$WDC_API_PORT" "$WDC_STATIC_ROOT" \
            "$WDC_SERVICE_UNIT_PATH" "$WDC_NGINX_AVAILABLE_PATH" "$WDC_NGINX_ENABLED_PATH" \
            "$WDC_PROJECT_ROOT" "$WDC_PROJECT_MAX_BYTES" "$WDC_FILESYSTEM_RESERVE_BYTES" \
            "$RELEASE_SIZE_BYTES" "$ARCHIVE_SIZE_BYTES" <<'REMOTE'
          set -Eeuo pipefail
          sha="$1"; root="$2"; server_path="$3"; service="$4"; server_commit="$5"; build_logic="$6"; port="$7"
          static_root="$8"; unit_path="$9"; nginx_available="${10}"; nginx_enabled="${11}"
          project_root="${12}"; max_bytes="${13}"; reserve_bytes="${14}"; release_bytes="${15}"; expected_archive_bytes="${16}"
          archive="/tmp/dsl-wdc-$sha.tar.gz"
          installer="/tmp/install-wdc-release.sh"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$project_root" == "/opt/culua/ytb-song-rank" && "$root" == "$project_root/releases" ]]
          for value in "$max_bytes" "$reserve_bytes" "$release_bytes" "$expected_archive_bytes"; do
            [[ "$value" =~ ^[0-9]+$ ]]
          done
          (( max_bytes == 40000000000 && reserve_bytes >= 5000000000 && release_bytes > 0 && expected_archive_bytes > 0 ))
          test -f "$archive"
          test -x "$installer"
          actual_archive_bytes="$(stat -c '%s' -- "$archive")"
          [[ "$actual_archive_bytes" == "$expected_archive_bytes" ]]
          current_bytes="$(du -sb -- "$project_root" | awk '{print $1}')"
          available_bytes="$(df -B1 --output=avail -- "$project_root" | tail -1 | tr -d ' ')"
          [[ "$current_bytes" =~ ^[0-9]+$ && "$available_bytes" =~ ^[0-9]+$ ]]
          rollback_bytes="$release_bytes"
          projected_bytes=$((current_bytes + actual_archive_bytes + release_bytes + rollback_bytes))
          (( projected_bytes < max_bytes )) || {
            echo "WDC_STORAGE_LIMIT_EXCEEDED_POSTUPLOAD current=$current_bytes archive=$actual_archive_bytes release=$release_bytes rollback=$rollback_bytes projected=$projected_bytes max=$max_bytes" >&2
            exit 74
          }
          (( available_bytes - release_bytes - rollback_bytes >= reserve_bytes )) || {
            echo "WDC_FILESYSTEM_RESERVE_VIOLATION_POSTUPLOAD available=$available_bytes release=$release_bytes rollback=$rollback_bytes reserve=$reserve_bytes" >&2
            exit 75
          }
          echo "WDC_STORAGE_POSTUPLOAD_OK current=$current_bytes archive=$actual_archive_bytes release=$release_bytes rollback=$rollback_bytes projected=$projected_bytes max=$max_bytes available=$available_bytes reserve=$reserve_bytes"
          mkdir -p "$root"
          incoming="$(mktemp -d "$root/.incoming-$sha.XXXXXX")"
          trap 'rm -rf "$incoming"; rm -f "$archive"' EXIT
          python3 - "$archive" "$incoming" "$sha" <<'PY'
          import tarfile, sys
          from pathlib import Path
          archive, incoming, expected = Path(sys.argv[1]), Path(sys.argv[2]).resolve(), sys.argv[3]
          with tarfile.open(archive, "r:gz") as tar:
              members = tar.getmembers()
              for member in members:
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f"unsafe tar member type: {member.name}")
                  target = (incoming / member.name).resolve()
                  if incoming not in target.parents and target != incoming:
                      raise SystemExit(f"tar path traversal: {member.name}")
              tar.extractall(incoming)
          extracted = incoming / expected
          if not extracted.is_dir():
              raise SystemExit("archive does not contain the expected release directory")
          PY
          if [[ -d "$root/$sha" ]]; then
            cmp "$incoming/$sha/manifest.json" "$root/$sha/manifest.json"
            rm -rf "$incoming/$sha"
          else
            mv "$incoming/$sha" "$root/$sha"
          fi
          chown -R daily-song-list:daily-song-list "$root/$sha"
          "$installer" \
            --action activate \
            --sha "$sha" \
            --releases-root "$root" \
            --server-path "$server_path" \
            --static-root "$static_root" \
            --service-unit-path "$unit_path" \
            --nginx-available-path "$nginx_available" \
            --nginx-enabled-path "$nginx_enabled" \
            --service "$service" \
            --expected-server-commit "$server_commit" \
            --expected-build-logic-sha "$build_logic" \
            --port "$port"
          REMOTE

      - name: Verify public next domain
        if: steps.check.outputs.skip != 'true'
        env:
          BUNDLE_SHA: ${{ steps.materialize.outputs.bundle_sha }}
        run: |
          set -Eeuo pipefail
          python3 - "$BUNDLE_SHA" "$BUILD_LOGIC_SHA" <<'PY'
          import json
          import sys
          from urllib.parse import quote, urlencode
          from urllib.request import Request, urlopen

          base = "https://next.ytb-song-rank.culua.com"
          expected_sha, expected_logic = sys.argv[1], sys.argv[2]
          expected_scopes = {"all", "niche", "visible", "visibleNiche"}

          def fetch(path, *, data_source=None):
              request = Request(
                  base + path,
                  headers={"Accept": "application/json", "User-Agent": "daily-song-list-release-gate/3"},
              )
              with urlopen(request, timeout=20) as response:
                  assert response.status == 200, (path, response.status)
                  assert response.headers.get("X-Release-Sha") == expected_sha, (
                      path,
                      response.headers.get("X-Release-Sha"),
                  )
                  if data_source is not None:
                      assert response.headers.get("X-Data-Source") == data_source, (
                          path,
                          response.headers.get("X-Data-Source"),
                      )
                  return json.loads(response.read())

          health = fetch("/healthz")
          assert health.get("status") == "ok", health
          assert health.get("releaseContentSha") == expected_sha, health
          assert health.get("buildLogicSha") == expected_logic, health
          assert health.get("oldOriginDependency") is False, health
          assert health.get("sourceFallbackEnabled") is False, health
          assert set(health.get("rankingScopes") or []) == expected_scopes, health

          meta = fetch("/api/meta", data_source="local-release")
          capabilities = meta.get("capabilities") or {}
          assert capabilities.get("localSources") is True, meta
          assert capabilities.get("localSearch") is True, meta
          assert capabilities.get("oldOriginDependency") is False, meta
          assert capabilities.get("sourceFallbackEnabled") is False, meta
          assert set(capabilities.get("rankingScopes") or []) == expected_scopes, meta
          assert {"7d", "all"}.issubset(set(capabilities.get("ranges") or [])), meta

          ranking_records = []
          for range_id in ("all", "7d"):
              query = urlencode({
                  "v": expected_sha,
                  "range": range_id,
                  "view": "songs",
                  "metric": "occurrences",
                  "page": 1,
                  "pageSize": 30,
              })
              ranking = fetch("/api/rankings?" + query, data_source="local-release-chunk")
              records = ranking.get("records") or []
              assert 0 < len(records) <= 30, (range_id, ranking)
              if range_id == "all":
                  ranking_records = records

          dynamic_query = urlencode({
              "v": expected_sha,
              "range": "all",
              "view": "songs",
              "metric": "occurrences",
              "nicheOnly": 1,
              "hideUnknownArtist": 1,
              "page": 1,
              "pageSize": 5,
          })
          dynamic = fetch("/api/rankings?" + dynamic_query, data_source="local-serving-sqlite")
          assert len(dynamic.get("records") or []) <= 5, dynamic

          source_record = next(
              (record for record in ranking_records if str(record.get("sourceDetailKey") or "")),
              None,
          )
          assert source_record is not None, ranking_records
          source_key = str(source_record["sourceDetailKey"])
          source_query = urlencode({
              "v": expected_sha,
              "range": "all",
              "page": 1,
              "pageSize": 2,
          })
          source = fetch(
              "/api/sources/" + quote(source_key, safe="") + "?" + source_query,
              data_source="local-serving-sqlite",
          )
          assert source.get("found") is True, source
          assert source.get("sourceKey") == source_key, source
          assert int(source.get("totalVideoCount") or 0) > 0, source
          assert int(source.get("totalOccurrenceCount") or 0) > 0, source

          search_text = next(
              (
                  str(source_record.get(key) or "").strip()
                  for key in ("title", "workTitle", "artist", "displayArtist", "name")
                  if str(source_record.get(key) or "").strip()
              ),
              source_key,
          )
          search_query = urlencode({
              "v": expected_sha,
              "range": "all",
              "view": "songs",
              "metric": "occurrences",
              "q": search_text,
              "page": 1,
              "pageSize": 5,
          })
          search = fetch("/api/rankings?" + search_query, data_source="local-serving-sqlite")
          assert search.get("records"), (search_text, search)

          print("PUBLIC_HEALTH_META_OK", expected_sha[:16])
          print("PUBLIC_RANKING_SCOPES_OK", ",".join(sorted(expected_scopes)))
          print("PUBLIC_SOURCE_SEARCH_OK", source_key, search_text)
          PY

      - name: Verify complete public correctness and asset contract
        if: steps.check.outputs.skip != 'true'
        env:
          BUNDLE_SHA: ${{ steps.materialize.outputs.bundle_sha }}
        run: |
          set -Eeuo pipefail
          python3 - "$BUNDLE_SHA" "$BUILD_LOGIC_SHA" "$GITHUB_SHA" <<'PY'
          from __future__ import annotations
          import gzip,json,math,re,sys
          from urllib.error import HTTPError
          from urllib.parse import quote,urlencode
          from urllib.request import Request,urlopen

          base="https://next.ytb-song-rank.culua.com"
          expected_sha,expected_logic,expected_commit=sys.argv[1:]
          expected_views={"songs","artists","vtubers","videos"}
          expected_metrics={"occurrences","songs","videos"}
          expected_scopes={"all","niche","visible","visibleNiche"}

          def raw(path,accept="application/json",encoding=""):
              headers={"Accept":accept,"User-Agent":"daily-song-list-complete-release-gate/3"}
              if encoding:headers["Accept-Encoding"]=encoding
              with urlopen(Request(base+path,headers=headers),timeout=20) as response:
                  body=response.read();response_headers=response.headers
                  if response_headers.get("Content-Encoding")=="gzip":body=gzip.decompress(body)
                  return response.status,response_headers,body

          def fetch(path,*,source=None,gzip_required=False):
              status,headers,body=raw(path,encoding="gzip" if gzip_required else "")
              assert status==200,(path,status)
              assert headers.get("X-Release-Sha")==expected_sha,(path,headers.get("X-Release-Sha"))
              assert headers.get("X-Server-Commit")==expected_commit,(path,headers.get("X-Server-Commit"))
              if source is not None:assert headers.get("X-Data-Source")==source,(path,headers.get("X-Data-Source"))
              if gzip_required:assert headers.get("Content-Encoding")=="gzip",(path,headers)
              return json.loads(body),headers

          health,_=fetch("/healthz")
          assert health.get("status")=="ok" and health.get("releaseContentSha")==expected_sha,health
          assert health.get("buildLogicSha")==expected_logic,health
          assert set(health.get("views") or [])==expected_views,health
          assert set(health.get("metrics") or [])==expected_metrics,health
          assert set(health.get("rankingScopes") or [])==expected_scopes,health

          meta,_=fetch("/api/meta",source="local-release")
          capabilities=meta.get("capabilities") or {}
          assert set(capabilities.get("views") or [])==expected_views,meta
          assert set(capabilities.get("metrics") or [])==expected_metrics,meta
          assert set(capabilities.get("rankingScopes") or [])==expected_scopes,meta
          assert capabilities.get("localSearch") is True and capabilities.get("localSources") is True,meta
          assert capabilities.get("oldOriginDependency") is False and capabilities.get("sourceFallbackEnabled") is False,meta

          all_song_records=[]
          for range_id in ("7d","all"):
              for view in sorted(expected_views):
                  for metric in sorted(expected_metrics):
                      query=urlencode({"v":expected_sha,"range":range_id,"view":view,"metric":metric,"page":1,"pageSize":30})
                      payload,_=fetch("/api/rankings?"+query,source="local-release-chunk",gzip_required=True)
                      records=payload.get("records") or []
                      assert records,(range_id,view,metric,payload)
                      keys=[str(record.get("key") or "") for record in records]
                      assert all(keys) and len(keys)==len(set(keys)),(range_id,view,metric,keys)
                      if view=="artists":
                          for record in records:
                              assert int(record.get("songCount") or 0)>=len(record.get("songs") or []),record
                              assert len(record.get("songs") or [])<=3,record
                      if range_id=="all" and view=="songs" and metric=="occurrences":all_song_records=records

          base_query={"v":expected_sha,"range":"all","view":"songs","metric":"occurrences","page":1,"pageSize":30}
          base_rank,_=fetch("/api/rankings?"+urlencode(base_query),source="local-release-chunk")
          scope_totals={"all":int(base_rank.get("totalCount") or 0)}
          for scope,flags in {
              "niche":{"nicheOnly":1},
              "visible":{"hideUnknownArtist":1},
              "visibleNiche":{"nicheOnly":1,"hideUnknownArtist":1},
          }.items():
              scoped,_=fetch("/api/rankings?"+urlencode({**base_query,**flags}),source="local-serving-sqlite")
              assert scoped.get("scopeKey")==scope,scoped
              scope_totals[scope]=int(scoped.get("totalCount") or 0)
          assert any(value!=scope_totals["all"] for key,value in scope_totals.items() if key!="all"),scope_totals

          search_record=next((record for record in all_song_records if record.get("title") and (record.get("artist") or record.get("displayArtist"))),None)
          assert search_record is not None,all_song_records
          for field,value in (("title",search_record["title"]),("artist",search_record.get("artist") or search_record.get("displayArtist"))):
              query=urlencode({**base_query,"q":str(value),"searchFields":field,"pageSize":12})
              searched,_=fetch("/api/rankings?"+query,source="local-serving-sqlite")
              records=searched.get("records") or []
              assert records,(field,value,searched)
              keys=[str(record.get("key") or "") for record in records]
              assert len(keys)==len(set(keys)),(field,keys)

          source_candidates=[]
          for source_key in dict.fromkeys(
              str(record.get("sourceDetailKey") or "") for record in all_song_records[:12]
          ):
              if not source_key:continue
              query=urlencode({"v":expected_sha,"range":"all","page":1,"pageSize":1})
              detail,_=fetch("/api/sources/"+quote(source_key,safe="")+"?"+query,source="local-serving-sqlite")
              if int(detail.get("totalVideoCount") or 0)>=2:source_candidates.append((source_key,detail))
          assert source_candidates,"no multi-page source detail found"
          source_key,probe=min(source_candidates,key=lambda item:int(item[1].get("totalVideoCount") or 0))
          total_videos=int(probe.get("totalVideoCount") or 0)
          page_size=min(200,max(1,total_videos-1))
          first_query=urlencode({"v":expected_sha,"range":"all","page":1,"pageSize":page_size})
          first_page,_=fetch("/api/sources/"+quote(source_key,safe="")+"?"+first_query,source="local-serving-sqlite")
          total_occurrences=int(first_page.get("totalOccurrenceCount") or 0)
          page_count=int(first_page.get("pageCount") or 0)
          assert page_count>=2 and page_count==math.ceil(total_videos/page_size),(source_key,total_videos,page_size,page_count)
          occurrences=[]
          for page in range(1,page_count+1):
              query=urlencode({"v":expected_sha,"range":"all","page":page,"pageSize":page_size})
              detail,_=fetch("/api/sources/"+quote(source_key,safe="")+"?"+query,source="local-serving-sqlite")
              assert int(detail.get("page") or 0)==page,detail
              assert int(detail.get("totalVideoCount") or 0)==total_videos,detail
              assert int(detail.get("totalOccurrenceCount") or 0)==total_occurrences,detail
              occurrences.extend((detail.get("record") or {}).get("occurrences") or [])
          video_ids={str(item.get("videoId") or (item.get("item") or {}).get("videoId") or "") for item in occurrences}
          video_ids.discard("")
          assert len(video_ids)==total_videos,(len(video_ids),total_videos)
          assert len(occurrences)==total_occurrences,(len(occurrences),total_occurrences)

          invalid_path="/api/sources/"+quote(source_key,safe="")+"?"+urlencode({"v":expected_sha,"range":"all","page":0})
          try:raw(invalid_path)
          except HTTPError as error:
              body=json.loads(error.read())
              assert error.code==400 and body.get("error")=="invalid_pagination",(error.code,body)
          else:raise AssertionError("invalid page unexpectedly succeeded")

          status,html_headers,html=raw("/",accept="text/html",encoding="gzip")
          assert status==200 and "max-age=60" in str(html_headers.get("Cache-Control") or ""),html_headers
          text=html.decode("utf-8")
          app_match=re.search(r'assets/app-h[0-9a-f]{12}\.js',text);css_match=re.search(r'assets/styles-h[0-9a-f]{12}\.css',text)
          assert app_match and css_match,text[:1000]
          for asset in (app_match.group(0),css_match.group(0)):
              status,headers,body=raw("/"+asset,accept="*/*",encoding="gzip")
              assert status==200 and headers.get("Content-Encoding")=="gzip",(asset,headers)
              assert "immutable" in str(headers.get("Cache-Control") or ""),(asset,headers)
              assert len(body)>1000,(asset,len(body))
          print("PUBLIC_COMPLETE_CONTRACT_OK",expected_sha,scope_totals,source_key,total_videos,total_occurrences)
          PY

      - name: Finalize successful WDC release and retain two revisions
        if: success() && steps.check.outputs.skip != 'true'
        env:
          BUNDLE_SHA: ${{ steps.materialize.outputs.bundle_sha }}
        run: |
          set -Eeuo pipefail
          WDC_SSH=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/tmp/ssh/wdc-knownhosts -o ConnectTimeout=8 -i /tmp/ssh/wdc-key)
          ssh "${WDC_SSH[@]}" "$WDC_USER@$WDC_HOST" bash -s -- \
            "$BUNDLE_SHA" "$WDC_RELEASES_ROOT" "$WDC_SERVER_PATH" "$WDC_STATIC_ROOT" \
            "$WDC_SERVICE_UNIT_PATH" "$WDC_NGINX_AVAILABLE_PATH" "$WDC_NGINX_ENABLED_PATH" "$WDC_SERVICE" \
            "$WDC_PROJECT_ROOT" "$WDC_PROJECT_MAX_BYTES" "$WDC_FILESYSTEM_RESERVE_BYTES" <<'REMOTE'
          set -Eeuo pipefail
          sha="$1";root="$2";server="$3";static="$4";unit="$5";available="$6";enabled="$7";service="$8"
          project_root="$9";max_bytes="${10}";reserve_bytes="${11}"
          [[ "$project_root" == "/opt/culua/ytb-song-rank" && "$root" == "$project_root/releases" ]]
          [[ "$max_bytes" == "40000000000" && "$reserve_bytes" =~ ^[0-9]+$ ]]
          (( reserve_bytes >= 5000000000 ))
          state="$root/.rollback-$sha"
          previous="$(cat "$state/previous-target")"
          systemctl is-active --quiet "$service"
          python3 - "$root" "$sha" "$previous" <<'PY'
          import re,shutil,sys
          from pathlib import Path
          root=Path(sys.argv[1]).resolve();current=sys.argv[2];previous=Path(sys.argv[3]).name if sys.argv[3] else ""
          if root==Path("/"):raise SystemExit("unsafe release root")
          keep={current,previous};removed=[]
          for path in root.iterdir():
              if not path.is_dir() or not re.fullmatch(r"[0-9a-f]{64}",path.name) or path.name in keep:continue
              if root not in path.resolve().parents:raise SystemExit(f"unsafe release path: {path}")
              shutil.rmtree(path);removed.append(path.name)
          print("RELEASE_RETENTION_OK",sorted(keep),removed)
          PY
          /tmp/install-wdc-release.sh --action finalize --sha "$sha" --releases-root "$root" \
            --server-path "$server" --static-root "$static" --service-unit-path "$unit" \
            --nginx-available-path "$available" --nginx-enabled-path "$enabled" --service "$service"
          project_bytes="$(du -sb -- "$project_root" | awk '{print $1}')"
          filesystem_available_bytes="$(df -B1 --output=avail -- "$project_root" | tail -1 | tr -d ' ')"
          [[ "$project_bytes" =~ ^[0-9]+$ && "$filesystem_available_bytes" =~ ^[0-9]+$ ]]
          (( project_bytes < max_bytes )) || {
            echo "WDC_STORAGE_LIMIT_EXCEEDED_FINAL project=$project_bytes max=$max_bytes" >&2
            exit 74
          }
          (( filesystem_available_bytes >= reserve_bytes )) || {
            echo "WDC_FILESYSTEM_RESERVE_VIOLATION_FINAL available=$filesystem_available_bytes reserve=$reserve_bytes" >&2
            exit 75
          }
          echo "WDC_STORAGE_FINAL_OK project=$project_bytes max=$max_bytes available=$filesystem_available_bytes reserve=$reserve_bytes"
          rm -f -- /tmp/install-wdc-release.sh
          REMOTE

      - name: Roll back WDC release after failed public gate
        if: failure() && steps.check.outputs.skip != 'true' && steps.materialize.outputs.bundle_sha != ''
        env:
          BUNDLE_SHA: ${{ steps.materialize.outputs.bundle_sha }}
        run: |
          set +e
          WDC_SSH=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/tmp/ssh/wdc-knownhosts -o ConnectTimeout=8 -i /tmp/ssh/wdc-key)
          ssh "${WDC_SSH[@]}" "$WDC_USER@$WDC_HOST" \
            "/tmp/install-wdc-release.sh --action rollback --sha '$BUNDLE_SHA' --releases-root '$WDC_RELEASES_ROOT' --server-path '$WDC_SERVER_PATH' --static-root '$WDC_STATIC_ROOT' --service-unit-path '$WDC_SERVICE_UNIT_PATH' --nginx-available-path '$WDC_NGINX_AVAILABLE_PATH' --nginx-enabled-path '$WDC_NGINX_ENABLED_PATH' --service '$WDC_SERVICE'"

      - name: Cleanup temporary build material
        if: always()
        env:
          REMOTE_ROOT: ${{ steps.materialize.outputs.remote_root }}
          BUNDLE_SHA: ${{ steps.materialize.outputs.bundle_sha }}
        run: |
          set +e
          cleanup_status=0
          VPS2_SSH=(-o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no -o ConnectTimeout=8)
          EXPECTED_REMOTE_ROOT="/tmp/dsl-wdc-sync-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          REMOTE_ROOT="${REMOTE_ROOT:-$EXPECTED_REMOTE_ROOT}"
          if [[ "$REMOTE_ROOT" == "$EXPECTED_REMOTE_ROOT" ]]; then
            if ! ssh "${VPS2_SSH[@]}" "$VPS2_USER@$VPS2_HOST" bash -s -- \
              "$REMOTE_ROOT" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" <<'REMOTE'
          set -Eeuo pipefail
          remote_root="$1"
          run_id="$2"
          run_attempt="$3"
          [[ "$run_id" =~ ^[0-9]+$ && "$run_attempt" =~ ^[0-9]+$ ]]
          [[ "$remote_root" == "/tmp/dsl-wdc-sync-${run_id}-${run_attempt}" ]]
          for phase in snapshot serving bundle; do
            unit="dsl-wdc-${phase}-${run_id}-${run_attempt}.service"
            timeout 20s systemctl stop "$unit" >/dev/null 2>&1 || true
            if systemctl is-active --quiet "$unit"; then
              echo "VPS2_TRANSIENT_UNIT_STILL_ACTIVE $unit" >&2
              exit 76
            fi
          done
          rm -rf -- "$remote_root"
          echo "VPS2_TRANSIENT_UNITS_CLEANED run=${run_id} attempt=${run_attempt}"
          REMOTE
            then
              cleanup_status=1
            fi
          else
            echo "refusing unexpected VPS2 cleanup path: $REMOTE_ROOT" >&2
            cleanup_status=1
          fi
          if [[ "$BUNDLE_SHA" =~ ^[0-9a-f]{64}$ ]]; then
            WDC_SSH=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/tmp/ssh/wdc-knownhosts -o ConnectTimeout=8 -i /tmp/ssh/wdc-key)
            if ! ssh "${WDC_SSH[@]}" "$WDC_USER@$WDC_HOST" \
              "rm -f -- '/tmp/dsl-wdc-$BUNDLE_SHA.tar.gz' '/tmp/install-wdc-release.sh'"; then
              cleanup_status=1
            fi
          fi
          EXPECTED_FRONTEND_ROOT="/tmp/dsl-wdc-frontend-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ "${FRONTEND_ROOT:-}" == "$EXPECTED_FRONTEND_ROOT" ]]; then
            rm -rf -- "$EXPECTED_FRONTEND_ROOT" || cleanup_status=1
          else
            echo "refusing unexpected frontend cleanup path: ${FRONTEND_ROOT:-unset}" >&2
            cleanup_status=1
          fi
          rm -rf /tmp/dsl-wdc-transfer /tmp/next-health.json /tmp/ssh || cleanup_status=1
          exit "$cleanup_status"
