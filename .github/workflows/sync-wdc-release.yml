name: Sync complete immutable release to WDC

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even when active revision and build logic are unchanged"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: daily-song-list-wdc-release-sync-v3
  cancel-in-progress: false

env:
  VPS2_HOST: ${{ secrets.VPS2_HOST }}
  VPS2_USER: "root"
  # This must be set only after a read-only VPS2 preflight verifies the canonical path.
  VPS2_RUNTIME_DB: ${{ vars.VPS2_RUNTIME_DB }}
  WDC_HOST: ${{ secrets.WDC_HOST }}
  WDC_USER: ${{ secrets.WDC_USER }}
  WDC_RELEASES_ROOT: "/opt/culua/ytb-song-rank/releases"
  WDC_SERVER_PATH: "/opt/culua/ytb-song-rank/server/release_serving_server.py"
  WDC_SERVICE: "daily-song-list-api"
  WDC_API_PORT: "18777"
  FORCE: ${{ inputs.force || 'false' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 600
    environment: wdc-shadow

    steps:
      - name: Checkout complete serving implementation
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            server/release_serving_server.py
            scripts/migration/snapshot-runtime-db.py
            scripts/migration/materialize-ranking-pages.py
            scripts/migration/build-serving-store.py
            scripts/migration/build-release-bundle.py
            scripts/migration/patch-next-frontend.py
            deploy/install-wdc-release.sh
            .github/workflows/sync-wdc-release.yml
            tests/test_next_serving_v3.py

      - name: Run release regression tests
        run: |
          set -Eeuo pipefail
          python3 -m py_compile \
            server/release_serving_server.py \
            scripts/migration/snapshot-runtime-db.py \
            scripts/migration/materialize-ranking-pages.py \
            scripts/migration/build-serving-store.py \
            scripts/migration/build-release-bundle.py \
            scripts/migration/patch-next-frontend.py
          bash -n deploy/install-wdc-release.sh
          PYTHONWARNINGS=error::ResourceWarning \
            python3 -m unittest discover -s tests -p 'test_next_serving_v3.py' -v
          BUILD_LOGIC_SHA="$({
            sha256sum server/release_serving_server.py
            sha256sum scripts/migration/snapshot-runtime-db.py
            sha256sum scripts/migration/materialize-ranking-pages.py
            sha256sum scripts/migration/build-serving-store.py
            sha256sum scripts/migration/build-release-bundle.py
            sha256sum deploy/install-wdc-release.sh
            sha256sum .github/workflows/sync-wdc-release.yml
          } | sha256sum | awk '{print $1}')"
          echo "BUILD_LOGIC_SHA=$BUILD_LOGIC_SHA" >> "$GITHUB_ENV"
          echo "build logic: $BUILD_LOGIC_SHA"

      - name: Prepare SSH helpers
        env:
          VPS2_PASSWORD: ${{ secrets.VPS2_PASSWORD }}
          WDC_SSH_PRIVATE_KEY: ${{ secrets.WDC_SSH_PRIVATE_KEY }}
          WDC_KNOWN_HOSTS: ${{ secrets.WDC_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$VPS2_PASSWORD"
          test -n "$WDC_SSH_PRIVATE_KEY"
          test -n "$WDC_KNOWN_HOSTS"
          test -n "$VPS2_RUNTIME_DB" || {
            echo "VPS2_RUNTIME_DB repository/environment variable is required" >&2
            exit 64
          }
          [[ "$VPS2_RUNTIME_DB" =~ ^/[A-Za-z0-9._/-]+$ ]] || {
            echo "VPS2_RUNTIME_DB must be a shell-safe absolute path" >&2
            exit 64
          }
          mkdir -p /tmp/ssh
          printf '%s\n' "$VPS2_PASSWORD" > /tmp/ssh/vps2-password
          printf '%s\n' "$WDC_SSH_PRIVATE_KEY" > /tmp/ssh/wdc-key
          printf '%s\n' "$WDC_KNOWN_HOSTS" > /tmp/ssh/wdc-knownhosts
          chmod 600 /tmp/ssh/vps2-password /tmp/ssh/wdc-key /tmp/ssh/wdc-knownhosts
          cat > /tmp/ssh/vps2-askpass.sh <<'SH'
          #!/bin/sh
          exec cat /tmp/ssh/vps2-password
          SH
          chmod 700 /tmp/ssh/vps2-askpass.sh
          {
            echo "SSH_ASKPASS=/tmp/ssh/vps2-askpass.sh"
            echo "SSH_ASKPASS_REQUIRE=force"
            echo "DISPLAY=daily-song-list"
          } >> "$GITHUB_ENV"

      - name: Compare active revision and deployed build logic
        id: check
        run: |
          set -Eeuo pipefail
          VPS2_SSH=(-o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no -o ConnectTimeout=8)
          WDC_SSH=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/tmp/ssh/wdc-knownhosts -o ConnectTimeout=8 -i /tmp/ssh/wdc-key)

          ACTIVE_JSON="$(ssh "${VPS2_SSH[@]}" "$VPS2_USER@$VPS2_HOST" \
            "timeout 65 curl --silent --show-error --fail --max-time 60 http://127.0.0.1:8765/api/meta" 2>/dev/null)"
          CURRENT_ACTIVE="$(printf '%s' "$ACTIVE_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("meta",{}).get("active_revision_id", ""))')"
          CURRENT_CONTENT="$(printf '%s' "$ACTIVE_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("meta",{}).get("content_sha256", ""))')"
          test -n "$CURRENT_ACTIVE" || { echo "old production returned no active revision" >&2; exit 65; }
          [[ "$CURRENT_ACTIVE" =~ ^[A-Za-z0-9._:-]{1,200}$ ]] || {
            echo "old production returned an unsafe active revision marker" >&2
            exit 65
          }

          DEPLOYED_HEALTH="$(ssh "${WDC_SSH[@]}" "$WDC_USER@$WDC_HOST" \
            "curl --silent --show-error --max-time 5 http://127.0.0.1:$WDC_API_PORT/healthz 2>/dev/null || true" 2>/dev/null || true)"
          DEPLOYED_STATUS="$(printf '%s' "$DEPLOYED_HEALTH" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status", ""))' 2>/dev/null || true)"
          DEPLOYED_ACTIVE="$(printf '%s' "$DEPLOYED_HEALTH" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("activeRevision", ""))' 2>/dev/null || true)"
          DEPLOYED_LOGIC="$(printf '%s' "$DEPLOYED_HEALTH" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("buildLogicSha", ""))' 2>/dev/null || true)"
          DEPLOYED_RELEASE="$(printf '%s' "$DEPLOYED_HEALTH" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("releaseContentSha", ""))' 2>/dev/null || true)"

          echo "old active=$CURRENT_ACTIVE content=${CURRENT_CONTENT:0:16}"
          echo "wdc status=${DEPLOYED_STATUS:-none} active=${DEPLOYED_ACTIVE:-none} release=${DEPLOYED_RELEASE:0:16} logic=${DEPLOYED_LOGIC:-none}"
          if [[ "$DEPLOYED_STATUS" == "ok" \
             && "$DEPLOYED_RELEASE" =~ ^[0-9a-f]{64}$ \
             && "$CURRENT_ACTIVE" == "$DEPLOYED_ACTIVE" \
             && "$BUILD_LOGIC_SHA" == "$DEPLOYED_LOGIC" \
             && "$FORCE" != "true" ]]; then
            echo "NO_CHANGE"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "active=$CURRENT_ACTIVE" >> "$GITHUB_OUTPUT"
          echo "content=$CURRENT_CONTENT" >> "$GITHUB_OUTPUT"

      - name: Materialize pages and canonical serving store on VPS2
        if: steps.check.outputs.skip != 'true'
        id: materialize
        env:
          ACTIVE: ${{ steps.check.outputs.active }}
        run: |
          set -Eeuo pipefail
          VPS2_SSH=(-o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          REMOTE_ROOT="/tmp/dsl-wdc-sync-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "remote_root=$REMOTE_ROOT" >> "$GITHUB_OUTPUT"
          ssh "${VPS2_SSH[@]}" "$VPS2_USER@$VPS2_HOST" "mkdir -p '$REMOTE_ROOT'"
          scp "${VPS2_SSH[@]}" \
            server/release_serving_server.py \
            scripts/migration/snapshot-runtime-db.py \
            scripts/migration/materialize-ranking-pages.py \
            scripts/migration/build-serving-store.py \
            scripts/migration/build-release-bundle.py \
            "$VPS2_USER@$VPS2_HOST:$REMOTE_ROOT/"

          ssh "${VPS2_SSH[@]}" "$VPS2_USER@$VPS2_HOST" bash -s -- \
            "$REMOTE_ROOT" "$ACTIVE" "$VPS2_RUNTIME_DB" "$GITHUB_SHA" "$BUILD_LOGIC_SHA" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" <<'REMOTE'
          set -Eeuo pipefail
          remote_root="$1"
          expected_active="$2"
          runtime_db="$3"
          server_commit="$4"
          build_logic_sha="$5"
          run_id="$6"
          run_attempt="$7"
          test -r "$runtime_db" || { echo "RUNTIME_DB_MISSING $runtime_db" >&2; exit 66; }
          cd "$remote_root"
          pages_root="$remote_root/pages"
          bundles_root="$remote_root/bundles"
          serving_db="$remote_root/serving.sqlite"
          runtime_snapshot="$remote_root/runtime-snapshot.sqlite"
          meta_file="$remote_root/source-meta.json"
          rm -rf "$pages_root" "$bundles_root" "$serving_db" "$runtime_snapshot"
          mkdir -p "$pages_root" "$bundles_root"

          run_isolated() {
            local phase="$1"
            shift
            systemd-run --quiet --wait --pipe --collect \
              --unit="dsl-wdc-${phase}-${run_id}-${run_attempt}" \
              --property=MemoryMax=700M \
              --property=Nice=15 \
              --property=CPUWeight=10 \
              --property=IOWeight=10 \
              --property=RuntimeMaxSec=32400 \
              --property="WorkingDirectory=$remote_root" \
              "$@"
          }

          curl --silent --show-error --fail --retry 5 --retry-all-errors \
            --connect-timeout 10 --max-time 60 \
            http://127.0.0.1:8765/api/meta > "$remote_root/meta-api.json"
          python3 - "$expected_active" "$remote_root/meta-api.json" "$meta_file" <<'PY'
          import json, sys
          expected, source_path, output_path = sys.argv[1:]
          meta = json.load(open(source_path, encoding="utf-8"))
          fields = meta.get("meta") or {}
          active = str(fields.get("active_revision_id") or "")
          if active != expected:
              raise SystemExit(f"ACTIVE_MISMATCH before materialize: local={active} expected={expected}")
          marker = {
              key: fields.get(key, "")
              for key in (
                  "active_revision_id",
                  "content_sha256",
                  "parent_revision_id",
                  "source_commit_sha",
                  "built_at",
                  "latest_generated_at",
              )
          }
          with open(output_path, "w", encoding="utf-8") as stream:
              json.dump(marker, stream, ensure_ascii=False, sort_keys=True, separators=(",", ":"))
          PY

          run_isolated snapshot /usr/bin/python3 "$remote_root/snapshot-runtime-db.py" \
            --source "$runtime_db" \
            --output "$runtime_snapshot" \
            --expected-revision "$expected_active"

          # Build every compact page from the same read-only runtime snapshot.
          # This does not call the old ranking HTTP API once per page.
          run_isolated pages /usr/bin/python3 "$remote_root/materialize-ranking-pages.py" \
            --source-db "$runtime_snapshot" \
            --output "$pages_root" \
            --active-revision-id "$expected_active" \
            --ranges "7d,all" \
            --views "songs,vtubers,videos" \
            --metrics "occurrences,songs,videos"

          built_at="$(python3 -c "import json; print(json.load(open('$meta_file')).get('built_at') or '')")"
          run_isolated serving /usr/bin/python3 "$remote_root/build-serving-store.py" \
            --source-db "$runtime_snapshot" \
            --ranking-root "$pages_root" \
            --output "$serving_db" \
            --active-revision-id "$expected_active" \
            --required-ranges "7d,all" \
            --built-at "$built_at"

          # The canonical active pointer must not move while pages and SQLite are
          # being assembled.  A mismatch aborts before any WDC upload.
          after_active="$(curl --silent --show-error --fail --max-time 60 \
            http://127.0.0.1:8765/api/meta | \
            python3 -c 'import json,sys; print(json.load(sys.stdin).get("meta",{}).get("active_revision_id", ""))')"
          [[ "$after_active" == "$expected_active" ]] || {
            echo "ACTIVE_MISMATCH after build: $after_active != $expected_active" >&2
            exit 67
          }

          run_isolated bundle /usr/bin/python3 "$remote_root/build-release-bundle.py" \
            --input "$pages_root" \
            --output "$bundles_root" \
            --serving-sqlite "$serving_db" \
            --server-artifact "$remote_root/release_serving_server.py" \
            --active-revision-id "$expected_active" \
            --expected-parent-revision-id "$(python3 -c "import json; print(json.load(open('$meta_file')).get('parent_revision_id') or '')")" \
            --source-commit-sha "$(python3 -c "import json; print(json.load(open('$meta_file')).get('source_commit_sha') or '')")" \
            --server-commit-sha "$server_commit" \
            --build-logic-sha "$build_logic_sha" \
            --generated-at "$built_at" \
            --latest-event-time "$(python3 -c "import json; print(json.load(open('$meta_file')).get('latest_generated_at') or '')")"

          bundle_dir="$(find "$bundles_root" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | head -1)"
          [[ "$bundle_dir" =~ ^[0-9a-f]{64}$ ]] || { echo "INVALID_BUNDLE_SHA $bundle_dir" >&2; exit 68; }
          tar -C "$bundles_root" -czf "$remote_root/dsl-wdc-$bundle_dir.tar.gz" "$bundle_dir"
          printf '%s\n' "$bundle_dir" > "$remote_root/bundle-sha"
          ls -lh "$remote_root/dsl-wdc-$bundle_dir.tar.gz"
          REMOTE

          BUNDLE_SHA="$(ssh "${VPS2_SSH[@]}" "$VPS2_USER@$VPS2_HOST" "cat '$REMOTE_ROOT/bundle-sha'")"
          [[ "$BUNDLE_SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "invalid bundle sha: $BUNDLE_SHA" >&2; exit 69; }
          echo "bundle_sha=$BUNDLE_SHA" >> "$GITHUB_OUTPUT"

      - name: Transfer and atomically deploy WDC release
        if: steps.check.outputs.skip != 'true'
        env:
          BUNDLE_SHA: ${{ steps.materialize.outputs.bundle_sha }}
          REMOTE_ROOT: ${{ steps.materialize.outputs.remote_root }}
        run: |
          set -Eeuo pipefail
          VPS2_SSH=(-o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          WDC_SSH=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/tmp/ssh/wdc-knownhosts -o ConnectTimeout=10 -i /tmp/ssh/wdc-key)
          [[ "$BUNDLE_SHA" =~ ^[0-9a-f]{64}$ ]]
          mkdir -p /tmp/dsl-wdc-transfer
          scp "${VPS2_SSH[@]}" \
            "$VPS2_USER@$VPS2_HOST:$REMOTE_ROOT/dsl-wdc-$BUNDLE_SHA.tar.gz" \
            /tmp/dsl-wdc-transfer/
          scp "${WDC_SSH[@]}" \
            "/tmp/dsl-wdc-transfer/dsl-wdc-$BUNDLE_SHA.tar.gz" \
            deploy/install-wdc-release.sh \
            "$WDC_USER@$WDC_HOST:/tmp/"

          ssh "${WDC_SSH[@]}" "$WDC_USER@$WDC_HOST" bash -s -- \
            "$BUNDLE_SHA" "$WDC_RELEASES_ROOT" "$WDC_SERVER_PATH" "$WDC_SERVICE" \
            "$GITHUB_SHA" "$BUILD_LOGIC_SHA" "$WDC_API_PORT" <<'REMOTE'
          set -Eeuo pipefail
          sha="$1"; root="$2"; server_path="$3"; service="$4"; server_commit="$5"; build_logic="$6"; port="$7"
          archive="/tmp/dsl-wdc-$sha.tar.gz"
          installer="/tmp/install-wdc-release.sh"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]]
          test -f "$archive"
          test -x "$installer"
          mkdir -p "$root"
          incoming="$(mktemp -d "$root/.incoming-$sha.XXXXXX")"
          trap 'rm -rf "$incoming" "$archive" "$installer"' EXIT
          python3 - "$archive" "$incoming" "$sha" <<'PY'
          import tarfile, sys
          from pathlib import Path
          archive, incoming, expected = Path(sys.argv[1]), Path(sys.argv[2]).resolve(), sys.argv[3]
          with tarfile.open(archive, "r:gz") as tar:
              members = tar.getmembers()
              for member in members:
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f"unsafe tar member type: {member.name}")
                  target = (incoming / member.name).resolve()
                  if incoming not in target.parents and target != incoming:
                      raise SystemExit(f"tar path traversal: {member.name}")
              tar.extractall(incoming)
          extracted = incoming / expected
          if not extracted.is_dir():
              raise SystemExit("archive does not contain the expected release directory")
          PY
          if [[ -d "$root/$sha" ]]; then
            cmp "$incoming/$sha/manifest.json" "$root/$sha/manifest.json"
            rm -rf "$incoming/$sha"
          else
            mv "$incoming/$sha" "$root/$sha"
          fi
          chown -R daily-song-list:daily-song-list "$root/$sha"
          "$installer" \
            --sha "$sha" \
            --releases-root "$root" \
            --server-path "$server_path" \
            --service "$service" \
            --expected-server-commit "$server_commit" \
            --expected-build-logic-sha "$build_logic" \
            --port "$port"
          REMOTE

      - name: Verify public next domain
        if: steps.check.outputs.skip != 'true'
        env:
          BUNDLE_SHA: ${{ steps.materialize.outputs.bundle_sha }}
        run: |
          set -Eeuo pipefail
          curl --silent --show-error --fail --max-time 20 \
            https://next.ytb-song-rank.culua.com/healthz > /tmp/next-health.json
          python3 - "$BUNDLE_SHA" "$BUILD_LOGIC_SHA" <<'PY'
          import json, sys
          p=json.load(open('/tmp/next-health.json',encoding='utf-8'))
          expected_sha, expected_logic=sys.argv[1],sys.argv[2]
          assert p.get('status') == 'ok', p
          assert p.get('releaseContentSha') == expected_sha, p
          assert p.get('buildLogicSha') == expected_logic, p
          assert p.get('oldOriginDependency') is False, p
          assert p.get('sourceFallbackEnabled') is False, p
          print('PUBLIC_HEALTH_OK', expected_sha[:16])
          PY
          curl --silent --show-error --fail --compressed --max-time 20 \
            "https://next.ytb-song-rank.culua.com/api/rankings?v=$BUNDLE_SHA&range=all&view=songs&metric=occurrences&page=1&pageSize=30" \
            | python3 -c 'import json,sys; p=json.load(sys.stdin); assert len(p.get("records") or []) <= 30; print("PUBLIC_RANKING_OK",len(p.get("records") or []))'

      - name: Cleanup temporary build material
        if: always()
        env:
          REMOTE_ROOT: ${{ steps.materialize.outputs.remote_root }}
          BUNDLE_SHA: ${{ steps.materialize.outputs.bundle_sha }}
        run: |
          set +e
          VPS2_SSH=(-o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no -o ConnectTimeout=8)
          EXPECTED_REMOTE_ROOT="/tmp/dsl-wdc-sync-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          REMOTE_ROOT="${REMOTE_ROOT:-$EXPECTED_REMOTE_ROOT}"
          if [[ "$REMOTE_ROOT" == "$EXPECTED_REMOTE_ROOT" ]]; then
            ssh "${VPS2_SSH[@]}" "$VPS2_USER@$VPS2_HOST" "rm -rf -- '$REMOTE_ROOT'"
          else
            echo "refusing unexpected VPS2 cleanup path: $REMOTE_ROOT" >&2
          fi
          if [[ "$BUNDLE_SHA" =~ ^[0-9a-f]{64}$ ]]; then
            WDC_SSH=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/tmp/ssh/wdc-knownhosts -o ConnectTimeout=8 -i /tmp/ssh/wdc-key)
            ssh "${WDC_SSH[@]}" "$WDC_USER@$WDC_HOST" \
              "rm -f -- '/tmp/dsl-wdc-$BUNDLE_SHA.tar.gz' '/tmp/install-wdc-release.sh'"
          fi
          rm -rf /tmp/dsl-wdc-transfer /tmp/next-health.json /tmp/ssh
