          WDC_INCOMING_ROOT: ${{ steps.deploy.outputs.incoming_root }}
        run: |
          set +e
          WDC_SSH=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_ROOT/wdc-knownhosts" -o ConnectTimeout=8 -i "$SSH_ROOT/wdc-key")
          if [[ "$WDC_INCOMING_ROOT" =~ ^/opt/culua/ytb-song-rank/incoming/dsl-wdc-[0-9]+-[0-9]+-[0-9a-f]{64}$ ]]; then
            ssh "${WDC_SSH[@]}" "$WDC_USER@$WDC_HOST" \
              "'$WDC_INCOMING_ROOT/install-wdc-release.sh' --action rollback --sha '$BUNDLE_SHA' --releases-root '$WDC_RELEASES_ROOT' --server-path '$WDC_SERVER_PATH' --static-root '$WDC_STATIC_ROOT' --service-unit-path '$WDC_SERVICE_UNIT_PATH' --nginx-available-path '$WDC_NGINX_AVAILABLE_PATH' --nginx-enabled-path '$WDC_NGINX_ENABLED_PATH' --service '$WDC_SERVICE'"
          fi

      - name: Cleanup exact Mac relay backend and WDC run paths
        if: always()
        env:
          BUNDLE_SHA: ${{ steps.materialize.outputs.bundle_sha }}
          CLEANUP_JOB_STATUS: ${{ job.status }}
        run: |
          set +e
          cleanup_status=0
          EXPECTED_MAC_ROOT="/Users/be/codex-temp/dsl-wdc-sync-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          EXPECTED_RELAY_ROOT="/tmp/dsl-pg-relay-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          EXPECTED_RELAY_UNIT="dsl-wdc-pg-relay-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          EXPECTED_TUNNEL_CONTROL="$EXPECTED_MAC_ROOT/ssh/vps2-tunnel-control"
          EXPECTED_APP_NAME="dsl-wdc-snapshot-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          if [[ -S "$EXPECTED_TUNNEL_CONTROL" ]]; then
            ssh -S "$EXPECTED_TUNNEL_CONTROL" -O exit "$VPS2_USER@$VPS2_HOST" >/dev/null 2>&1 || cleanup_status=1
          fi

          if [[ -f "$EXPECTED_MAC_ROOT/ssh/vps2-knownhosts" && -x "$EXPECTED_MAC_ROOT/ssh/vps2-askpass.sh" ]]; then
            export SSH_ASKPASS="$EXPECTED_MAC_ROOT/ssh/vps2-askpass.sh"
            export SSH_ASKPASS_REQUIRE=force
            export DISPLAY=daily-song-list
            VPS2_CLEANUP_SSH=(-o BatchMode=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$EXPECTED_MAC_ROOT/ssh/vps2-knownhosts" -o ConnectTimeout=8)
            if ! ssh "${VPS2_CLEANUP_SSH[@]}" "$VPS2_USER@$VPS2_HOST" bash -s -- \
              "$EXPECTED_RELAY_ROOT" "$EXPECTED_RELAY_UNIT" "$EXPECTED_APP_NAME" \
              "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" <<'REMOTE'
          set -Eeuo pipefail
          relay_root="$1"; relay_unit="$2"; app_name="$3"; run_id="$4"; run_attempt="$5"
          [[ "$relay_root" == "/tmp/dsl-pg-relay-${run_id}-${run_attempt}" ]]
          [[ "$relay_unit" == "dsl-wdc-pg-relay-${run_id}-${run_attempt}" ]]
          [[ "$app_name" == "dsl-wdc-snapshot-${run_id}-${run_attempt}" ]]
          timeout 20s systemctl stop "$relay_unit.service" >/dev/null 2>&1 || true
          systemctl is-active --quiet "$relay_unit.service" && exit 76
          runuser -u www-data -- psql -d song_rank -v ON_ERROR_STOP=1 -Atqc \
            "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE application_name = '$app_name' AND pid <> pg_backend_pid()" >/dev/null
          remaining="$(runuser -u www-data -- psql -d song_rank -v ON_ERROR_STOP=1 -Atqc \
            "SELECT count(*) FROM pg_stat_activity WHERE application_name = '$app_name'")"
          [[ "$remaining" == "0" ]]
          if [[ -e "$relay_root" ]]; then
            [[ "$(realpath -- "$relay_root")" == "$relay_root" ]]
            rm -rf -- "$relay_root"
          fi
          echo "VPS2_RELAY_BACKEND_CLEAN run=$run_id attempt=$run_attempt"
          REMOTE
            then
              cleanup_status=1
            fi
          fi

          if [[ "$BUNDLE_SHA" =~ ^[0-9a-f]{64}$ && -f "$EXPECTED_MAC_ROOT/ssh/wdc-key" && -f "$EXPECTED_MAC_ROOT/ssh/wdc-knownhosts" ]]; then
            EXPECTED_WDC_INCOMING="$WDC_PROJECT_ROOT/incoming/dsl-wdc-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${BUNDLE_SHA}"
            WDC_CLEANUP_SSH=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$EXPECTED_MAC_ROOT/ssh/wdc-knownhosts" -o ConnectTimeout=8 -i "$EXPECTED_MAC_ROOT/ssh/wdc-key")
            if ! ssh "${WDC_CLEANUP_SSH[@]}" "$WDC_USER@$WDC_HOST" bash -s -- \
              "$WDC_PROJECT_ROOT" "$WDC_RELEASES_ROOT" "$EXPECTED_WDC_INCOMING" \
              "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$BUNDLE_SHA" \
              "$CLEANUP_JOB_STATUS" <<'REMOTE'
          set -Eeuo pipefail
          project_root="$1"; releases_root="$2"; incoming_root="$3"
          run_id="$4"; run_attempt="$5"; sha="$6"; job_status="$7"
          [[ "$project_root" == "/opt/culua/ytb-song-rank" ]]
          [[ "$releases_root" == "$project_root/releases" ]]
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$job_status" =~ ^(success|failure|cancelled)$ ]]
          [[ "$incoming_root" == "$project_root/incoming/dsl-wdc-${run_id}-${run_attempt}-${sha}" ]]
          remote_cleanup_status=0
          current_path="$releases_root/current"
          current_sha=""
          current_valid=true
          if [[ -L "$current_path" ]]; then
            current_target="$(readlink -- "$current_path")"
            current_sha="${current_target##*/}"
            if [[ ! "$current_sha" =~ ^[0-9a-f]{64}$ ]]; then
              echo "WDC_ORPHAN_CURRENT_IDENTITY_UNSAFE target=$current_target" >&2
              current_valid=false
              remote_cleanup_status=1
            fi
          elif [[ -e "$current_path" ]]; then
            echo "WDC_ORPHAN_CURRENT_NOT_SYMLINK path=$current_path" >&2
            current_valid=false
            remote_cleanup_status=1
          fi
          release_dir="$releases_root/$sha"
          rollback_state="$releases_root/.rollback-$sha"
          if [[ -e "$release_dir" || -L "$release_dir" ]]; then
            if [[ "$job_status" == "success" ]]; then
              if [[ "$current_sha" == "$sha" ]]; then
                echo "WDC_ACTIVE_RELEASE_PRESERVED sha=$sha"
              else
                echo "WDC_SUCCESS_RELEASE_NOT_ACTIVE_PRESERVED sha=$sha current=${current_sha:-missing}" >&2
                remote_cleanup_status=1
              fi
            elif [[ "$current_valid" != "true" ]]; then
              echo "WDC_ORPHAN_PRESERVED_UNSAFE_CURRENT sha=$sha" >&2
              remote_cleanup_status=1
            elif [[ "$current_sha" == "$sha" ]]; then
              echo "WDC_ORPHAN_PRESERVED_ACTIVE sha=$sha" >&2
              remote_cleanup_status=1
            elif [[ -e "$rollback_state" || -L "$rollback_state" ]]; then
              echo "WDC_ORPHAN_PRESERVED_ROLLBACK sha=$sha state=$rollback_state" >&2
              remote_cleanup_status=1
            elif [[ -L "$release_dir" || ! -d "$release_dir" ]]; then
              echo "WDC_ORPHAN_PRESERVED_UNSAFE_RELEASE path=$release_dir" >&2
              remote_cleanup_status=1
            else
              release_real="$(realpath -- "$release_dir")"
              if [[ "$release_real" != "$release_dir" \
                 || "${release_real%/*}" != "$releases_root" \
                 || "${release_real##*/}" != "$sha" ]]; then
                echo "WDC_ORPHAN_REALPATH_UNSAFE path=$release_dir real=$release_real" >&2
                remote_cleanup_status=1
              else
                rm -rf -- "$release_dir"
                echo "WDC_PREACTIVATION_ORPHAN_REMOVED sha=$sha path=$release_dir"
              fi
            fi
          fi
          if [[ -e "$incoming_root" || -L "$incoming_root" ]]; then
            if [[ -L "$incoming_root" || ! -d "$incoming_root" ]]; then
              echo "WDC_INCOMING_PRESERVED_UNSAFE path=$incoming_root" >&2
              remote_cleanup_status=1
            elif [[ "$(realpath -- "$incoming_root")" != "$incoming_root" ]]; then
              echo "WDC_INCOMING_REALPATH_UNSAFE path=$incoming_root" >&2
              remote_cleanup_status=1
            else
              rm -rf -- "$incoming_root"
            fi
          fi
          echo "WDC_EXACT_INCOMING_CLEAN run=$run_id attempt=$run_attempt sha=$sha"
          exit "$remote_cleanup_status"
          REMOTE
            then
              cleanup_status=1
            fi
          fi

          if [[ -e "$EXPECTED_MAC_ROOT" || -L "$EXPECTED_MAC_ROOT" ]]; then
            if [[ -d "$EXPECTED_MAC_ROOT" && ! -L "$EXPECTED_MAC_ROOT" \
               && "$(cat "$EXPECTED_MAC_ROOT/.codex-owned-run" 2>/dev/null)" == "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" ]]; then
              if [[ ! -L "$EXPECTED_MAC_ROOT" \
                 && "$("$MAC_PYTHON" -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$EXPECTED_MAC_ROOT")" == "$EXPECTED_MAC_ROOT" ]]; then
                rm -rf -- "$EXPECTED_MAC_ROOT" || cleanup_status=1
              else
                echo "refusing non-exact Mac cleanup path: $EXPECTED_MAC_ROOT" >&2
                cleanup_status=1
              fi
            else
              echo "refusing unowned Mac cleanup path: $EXPECTED_MAC_ROOT" >&2
              cleanup_status=1
            fi
          fi
          exit "$cleanup_status"
