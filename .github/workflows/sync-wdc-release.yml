          assert health.get("releaseContentSha") == expected_sha, health
          assert health.get("buildLogicSha") == expected_logic, health
          assert health.get("activeRevision") == expected_active, health
          assert health.get("sourceCommit") == expected_source, health
          assert health.get("oldOriginDependency") is False, health
