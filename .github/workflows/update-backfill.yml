name: Prepare backfill inbox bundle

on:
  schedule:
    - cron: "19 18 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: daily-song-list-backfill
  cancel-in-progress: false

jobs:
  release_window:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      blocked: ${{ steps.detect.outputs.blocked }}
    steps:
      - name: Skip while bounded WDC release owns the snapshot
        id: detect
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QUEUED_LEASE_MAX_AGE_SECONDS: "3600"
        run: |
          set -Eeuo pipefail
          observed_wdc="$(
            for release_status in in_progress queued; do
              curl --fail --silent --show-error --location --retry 2 \
                --connect-timeout 5 --max-time 30 \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H 'Accept: application/vnd.github+json' \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?status=${release_status}&per_page=100"
            done | jq -sr '
              [.[].workflow_runs[] |
                select(.name == "Sync complete immutable release to WDC") |
                {id,name,status,head_sha,created_at}
              ] | unique_by(.id)
            '
          )"
          active_wdc="$(jq -c --argjson max_age "$QUEUED_LEASE_MAX_AGE_SECONDS" '
            [.[] | select(
              .status == "in_progress" or
              (.status == "queued" and (now - (.created_at | fromdateiso8601)) <= $max_age)
            )]
          ' <<<"$observed_wdc")"
          stale_queued="$(jq -c --argjson max_age "$QUEUED_LEASE_MAX_AGE_SECONDS" '
            [.[] | select(
              .status == "queued" and (now - (.created_at | fromdateiso8601)) > $max_age
            )]
          ' <<<"$observed_wdc")"
          if [ "$(jq -r 'length' <<<"$stale_queued")" -gt 0 ]; then
            echo "WDC_STALE_QUEUED_LEASE_IGNORED runs=$stale_queued"
          fi
          if [ "$(jq -r 'length' <<<"$active_wdc")" -gt 0 ]; then
            echo 'blocked=true' >> "$GITHUB_OUTPUT"
            echo "BACKFILL_UPDATE_NOOP reason=active-wdc-release runs=$(jq -c . <<<"$active_wdc")"
          else
            echo 'blocked=false' >> "$GITHUB_OUTPUT"
            echo "BACKFILL_UPDATE_RELEASE_WINDOW_CLEAR"
          fi

  backfill:
    needs: release_window
    if: ${{ needs.release_window.outputs.blocked != 'true' }}
    runs-on: [self-hosted, macOS, ARM64, daily-song-list-mac]
    timeout-minutes: 75
    env:
      BACKFILL_SOURCE_ROOT: ${{ github.workspace }}/backfill-update-source
      DAILY_SONG_UPDATE_MODE: "backfill"
      DAILY_SONG_MONTH_BACKFILL_TARGET: "3000"
      DAILY_SONG_MYGIT_TODAY_SNAPSHOT_DAYS: "7"
    defaults:
      run:
        working-directory: backfill-update-source
    steps:
      - name: Reset bounded isolated backfill checkout
        working-directory: .
        run: |
          set -Eeuo pipefail
          OWNER_PATH="$GITHUB_WORKSPACE/.backfill-update-source-owned"
          [[ "$BACKFILL_SOURCE_ROOT" == "$GITHUB_WORKSPACE/backfill-update-source" ]]
          [[ "${BACKFILL_SOURCE_ROOT%/*}" == "$GITHUB_WORKSPACE" ]]
          [[ "${BACKFILL_SOURCE_ROOT##*/}" == "backfill-update-source" ]]
          if [[ -e "$BACKFILL_SOURCE_ROOT" || -L "$BACKFILL_SOURCE_ROOT" ]]; then
            [[ -d "$BACKFILL_SOURCE_ROOT" && ! -L "$BACKFILL_SOURCE_ROOT" ]]
            [[ -f "$OWNER_PATH" ]]
            [[ "$(cat "$OWNER_PATH")" == "daily-song-list-backfill-source-v1" ]]
            source_real="$(/usr/bin/python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$BACKFILL_SOURCE_ROOT")"
            [[ "$source_real" == "$BACKFILL_SOURCE_ROOT" ]]
            rm -rf -- "$BACKFILL_SOURCE_ROOT"
          fi
          printf '%s\n' "daily-song-list-backfill-source-v1" > "$OWNER_PATH"
          install -d -m 0700 "$BACKFILL_SOURCE_ROOT"
          echo "BACKFILL_SOURCE_CHECKOUT_RESET root=$BACKFILL_SOURCE_ROOT"

      - name: Checkout controlled backfill inputs
        id: backfill_checkout
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: backfill-update-source
          fetch-depth: 50
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/update-backfill.yml
            /.gitignore
            /scripts/run-backfill-update.js
            /data/latest.json
            /data/backfill-inbox/**

      - name: Recover controlled backfill checkout after transport interruption
        if: steps.backfill_checkout.outcome == 'failure'
        working-directory: .
        run: |
          set -Eeuo pipefail
          OWNER_PATH="$GITHUB_WORKSPACE/.backfill-update-source-owned"
          RETRY_LOG="$RUNNER_TEMP/backfill-checkout-transport-retry.log"
          [[ "$BACKFILL_SOURCE_ROOT" == "$GITHUB_WORKSPACE/backfill-update-source" ]]
          [[ -d "$BACKFILL_SOURCE_ROOT/.git" && ! -L "$BACKFILL_SOURCE_ROOT" ]]
          [[ -f "$OWNER_PATH" ]]
          [[ "$(cat "$OWNER_PATH")" == "daily-song-list-backfill-source-v1" ]]
          cd "$BACKFILL_SOURCE_ROOT"
          for attempt in 1 2 3; do
            : > "$RETRY_LOG"
            if {
              git show-ref --verify --quiet refs/remotes/origin/main ||
                git -c protocol.version=2 fetch \
                  --no-tags --prune --no-recurse-submodules \
                  --filter=blob:none --depth=50 origin \
                  "+${GITHUB_SHA}:refs/remotes/origin/main"
              git checkout --progress --force -B main refs/remotes/origin/main
            } >"$RETRY_LOG" 2>&1; then
              rm -f -- "$RETRY_LOG"
              echo "BACKFILL_CHECKOUT_TRANSPORT_RECOVERED attempt=$attempt"
              exit 0
            else
              status=$?
            fi
            cat "$RETRY_LOG" >&2
            if ! grep -Eiq \
              'RPC failed|Transferred a partial file|bytes of body are still expected|unexpected disconnect|early EOF|Failed to connect|Connection reset by peer|Operation timed out|Could not resolve host|stream .* was not closed cleanly|TLS.*error|Recv failure' \
              "$RETRY_LOG"; then
              echo "BACKFILL_CHECKOUT_NON_TRANSPORT_FAILURE attempt=$attempt status=$status" >&2
              exit "$status"
            fi
            echo "BACKFILL_CHECKOUT_TRANSPORT_RETRY attempt=$attempt status=$status" >&2
            if (( attempt == 3 )); then
              exit "$status"
            fi
            sleep "$(( attempt * 2 ))"
          done

      - name: Validate bounded isolated backfill checkout
        run: |
          set -Eeuo pipefail
          source_git_kib="$(du -sk "$BACKFILL_SOURCE_ROOT/.git" | awk '{print $1}')"
          [[ "$source_git_kib" =~ ^[0-9]+$ ]]
          source_git_bytes=$((source_git_kib * 1024))
          (( source_git_bytes < 1000000000 )) || {
            echo "BACKFILL_SOURCE_CHECKOUT_LIMIT_EXCEEDED bytes=$source_git_bytes" >&2
            exit 74
          }
          echo "BACKFILL_SOURCE_CHECKOUT_BYTES bytes=$source_git_bytes limit=1000000000"

      - name: Configure Mac toolchain
        run: |
          echo "/Users/be/.local/bin" >> "$GITHUB_PATH"
          echo "/Users/be/.local/codex-toolchains/node/bin" >> "$GITHUB_PATH"
          echo "/Users/be/.local/codex-toolchains/python312/bin" >> "$GITHUB_PATH"
      - name: Record run start
        id: runmeta
        run: |
          echo "started_epoch=$(date -u +%s)" >> "$GITHUB_OUTPUT"
          {
            echo "### Backfill inbox bundle"
            echo "- run_id: $GITHUB_RUN_ID"
            echo "- run_attempt: $GITHUB_RUN_ATTEMPT"
            echo "- started_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- release_runbook: docs/release-runbook.md"
            echo "- target: $DAILY_SONG_MONTH_BACKFILL_TARGET"
            echo "- snapshot_days: $DAILY_SONG_MYGIT_TODAY_SNAPSHOT_DAYS"
            echo "- note: prepares immutable data/backfill-inbox only; full DB/runtime rebuild belongs in deploy workflow or larger runners"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sync latest main
        run: |
          git fetch --no-tags --filter=blob:none --prune origin main
          git merge --ff-only FETCH_HEAD

      - name: Prepare immutable backfill bundle
        id: backfill
        run: node scripts/run-backfill-update.js

      - name: Commit backfill bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backfill-inbox
          if git diff --cached --quiet; then
            echo "No backfill bundle changes."
            exit 0
          fi
          git commit -m "chore: prepare backfill inbox bundle"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Failed to push backfill bundle after retries."
          exit 1

      - name: Finish run summary
        if: always()
        run: |
          started="${{ steps.runmeta.outputs.started_epoch }}"
          now="$(date -u +%s)"
          elapsed="unknown"
          if [ -n "$started" ]; then
            elapsed="$((now - started))s"
          fi
          {
            echo "- completed_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- elapsed: $elapsed"
            echo "- backfill_outcome: ${{ steps.backfill.outcome }}"
            echo "- failure_hint: if this fails, record whether the failure was sync, prepare bundle, commit/rebase, or push before rerunning"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove controlled backfill checkout
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          set -Eeuo pipefail
          OWNER_PATH="$GITHUB_WORKSPACE/.backfill-update-source-owned"
          [[ "$BACKFILL_SOURCE_ROOT" == "$GITHUB_WORKSPACE/backfill-update-source" ]]
          [[ "${BACKFILL_SOURCE_ROOT%/*}" == "$GITHUB_WORKSPACE" ]]
          [[ "${BACKFILL_SOURCE_ROOT##*/}" == "backfill-update-source" ]]
          if [[ -e "$BACKFILL_SOURCE_ROOT" || -L "$BACKFILL_SOURCE_ROOT" ]]; then
            [[ -d "$BACKFILL_SOURCE_ROOT" && ! -L "$BACKFILL_SOURCE_ROOT" ]]
            [[ -f "$OWNER_PATH" ]]
            [[ "$(cat "$OWNER_PATH")" == "daily-song-list-backfill-source-v1" ]]
            source_real="$(/usr/bin/python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$BACKFILL_SOURCE_ROOT")"
            [[ "$source_real" == "$BACKFILL_SOURCE_ROOT" ]]
            before_kib="$(du -sk "$BACKFILL_SOURCE_ROOT" | awk '{print $1}')"
            rm -rf -- "$BACKFILL_SOURCE_ROOT"
          else
            before_kib=0
          fi
          rm -f -- "$OWNER_PATH"
          [[ ! -e "$BACKFILL_SOURCE_ROOT" && ! -L "$BACKFILL_SOURCE_ROOT" ]]
          echo "BACKFILL_SOURCE_CHECKOUT_POSTCLEAN before_bytes=$((before_kib * 1024)) after_bytes=0"
