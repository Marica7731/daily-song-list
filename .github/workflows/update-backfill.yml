name: Prepare backfill inbox bundle

on:
  schedule:
    - cron: "19 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-song-list-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: [self-hosted, macOS, ARM64, daily-song-list-mac]
    timeout-minutes: 75
    env:
      BACKFILL_SOURCE_ROOT: ${{ github.workspace }}/backfill-update-source
      DAILY_SONG_UPDATE_MODE: "backfill"
      DAILY_SONG_MONTH_BACKFILL_TARGET: "3000"
      DAILY_SONG_MYGIT_TODAY_SNAPSHOT_DAYS: "7"
    defaults:
      run:
        working-directory: backfill-update-source
    steps:
      - name: Reset bounded isolated backfill checkout
        working-directory: .
        run: |
          set -Eeuo pipefail
          OWNER_PATH="$GITHUB_WORKSPACE/.backfill-update-source-owned"
          [[ "$BACKFILL_SOURCE_ROOT" == "$GITHUB_WORKSPACE/backfill-update-source" ]]
          [[ "${BACKFILL_SOURCE_ROOT%/*}" == "$GITHUB_WORKSPACE" ]]
          [[ "${BACKFILL_SOURCE_ROOT##*/}" == "backfill-update-source" ]]
          if [[ -e "$BACKFILL_SOURCE_ROOT" || -L "$BACKFILL_SOURCE_ROOT" ]]; then
            [[ -d "$BACKFILL_SOURCE_ROOT" && ! -L "$BACKFILL_SOURCE_ROOT" ]]
            [[ -f "$OWNER_PATH" ]]
            [[ "$(cat "$OWNER_PATH")" == "daily-song-list-backfill-source-v1" ]]
            source_real="$(/usr/bin/python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$BACKFILL_SOURCE_ROOT")"
            [[ "$source_real" == "$BACKFILL_SOURCE_ROOT" ]]
            rm -rf -- "$BACKFILL_SOURCE_ROOT"
          fi
          printf '%s\n' "daily-song-list-backfill-source-v1" > "$OWNER_PATH"
          install -d -m 0700 "$BACKFILL_SOURCE_ROOT"
          echo "BACKFILL_SOURCE_CHECKOUT_RESET root=$BACKFILL_SOURCE_ROOT"

      - name: Checkout controlled backfill inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: backfill-update-source
          fetch-depth: 50
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/update-backfill.yml
            /.gitignore
            /scripts/run-backfill-update.js
            /data/latest.json
            /data/backfill-inbox/**

      - name: Validate bounded isolated backfill checkout
        run: |
          set -Eeuo pipefail
          source_git_kib="$(du -sk "$BACKFILL_SOURCE_ROOT/.git" | awk '{print $1}')"
          [[ "$source_git_kib" =~ ^[0-9]+$ ]]
          source_git_bytes=$((source_git_kib * 1024))
          (( source_git_bytes < 1000000000 )) || {
            echo "BACKFILL_SOURCE_CHECKOUT_LIMIT_EXCEEDED bytes=$source_git_bytes" >&2
            exit 74
          }
          echo "BACKFILL_SOURCE_CHECKOUT_BYTES bytes=$source_git_bytes limit=1000000000"

      - name: Configure Mac toolchain
        run: |
          echo "/Users/be/.local/bin" >> "$GITHUB_PATH"
          echo "/Users/be/.local/codex-toolchains/node/bin" >> "$GITHUB_PATH"
          echo "/Users/be/.local/codex-toolchains/python312/bin" >> "$GITHUB_PATH"
      - name: Record run start
        id: runmeta
        run: |
          echo "started_epoch=$(date -u +%s)" >> "$GITHUB_OUTPUT"
          {
            echo "### Backfill inbox bundle"
            echo "- run_id: $GITHUB_RUN_ID"
            echo "- run_attempt: $GITHUB_RUN_ATTEMPT"
            echo "- started_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- release_runbook: docs/release-runbook.md"
            echo "- target: $DAILY_SONG_MONTH_BACKFILL_TARGET"
            echo "- snapshot_days: $DAILY_SONG_MYGIT_TODAY_SNAPSHOT_DAYS"
            echo "- note: prepares immutable data/backfill-inbox only; full DB/runtime rebuild belongs in deploy workflow or larger runners"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sync latest main
        run: |
          git fetch --no-tags --filter=blob:none --prune origin main
          git merge --ff-only FETCH_HEAD

      - name: Prepare immutable backfill bundle
        id: backfill
        run: node scripts/run-backfill-update.js

      - name: Commit backfill bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backfill-inbox
          if git diff --cached --quiet; then
            echo "No backfill bundle changes."
            exit 0
          fi
          git commit -m "chore: prepare backfill inbox bundle"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Failed to push backfill bundle after retries."
          exit 1

      - name: Finish run summary
        if: always()
        run: |
          started="${{ steps.runmeta.outputs.started_epoch }}"
          now="$(date -u +%s)"
          elapsed="unknown"
          if [ -n "$started" ]; then
            elapsed="$((now - started))s"
          fi
          {
            echo "- completed_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- elapsed: $elapsed"
            echo "- backfill_outcome: ${{ steps.backfill.outcome }}"
            echo "- failure_hint: if this fails, record whether the failure was sync, prepare bundle, commit/rebase, or push before rerunning"
          } >> "$GITHUB_STEP_SUMMARY"
