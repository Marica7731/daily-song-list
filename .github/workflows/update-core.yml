name: Update core song-list data

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Update mode"
        required: false
        default: "fast"
        type: choice
        options:
          - fast
      reason:
        description: "Dispatch reason"
        required: false
        default: "manual"

permissions:
  contents: write

concurrency:
  group: daily-song-list-core
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DAILY_SONG_SEARCH_LIMIT: "500"
      DAILY_SONG_UPDATE_MODE: ${{ inputs.mode || 'fast' }}
      DAILY_SONG_VIDEO_LIMIT: "90"
      DAILY_SONG_VIDEO_CONCURRENCY: "1"
      DAILY_SONG_RECENT_BUCKET_LIMIT: "48"
      DAILY_SONG_MONTH_REFRESH_LIMIT: "8"
      DAILY_SONG_MONTH_BACKFILL_TARGET: "0"
      DAILY_SONG_MONTH_BACKFILL_RECENT_BUCKET_LIMIT: "0"
      DAILY_SONG_MYGIT_TODAY_SNAPSHOTS: "1"
      DAILY_SONG_MYGIT_TODAY_SNAPSHOT_DAYS: "0"
      DAILY_SONG_MYGIT_TODAY_SNAPSHOT_LIMIT: "0"
      DAILY_SONG_RECENT_WINDOW_DAYS: "7"
      DAILY_SONG_CARRY_FORWARD_MAX_AGE_HOURS: "36"
      DAILY_SONG_SEARCH_CONTINUATION_ROUNDS: "120"
      DAILY_SONG_FETCH_RETRIES: "3"
      DAILY_SONG_REQUEST_DELAY_MS: "2500"
      DAILY_SONG_REQUEST_JITTER_MS: "1500"
      DAILY_SONG_429_COOLDOWN_MS: "60000"
      DAILY_SONG_RETRY_JITTER_MS: "5000"
      DAILY_SONG_MAX_429_ERRORS: "8"
      DAILY_SONG_SNAPSHOT_RETENTION_DAYS: "0"
      DAILY_SONG_INSPECTION_CACHE_RETENTION_DAYS: "35"
      DAILY_SONG_CATALOG_SEGMENT_SIZE: "500"
      DAILY_SONG_INSPECTION_CACHE_FETCH_ERROR_TTL_HOURS: "6"
      DAILY_SONG_INSPECTION_CACHE_NO_USABLE_MIN_AGE_HOURS: "48"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Record run start
        id: runmeta
        run: |
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          {
            echo "### Core update"
            echo "- run_id: $GITHUB_RUN_ID"
            echo "- run_attempt: $GITHUB_RUN_ATTEMPT"
            echo "- started_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- mode: $DAILY_SONG_UPDATE_MODE"
            echo "- reason: ${{ inputs.reason || github.event_name }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sync latest main before generating data
        id: sync
        run: |
          git pull --ff-only origin main
          echo "base_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Update compact runtime data
        id: core
        timeout-minutes: 35
        continue-on-error: true
        env:
          DAILY_SONG_EVENT_SCHEDULE: ${{ github.event.schedule }}
          DAILY_SONG_DISPATCH_REASON: ${{ inputs.reason || github.event_name }}
          DAILY_SONG_RUNNER_STARTED_AT: ${{ steps.runmeta.outputs.started_at }}
        run: node scripts/run-core-update.js

      - name: Regenerate on latest main when remote moved
        if: steps.core.outcome == 'success' && steps.core.outputs.updated == 'true'
        env:
          DAILY_SONG_EVENT_SCHEDULE: ${{ github.event.schedule }}
          DAILY_SONG_DISPATCH_REASON: ${{ inputs.reason || github.event_name }}
          DAILY_SONG_RUNNER_STARTED_AT: ${{ steps.runmeta.outputs.started_at }}
        run: |
          git fetch origin main
          remote_head="$(git rev-parse origin/main)"
          if [ "$remote_head" = "${{ steps.sync.outputs.base_head }}" ]; then
            echo "Remote main did not move during generation."
            exit 0
          fi
          echo "Remote main moved from ${{ steps.sync.outputs.base_head }} to $remote_head; regenerating core data on the latest base."
          git reset --hard "$remote_head"
          node scripts/run-core-update.js

      - name: Restore core data after core failure
        if: always() && steps.core.outcome != 'success'
        env:
          DAILY_SONG_FAILURE_MESSAGE: "Core scheduled update failed; previous latest data kept."
          DAILY_SONG_FAILURE_OUTCOME: ${{ steps.core.outcome }}
          DAILY_SONG_RUNNER_STARTED_AT: ${{ steps.runmeta.outputs.started_at }}
        run: |
          node scripts/run-core-update.js restore-after-failure
          npm run mark:failure

      - name: Configure git identity
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit core data
        if: steps.core.outcome == 'success'
        run: |
          git add data/latest.json data/7d.json data/all.json data/72h.json data/1m.json data/audit.json data/inspection-cache.json data/status.json data/video-catalog.json data/song-search-known-songs.json data/snapshots data/diff data/ui data/catalog-segments
          if git diff --cached --quiet; then
            echo "No core data changes to commit."
            exit 0
          fi
          git commit -m "chore: update core song-list data"

      - name: Commit failure status
        if: always() && steps.core.outcome != 'success'
        run: |
          git add data/status.json
          if git diff --cached --quiet; then
            echo "No failure status changes to commit."
            exit 0
          fi
          git commit -m "chore: mark failed core song-list update"

      - name: Push core changes
        if: always()
        env:
          CORE_OUTCOME: ${{ steps.core.outcome }}
          DAILY_SONG_EVENT_SCHEDULE: ${{ github.event.schedule }}
          DAILY_SONG_DISPATCH_REASON: ${{ inputs.reason || github.event_name }}
          DAILY_SONG_FAILURE_MESSAGE: "Core scheduled update failed; previous latest data kept."
          DAILY_SONG_FAILURE_OUTCOME: ${{ steps.core.outcome }}
          DAILY_SONG_RUNNER_STARTED_AT: ${{ steps.runmeta.outputs.started_at }}
        run: |
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; rebuilding against latest main before retry."
            git fetch origin main
            git reset --hard origin/main
            if [ "$CORE_OUTCOME" = "success" ]; then
              node scripts/run-core-update.js
              git add data/latest.json data/7d.json data/all.json data/72h.json data/1m.json data/audit.json data/inspection-cache.json data/status.json data/video-catalog.json data/song-search-known-songs.json data/snapshots data/diff data/ui data/catalog-segments
              git commit -m "chore: update core song-list data" || true
            else
              node scripts/run-core-update.js restore-after-failure
              npm run mark:failure
              git add data/status.json
              git commit -m "chore: mark failed core song-list update" || true
            fi
            sleep 5
          done
          echo "::error::Failed to push core data changes after retries."
          exit 1

      - name: Published runtime health check
        if: steps.core.outcome == 'success' && steps.core.outputs.updated == 'true'
        run: |
          sleep 75
          for attempt in 1 2 3 4 5; do
            if npm run check:published -- https://ytb-song-rank.culua.com/ --expected-meta data/ui/meta.json; then
              exit 0
            fi
            echo "Published runtime health check attempt ${attempt} failed; waiting for CDN propagation."
            sleep 45
          done
          npm run check:published -- https://ytb-song-rank.culua.com/ --expected-meta data/ui/meta.json

      - name: Finish run summary
        if: always()
        run: |
          {
            echo "- completed_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- core_outcome: ${{ steps.core.outcome }}"
            echo "- skipped: ${{ steps.core.outputs.skipped }}"
            echo "- updated: ${{ steps.core.outputs.updated }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when core update failed
        if: always() && steps.core.outcome != 'success'
        run: exit 1
