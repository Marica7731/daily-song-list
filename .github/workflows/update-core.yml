name: Update core song-list data

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Update mode"
        required: false
        default: "fast"
        type: choice
        options:
          - fast
      reason:
        description: "Dispatch reason"
        required: false
        default: "manual"

permissions:
  actions: read
  contents: write

concurrency:
  group: daily-song-list-core
  cancel-in-progress: false

jobs:
  release_window:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      blocked: ${{ steps.detect.outputs.blocked }}
    steps:
      - name: Skip while bounded WDC release owns the snapshot
        id: detect
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          active_wdc="$(
            for release_status in in_progress queued; do
              curl --fail --silent --show-error --location --retry 2 \
                --connect-timeout 5 --max-time 30 \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H 'Accept: application/vnd.github+json' \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?status=${release_status}&per_page=100"
            done | jq -sr '
              [.[].workflow_runs[] |
                select(.name == "Sync complete immutable release to WDC") |
                {id,name,status,head_sha}
              ] | unique_by(.id)
            '
          )"
          if [ "$(jq -r 'length' <<<"$active_wdc")" -gt 0 ]; then
            echo 'blocked=true' >> "$GITHUB_OUTPUT"
            echo "CORE_UPDATE_NOOP reason=active-wdc-release runs=$(jq -c . <<<"$active_wdc")"
          else
            echo 'blocked=false' >> "$GITHUB_OUTPUT"
            echo "CORE_UPDATE_RELEASE_WINDOW_CLEAR"
          fi

  update:
    needs: release_window
    if: ${{ needs.release_window.outputs.blocked != 'true' }}
    runs-on: [self-hosted, macOS, ARM64, daily-song-list-mac]
    timeout-minutes: 240
    env:
      CORE_SOURCE_ROOT: ${{ github.workspace }}/core-update-source
      DAILY_SONG_SEARCH_LIMIT: "500"
      DAILY_SONG_UPDATE_MODE: ${{ inputs.mode || 'fast' }}
      DAILY_SONG_VIDEO_LIMIT: "20"
      DAILY_SONG_VIDEO_CONCURRENCY: "1"
      DAILY_SONG_RECENT_BUCKET_LIMIT: "48"
      DAILY_SONG_MONTH_REFRESH_LIMIT: "8"
      DAILY_SONG_MONTH_BACKFILL_TARGET: "0"
      DAILY_SONG_MONTH_BACKFILL_RECENT_BUCKET_LIMIT: "0"
      DAILY_SONG_MYGIT_TODAY_SNAPSHOTS: "1"
      DAILY_SONG_MYGIT_TODAY_SNAPSHOT_DAYS: "0"
      DAILY_SONG_MYGIT_TODAY_SNAPSHOT_LIMIT: "0"
      DAILY_SONG_RECENT_WINDOW_DAYS: "7"
      DAILY_SONG_CARRY_FORWARD_MAX_AGE_HOURS: "36"
      DAILY_SONG_SEARCH_CONTINUATION_ROUNDS: "120"
      DAILY_SONG_FETCH_RETRIES: "3"
      DAILY_SONG_REQUEST_DELAY_MS: "2500"
      DAILY_SONG_REQUEST_JITTER_MS: "1500"
      DAILY_SONG_429_COOLDOWN_MS: "60000"
      DAILY_SONG_RETRY_JITTER_MS: "5000"
      DAILY_SONG_MAX_429_ERRORS: "8"
      DAILY_SONG_SNAPSHOT_RETENTION_DAYS: "0"
      DAILY_SONG_INSPECTION_CACHE_RETENTION_DAYS: "35"
      DAILY_SONG_CATALOG_SEGMENT_SIZE: "500"
      DAILY_SONG_INSPECTION_CACHE_FETCH_ERROR_TTL_HOURS: "6"
      DAILY_SONG_INSPECTION_CACHE_NO_USABLE_MIN_AGE_HOURS: "48"
      DAILY_SONG_CHANNEL_AVATAR_MAX_FETCH: "0"
      DAILY_SONG_CHANNEL_AVATAR_DELAY_MS: "1500"
      DAILY_SONG_CHANNEL_AVATAR_STALE_DAYS: "30"
      DAILY_SONG_SEARCH_REFRESH_MAX_AGE_HOURS: "24"
    defaults:
      run:
        working-directory: core-update-source
    steps:
      - name: Reset bounded isolated core checkout
        working-directory: .
        run: |
          set -Eeuo pipefail
          OWNER_PATH="$GITHUB_WORKSPACE/.core-update-source-owned"
          [[ "$CORE_SOURCE_ROOT" == "$GITHUB_WORKSPACE/core-update-source" ]]
          [[ "${CORE_SOURCE_ROOT%/*}" == "$GITHUB_WORKSPACE" ]]
          [[ "${CORE_SOURCE_ROOT##*/}" == "core-update-source" ]]
          if [[ -e "$CORE_SOURCE_ROOT" || -L "$CORE_SOURCE_ROOT" ]]; then
            [[ -d "$CORE_SOURCE_ROOT" && ! -L "$CORE_SOURCE_ROOT" ]]
            [[ -f "$OWNER_PATH" ]]
            [[ "$(cat "$OWNER_PATH")" == "daily-song-list-core-source-v1" ]]
            source_real="$(/usr/bin/python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$CORE_SOURCE_ROOT")"
            [[ "$source_real" == "$CORE_SOURCE_ROOT" ]]
            rm -rf -- "$CORE_SOURCE_ROOT"
          fi
          printf '%s\n' "daily-song-list-core-source-v1" > "$OWNER_PATH"
          install -d -m 0700 "$CORE_SOURCE_ROOT"
          echo "CORE_SOURCE_CHECKOUT_RESET root=$CORE_SOURCE_ROOT"

      - name: Checkout controlled core inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: core-update-source
          fetch-depth: 50
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/update-core.yml
            /package.json
            /package-lock.json
            /scripts/**
            /assets/**
            /config/**
            /docs/release-runbook.md
            /.gitignore
            /data/latest.json
            /data/7d.json
            /data/all.json
            /data/72h.json
            /data/1m.json
            /data/audit.json
            /data/inspection-cache.json
            /data/mygit-today-snapshot-import-state.json
            /data/status.json
            /data/video-catalog.json
            /data/song-search-known-songs.json
            /data/external/youtube-channel-discovery/channel-metadata.json
            /data/external/youtube-channel-discovery/accepted/**
            /data/external/vsinger-http/backfill/**
            /data/snapshots/**
            /data/catalog-segments/**
            /data/diff/**
            /data/ui/meta.json

      - name: Validate bounded isolated core checkout
        run: |
          set -Eeuo pipefail
          source_git_kib="$(du -sk "$CORE_SOURCE_ROOT/.git" | awk '{print $1}')"
          [[ "$source_git_kib" =~ ^[0-9]+$ ]]
          source_git_bytes=$((source_git_kib * 1024))
          (( source_git_bytes < 5000000000 )) || {
            echo "CORE_SOURCE_CHECKOUT_LIMIT_EXCEEDED bytes=$source_git_bytes" >&2
            exit 74
          }
          echo "CORE_SOURCE_CHECKOUT_BYTES bytes=$source_git_bytes limit=5000000000"

      - name: Configure Mac toolchain
        run: |
          echo "/Users/be/.local/bin" >> "$GITHUB_PATH"
          echo "/Users/be/.local/codex-toolchains/node/bin" >> "$GITHUB_PATH"
          echo "/Users/be/.local/codex-toolchains/python312/bin" >> "$GITHUB_PATH"

      - name: Record run start
        id: runmeta
        run: |
          echo "started_epoch=$(date -u +%s)" >> "$GITHUB_OUTPUT"
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          {
            echo "### Core update"
            echo "- run_id: $GITHUB_RUN_ID"
            echo "- run_attempt: $GITHUB_RUN_ATTEMPT"
            echo "- started_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- mode: $DAILY_SONG_UPDATE_MODE"
            echo "- reason: ${{ inputs.reason || github.event_name }}"
            echo "- input_version: exact checked-out Git HEAD"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sync latest main before build
        run: |
          git fetch --no-tags --filter=blob:none --prune origin main
          git merge --ff-only FETCH_HEAD

      - name: Build core data
        id: core
        timeout-minutes: 230
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          node scripts/update-songlist.js
          node scripts/apply-song-search-niche.js
          node scripts/fetch-channel-avatar-cache.js --daily
          NODE_OPTIONS="${NODE_OPTIONS:-} --max-old-space-size=8192" node scripts/build-runtime-data.js
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Cleanup transient UI and avatar checkpoint
        id: cleanup
        if: always()
        run: |
          set -Eeuo pipefail
          if [ -d data/ui ]; then
            find data/ui -mindepth 1 -type f ! -path data/ui/meta.json -delete
            find data/ui -mindepth 1 -depth -type d -empty -delete
          fi
          git restore --worktree -- data/ui/meta.json
          git clean -fd -- data/ui
          rm -f -- artifacts/channel-avatar-cache/checkpoint.json
          rmdir artifacts/channel-avatar-cache 2>/dev/null || true
          rmdir artifacts 2>/dev/null || true
          echo "CORE_TRANSIENT_CLEANUP_OK"

      - name: Commit and push controlled core outputs
        id: publish
        if: steps.core.outcome == 'success' && steps.cleanup.outcome == 'success'
        run: |
          set -Eeuo pipefail
          path_allowed() {
            case "$1" in
              data/latest.json|data/7d.json|data/all.json|data/72h.json|data/1m.json|data/audit.json|data/inspection-cache.json|data/status.json|data/video-catalog.json|data/song-search-known-songs.json|data/mygit-today-snapshot-import-state.json|data/external/youtube-channel-discovery/channel-metadata.json|data/snapshots/*|data/diff/*|data/catalog-segments/*) return 0 ;;
              *) return 1 ;;
            esac
          }
          while IFS= read -r -d '' record; do
            path="${record:3}"
            path_allowed "$path" || { echo "CORE_PATH_SCOPE_BLOCKED path=$path"; exit 1; }
          done < <(git status --porcelain=v1 -z --untracked-files=all)
          git add --sparse -- \
            data/latest.json data/7d.json data/all.json data/72h.json data/1m.json \
            data/audit.json data/inspection-cache.json data/status.json data/video-catalog.json \
            data/song-search-known-songs.json data/mygit-today-snapshot-import-state.json \
            data/external/youtube-channel-discovery/channel-metadata.json \
            data/snapshots data/diff data/catalog-segments
          while IFS= read -r -d '' path; do
            path_allowed "$path" || { echo "CORE_CACHED_PATH_SCOPE_BLOCKED path=$path"; exit 1; }
          done < <(git diff --cached --name-only -z)
          if git diff --cached --quiet; then
            echo "No core data changes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update core song-list data"
          git fetch --no-tags --filter=blob:none --prune origin main
          git rebase FETCH_HEAD
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Prepare authoritative 7D producer artifact
        id: authoritative_7d
        if: steps.publish.outputs.pushed == 'true'
        run: |
          set -Eeuo pipefail
          test -s data/7d.json || { echo "AUTHORITATIVE_7D_PRODUCER_BLOCKED missing-data-7d" >&2; exit 1; }
          source_sha="$(git rev-parse HEAD)"
          source_base_sha="$(git rev-parse "${source_sha}^")"
          source_blob_sha="$(git rev-parse "${source_sha}:data/7d.json")"
          data_sha="$(shasum -a 256 data/7d.json | awk '{print $1}')"
          artifact_name="daily-song-list-authoritative-7d-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          artifact_root="$RUNNER_TEMP/daily-song-list-authoritative-7d"
          rm -rf -- "$artifact_root"
          mkdir -p -- "$artifact_root"
          cp -- data/7d.json "$artifact_root/7d.json"
          created_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n \
            --arg artifact_name "$artifact_name" \
            --arg producer_run_id "$GITHUB_RUN_ID" \
            --arg producer_run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg producer_repo "$GITHUB_REPOSITORY" \
            --arg producer_head "$GITHUB_SHA" \
            --arg producer_ref "$GITHUB_REF" \
            --arg source_sha "$source_sha" \
            --arg source_base_sha "$source_base_sha" \
            --arg source_blob_sha "$source_blob_sha" \
            --arg data_sha "$data_sha" \
            --arg created_at "$created_at" \
            '{
              schemaVersion: 1,
              route: "authoritative-7d",
              artifactName: $artifact_name,
              producerRunId: ($producer_run_id | tonumber),
              producerRunAttempt: ($producer_run_attempt | tonumber),
              producerRepository: $producer_repo,
              producerHeadSha: $producer_head,
              producerRef: $producer_ref,
              sourceSha: $source_sha,
              sourceBaseSha: $source_base_sha,
              sourceBlobSha: $source_blob_sha,
              dataPath: "7d.json",
              dataSha256: $data_sha,
              createdAt: $created_at
            }' > "$artifact_root/authoritative-7d-manifest.json"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "AUTHORITATIVE_7D_PRODUCER_READY artifact=$artifact_name producerHead=$GITHUB_SHA sourceSha=$source_sha sourceBaseSha=$source_base_sha sourceBlobSha=$source_blob_sha"

      - name: Upload authoritative 7D producer artifact
        if: steps.authoritative_7d.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.authoritative_7d.outputs.artifact_name }}
          path: ${{ runner.temp }}/daily-song-list-authoritative-7d
          if-no-files-found: error
          retention-days: 7

      - name: Observe public health
        if: always() && steps.publish.outcome == 'success'
        continue-on-error: true
        run: |
          status="$(curl --silent --show-error --location --connect-timeout 8 --max-time 20 -o "$RUNNER_TEMP/core-public-healthz.json" -w '%{http_code}' https://ytb-song-rank.culua.com/healthz || true)"
          echo "CORE_PUBLIC_HEALTH_OBSERVATION http=${status:-unavailable}"
          echo "- public_health_observation_http: ${status:-unavailable}" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Finish run summary
        if: always()
        run: |
          started="${{ steps.runmeta.outputs.started_epoch }}"
          now="$(date -u +%s)"
          elapsed="unknown"
          if [ -n "$started" ]; then
            elapsed="$((now - started))s"
          fi
          {
            echo "- completed_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- elapsed_observation: $elapsed"
            echo "- core_outcome: ${{ steps.core.outcome }}"
            echo "- pushed: ${{ steps.publish.outputs.pushed }}"
            echo "- route: ordinary data/7d.json push triggers the PostgreSQL release workflow"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail only when core program failed
        if: always() && steps.core.outcome != 'success'
        run: exit 1
