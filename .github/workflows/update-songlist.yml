name: Update song-list snapshots

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-songlist.yml"
      - "scripts/**"
      - "assets/**"
      - "index.html"
      - "package.json"
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-song-list-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check code without refreshing data
        if: github.event_name == 'push'
        run: npm run check

      - name: Update data with previous-data fallback
        if: github.event_name != 'push'
        id: update
        continue-on-error: true
        env:
          DAILY_SONG_SEARCH_LIMIT: "500"
          DAILY_SONG_VIDEO_LIMIT: "160"
          DAILY_SONG_VIDEO_CONCURRENCY: "1"
          DAILY_SONG_RECENT_BUCKET_LIMIT: "70"
          DAILY_SONG_MONTH_REFRESH_LIMIT: "20"
          DAILY_SONG_MONTH_BACKFILL_TARGET: "320"
          DAILY_SONG_MONTH_BACKFILL_RECENT_BUCKET_LIMIT: "20"
          DAILY_SONG_CARRY_FORWARD_MAX_AGE_HOURS: "36"
          DAILY_SONG_SEARCH_CONTINUATION_ROUNDS: "120"
          DAILY_SONG_FETCH_RETRIES: "3"
          DAILY_SONG_REQUEST_DELAY_MS: "750"
          DAILY_SONG_429_COOLDOWN_MS: "15000"
          DAILY_SONG_MAX_429_ERRORS: "8"
          DAILY_SONG_SNAPSHOT_RETENTION_DAYS: "35"
        run: npm run update

      - name: Keep previous data after update failure
        if: github.event_name != 'push' && steps.update.outcome == 'failure'
        env:
          DAILY_SONG_FAILURE_MESSAGE: "Scheduled update failed; previous latest data kept."
        run: npm run mark:failure

      - name: Validate data if latest exists
        if: github.event_name != 'push'
        run: |
          if [ -f data/latest.json ]; then
            npm run validate
          else
            echo "::warning::No data/latest.json exists yet."
          fi

      - name: Commit data changes
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: update hourly song-list snapshot"
            git push
          fi
