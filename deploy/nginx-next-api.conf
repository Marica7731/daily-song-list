# Include from the next.ytb-song-rank.culua.com server block.
# The application already emits version-aware Cache-Control/ETag/gzip headers.
# Nginx must not override them or buffer an unbounded response.

location = /healthz {
    proxy_pass http://127.0.0.1:18777;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
    proxy_buffering off;
}

location ^~ /api/ {
    proxy_pass http://127.0.0.1:18777;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;

    # A local request should finish quickly.  Do not hide data/key bugs behind
    # minute-long proxy timeouts.
    proxy_connect_timeout 2s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;

    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 16 64k;
    proxy_busy_buffers_size 128k;
    proxy_max_temp_file_size 32m;

    # Preserve application cache validators.  Versioned ?v=<releaseSha> URLs
    # are immutable; unversioned API URLs are short-cache/revalidated.
    proxy_pass_header ETag;
    proxy_pass_header Cache-Control;
    proxy_pass_header X-Data-Source;
    proxy_pass_header X-Release-Sha;
    proxy_pass_header X-Server-Commit;
    proxy_pass_header Server-Timing;
}
