# Managed WDC site for the immutable daily-song-list release.
server {
    listen 443 ssl http2;
    server_name next.ytb-song-rank.culua.com;

    ssl_certificate /etc/letsencrypt/live/next.ytb-song-rank.culua.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/next.ytb-song-rank.culua.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Security-Policy "default-src 'self'" always;

    root /opt/culua/ytb-song-rank/static;
    index index.html;

    # The frontend bundle is large enough that transfer compression materially
    # affects first render. JSON responses already compressed by the API keep
    # their Content-Encoding and are not compressed a second time.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        text/css
        text/javascript;

    location = /healthz {
        proxy_pass http://127.0.0.1:18777;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_next_upstream off;
        proxy_intercept_errors off;
        proxy_buffering off;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:18777;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        proxy_next_upstream off;
        proxy_intercept_errors off;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 16 64k;
        proxy_busy_buffers_size 128k;
        proxy_max_temp_file_size 32m;
        proxy_pass_header ETag;
        proxy_pass_header Cache-Control;
        proxy_pass_header Content-Encoding;
        proxy_pass_header X-Data-Source;
        proxy_pass_header X-Duration-Ms;
        proxy_pass_header X-Release-Sha;
        proxy_pass_header X-Server-Commit;
        proxy_pass_header Server-Timing;
    }

    # Hashed JS/CSS/SVG and immutable release data are safe for a one-year
    # browser cache. Every deployment updates index.html atomically.
    location ~* ^/(?:assets/)?[^/]+(?:-|\.)h?[0-9a-f]{12,64}\.(?:js|css|svg)$ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* ^/data/.+\.[0-9a-f]{12,64}\.(?:json|gz|br)$ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "public, max-age=60, must-revalidate";
        try_files $uri =404;
    }

    location = / {
        expires -1;
        add_header Cache-Control "public, max-age=60, must-revalidate";
        try_files /index.html =404;
    }

    location ~* \.(?:js|css|svg|json|gz|br)$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    server_name next.ytb-song-rank.culua.com;
    return 301 https://$host$request_uri;
}
