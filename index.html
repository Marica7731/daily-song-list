<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daily Song List</title>
    <meta
      name="description"
      content="YouTube 72H and one-month timestamp song-list snapshots with direct jump links."
    />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <h1>Daily Song List</h1>
        <p>歌曲时间戳排行</p>
      </div>
      <div class="status" id="status">载入中</div>
    </header>

    <main class="layout">
      <section class="controls" aria-label="榜单筛选">
        <div class="segmented range-mode" role="tablist" aria-label="Range">
          <button class="tab active" type="button" data-range="72h" role="tab" aria-selected="true">最近72小时</button>
          <button class="tab" type="button" data-range="1m" role="tab" aria-selected="false">近30天</button>
        </div>

        <div class="segmented view-mode" role="tablist" aria-label="View">
          <button class="tab active" type="button" data-view="songRank" role="tab" aria-selected="true">歌曲榜</button>
          <button class="tab" type="button" data-view="artistRank" role="tab" aria-selected="false">歌手榜</button>
          <button class="tab" type="button" data-view="songAz" role="tab" aria-selected="false">歌曲索引</button>
          <button class="tab" type="button" data-view="videos" role="tab" aria-selected="false">视频</button>
        </div>

        <label class="field search-field">
          <span class="sr-only">搜索</span>
          <input id="filterInput" type="search" placeholder="搜索歌曲、歌手、频道或视频" autocomplete="off" />
        </label>

        <label class="field snapshot-field">
          <span class="sr-only">历史快照</span>
          <select id="snapshotSelect" aria-label="历史快照"></select>
        </label>
      </section>

      <section class="summary" id="summary" aria-live="polite"></section>
      <section class="content-shell" id="videoList"></section>
    </main>

    <script src="assets/app.js" defer></script>
  </body>
</html>
