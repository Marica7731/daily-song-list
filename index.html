<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouTube 歌枠歌曲排行</title>
    <meta
      name="description"
      content="YouTube 最近7天和累计全量时间戳歌单快照，支持直接跳转到歌曲时间点。"
    />
    <link rel="canonical" href="https://ytb-song-rank.culua.com/" />
    <meta name="theme-color" content="#0f766e" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="YouTube 歌枠歌曲排行" />
    <meta
      property="og:description"
      content="YouTube 最近7天和累计全量时间戳歌单快照，支持直接跳转到歌曲时间点。"
    />
    <meta property="og:url" content="https://ytb-song-rank.culua.com/" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="512x512" href="assets/favicon.png?v=icon1" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png?v=icon1" />
    <link rel="stylesheet" href="assets/styles.css?v=h9f1018164a19" />
  </head>
  <body>
    <main class="layout">
      <section class="controls" id="controls" aria-label="榜单查询">
        <div class="controls-inner">
          <div class="segmented range-mode" role="group" aria-label="范围">
            <button class="tab active" type="button" data-range="7d" aria-pressed="true">最近7天</button>
            <button
              class="tab"
              type="button"
              data-range="all"
              aria-pressed="false"
              title="累计全量；YouTube 月度搜索和历史快照用于补充发现视频。"
              aria-description="累计全量；YouTube 月度搜索和历史快照用于补充发现视频。"
            >
              本月
            </button>
          </div>

          <div class="segmented view-mode" role="group" aria-label="视图">
            <button class="tab active" type="button" data-view="songRank" aria-pressed="true">歌曲榜</button>
            <button class="tab" type="button" data-view="artistRank" aria-pressed="false">歌手榜</button>
            <button class="tab" type="button" data-view="songAz" aria-pressed="false">歌曲索引</button>
            <button class="tab" type="button" data-view="videos" aria-pressed="false">视频</button>
          </div>

          <button class="query-trigger" id="queryTrigger" type="button" aria-haspopup="dialog" aria-controls="queryDialog">
            <svg class="query-trigger-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m21 21-5.2-5.2M10.8 18a7.2 7.2 0 1 1 0-14.4 7.2 7.2 0 0 1 0 14.4Z" />
            </svg>
            <span class="query-trigger-text" id="queryTriggerText">搜索歌曲、歌手、频道或视频</span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 6h16M7 12h10M10 18h4" />
            </svg>
            <span class="query-count" id="queryCountBadge" hidden></span>
          </button>
        </div>
      </section>

      <div class="status" id="status" hidden aria-hidden="true">载入中</div>
      <section class="active-query-strip" id="activeQueryStrip" aria-label="当前搜索与筛选条件" hidden></section>
      <section class="summary" id="summary" aria-live="polite"></section>
      <section class="status-alerts" id="statusAlerts" aria-live="polite"></section>
      <section class="content-shell rank-panel skeleton-panel" id="videoList" aria-busy="true">
        <div class="rank-header skeleton-header" aria-hidden="true">
          <span>排名</span>
          <span>歌曲</span>
          <span>次数</span>
        </div>
        <div class="rank-row skeleton-row" aria-hidden="true">
          <span class="skeleton-rank"></span><span class="skeleton-lines"><span></span><span></span></span><span class="skeleton-count"></span>
        </div>
        <div class="rank-row skeleton-row" aria-hidden="true">
          <span class="skeleton-rank"></span><span class="skeleton-lines"><span></span><span></span></span><span class="skeleton-count"></span>
        </div>
        <div class="rank-row skeleton-row" aria-hidden="true">
          <span class="skeleton-rank"></span><span class="skeleton-lines"><span></span><span></span></span><span class="skeleton-count"></span>
        </div>
        <div class="rank-row skeleton-row" aria-hidden="true">
          <span class="skeleton-rank"></span><span class="skeleton-lines"><span></span><span></span></span><span class="skeleton-count"></span>
        </div>
        <div class="rank-row skeleton-row" aria-hidden="true">
          <span class="skeleton-rank"></span><span class="skeleton-lines"><span></span><span></span></span><span class="skeleton-count"></span>
        </div>
        <div class="rank-row skeleton-row" aria-hidden="true">
          <span class="skeleton-rank"></span><span class="skeleton-lines"><span></span><span></span></span><span class="skeleton-count"></span>
        </div>
        <div class="rank-row skeleton-row" aria-hidden="true">
          <span class="skeleton-rank"></span><span class="skeleton-lines"><span></span><span></span></span><span class="skeleton-count"></span>
        </div>
        <div class="rank-row skeleton-row" aria-hidden="true">
          <span class="skeleton-rank"></span><span class="skeleton-lines"><span></span><span></span></span><span class="skeleton-count"></span>
        </div>
      </section>
    </main>

    <nav class="mobile-bottom-nav" id="mobileBottomNav" aria-label="主视图">
      <button class="bottom-nav-item active" type="button" data-view="songRank" aria-current="page">
        <span class="bottom-nav-icon-wrap" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M9 18V5l10-2v13M9 10l10-2M9 18a3 3 0 1 1-3-3 3 3 0 0 1 3 3Zm10-2a3 3 0 1 1-3-3 3 3 0 0 1 3 3Z" />
          </svg>
        </span>
        <span>歌曲榜</span>
      </button>
      <button class="bottom-nav-item" type="button" data-view="artistRank">
        <span class="bottom-nav-icon-wrap" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm7 8a7 7 0 0 0-14 0" />
          </svg>
        </span>
        <span>歌手榜</span>
      </button>
      <button class="bottom-nav-item" type="button" data-view="songAz">
        <span class="bottom-nav-icon-wrap" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M5 5h14M5 12h14M5 19h10" />
          </svg>
        </span>
        <span>歌曲索引</span>
      </button>
      <button class="bottom-nav-item" type="button" data-view="videos">
        <span class="bottom-nav-icon-wrap" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M4 6h16v12H4zM10 9l5 3-5 3z" />
          </svg>
        </span>
        <span>视频</span>
      </button>
    </nav>

    <div class="overlay-root" id="queryDialog" hidden role="dialog" aria-modal="true" aria-labelledby="queryDialogTitle">
      <div class="overlay-backdrop" data-close-overlay="query"></div>
      <section class="query-panel" tabindex="-1">
        <header class="query-panel-header">
          <h2 id="queryDialogTitle">搜索与筛选</h2>
          <button class="icon-button" id="cancelQueryButton" type="button" aria-label="关闭搜索与筛选">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m6 6 12 12M18 6 6 18" />
            </svg>
          </button>
        </header>
        <label class="query-search-section">
          <span class="sr-only">搜索歌曲、歌手、频道或视频</span>
          <input id="queryInput" type="search" autocomplete="off" placeholder="搜索歌曲、歌手、频道或视频" />
          <button class="icon-button clear-query-button" id="clearQueryButton" type="button" aria-label="清空搜索词">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m6 6 12 12M18 6 6 18" />
            </svg>
          </button>
        </label>
        <div class="query-tabs" role="tablist" aria-label="搜索与筛选面板">
          <button id="querySearchTab" class="query-tab is-active" type="button" role="tab" aria-selected="true" aria-controls="querySearchPanel" data-query-panel-tab="search">搜索</button>
          <button id="queryFilterTab" class="query-tab" type="button" role="tab" aria-selected="false" aria-controls="queryFilterPanel" data-query-panel-tab="filter" tabindex="-1">筛选</button>
        </div>
        <div class="query-panel-body">
          <div class="query-tab-panel" id="querySearchPanel" role="tabpanel" aria-labelledby="querySearchTab">
            <section class="query-section recent-query-section" id="recentSearchSection">
              <div class="query-section-heading">
                <h3>最近搜索</h3>
                <button class="text-button subtle" id="clearRecentSearchesButton" type="button">清空</button>
              </div>
              <div class="recent-query-chips" id="recentSearches"></div>
            </section>
            <section class="query-section suggestions-section">
              <h3>匹配建议</h3>
              <div class="query-suggestions" id="searchSuggestions"></div>
            </section>
          </div>

          <div class="query-tab-panel" id="queryFilterPanel" role="tabpanel" aria-labelledby="queryFilterTab" hidden>
            <section class="query-section">
              <h3>内容范围</h3>
              <div class="query-toggle-grid">
                <label class="query-toggle" title="未匹配到 song-search 已知曲库，仅表示曲库未收录，不代表播放量或知名度低。">
                  <input id="nicheOnlyToggle" type="checkbox" aria-describedby="nicheHelp" />
                  <span>只看小众</span>
                  <small id="nicheHelp">未匹配到已知曲库的歌曲</small>
                </label>
                <label class="query-toggle" title="隐藏没有明确歌手的收录；取消后会在链接中写入 showUnknown=1。">
                  <input id="hideUnknownToggle" type="checkbox" aria-describedby="hideUnknownHelp" checked />
                  <span>隐藏无歌手</span>
                  <small id="hideUnknownHelp">隐藏空歌手、未記載、待补歌手等</small>
                </label>
              </div>
            </section>

            <section class="query-section" id="metricFilterGroup">
              <h3>排行条件</h3>
              <label class="query-field">
                <span>排行口径</span>
                <span class="query-segmented" role="group" aria-label="排行口径">
                  <label><input type="radio" name="queryMetric" value="occurrences" checked />按收录</label>
                  <label><input type="radio" name="queryMetric" value="videos" />按视频</label>
                </span>
              </label>
              <label class="query-field" id="trendFilterGroup">
                <span>趋势筛选</span>
                <select id="trendFilterSelect">
                  <option value="all">全部</option>
                  <option value="new">新上榜</option>
                  <option value="up">上升</option>
                  <option value="down">下降</option>
                </select>
                <small id="trendFilterHint"></small>
              </label>
              <label class="query-field" id="minCountFilterGroup">
                <span>最低收录</span>
                <select id="minCountSelect">
                  <option value="1">不限</option>
                  <option value="2">2次以上</option>
                  <option value="5">5次以上</option>
                  <option value="10">10次以上</option>
                </select>
              </label>
            </section>

            <section class="query-section" id="displayFilterGroup">
              <h3>显示设置</h3>
              <label class="query-field page-size-filter">
                <span>每页数量</span>
                <select id="queryPageSizeSelect">
                  <option value="50">50</option>
                  <option value="100">100</option>
                </select>
              </label>
            </section>

            <details class="query-section query-history-section">
              <summary>历史快照</summary>
              <label class="query-field">
                <span>快照日期</span>
                <select id="querySnapshotDateSelect"></select>
              </label>
              <label class="query-field">
                <span>快照时间</span>
                <select id="querySnapshotSelect"></select>
              </label>
            </details>
          </div>
        </div>
        <footer class="query-panel-footer">
          <button class="secondary-button" id="resetQueryButton" type="button">重置条件</button>
          <span class="query-preview sr-only" id="queryResultPreview" aria-live="polite">计算中</span>
          <button class="primary-button" id="applyQueryButton" type="button">查看结果</button>
        </footer>
      </section>
    </div>

    <button class="back-to-top" id="backToTop" type="button" aria-label="返回顶部" title="返回顶部" hidden>
      &uarr;
    </button>
    <div class="toast" id="toast" aria-live="polite" hidden></div>

    <script src="assets/blocked-vtuber-meta.js?v=h9f1018164a19" defer></script>
    <script src="assets/frontend-utils.js?v=h9f1018164a19" defer></script>
    <script src="assets/ranking-utils.js?v=h9f1018164a19" defer></script>
    <script src="assets/app.js?v=h9f1018164a19" defer></script>
  </body>
</html>
