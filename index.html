<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouTube 歌枠歌曲排行 | Daily Song List</title>
    <meta
      name="description"
      content="YouTube 最近72小时和最近35天累计时间戳歌单快照，支持直接跳转到歌曲时间点。"
    />
    <link rel="canonical" href="https://ytb-song-rank.culua.com/" />
    <meta name="theme-color" content="#0f766e" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="YouTube 歌枠歌曲排行 | Daily Song List" />
    <meta
      property="og:description"
      content="YouTube 最近72小时和最近35天累计时间戳歌单快照，支持直接跳转到歌曲时间点。"
    />
    <meta property="og:url" content="https://ytb-song-rank.culua.com/" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="512x512" href="assets/favicon.png?v=icon1" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png?v=icon1" />
    <link rel="stylesheet" href="assets/styles.css?v=h6564a519653d" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <h1>Daily Song List</h1>
        <p>歌曲时间戳排行</p>
      </div>
      <div class="status" id="status">载入中</div>
    </header>

    <main class="layout">
      <section class="controls" id="controls" aria-label="榜单筛选">
        <label class="field search-field">
          <span class="sr-only">搜索</span>
          <input id="filterInput" type="search" placeholder="搜索歌曲、歌手、频道或视频" autocomplete="off" />
        </label>

        <div class="control-strip">
          <div class="segmented range-mode" role="group" aria-label="范围">
            <button class="tab active" type="button" data-range="72h" aria-pressed="true">最近72小时</button>
            <button
              class="tab"
              type="button"
              data-range="1m"
              aria-pressed="false"
              title="最近35天累计；YouTube 月度搜索用于补充发现视频。"
              aria-description="最近35天累计；YouTube 月度搜索用于补充发现视频。"
            >
              月度
            </button>
          </div>

          <div class="segmented view-mode" role="group" aria-label="视图">
            <button class="tab active" type="button" data-view="songRank" aria-pressed="true">歌曲榜</button>
            <button class="tab" type="button" data-view="artistRank" aria-pressed="false">歌手榜</button>
            <button class="tab" type="button" data-view="songAz" aria-pressed="false">歌曲索引</button>
            <button class="tab" type="button" data-view="videos" aria-pressed="false">视频</button>
          </div>

          <label
            class="niche-toggle"
            title="未匹配到 song-search 已知曲库，仅表示曲库未收录，不代表播放量或知名度低。"
          >
            <input
              id="nicheOnlyToggle"
              type="checkbox"
              aria-describedby="nicheHelp"
              title="未匹配到 song-search 已知曲库，仅表示曲库未收录，不代表播放量或知名度低。"
            />
            <span>只看小众</span>
            <span id="nicheHelp" class="sr-only"
              >未匹配到 song-search 已知曲库，仅表示曲库未收录，不代表播放量或知名度低。</span
            >
          </label>
          <label class="unknown-toggle" title="隐藏没有明确歌手的收录；取消后会在链接中写入 showUnknown=1。">
            <input id="hideUnknownToggle" type="checkbox" aria-describedby="hideUnknownHelp" checked />
            <span>隐藏无歌手</span>
            <span id="hideUnknownHelp" class="sr-only">隐藏空歌手、未記載、待补歌手、unknown、n/a 等无歌手收录。</span>
          </label>

          <label class="field snapshot-date-field">
            <span class="sr-only">快照日期</span>
            <select id="snapshotDateSelect" aria-label="快照日期"></select>
          </label>

          <label class="field snapshot-time-field">
            <span class="sr-only">快照时间</span>
            <select id="snapshotSelect" aria-label="快照时间"></select>
          </label>
        </div>
      </section>

      <section class="summary" id="summary" aria-live="polite"></section>
      <section class="content-shell rank-panel skeleton-panel" id="videoList" aria-busy="true">
        <div class="rank-header skeleton-header" aria-hidden="true">
          <span>排名</span>
          <span>歌曲</span>
          <span>次数</span>
        </div>
        <div class="rank-row skeleton-row" aria-hidden="true">
          <span class="skeleton-rank"></span><span class="skeleton-lines"><span></span><span></span></span><span class="skeleton-count"></span>
        </div>
        <div class="rank-row skeleton-row" aria-hidden="true">
          <span class="skeleton-rank"></span><span class="skeleton-lines"><span></span><span></span></span><span class="skeleton-count"></span>
        </div>
        <div class="rank-row skeleton-row" aria-hidden="true">
          <span class="skeleton-rank"></span><span class="skeleton-lines"><span></span><span></span></span><span class="skeleton-count"></span>
        </div>
        <div class="rank-row skeleton-row" aria-hidden="true">
          <span class="skeleton-rank"></span><span class="skeleton-lines"><span></span><span></span></span><span class="skeleton-count"></span>
        </div>
        <div class="rank-row skeleton-row" aria-hidden="true">
          <span class="skeleton-rank"></span><span class="skeleton-lines"><span></span><span></span></span><span class="skeleton-count"></span>
        </div>
        <div class="rank-row skeleton-row" aria-hidden="true">
          <span class="skeleton-rank"></span><span class="skeleton-lines"><span></span><span></span></span><span class="skeleton-count"></span>
        </div>
        <div class="rank-row skeleton-row" aria-hidden="true">
          <span class="skeleton-rank"></span><span class="skeleton-lines"><span></span><span></span></span><span class="skeleton-count"></span>
        </div>
        <div class="rank-row skeleton-row" aria-hidden="true">
          <span class="skeleton-rank"></span><span class="skeleton-lines"><span></span><span></span></span><span class="skeleton-count"></span>
        </div>
      </section>
    </main>

    <button class="back-to-top" id="backToTop" type="button" aria-label="返回顶部" title="返回顶部" hidden>
      &uarr;
    </button>
    <div class="toast" id="toast" aria-live="polite" hidden></div>

    <script src="assets/source-filter.js?v=h6564a519653d" defer></script>
    <script src="assets/frontend-utils.js?v=h6564a519653d" defer></script>
    <script src="assets/ranking-utils.js?v=h6564a519653d" defer></script>
    <script src="assets/app.js?v=h6564a519653d" defer></script>
  </body>
</html>
